<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Quiz das Portas — Geografia</title>
<link rel="stylesheet" href="serafina-core.css?v=aa1c05a0026">
<style>
/* ============================================================
   QUIZ DAS PORTAS — Geografia 3º tri (AF 12/11/2026), Y2, prova em PORTUGUÊS.
   Simulado disfarçado de jogo: pergunta no alto, alternativas em PORTAS
   verticais, reloginho de areia. Certa = a porta abre e a Mariana entra.
   Errada = "toim-oim-oim", a porta certa se abre e a explicação aparece.
   Banco: GEO3_banco.js (window.GEO3, mesmo formato do HIS3_banco.js).
   Universo: BIBLIA_GEO3.md (Mariana, Bem-te-vi, Sementes dos Biomas).
   Casca: serafina-core (casa, A+/A-, som, cadeado) + sera_theme (5 temas).
   ============================================================ */
:root{--fs:1;--bg:#0d0b1e;--bg2:#11253a;--ink:#f2f7ff;--soft:rgba(255,255,255,.68);--dim:rgba(255,255,255,.46);
  --card:#15243c;--line:rgba(255,255,255,.14);--surf:rgba(255,255,255,.06);--accent:#22c55e;--accent2:#fbbf24;--ok:#34d399;--no:#f87171}
body.light{--bg:#eaf6ee;--bg2:#e3f0fb;--ink:#0b2033;--soft:rgba(11,32,51,.72);--dim:rgba(11,32,51,.54);
  --card:#fff;--line:rgba(11,32,51,.16);--surf:rgba(11,32,51,.05);--accent:#15803d;--accent2:#a16207;--ok:#0f9d6b;--no:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* ---- barra de cima (igual aos irmãos: casa, A-/A+, som, tema, cadeado) ---- */
.topbar{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.topbar .title{flex:1;font-weight:900;font-size:calc(.9rem*var(--fs));color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:11px;background:var(--line);color:var(--ink);font-weight:900;font-size:17px;cursor:pointer;line-height:1}
.iconbtn:active{transform:scale(.92)}
.iconbtn.off{opacity:.55}
@media (max-width:430px){.topbar{gap:3px;padding:5px 6px}.topbar .title{display:none}}
body.light .topbar .title{color:#15803d} /* verde da matéria no tema claro: contraste >= 4.5 */

/* ---- telas ---- */
.tela{display:none;flex:1;min-height:0;flex-direction:column}
.tela.on{display:flex}

/* ---- INÍCIO: corredor de fases ---- */
#inicio{padding:8px 12px 10px;gap:8px}
.cab{display:flex;align-items:center;gap:10px;flex:none}
.cab .mari{position:static;width:36px;height:58px;flex:none}
.cab h1{font-size:calc(1.3rem*var(--fs));font-weight:900;line-height:1.1;color:var(--ink)}
.cab p{font-size:calc(.82rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.25;margin-top:2px}
.cab .btv{position:static;width:44px;height:34px;flex:none;margin-left:auto}
.corredor{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;align-content:start;padding:2px}
.mini{min-height:88px;border:none;border-radius:14px 14px 8px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:6px 5px;color:#fff;font-weight:900;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 80%,#fff),var(--pc) 55%,color-mix(in srgb,var(--pc) 70%,#000));
  box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mini:active{transform:translateY(2px);box-shadow:none}
.mini .md{width:28px;height:34px;border-radius:14px 14px 3px 3px;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.75);position:relative;flex:none}
.mini .md::after{content:"";position:absolute;right:4px;top:50%;width:4px;height:4px;border-radius:50%;background:#fff}
.mini .mn{flex:none;font-size:calc(.7rem*var(--fs));line-height:1.1;text-align:center;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.55);max-height:2.3em;overflow:hidden}
.mini .mq{flex:none;font-size:calc(.62rem*var(--fs));line-height:1.1;opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.mini.feita::after{content:"\2714";position:absolute;top:5px;right:6px;width:22px;height:22px;border-radius:50%;background:#fff;color:#15803d;font-size:14px;line-height:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mini.todas{grid-column:1/-1;flex-direction:row;gap:10px;min-height:58px;justify-content:center}
.mini.todas .md{width:26px;height:34px}
.mini.todas .mn{margin:0;font-size:calc(.95rem*var(--fs))}
.rodape{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:calc(.78rem*var(--fs));font-weight:800;color:var(--soft)}
.rodape .sem{display:inline-flex;align-items:center;gap:5px}
.rodape .sem svg{width:18px;height:18px}
.rodape button{min-height:44px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:0 12px;font-weight:900;font-size:calc(.78rem*var(--fs));cursor:pointer}
.vazio{padding:20px;text-align:center;font-weight:800;color:var(--soft);line-height:1.4;grid-column:1/-1}
@media (max-height:430px){#inicio{padding:5px 10px 6px;gap:5px}.cab .mari,.cab .btv{display:none}.cab h1{font-size:calc(1.05rem*var(--fs))}.cab p{display:none}
  .mini{min-height:64px}.mini .md{width:22px;height:26px}.mini.todas{min-height:46px}.corredor{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}.rodape{min-height:44px}}

/* ---- JOGO ---- */
#jogo{gap:0}
.status{display:flex;align-items:center;gap:8px;padding:5px 10px 3px;flex:none}
.status .fase{flex:1;min-width:0;font-weight:900;font-size:calc(.82rem*var(--fs));color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .fase b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 9px;border-radius:15px;background:var(--surf);border:1px solid var(--line);font-weight:900;font-size:calc(.8rem*var(--fs));white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.relogio{width:46px;height:46px;position:relative;flex:none}
.relogio svg{width:46px;height:46px;transform:rotate(-90deg)}
.relogio .arco{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke .3s}
.relogio .trilho{fill:none;stroke:var(--line);stroke-width:5}
.relogio b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:var(--ink)}
.relogio.pouco .arco{stroke:#f59e0b}
.relogio.fim .arco{stroke:#ef4444}
.relogio.fim{animation:bate .5s infinite}
@keyframes bate{50%{transform:scale(1.1)}}
.corpo{flex:1;min-height:0;display:flex;flex-direction:column}
.lado{flex:none;display:flex;flex-direction:column;min-height:0;padding:0 10px}
.qbox{padding:7px 8px 7px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;gap:6px;align-items:center;flex:none}
.qbox .ptxt{flex:1;min-width:0;font-weight:900;font-size:calc(1.02rem*var(--fs));line-height:1.28}
.qbox .dtxt{display:none;font-weight:800;font-size:calc(.82rem*var(--fs));color:var(--soft);line-height:1.25;margin-top:4px}
.qbox .dtxt.on{display:block}
.qbox .bq{min-width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);font-weight:900;font-size:16px;cursor:pointer;flex:none}
.qbox .bq:active{transform:scale(.92)}
.fig{flex:none;text-align:center;margin-top:6px;min-height:0}
.fig img{max-height:var(--figh,110px);max-width:100%;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:zoom-in;display:inline-block;vertical-align:top}
.fig.vazia{display:none}

/* ---- a cena: céu, cenário em SVG, portas, chão, Mariana e Bem-te-vi ---- */
.cena{flex:1;min-height:0;position:relative;margin:6px 10px 8px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--ceu1,#bfe6ff),var(--ceu2,#eaf7ff));--chao:44px}
.cena svg.fundo{position:absolute;inset:0;width:100%;height:100%}
.chao{position:absolute;left:0;right:0;bottom:0;height:var(--chao);background:var(--chaocor,#9aa5ad)}
.chao svg{position:absolute;inset:0;width:100%;height:100%}
.portas{position:absolute;left:8px;right:8px;top:6px;bottom:calc(var(--chao) - 6px);display:flex;gap:8px;align-items:flex-end;justify-content:center;z-index:2}
.porta{flex:1 1 0;min-width:0;max-width:176px;height:100%;max-height:340px;display:flex;flex-direction:column;border:none;background:none;padding:0;cursor:pointer;color:inherit;position:relative}
.porta .topo{height:40px;flex:none;position:relative;z-index:1}
.porta .topo svg{width:100%;height:100%;display:block;overflow:visible}
.batente{flex:1;min-height:0;position:relative;border:4px solid var(--bat,#5b3a1e);border-bottom:none;border-radius:var(--rad,14px 14px 0 0);background:#1a1b2e;perspective:520px;transform-style:preserve-3d}
.dentro{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 35%,#fff9d6,#fbd55b 58%,#d9931f);opacity:0;transition:opacity .45s;display:flex;align-items:center;justify-content:center;padding:6px}
.dentro .rtxt{background:#fff;color:#14532d;border:2px solid #16a34a;border-radius:8px;padding:5px 4px;font-weight:900;font-size:calc(.84rem*var(--fs));line-height:1.2;text-align:center;width:100%;word-break:break-word;hyphens:auto;-webkit-hyphens:auto}
.folha{position:absolute;inset:0;background:var(--pc,#c2410c);border-radius:inherit;transform-origin:left center;transition:transform .75s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden;backface-visibility:hidden}
.folha svg.dec{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.placa{position:relative;background:#fffdf5;color:#1a1a1a;border:2px solid rgba(0,0,0,.28);border-radius:8px;padding:5px 4px;font-weight:900;font-size:calc(.86rem*var(--fs));
  line-height:1.2;text-align:center;width:100%;max-height:100%;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.25);word-break:break-word;hyphens:auto}
.portas.n4 .placa{font-size:calc(.76rem*var(--fs));padding:4px 2px}
.portas.n4{gap:5px}
.porta .num{position:absolute;top:-2px;left:4px;z-index:3;width:22px;height:22px;border-radius:50%;background:#fff;color:#1a1a1a;font-size:12px;font-weight:900;line-height:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.porta.aberta .folha{transform:rotateY(-108deg)}
.porta.aberta .dentro{opacity:1}
.porta.bateu .folha{animation:treme .6s}
@keyframes treme{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px) rotate(-1.6deg)}30%{transform:translateX(7px) rotate(1.6deg)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.porta.brilha .batente{box-shadow:0 0 0 4px #fde047,0 0 26px 8px rgba(253,224,71,.75);animation:pisca .45s 3}
@keyframes pisca{50%{box-shadow:0 0 0 2px #fde047,0 0 8px 2px rgba(253,224,71,.3)}}
.porta.apaga{opacity:.5;filter:saturate(.5)}
.porta:disabled{cursor:default}
.portas.trava .porta{pointer-events:none}
/* luzes do semáforo (estilo sinalização): acendem com o resultado */
.porta .luzV,.porta .luzA,.porta .luzR{fill:#3a3a3a}
.porta.aberta .luzV{fill:#22c55e;filter:drop-shadow(0 0 3px #22c55e)}
.porta.bateu .luzR{fill:#ef4444;filter:drop-shadow(0 0 3px #ef4444)}
/* estrelinhas da batida */
.estrela{position:absolute;width:16px;height:16px;z-index:6;pointer-events:none;animation:voa .85s ease-out forwards}
@keyframes voa{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}
/* Mariana */
.mari{position:absolute;bottom:calc(var(--chao) - 10px);left:5%;width:52px;height:88px;z-index:4;transition:left .95s ease-in-out,transform .45s,opacity .5s;transform-origin:50% 100%}
.mari svg{width:100%;height:100%;overflow:visible}
.mari .perna{transform-origin:50% 0;transform-box:fill-box}
.mari .corpo{transform-box:fill-box}
.btv .asa{transform-box:fill-box}
.mari.anda .pe{animation:passo .5s infinite}
.mari.anda .pd{animation:passo .5s infinite .25s}
@keyframes passo{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.mari.anda .corpo{animation:sobe .25s infinite}
@keyframes sobe{50%{transform:translateY(-2px)}}
.mari.entra{transform:scale(.55);opacity:0}
.mari.bate{animation:recua .7s}
@keyframes recua{0%{transform:translateX(0)}20%{transform:translateX(-8px) scaleY(.9)}45%{transform:translateX(-26px) rotate(-10deg)}70%{transform:translateX(-18px) rotate(4deg)}100%{transform:translateX(-22px)}}
/* Bem-te-vi */
.btv{position:absolute;top:8px;right:12px;width:46px;height:36px;z-index:4;animation:flutua 2.6s ease-in-out infinite}
.btv svg{width:100%;height:100%;overflow:visible}
.btv .asa{transform-origin:40% 55%;animation:bate-asa .35s infinite alternate}
@keyframes bate-asa{from{transform:rotate(-18deg)}to{transform:rotate(14deg)}}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.btv.festa{animation:voo 1.1s ease-in-out}
@keyframes voo{0%{transform:translate(0,0)}30%{transform:translate(-50px,-18px) rotate(-20deg)}60%{transform:translate(-90px,8px) rotate(10deg)}100%{transform:translate(0,0)}}
/* mãozinha: só na 1ª porta da 1ª vez */
.mao{position:absolute;z-index:7;width:44px;height:48px;pointer-events:none;animation:toque 1s infinite;display:none}
.mao.on{display:block}
@keyframes toque{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(8px) scale(.88)}}
/* balão da explicação + Continuar */
.balao{position:absolute;left:8px;right:8px;bottom:6px;z-index:8;background:var(--card);color:var(--ink);border:2px solid var(--accent);border-radius:14px;padding:8px 10px;display:none;
  max-height:min(62%,230px);flex-direction:column;gap:7px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.balao.on{display:flex}
.balao .cabe{display:flex;align-items:center;gap:8px;font-weight:900;font-size:calc(.86rem*var(--fs))}
.balao .cabe.no{color:var(--no)} .balao .cabe.ok{color:var(--ok)} .balao .cabe.tempo{color:var(--accent2)}
.balao .ex{font-weight:800;font-size:calc(.92rem*var(--fs));line-height:1.3;overflow:auto;min-height:0}
.balao .cont{height:44px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08263a;font-weight:900;font-size:1rem;cursor:pointer;flex:none}
.balao .cont:active{transform:scale(.98)}
/* paisagem: pergunta e figura à esquerda, cena à direita, nada rola */
@media (orientation:landscape) and (max-height:620px){
  .corpo{flex-direction:row}
  .lado{width:37%;flex:none;padding:4px 0 8px 10px}
  .fig{flex:1;min-height:0;margin-top:5px;display:flex;align-items:flex-start;justify-content:center}
  .fig img{max-height:100%;--figh:100%}
  .cena{margin:4px 10px 8px 8px}
  .status{padding-top:3px}
  .porta .topo{height:32px}
  .balao{max-height:72%}
}
@media (min-width:700px) and (min-height:900px){.fig img{max-height:var(--figh,200px)}.cena{--chao:56px}.mari{width:64px;height:108px}.btv{width:58px;height:46px}}
@media (min-width:1100px) and (min-height:620px){.lado{width:34%}.porta{max-width:210px}.cena{--chao:56px}.mari{width:64px;height:108px}}
@media (min-height:700px){.porta{max-height:430px}}
/* ---- FIM DA FASE ---- */
#fim{align-items:center;justify-content:center;padding:10px 12px;overflow:hidden}
.fimbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px;text-align:center;max-height:100%;overflow:auto}
.fimbox h2{font-size:calc(1.3rem*var(--fs));font-weight:900;line-height:1.1}
.fimbox .sub{font-size:calc(.86rem*var(--fs));font-weight:800;color:var(--soft);margin-top:3px;line-height:1.3}
.nums{display:flex;justify-content:center;gap:8px;margin:10px 0 8px;flex-wrap:wrap}
.nums .rn{min-width:84px;padding:6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--surf)}
.nums .rn b{display:block;font-size:calc(1.4rem*var(--fs));font-weight:900;line-height:1.1}
.nums .rn span{font-size:calc(.74rem*var(--fs));font-weight:800;color:var(--soft)}
.nums .rn.ok b{color:var(--ok)} .nums .rn.no b{color:var(--no)} .nums .rn.pu b{color:var(--accent2)}
.sems{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.sems svg{width:22px;height:22px}
.fimbox .bts{display:grid;gap:7px}
.bt{min-height:46px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08263a;font-weight:900;font-size:calc(.95rem*var(--fs));cursor:pointer;padding:0 10px}
.bt.calmo{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.bt:active{transform:scale(.98)}
@media (orientation:landscape) and (max-height:430px){.fimbox{padding:8px 12px}.fimbox h2{font-size:calc(1.1rem*var(--fs))}.nums{margin:5px 0 4px}.sems{display:none}.fimbox .bts{grid-template-columns:1fr 1fr}.bt{min-height:44px}}
/* ---- sair (casa com confirmação) e zoom da figura ---- */
.sairov{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(5,7,18,.72);backdrop-filter:blur(3px)}
.sairov.show{display:flex}
.sairbox{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;color:var(--ink)}
.sairbox h2{font-size:1.15rem;font-weight:900}
.sairbox p{font-size:.92rem;font-weight:800;color:var(--soft);line-height:1.4;margin:6px 0 10px}
.sairbox .bt{width:100%;margin-top:7px}
.zoomov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.zoomov img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn sera-home" title="Início" onclick="goHome()">&#127968;</button>
    <span class="title">Quiz das Portas</span>
    <button class="iconbtn" title="Letra menor" onclick="fs(-1)">A-</button>

function semAcento(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function estiloTema(k,nome){
  var s=semAcento(k+' '+(nome||'')), i;
  for(i=0;i<BIOMA_RE.length;i++) if(BIOMA_RE[i][0].test(s)) return BIOMA_RE[i][1];
  if(/preserv|cuidar|lixo|recicl|impact/.test(s)) return 'papelao';
  if(/bioma|fauna|flora|animais|plantas/.test(s)) return 'brasil';
  if(/sinal|segur|atravess|travess|faixa|semaf/.test(s)) return 'semaforo';
  if(/comerc|loja/.test(s)) return 'loja';
  if(/avenid|urban|espaco/.test(s)) return 'predio';
  if(/rodov|tipos? ?de ?rua|tiposrua|vias/.test(s)) return 'rodovia';
  if(/mapa|croqui|planta/.test(s)) return 'croqui';
  if(/direc|esquerd|direit/.test(s)) return 'esquina';
  if(/refer|local/.test(s)) return 'placa';
  if(/transp|trabalh|onibus|profiss/.test(s)) return 'onibus';
  if(/bairro|resid|cidade|rua/.test(s)) return 'casa';
  if(/\bsom|sons/.test(s)) return 'sons';
  if(/ambiente|meio|natur/.test(s)) return 'natureza';
  return 'casa';
}

function estiloItem(item,temaK,temaNome){
  var base=estiloTema(temaK,temaNome);
  if(base==='brasil'||BIOMA_RE.some(function(b){ return b[1]===base; })){
    var p=semAcento(item.p), i;
    for(i=0;i<BIOMA_RE.length;i++) if(BIOMA_RE[i][0].test(p)) return BIOMA_RE[i][1];
    return 'brasil';

  return base;
}

    fase.acertos++; fase.sementes++;
    andaAte(i,function(){
      portaEl(i).classList.add('aberta'); SFX.porta();
      setTimeout(function(){ $('mari').classList.add('entra'); SFX.piado(); $('btv').classList.add('festa'); SFX.semente();
        var ch=$('stSem'); ch.innerHTML=semente(CORES_SEM[(fase.sementes-1)%6])+' '+fase.sementes; ch.classList.remove('pop'); void ch.offsetWidth; ch.classList.add('pop'); },450);
      setTimeout(function(){ fase.i++; proximaPergunta(); },1900);
    });
  } else {
    fase.erros++; fase.erradas.push(item);
    andaAte(i,function(){
      var p=portaEl(i); p.classList.add('bateu'); $('mari').classList.add('bate'); SFX.toim(); estrelas(i);
      setTimeout(function(){ p.classList.add('apaga'); var pc=portaEl(certa); pc.classList.add('brilha'); setTimeout(function(){ pc.classList.add('aberta'); SFX.porta(); },500); },700);
      setTimeout(function(){ mostraBalao('no','Toim-oim-oim! A porta certa era: '+atual.opts[certa],item.ex); },1500);
    });
  }
}
function tempoEsgotou(){
  if(!atual||atual.respondido) return;
  atual.respondido=true; travaPortas(); calar(); fase.semResp++; fase.erradas.push(atual.item); SFX.tempo();
  var pc=portaEl(atual.certa); pc.classList.add('brilha');
  $('portas').querySelectorAll('.porta').forEach(function(p){ if(p!==pc) p.classList.add('apaga'); });
  setTimeout(function(){ pc.classList.add('aberta'); SFX.porta(); },600);
  setTimeout(function(){ mostraBalao('tempo','O tempo acabou. A porta certa era: '+atual.opts[atual.certa],atual.item.ex); },1300);
}
function mostraBalao(tipo,cabe,ex){
  $('balCabe').className='cabe '+tipo; $('balCabe').textContent=cabe; $('balEx').textContent=ex||'';
  $('balao').classList.add('on'); $('btCont').focus({preventScroll:true});
  falar(cabe+'. '+(ex||''));
}
$('btCont').onclick=function(){ $('balao').classList.remove('on'); calar(); fase.i++; proximaPergunta(); };
$('btOuvir').onclick=function(){ if(atual) falar(atual.item.p); };
$('btDica').onclick=function(){ var d=$('dtxt'); d.classList.toggle('on'); if(d.classList.contains('on')) falar(atual.item.dica); encaixa(); };

/* ---- fim da fase ---- */
function fimDeFase(){
  paraTempo(); calar();
  var tot=fase.fila.length, pct=tot?Math.round(fase.acertos/tot*100):0, venceu=pct>=70;
  if(fase.k!=='*'&&fase.modo==='fase'){ var f=lsGet(K_FASES,{}), ant=f[fase.k]||{}; f[fase.k]={melhor:Math.max(ant.melhor||0,pct),vencida:!!(ant.vencida||venceu)}; lsSet(K_FASES,f); }
  lsSet(K_SEM,(lsGet(K_SEM,0)||0)+fase.sementes);
  $('fimTit').textContent= pct===100?'Todas as portas abertas!':venceu?'Fase vencida!':'Fim da fase';
  $('fimSub').textContent= pct===100?'A Mariana passou por todas. Muito bem!':venceu?'Quase todas as portas se abriram.':'Cada porta fechada é uma que você vai abrir na prova.';
  $('fimNums').innerHTML='<div class="rn ok"><b>'+fase.acertos+'</b><span>certas</span></div><div class="rn no"><b>'+fase.erros+'</b><span>erradas</span></div>'+(fase.semResp?'<div class="rn pu"><b>'+fase.semResp+'</b><span>sem resposta</span></div>':'');
  var s='',k; for(k=0;k<fase.sementes;k++) s+=semente(CORES_SEM[k%6]); $('fimSems').innerHTML=s;
  var bts='', prox=null;
  if(fase.k!=='*'){ var ix=ORDEM.indexOf(fase.k); if(ix>=0&&ix<ORDEM.length-1) prox=ORDEM[ix+1]; }
  if(fase.erradas.length) bts+='<button class="bt" type="button" id="btRefazer">Refazer as erradas ('+fase.erradas.length+')</button>';
  if(prox) bts+='<button class="bt'+(fase.erradas.length?' calmo':'')+'" type="button" id="btProx">Próxima fase: '+esc(TEMAS[prox].nome)+'</button>';
  bts+='<button class="bt calmo" type="button" id="btDeNovo">Jogar de novo</button><button class="bt calmo" type="button" id="btMapa">Corredor das fases</button>';
  $('fimBts').innerHTML=bts;
  var er=fase.erradas.slice(), fk=fase.k;
  if($('btRefazer')) $('btRefazer').onclick=function(){ comecaFase(fk,embaralha(er),'refazer'); };
  if($('btProx')) $('btProx').onclick=function(){ comecaFase(prox); };
  $('btDeNovo').onclick=function(){ comecaFase(fk); };
  $('btMapa').onclick=function(){ renderInicio(); mostra('inicio'); };
  mostra('fim'); SFX.fim();
}

/* ---- zoom da figura, casinha com confirmação, teclado ---- */
function zoom(src){ var ov=document.createElement('div'); ov.className='zoomov'; ov.innerHTML='<img alt="" src="'+esc(src)+'">'; ov.onclick=function(){ ov.remove(); pausado=false; tFim=Date.now()+restante; }; var restante=Math.max(0,tFim-Date.now()); pausado=true; document.body.appendChild(ov); }
(function(){
  var ov=$('sairov'), irEmbora=window.goHome;
  window.goHome=function(){ if(window.screenLocked) return; ov.classList.add('show'); pausado=true; };
  $('sairSim').onclick=function(){ ov.classList.remove('show'); calar(); irEmbora(); };
  $('sairNao').onclick=function(){ ov.classList.remove('show'); if(atual&&!atual.respondido){ tFim=Date.now()+Math.max(3,(tFim-Date.now())/1000)*1000; } pausado=false; };
  ov.onclick=function(e){ if(e.target===ov) $('sairNao').click(); };
  document.addEventListener('keydown',function(e){
    if(ov.classList.contains('show')){ if(e.key==='Escape') $('sairNao').click(); return; }
    if(!$('jogo').classList.contains('on')) return;
    if($('balao').classList.contains('on')){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('btCont').click(); } return; }
    var n=parseInt(e.key,10); if(n>=1&&n<=4){ var p=portaEl(n-1); if(p) p.click(); }
  });
})();
