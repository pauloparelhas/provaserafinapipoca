<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#171334;--ink:#f5f3ff;--soft:rgba(255,255,255,.55);--card:#221c44;--line:rgba(255,255,255,.12);--accent:#34d399;--accent2:#60a5fa;--ok:#34d399;--no:#f87171;--mid:#fbbf24;--tr:#fcd34d;--rad:22px}

html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
#starfield{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}

.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.1rem;font-weight:800;cursor:pointer;padding:0 9px}

.q{font-size:calc(1.22rem*var(--fs));font-weight:900;line-height:1.35;margin:4px 0 2px}

.tr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:calc(.92rem*var(--fs));line-height:1.3}

.opt .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.78rem}

.opt.ok{background:var(--ok);color:#06251a;border-color:var(--ok)}.opt.ok .otr{color:#06251a}
.opt.no{background:var(--no);color:#3a0a0a;border-color:var(--no)}.opt.no .otr{color:#3a0a0a}

.vfwrap{display:flex;gap:12px;justify-content:center}
.vfbtn{flex:1;max-width:200px;padding:18px 10px;border:2px solid var(--line);border-radius:18px;background:transparent;color:var(--ink);
  font-size:calc(1.15rem*var(--fs));font-weight:900;cursor:pointer;font-family:inherit;transition:.15s}

.vfbtn.ok{background:var(--ok);color:#06251a;border-color:var(--ok)}
.vfbtn.no{background:var(--no);color:#3a0a0a;border-color:var(--no)}

.fillsent{font-size:calc(1.22rem*var(--fs));font-weight:900;line-height:1.6;margin:6px 4px 4px}

.blank.ok{color:#34d399}.blank.no{color:var(--no);border-color:var(--no)}
.wbank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 0 4px}

.wchip .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.72rem}
body.show-tr .wchip .otr{display:block}
.wchip:active{transform:scale(.95)}
.wchip.ok{background:var(--ok);color:#06251a;border-color:var(--ok)}
.wchip.no{background:var(--no);color:#3a0a0a;border-color:var(--no)}

.mitem .mlbl{flex:1;display:flex;flex-direction:column;gap:1px}

.mitem.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(96,165,250,.4) inset}
.mslot{min-width:74px;text-align:center;font-size:.78rem;font-weight:900;padding:5px 7px;border-radius:10px;background:var(--line);color:var(--soft)}
.mslot.set{background:rgba(96,165,250,.22);color:#bfdbfe}
.mitem.ok{background:rgba(52,211,153,.16);border-color:var(--ok)}.mitem.ok .mslot{background:var(--ok);color:#06251a}
.mitem.no{background:rgba(248,113,113,.14);border-color:var(--no)}.mitem.no .mslot{background:var(--no);color:#3a0a0a}
.mcats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 2px}
.mcat{min-height:44px;padding:9px 13px;border:2px solid var(--line);border-radius:13px;background:transparent;color:var(--ink);font-weight:900;font-size:calc(.92rem*var(--fs));cursor:pointer;font-family:inherit;transition:.15s}
.mcat:active{transform:scale(.95)}
.writeline{height:46px;border-bottom:3px dashed var(--line);margin:10px 4px 14px;display:flex;align-items:flex-end;justify-content:center;color:var(--soft);font-weight:700;font-size:.82rem;padding-bottom:4px}
.hint{font-size:.9rem;font-weight:800;color:var(--soft);margin-bottom:10px}
.reveal{display:none;margin:8px 0 4px;padding:13px 14px;border-radius:14px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);

.reveal.show{display:block}
.reveal .lab{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.selfwrap{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.selfwrap.show{display:flex}
.selfbtn{flex:1;min-width:96px;padding:12px 8px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font-weight:900;font-size:.86rem;cursor:pointer;font-family:inherit;transition:.15s}
.selfbtn .big{display:block;font-size:1.5rem;margin-bottom:2px}
.selfbtn:active{transform:scale(.95)}
.selfbtn.acertei.sel{background:var(--ok);color:#06251a;border-color:var(--ok)}
.selfbtn.parcial.sel{background:var(--mid);color:#3a2c00;border-color:var(--mid)}
.selfbtn.errei.sel{background:var(--no);color:#3a0a0a;border-color:var(--no)}
.fb{margin-top:14px;font-size:calc(1.02rem*var(--fs));font-weight:900;min-height:1.3em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}.fb.mid{color:var(--mid)}
.next{margin-top:16px;width:100%;height:54px;border:none;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#06251a;font-size:1.08rem;font-weight:900;cursor:pointer;display:none;font-family:inherit}
.next.show{display:block}
.next:active{transform:scale(.97)}
.fim .big{font-size:4rem}
.fim .score{font-size:1.7rem;font-weight:900;color:var(--accent);margin:8px 0 2px}
.fim .sub{font-weight:800;color:var(--soft);font-size:.95rem;margin-bottom:6px}
.again{margin-top:16px;background:var(--line);border:none;border-radius:14px;padding:13px 22px;font-size:1rem;font-weight:900;cursor:pointer;color:var(--ink);font-family:inherit}
.intro p{font-size:calc(1rem*var(--fs));font-weight:700;line-height:1.5;color:var(--soft);margin:10px 0}
.sizewrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.sizebtn{min-width:64px;padding:16px 10px;border:2px solid var(--accent2);border-radius:16px;background:transparent;color:var(--ink);font-size:1.3rem;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.sizebtn .sl{font-size:.6rem;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.sizebtn:active{transform:scale(.95)}
.sizebtn.sel{background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(96,165,250,.18));border-color:var(--accent)}
</style>

<script>

const MATCH = [
 {t:"Match the animal to its group.",tpt:"Ligue o animal ao grupo dele.",say:"Match the animal to its group.",

 {t:"Match the group to its characteristic.",tpt:"Ligue o grupo à sua característica.",say:"Match the group to its characteristic.",

  items:[["Have feathers and wings","têm penas e asas",1],["Have scales and live in water","têm escamas e vivem na água",2],["Have six legs","têm seis patas",5],["Have hair or fur","têm pelo",0],["Have dry scales, lay eggs on land","escamas secas, ovos na terra",3],["Live in water and on land","vivem na água e na terra",4]]},

];

/* ---- MC (circle the correct answer) ---- */
const MC = [
 {fig:"\u{1F43B}",en:"Which animal group has <b>fur</b>?",pt:"Qual grupo de animal tem pelo?",say:"Which animal group has fur?",opts:[["Mammal",1,"mamífero"],["Fish",0,"peixe"],["Reptile",0,"réptil"],["Bird",0,"ave"]]},
 {fig:"\u{1F98E}",en:"What covers a <b>reptile's</b> body?",pt:"O que cobre o corpo do réptil?",say:"What covers a reptile's body?",opts:[["Scales",1,"escamas"],["Feathers",0,"penas"],["Fur",0,"pelo"],["Moist skin",0,"pele molhada"]]},
 {fig:"\u{1F426}",en:"What covers a <b>bird's</b> body?",pt:"O que cobre o corpo do pássaro?",say:"What covers a bird's body?",opts:[["Feathers",1,"penas"],["Scales",0,"escamas"],["Fur",0,"pelo"]]},
 {fig:"\u{1F41F}",en:"What covers a <b>fish's</b> body?",pt:"O que cobre o corpo do peixe?",say:"What covers a fish's body?",opts:[["Scales",1,"escamas"],["Feathers",0,"penas"],["Fur",0,"pelo"]]},
 {fig:"\u{1F438}",en:"An <b>amphibian's</b> skin feels...?",pt:"A pele do anfíbio é...?",say:"An amphibian's skin feels how?",opts:[["Moist (wet)",1,"molhada"],["Dry",0,"seca"],["Furry",0,"peluda"]]},
 {fig:"\u{1F41C}",en:"How many <b>legs</b> does an insect have?",pt:"Quantas patas tem o inseto?",say:"How many legs does an insect have?",opts:[["6",1,"seis"],["4",0,"quatro"],["8",0,"oito"],["2",0,"duas"]]},
 {fig:"\u{1F37C}",en:"Which animal <b>drinks milk</b> from its mother?",pt:"Qual animal mama o leite da mãe?",say:"Which animal drinks milk from its mother?",opts:[["Mammal",1,"mamífero"],["Fish",0,"peixe"],["Bird",0,"ave"],["Reptile",0,"réptil"]]},
 {fig:"\u{1F41F}",en:"Which group breathes with <b>gills</b> in the water?",pt:"Qual grupo respira com guelras na água?",say:"Which group breathes with gills in the water?",opts:[["Fish",1,"peixe"],["Mammal",0,"mamífero"],["Bird",0,"ave"]]},
 {fig:"\u{1F436}",en:"A <b>dog</b> is a...?",pt:"O cachorro é um...?",say:"A dog is a what?",opts:[["Mammal",1,"mamífero"],["Fish",0,"peixe"],["Bird",0,"ave"]]},
 {fig:"\u{1F40D}",en:"A <b>snake</b> is a...?",pt:"A cobra é um...?",say:"A snake is a what?",opts:[["Reptile",1,"réptil"],["Bird",0,"ave"],["Mammal",0,"mamífero"]]},
 {fig:"\u{1F98B}",en:"A <b>butterfly</b> is an...?",pt:"A borboleta é um...?",say:"A butterfly is an what?",opts:[["Insect",1,"inseto"],["Amphibian",0,"anfíbio"],["Fish",0,"peixe"]]},
 {fig:"\u{1F99C}",en:"A <b>parrot</b> is a...?",pt:"O papagaio é um...?",say:"A parrot is a what?",opts:[["Bird",1,"ave"],["Fish",0,"peixe"],["Mammal",0,"mamífero"]]},
 {fig:"\u{1F41C}",en:"Which animal has <b>6 legs</b> and antennae?",pt:"Qual animal tem 6 patas e antenas?",say:"Which animal has six legs and antennae?",opts:[["Insect",1,"inseto"],["Reptile",0,"réptil"],["Bird",0,"ave"]]},
 {fig:"\u{1FAB8}",en:"Which animal is an <b>invertebrate</b> (no backbone)?",pt:"Qual animal é invertebrado (sem espinha)?",say:"Which animal is an invertebrate?",opts:[["Jellyfish",1,"água-viva"],["Dog",0,"cachorro"],["Snake",0,"cobra"],["Bird",0,"pássaro"]]},
 {fig:"\u{1F9B4}",en:"An animal <b>with a backbone</b> is a...?",pt:"Um animal COM espinha é um...?",say:"An animal with a backbone is a what?",opts:[["Vertebrate",1,"vertebrado"],["Invertebrate",0,"invertebrado"]]},
 /* diet */
 {fig:"\u{1F96C}",en:"Which animal eats <b>only plants</b>?",pt:"Quem come só plantas?",say:"Which animal eats only plants?",opts:[["Herbivore",1,"herbívoro"],["Carnivore",0,"carnívoro"],["Omnivore",0,"onívoro"]]},
 {fig:"\u{1F356}",en:"Which animal eats <b>only meat</b>?",pt:"Quem come só carne?",say:"Which animal eats only meat?",opts:[["Carnivore",1,"carnívoro"],["Herbivore",0,"herbívoro"],["Omnivore",0,"onívoro"]]},
 {fig:"\u{1F37D}️",en:"Which animal eats <b>both plants and meat</b>?",pt:"Quem come plantas E carne?",say:"Which animal eats both plants and meat?",opts:[["Omnivore",1,"onívoro"],["Herbivore",0,"herbívoro"],["Carnivore",0,"carnívoro"]]},
 /* reptiles */
 {fig:"\u{1F95A}",en:"A <b>reptile</b> is born from a...?",pt:"O réptil nasce de...?",say:"A reptile is born from a what?",opts:[["Egg",1,"ovo"],["Milk",0,"leite"],["Plant",0,"planta"]]},
 {fig:"\u{1F95A}",en:"<b>Where</b> does a reptile lay its eggs?",pt:"Onde o réptil bota os ovos?",say:"Where does a reptile lay its eggs?",opts:[["On land",1,"na terra"],["In the water",0,"na água"],["In the sky",0,"no céu"]]},
 {fig:"\u{1F46A}",en:"How many <b>reptile families</b> are there?",pt:"Quantas famílias de réptil existem?",say:"How many reptile families are there?",opts:[["4",1,"quatro"],["2",0,"duas"],["3",0,"três"],["5",0,"cinco"]]},
 {fig:"\u{1FAC1}",en:"A <b>reptile</b> breathes with...?",pt:"O réptil respira com...?",say:"A reptile breathes with what?",opts:[["Lungs",1,"pulmões"],["Gills",0,"guelras"],["Skin",0,"pele"]]},
 {fig:"\u{1F9CA}",en:"Reptiles live everywhere <b>except</b>...?",pt:"Répteis vivem em todo lugar, menos...?",say:"Reptiles live everywhere except where?",opts:[["Antarctica",1,"Antártica"],["Africa",0,"África"],["Brazil",0,"Brasil"]]},

/* ================= ENGINE ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=id=>document.getElementById(id);
let deck=[], cur=0, score=0, total=0, fontStep=0, roundSize=10;

/* varied sampling: round-robin across the 6 types so even a 5-question
   round mixes types; matches stay rare (1 type bucket among 6). */
function buildDeck(n){
  const buckets=[
    shuffle(MATCH.map(o=>({type:'match',...o}))),
    shuffle(MC.map(o=>({type:'mc',...o}))),
    shuffle(FILL.map(o=>({type:'fill',...o}))),
    shuffle(VF.map(o=>({type:'vf',...o}))),
    shuffle(CLS.map(o=>({type:'cls',...o}))),
    shuffle(OPEN.map(o=>({type:'open',...o})))
  ];
  const picked=[]; const order=shuffle([0,1,2,3,4,5]); let matchCap=Math.max(1,Math.round(n/6));
  while(picked.length<n){
    let any=false;
    for(const idx of order){
      if(picked.length>=n) break;
      const b=buckets[idx];
      if(!b.length) continue;
      if(idx===0 && picked.filter(p=>p.type==='match').length>=matchCap) continue;
      picked.push(b.shift()); any=true;
    }
    if(!any) break;
  }
  deck=shuffle(picked);
  deck.forEach(it=>{
    if(it.type==='mc') it.opts=shuffle(it.opts.map(p=>({t:p[0],ok:!!p[1],pt:p[2]})));
    if(it.type==='fill'){it.chips=shuffle([{w:it.ans,ok:true},...it.bank.map(w=>({w,ok:false}))]);}
    if(it.type==='match'){it.cho=new Array(it.items.length).fill(-1);it.active=0;}
  });
  total=deck.length; cur=0; score=0;
}

function fs(d){fontStep=Math.max(-2,Math.min(3,fontStep+d));document.documentElement.style.setProperty('--fs',1+fontStep*0.12);}
function toggleTr(){const on=document.body.classList.toggle('show-tr');try{localStorage.setItem('ela2_tr',on?'1':'0');}catch(e){}}
function esc(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,"\\'");}
function say(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/en-US|en_US|English \(United States\)/i.test(v.lang+v.name));if(v)u.voice=v;
  speechSynthesis.speak(u);}catch(e){}}

function start(n){roundSize=n;buildDeck(n);render();}
function render(){
  $('bar').style.width=(cur/total*100)+'%';
  const it=deck[cur];
  ({mc:renderMC,vf:renderVF,open:renderOpen,fill:renderFill,match:renderMatch,cls:renderCls}[it.type])(it);
}
function head(it,label,cls){return `<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge ${cls}">${label}</span></div>
  ${it.fig?`<div class="qfig">${it.fig}</div>`:''}${it.en?`<div class="q">${it.en}</div><div class="tr qtr">${it.pt}</div>`:''}
  ${it.say?`<button class="speak" onclick="say('${esc(it.say)}')">&#128266; Listen</button>`:''}`;}
function nextBtn(hidden){return `<button class="next" id="next" ${hidden?'style="display:none"':''} onclick="next()">${cur===total-1?'See results \u{1F389}':'Next →'}</button>`;}

    <div class="fb" id="fb"></div>`+nextBtn(false);
}
function ansMC(i){
  const it=deck[cur], b=document.querySelectorAll('.opt');
  b.forEach(x=>x.disabled=true);
  if(it.opts[i].ok){b[i].classList.add('ok');$('fb').textContent='Correct! \u{1F31F}';$('fb').className='fb ok';score++;}
  else{b[i].classList.add('no');it.opts.forEach((o,k)=>{if(o.ok)b[k].classList.add('ok');});
    $('fb').textContent='The green one is right \u{1F60A}';$('fb').className='fb no';}
  $('next').classList.add('show');
}

/* V/F */
function renderVF(it){
  $('card').innerHTML=head(it,'True or False','vf')+
   `<div class="vfwrap">
      <button class="vfbtn" id="vT" onclick="ansVF(true)"><span class="big">✅</span>True<span class="vtr">verdadeiro</span></button>
      <button class="vfbtn" id="vF" onclick="ansVF(false)"><span class="big">❌</span>False<span class="vtr">falso</span></button>
    </div><div class="fb" id="fb"></div>`+nextBtn(false);
}
function ansVF(val){
  const it=deck[cur], T=$('vT'),F=$('vF');
  T.disabled=F.disabled=true;
  const rightBtn=it.ans?T:F;
  if(val===it.ans){rightBtn.classList.add('ok');$('fb').textContent='Correct! \u{1F31F}';$('fb').className='fb ok';score++;}
  else{(val?T:F).classList.add('no');rightBtn.classList.add('ok');
    $('fb').textContent='The green one is right \u{1F60A}';$('fb').className='fb no';}
  $('next').classList.add('show');
}

/* CLASSIFY — real or make-believe */
function renderCls(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge cls">Real or Make-believe</span></div>
   <div class="qfig">${it.fig}</div><div class="q">${it.en}</div><div class="tr qtr">${it.pt}</div>
   <button class="speak" onclick="say('${esc(it.say)}')">&#128266; Listen</button>
   <div class="vfwrap">
     <button class="vfbtn" id="vT" onclick="ansCls(true)"><span class="big">✅</span>Real<span class="vtr">de verdade</span></button>
     <button class="vfbtn" id="vF" onclick="ansCls(false)"><span class="big">✨</span>Make-believe<span class="vtr">faz de conta</span></button>
   </div><div class="fb" id="fb"></div>`+nextBtn(false);
}
function ansCls(val){
  const it=deck[cur], T=$('vT'),F=$('vF');
  T.disabled=F.disabled=true;
  const rightBtn=it.real?T:F;
  if(val===it.real){rightBtn.classList.add('ok');$('fb').textContent='Correct! \u{1F31F}';$('fb').className='fb ok';score++;}
  else{(val?T:F).classList.add('no');rightBtn.classList.add('ok');
    $('fb').textContent='The green one is right \u{1F60A}';$('fb').className='fb no';}
  $('next').classList.add('show');
}

/* FILL — complete the sentence */
function renderFill(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge fill">Complete</span></div>
   <button class="speak" onclick="say('${esc(it.say)}')">&#128266; Listen</button>
   <div class="fillsent">${it.pre} <span class="blank" id="blank">_____</span> ${it.post}</div>
   <div class="tr qtr">${it.pt}</div>
   <div class="wbank">${it.chips.map((c,i)=>`<button class="wchip" onclick="ansFill(${i})">${c.w}</button>`).join('')}</div>
   <div class="fb" id="fb"></div>`+nextBtn(false);
}
function ansFill(i){
  const it=deck[cur], chips=document.querySelectorAll('.wchip');
  chips.forEach(c=>c.disabled=true);
  const chosen=it.chips[i];
  $('blank').textContent=chosen.w;
  if(chosen.ok){chips[i].classList.add('ok');$('blank').classList.add('ok');$('fb').textContent='Correct! \u{1F31F}';$('fb').className='fb ok';score++;}
  else{chips[i].classList.add('no');$('blank').classList.add('no');
    it.chips.forEach((c,k)=>{if(c.ok)chips[k].classList.add('ok');});
    $('blank').textContent=it.ans;$('blank').classList.remove('no');$('blank').classList.add('ok');
    $('fb').textContent='The right word is "'+it.ans+'" \u{1F60A}';$('fb').className='fb no';}
  $('next').classList.add('show');
}

/* MATCH — pair each item to a category */
function renderMatch(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge match">Match</span></div>
   <div class="q">${it.t}</div><div class="tr qtr">${it.tpt}</div>
   <button class="speak" onclick="say('${esc(it.say)}')">&#128266; Listen</button>
   <div class="mintro">Tap an animal, then tap its group. <span class="tr">Toque no item, depois no grupo.</span></div>
   <div class="mboard" id="mboard"></div>
   <div class="mcats" id="mcats">${it.cats.map((c,ci)=>`<button class="mcat" onclick="pickCat(${ci})">${c[0]}</button>`).join('')}</div>
   <div class="fb" id="fb"></div>
   <button class="next" id="mcheck" style="display:none" onclick="checkMatch()">Check &#9989;</button>`+nextBtn(true);
  drawMatch();
}
function drawMatch(){
  const it=deck[cur];
  $('mboard').innerHTML=it.items.map((m,mi)=>{
    const cho=it.cho[mi];
    const slot=cho>=0?`<span class="mslot set">${it.cats[cho][0]}</span>`:`<span class="mslot">?</span>`;
    return `<button class="mitem${mi===it.active?' active':''}" id="mi${mi}" onclick="pickItem(${mi})">
      <span class="mlbl"><span>${m[0]}</span><span class="mtr">${m[1]}</span></span>${slot}</button>`;
  }).join('');
  const done=it.cho.every(c=>c>=0);
  $('mcheck').style.display=done?'block':'none';
}
function pickItem(mi){const it=deck[cur];if(it.locked)return;it.active=mi;drawMatch();}
function pickCat(ci){
  const it=deck[cur];if(it.locked)return;
  it.cho[it.active]=ci;
  let nxt=it.cho.findIndex(c=>c<0); it.active=nxt<0?it.active:nxt;
  drawMatch();
}
function checkMatch(){
  const it=deck[cur];it.locked=true;
  let right=0;
  it.items.forEach((m,mi)=>{
    const el=$('mi'+mi);el.disabled=true;
    if(it.cho[mi]===m[2]){el.classList.add('ok');right++;}
    else{el.classList.add('no');el.querySelector('.mslot').textContent=it.cats[m[2]][0];}
  });
  document.querySelectorAll('.mcat').forEach(c=>c.disabled=true);
  $('mcheck').style.display='none';
  const all=it.items.length;
  score+=right/all;
  if(right===all){$('fb').textContent='All correct! \u{1F31F}';$('fb').className='fb ok';}
  else{$('fb').textContent=right+' of '+all+' right — green slots show the answer \u{1F60A}';$('fb').className='fb mid';}
  $('next').style.display='block';$('next').classList.add('show');
}

/* OPEN */
function renderOpen(it){
  $('card').innerHTML=head(it,'Open answer','open')+
   `<div class="writeline">&#9999;&#65039; answer in your head</div>
    <button class="next show" id="seebtn" onclick="reveal()">See answer &#128065;&#65039;</button>
    <div class="reveal" id="rev"><span class="lab">Answer</span>${it.men}<div class="tr">${it.mpt}</div></div>
    <div class="hint" id="selfhint" style="display:none">Did you get it right?</div>
    <div class="selfwrap" id="self">
      <button class="selfbtn acertei" onclick="self('ok')"><span class="big">\u{1F604}</span>Right<span class="tr">acertei</span></button>
      <button class="selfbtn parcial" onclick="self('mid')"><span class="big">\u{1F610}</span>Almost<span class="tr">mais ou menos</span></button>
      <button class="selfbtn errei" onclick="self('no')"><span class="big">\u{1F605}</span>Wrong<span class="tr">errei</span></button>
    </div>
    <div class="fb" id="fb"></div>`+nextBtn(true);
}
function reveal(){$('rev').classList.add('show');$('seebtn').style.display='none';$('selfhint').style.display='block';$('self').classList.add('show');}
function self(v){
  document.querySelectorAll('.selfbtn').forEach(b=>b.disabled=true);
  if(v==='ok'){document.querySelector('.selfbtn.acertei').classList.add('sel');$('fb').textContent='Great! \u{1F31F}';$('fb').className='fb ok';score++;}
  else if(v==='mid'){document.querySelector('.selfbtn.parcial').classList.add('sel');$('fb').textContent='Almost there! \u{1F44D}';$('fb').className='fb mid';score+=0.5;}
  else{document.querySelector('.selfbtn.errei').classList.add('sel');$('fb').textContent='Now you know it! \u{1F4AA}';$('fb').className='fb no';}
  $('next').style.display='block';$('next').classList.add('show');
}

function next(){cur++;if(cur<total)render();else fim();}
function fim(){
  $('bar').style.width='100%';
  const s=Math.round(score*10)/10, pct=score/total;
  const msg=pct>=.9?'You rock! \u{1F3C6}':pct>=.6?'Well done! Keep practicing.':'Good practice — try again to learn more!';
  $('card').innerHTML=`<div class="fim"><div class="big">\u{1F3C6}</div>
    <div class="score">${s} / ${total}</div>
    <div class="sub">${msg}</div>
    <button class="again" onclick="intro()">↺ New practice</button></div>`;
}

/* starfield */
(function(){var c=document.getElementById('starfield'),x=c.getContext('2d'),s=[];
function rz(){c.width=innerWidth;c.height=innerHeight;s=[];for(var i=0;i<140;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.2,a:Math.random(),da:(Math.random()-.5)*.004,sp:Math.random()*.1+.02});}
function d(){x.clearRect(0,0,c.width,c.height);s.forEach(function(t){t.y-=t.sp;if(t.y<-5)t.y=c.height+5;t.a+=t.da;if(t.a>1||t.a<.1)t.da*=-1;x.save();x.globalAlpha=t.a;x.fillStyle='#fff';x.beginPath();x.arc(t.x,t.y,t.r,0,Math.PI*2);x.fill();x.restore();});requestAnimationFrame(d);}
rz();addEventListener('resize',rz);d();})();
try{if(localStorage.getItem('ela2_tr')==='1')document.body.classList.add('show-tr');}catch(e){}
if('speechSynthesis' in window){speechSynthesis.getVoices();}
intro();
</script>
</body>
