<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Practice test — Math AP1</title>
<link rel="stylesheet" href="serafina-core.css?v=20260817">
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#102a3a;--ink:#f0f9ff;--soft:rgba(255,255,255,.55);--card:#13243a;--line:rgba(255,255,255,.12);--accent:#a78bfa;--accent2:#fbbf24;--tr:#fcd34d;--ok:#34d399;--no:#f87171;--mid:#fbbf24;--rad:22px;--surf:rgba(255,255,255,.055);--press:0 2px 0 rgba(0,0,0,.22)}
body.light{--bg:#e0f2fe;--bg2:#dbeafe;--ink:#0c1e33;--soft:rgba(0,0,0,.5);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309;--surf:rgba(0,0,0,.045);--press:0 2px 0 rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.92rem*var(--fs));color:var(--accent);flex:1;line-height:1.1}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;padding:0 8px}
.iconbtn:active{transform:scale(.9)}
.dicabtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.62}
.dicabtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .dicabtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.bar{height:8px;background:var(--line)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .35s}
/* ---------- palco / cartao ---------- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:14px clamp(10px,3vw,26px) 94px}
.card{position:relative;width:100%;max-width:560px;background:var(--card);border-radius:var(--rad);box-shadow:0 14px 40px rgba(0,0,0,.35);padding:clamp(16px,4.5vw,26px) clamp(14px,4.5vw,26px) clamp(18px,4.5vw,26px);text-align:center;border:1px solid var(--line)}
/* cabecalho discreto: numero da pergunta + tipo */
.qhead{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px;flex-wrap:wrap;padding:0 44px}
.qnum{font-size:.68rem;font-weight:900;color:var(--soft);letter-spacing:1px;text-transform:uppercase}
.badge{font-size:.6rem;font-weight:900;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.badge.mc{background:rgba(56,189,248,.2);color:#7dd3fc}
.badge.vf{background:rgba(251,191,36,.18);color:#fbbf24}
.badge.open{background:rgba(244,114,182,.2);color:#f9a8d4}
.badge.fill{background:rgba(52,211,153,.18);color:#6ee7b7}
.badge.match{background:rgba(167,139,250,.2);color:#c4b5fd}
.badge.order{background:rgba(251,146,60,.2);color:#fdba74}
/* tradução PT (bandeira BR) */
.tr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:calc(.88rem*var(--fs));line-height:1.3}
body.show-tr .tr{display:block}
.qtr{margin:2px 0 2px}
.qfig{font-size:calc(clamp(2rem,7vw,2.8rem)*var(--fs));margin:8px 0 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
/* a PERGUNTA domina a tela */
.q{font-size:calc(clamp(1.18rem,3.6vw,1.5rem)*var(--fs));font-weight:900;line-height:1.32;margin:8px auto 2px;max-width:32ch}
.speak{margin:8px auto 2px;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surf);color:var(--soft);
  font-weight:800;font-size:.78rem;border-radius:22px;padding:5px 14px;min-height:44px;cursor:pointer;font-family:inherit}
.speak:active{transform:scale(.95)}
/* linha de tarefa: diz O QUE FAZER, em uma frase curta */
.task{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto;font-size:calc(.8rem*var(--fs));font-weight:900;color:var(--accent);line-height:1.25}
.task::before,.task::after{content:"";flex:0 0 18px;height:2px;border-radius:2px;background:var(--accent);opacity:.45}
/* botão refazer a questão (cliques acidentais) */
.redoq{position:absolute;top:10px;right:10px;width:44px;height:44px;border:2px solid var(--line);border-radius:50%;background:var(--card);color:var(--soft);font-size:1.2rem;font-weight:900;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.redoq:active{transform:scale(.88) rotate(-90deg)}
.redoq .rl{position:absolute;bottom:-13px;font-size:.5rem;font-weight:900;letter-spacing:.3px;color:var(--soft);text-transform:uppercase}
/* ---------- alternativas: parecem teclas tocaveis ---------- */
.opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:460px;margin:0 auto}
.opt{min-height:52px;padding:11px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);font-size:calc(clamp(1rem,2.6vw,1.12rem)*var(--fs));font-weight:800;cursor:pointer;font-family:inherit;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;justify-content:center;gap:1px;box-shadow:var(--press)}
.opt:active{transform:translateY(1px)}
.opt.ok{background:var(--ok);color:#06251a;border-color:var(--ok);box-shadow:none}.opt.ok .otr{color:#06251a}
.opt.no{background:var(--no);color:#3a0a0a;border-color:var(--no);box-shadow:none}.opt.no .otr{color:#3a0a0a}
.opt:disabled{cursor:default;opacity:1}
.opt .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.78rem}
body.show-tr .opt .otr{display:block}
.vfwrap{display:flex;gap:12px;justify-content:center}
.vfbtn{flex:1;max-width:200px;min-height:96px;padding:14px 10px;border:2px solid var(--line);border-radius:18px;background:var(--surf);color:var(--ink);text-align:center;box-shadow:var(--press);
  font-size:calc(1.12rem*var(--fs));font-weight:900;cursor:pointer;font-family:inherit;transition:.15s}
.vfbtn .big{display:block;font-size:1.8rem;margin-bottom:2px}
.vfbtn:active{transform:scale(.96)}
.vfbtn.ok{background:var(--ok);color:#06251a;border-color:var(--ok);box-shadow:none}
.vfbtn.no{background:var(--no);color:#3a0a0a;border-color:var(--no);box-shadow:none}
/* FILL */
.fillsent{font-size:calc(clamp(1.1rem,3.2vw,1.38rem)*var(--fs));font-weight:900;line-height:1.7;margin:8px 4px 0}
.blank{display:inline-block;min-width:84px;border-bottom:3px solid var(--accent);margin:0 4px;padding:0 8px;color:var(--accent);background:var(--surf);border-radius:9px 9px 0 0}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.no{color:var(--no);border-color:var(--no)}
.wbank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:2px 0 4px}
.wchip{min-height:48px;padding:10px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);font-size:calc(1.02rem*var(--fs));font-weight:800;cursor:pointer;font-family:inherit;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;justify-content:center;gap:1px;box-shadow:var(--press)}
.wchip:active{transform:translateY(1px)}
.wchip.ok{background:var(--ok);color:#06251a;border-color:var(--ok);box-shadow:none}
.wchip.no{background:var(--no);color:#3a0a0a;border-color:var(--no);box-shadow:none}
.wchip .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.72rem}
body.show-tr .wchip .otr{display:block}
/* MATCH */
.mboard{display:flex;flex-direction:column;gap:8px;margin:2px 0}
.mitem{display:flex;align-items:center;gap:8px;min-height:48px;padding:9px 11px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);font-weight:800;font-size:calc(.96rem*var(--fs));cursor:pointer;font-family:inherit;text-align:left;transition:border-color .12s}
.mitem .mlbl{flex:1;display:flex;flex-direction:column;gap:1px}
.mitem .mtr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.74rem}
body.show-tr .mitem .mtr{display:block}
.mitem.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(251,146,60,.4) inset}
.mslot{min-width:74px;text-align:center;font-size:.74rem;font-weight:900;padding:5px 7px;border-radius:10px;background:var(--line);color:var(--soft)}
.mslot.set{background:rgba(56,189,248,.25);color:#bae6fd}
.mitem.ok{background:rgba(52,211,153,.16);border-color:var(--ok)}.mitem.ok .mslot{background:var(--ok);color:#06251a}
.mitem.no{background:rgba(248,113,113,.14);border-color:var(--no)}.mitem.no .mslot{background:var(--no);color:#3a0a0a}
.mcats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 2px}
.mcat{min-height:48px;padding:9px 14px;border:2px solid var(--line);border-radius:13px;background:var(--surf);color:var(--ink);font-weight:900;font-size:calc(.9rem*var(--fs));cursor:pointer;font-family:inherit;transition:transform .12s,border-color .12s;display:flex;flex-direction:column;justify-content:center;gap:1px;box-shadow:var(--press)}
.mcat:active{transform:translateY(1px)}
.mcat .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.66rem}
body.show-tr .mcat .otr{display:block}
/* ORDER */
.oseq{display:flex;flex-direction:column;gap:8px;margin:2px 0 4px;min-height:40px}
.oslot{display:flex;align-items:center;gap:9px;min-height:48px;padding:8px 11px;border:2px dashed var(--line);border-radius:14px;color:var(--soft);font-weight:800;font-size:calc(.96rem*var(--fs));font-family:inherit;background:transparent;cursor:pointer;text-align:left;width:100%}
.oslot.filled{border-style:solid;color:var(--ink);background:var(--surf)}
.oslot.ok{border-color:var(--ok);background:rgba(52,211,153,.14)}
.oslot.no{border-color:var(--no);background:rgba(248,113,113,.12)}
.onum{min-width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;background:var(--accent2);color:#3a1a00}
.opool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 2px}
.opiece{min-height:44px;padding:10px 14px;border:2px solid var(--accent);border-radius:13px;background:var(--surf);color:var(--ink);font-weight:800;font-size:calc(.98rem*var(--fs));cursor:pointer;font-family:inherit;transition:transform .12s;box-shadow:var(--press)}
.opiece:active{transform:translateY(1px)}
.opiece.used{opacity:.25;pointer-events:none;box-shadow:none}
.ocorrect{font-size:.85rem;font-weight:800;color:var(--soft);margin-top:8px;line-height:1.4}
/* OPEN */
.writeline{min-height:46px;border-bottom:3px dashed var(--line);margin:8px 4px 14px;display:flex;align-items:flex-end;justify-content:center;color:var(--soft);font-weight:700;font-size:.82rem;padding-bottom:4px}
.hint{font-size:.9rem;font-weight:800;color:var(--soft);margin-bottom:10px}
.reveal{display:none;margin:8px 0 4px;padding:13px 14px;border-radius:14px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);
  font-weight:800;font-size:calc(1.02rem*var(--fs));line-height:1.4;color:var(--ink)}
.reveal.show{display:block}
.reveal .lab{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.selfwrap{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.selfwrap.show{display:flex}
.selfbtn{flex:1;min-width:96px;min-height:64px;padding:10px 8px;border:2px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);font-weight:900;font-size:.86rem;cursor:pointer;font-family:inherit;transition:transform .12s;box-shadow:var(--press)}
.selfbtn .big{display:block;font-size:1.5rem;margin-bottom:2px}
.selfbtn .str{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.66rem}
body.show-tr .selfbtn .str{display:block}
.selfbtn:active{transform:translateY(1px)}
.selfbtn.acertei.sel{background:var(--ok);color:#06251a;border-color:var(--ok);box-shadow:none}
.selfbtn.parcial.sel{background:var(--mid);color:#3a2c00;border-color:var(--mid);box-shadow:none}
.selfbtn.errei.sel{background:var(--no);color:#3a0a0a;border-color:var(--no);box-shadow:none}
/* feedback: imediato e inconfundivel */
.fb{margin-top:14px;font-size:calc(1.05rem*var(--fs));font-weight:900;min-height:1.4em;line-height:1.35}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}.fb.mid{color:var(--mid)}
.next{margin-top:14px;width:100%;min-height:54px;border:none;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08263a;font-size:1.08rem;font-weight:900;cursor:pointer;display:none;font-family:inherit;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.next.show{display:block}
/* quando o botao leva ao RESULTADO ele muda de cara: verde, maior e pulsa
   uma vez — nao pode parecer um 'avancar' qualquer */
.next.result{background:linear-gradient(90deg,#34d399,#fbbf24);min-height:60px;font-size:1.15rem;animation:pulsaFim .9s ease-out 1}
@keyframes pulsaFim{0%{transform:scale(.96)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.next.result{animation:none}}
.next:active{transform:scale(.98)}
.fim .big{font-size:4rem}
.fim .score{font-size:1.7rem;font-weight:900;color:var(--accent);margin:8px 0 2px}
.fim .sub{font-weight:800;color:var(--soft);font-size:.95rem;margin-bottom:6px}
.intro p{font-size:calc(1rem*var(--fs));font-weight:700;line-height:1.5;color:var(--soft);margin:10px auto;max-width:46ch}
.themewrap{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:8px 0 4px}
.themechip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:96px;min-height:64px;flex:1 1 96px;max-width:150px;padding:10px;border:2px solid var(--line);border-radius:15px;background:var(--surf);color:var(--soft);font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit;transition:.15s;opacity:.5}
.themechip .tem{font-size:1.5rem}
.themechip .ttr{font-size:.62rem;font-weight:700}
.themechip.on{opacity:1;color:var(--ink);border-color:var(--accent);background:linear-gradient(135deg,rgba(56,189,248,.22),rgba(251,146,60,.15))}
.themechip:active{transform:scale(.95)}
.themehint{color:var(--no)!important;font-weight:900;font-size:.85rem;min-height:1em;margin:4px 0!important}
.startnote{font-size:.8rem;margin-top:8px}
.sizewrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 4px}
.sizebtn{min-width:64px;min-height:64px;padding:12px 10px;border:2px solid var(--accent2);border-radius:16px;background:var(--surf);color:var(--ink);font-size:1.3rem;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--press)}
.sizebtn .sl{font-size:.6rem;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.sizebtn:active{transform:translateY(1px)}
.sizebtn.sel{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(251,146,60,.18));border-color:var(--accent)}
.endbtns{display:flex;flex-direction:column;gap:10px;margin:18px auto 0;max-width:420px}
.endbtn{width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--line);border-radius:15px;background:var(--surf);color:var(--ink);font-size:1rem;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:var(--press)}
.endbtn.redo{border-color:var(--accent);background:linear-gradient(90deg,rgba(56,189,248,.22),rgba(251,146,60,.15))}
.endbtn .etr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.74rem}
body.show-tr .endbtn .etr{display:block}
.endbtn:active{transform:scale(.97)}
/* --- question nav arrows (always visible during quiz) --- */
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;justify-content:center;gap:14px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--card) 55%,rgba(0,0,0,0))}
.qnav.show{display:flex}
.qnav-btn{flex:1;max-width:160px;height:50px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);font-size:1.5rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.qnav-btn .ql{font-size:.78rem;font-weight:900;letter-spacing:.5px}
.qnav-btn:disabled{opacity:.32;cursor:default;box-shadow:none}
.qnav-btn:active:not(:disabled){transform:scale(.96)}
.qnav-btn.jump{max-width:130px;font-size:1.15rem;border-color:var(--accent2);color:var(--accent2);background:rgba(251,191,36,.12)}
.qnav-btn.jump:disabled{border-color:var(--line);color:var(--ink)}
.qnav-btn.results{max-width:160px;font-size:1.3rem;border-color:var(--accent);color:#08263a;background:var(--accent)}
/* --- lock / fullscreen --- */

.sombtn{transition:opacity .15s}
.sombtn.off{opacity:.45;background:rgba(248,113,113,.18)}
/* ---------- mouse (notebook): affordance de hover ---------- */
@media (hover:hover){
  .opt:not(:disabled):hover,.wchip:not(:disabled):hover,.mcat:not(:disabled):hover,.vfbtn:not(:disabled):hover,.selfbtn:not(:disabled):hover,.endbtn:hover,.themechip:hover,.sizebtn:hover{border-color:var(--accent)}
  .opiece:not(.used):hover{border-color:var(--accent2)}
  .next:hover{opacity:.92}
}
/* ---------- tablet retrato / telas medias ---------- */
@media (min-width:700px){
  .card{max-width:640px}
  .stage{padding-bottom:100px}
}
/* ---------- telas largas (notebook) ---------- */
@media (min-width:1000px){
  .card{max-width:880px;padding:28px 34px 30px}
  .stage{padding-bottom:104px}
}
/* ---------- pergunta ao lado das alternativas:
   celular em PAISAGEM (altura escassa) e notebook ---------- */
@media (orientation:landscape) and (max-height:520px),(min-width:1000px){
  .card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:clamp(16px,3vw,36px);align-items:start;align-content:start;text-align:left}
  .card>.intro,.card>.fim{grid-column:1/-1;text-align:center}
  .qhead,.qfig,.q,.qtr,.speak,.task,.fillsent{grid-column:1}
  .qhead{justify-content:flex-start;padding:0}
  .q,.fillsent{margin-left:0;margin-right:0;max-width:none}
  .task{justify-content:flex-start;margin:10px 0 6px}
  .task::after{display:none}
  .speak{margin:6px 0 2px}
  .opts,.vfwrap,.wbank{grid-column:2;grid-row:1/span 7;align-self:center;max-width:none;margin:0}
  .wbank{justify-content:flex-start}
  .mboard{grid-column:2;grid-row:1/span 4;margin:0}
  .mcats{grid-column:2;grid-row:5/span 3;justify-content:flex-start;margin:4px 0 0}
  .oseq{grid-column:2;grid-row:1/span 4;margin:0}
  .opool{grid-column:2;grid-row:5/span 3;justify-content:flex-start;margin:4px 0 0}
  .writeline{grid-column:2;grid-row:1/span 2;margin:6px 0}
  .reveal{grid-column:2;grid-row:3/span 2;margin:4px 0;text-align:left}
  .hint{grid-column:2;grid-row:5;margin:4px 0 2px}
  .selfwrap{grid-column:2;grid-row:6/span 2;margin-top:4px}
  .fb,.next{grid-column:1/-1;text-align:center}
  .redoq{position:static;grid-column:1/-1;justify-self:center;width:auto;min-width:44px;flex-direction:row;gap:7px;padding:0 16px;border-radius:22px;margin-top:6px;font-size:1rem}
  .redoq .rl{position:static;font-size:.62rem;bottom:auto}
}
/* ---------- celular em PAISAGEM: comprimir o eixo vertical ---------- */
@media (orientation:landscape) and (max-height:520px){
  .topbar{padding:5px 8px}
  .bar{height:6px}
  .stage{padding:8px 10px 70px}
  .card{max-width:min(97vw,780px);padding:12px 16px 14px;border-radius:18px}
  .qnum{font-size:.6rem}
  .qfig{font-size:calc(1.5rem*var(--fs));margin:2px 0 0}
  .q{font-size:calc(1.08rem*var(--fs));margin:4px 0 2px}

/* ================= TEMAS ================= */
const THEMES=[
 {k:'tempo',    en:'Units of time',      pt:'less, about, more than a minute', emo:'\u{23F1}\u{FE0F}'},
 {k:'horas',    en:'Telling time',       pt:'o relógio até o quarto de hora',  emo:'\u{1F551}'},
 {k:'dinheiro', en:'Money',              pt:'as moedas e os centavos',         emo:'\u{1FA99}'},
 {k:'somar',    en:'Adding',             pt:'somar com reagrupamento',         emo:'\u{2795}'},
 {k:'subtrair', en:'Subtracting',        pt:'subtrair com reagrupamento',      emo:'\u{2796}'}
];
/* pesos — telling time e o eixo com mais fatos no insumo (9 horas), depois dinheiro/somar/subtrair */
const TH_WEIGHT={tempo:12,horas:28,dinheiro:20,somar:20,subtrair:20};

/* ================= ENGINE ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=id=>document.getElementById(id);
let deck=[], cur=0, total=0, roundSize=25;
let selThemes=new Set(THEMES.map(t=>t.k));

/* score is derived from the items, so free navigation never double-counts */
function curScore(){return deck.reduce((s,it)=>s+(it.pts||0),0);}
function wrongItems(){return deck.filter(it=>it.done&&it.wrong);}

function makeItem(type,src){
  const it={_type:type,_src:src,type:type,...src};
  if(type==='mc') it.opts=shuffle(src.opts.map(p=>({t:p[0],ok:!!p[1],pt:p[2]})));
  if(type==='fill') it.chips=shuffle([{w:src.ans,ok:true},...src.bank.map(w=>({w,ok:false}))]);
  if(type==='match'){it.cho=new Array(src.items.length).fill(-1);it.active=0;it.locked=false;}
  if(type==='order'){it.order=shuffle(src.items.map((t,i)=>({t,rank:i})));it.seq=[];it.locked=false;}
  it.done=false; it.pts=0; it.wrong=false;
  return it;
}

function pickTheme(tag,count){
  const byType={mc:[],fill:[],vf:[],open:[],order:[],match:[]};
  const add=(arr,type)=>arr.forEach(o=>{if(o.th===tag)byType[type].push({type,src:o});});
  add(MC,'mc');add(FILL,'fill');add(VF,'vf');add(OPEN,'open');add(ORDER,'order');add(MATCH,'match');
  Object.keys(byType).forEach(k=>shuffle(byType[k]));
  const order=['mc','vf','fill','order','match','open'];
  const out=[]; let guard=0;
  while(out.length<count && guard<2000){
    let any=false;
    for(const t of order){ if(out.length>=count)break; if(byType[t].length){out.push(byType[t].shift());any=true;} }
    if(!any)break; guard++;
  }
  return out;
}

function buildDeck(n){
  const tags=[...selThemes];
  const sumW=tags.reduce((s,t)=>s+(TH_WEIGHT[t]||1),0)||1;
  let picks=[];
  tags.forEach(t=>{ picks=picks.concat(pickTheme(t,Math.round(n*(TH_WEIGHT[t]||1)/sumW))); });
  picks=shuffle(picks);
  if(picks.length>n) picks=picks.slice(0,n);
  if(picks.length<n){
    const used=new Set(picks.map(p=>p.src)); const rest=[];
    const addAll=(arr,type)=>arr.forEach(o=>{if(selThemes.has(o.th)&&!used.has(o))rest.push({type,src:o});});
    addAll(MC,'mc');addAll(VF,'vf');addAll(FILL,'fill');addAll(ORDER,'order');addAll(MATCH,'match');addAll(OPEN,'open');
    shuffle(rest);
    while(picks.length<n && rest.length) picks.push(rest.shift());
  }
  deck=shuffle(picks).map(p=>makeItem(p.type,p.src));
  total=deck.length; cur=0;
}

function esc(s){return String(s).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;').replace(/'/g,"\\'");}


/* ---- question navigation arrows ---- */
function prevQ(){ if(cur>0){cur--;render();} }
function nextQ(){ if(cur<total-1){cur++;render();} }
/* index of the next UNANSWERED question (search forward, wrap around); -1 if none */
function nextUnansweredIdx(){
  if(!deck||!total)return -1;
  for(var k=1;k<=total;k++){ var idx=(cur+k)%total; if(!deck[idx].done) return idx; }
  return -1;
}
function jumpUnanswered(){ var idx=nextUnansweredIdx(); if(idx>=0){ cur=idx; render(); } }
/* all questions answered? then the result screen must be reachable from anywhere */
function allAnswered(){ return deck && total>0 && deck.every(function(it){return it.done;}); }
function updateArrows(){
  $('qnav').classList.add('show');
  $('navPrev').disabled = cur<=0;
  $('navNext').disabled = cur>=total-1;
  var jb=$('navJump');
  if(allAnswered()){
    /* every question answered → turn the jump button into "See results" so the
       child always reaches the grade, even when answering out of order */
    jb.disabled=false; jb.classList.add('results');
    jb.onclick=fim; jb.title='See my score';
    jb.innerHTML='\u{1F389}<span class="ql">Results</span>';
  }else{
    jb.classList.remove('results');
    jb.onclick=jumpUnanswered; jb.title='Next unanswered';
    jb.innerHTML='⏩<span class="ql">Unanswered</span>';
    var ji=nextUnansweredIdx();
    jb.disabled = ji<0 || ji===cur;   /* só habilita se houver OUTRA questão sem resposta */
  }
}

/* ---- screens ---- */
function intro(){
  $('bar').style.width='0%';
  $('qnav').classList.remove('show');
  $('card').innerHTML=`<div class="intro">
    <div class="qfig">\u{1F30E}</div>
    <div class="q">Let's practise for the test!</div>
    <div class="tr qtr">Vamos treinar para a prova!</div>
    <p>You choose the subject and the size of your practice.
       <span class="tr">Você escolhe o assunto e o tamanho do treino.</span></p>
    <div class="task">1 · Choose the topics<span class="tr">escolha os temas</span></div>
    <div class="themewrap">
      ${THEMES.map(t=>`<button class="themechip${selThemes.has(t.k)?' on':''}" onclick="toggleTheme('${t.k}')">
        <span class="tem">${t.emo}</span><span>${t.en}</span><span class="ttr tr">${t.pt}</span></button>`).join('')}
    </div>
    <p class="themehint" id="themehint"></p>
    <div class="task">2 · Tap a number to start<span class="tr">toque num número para começar</span></div>
    <div class="sizewrap">
      ${[5,10,25,50,100].map(n=>`<button class="sizebtn${n===roundSize?' sel':''}" onclick="start(${n})">${n}<span class="sl">questions</span></button>`).join('')}
    </div>
    <p class="startnote">Start with 10 and build up from there. <span class="tr">Comece com 10 e depois aumente.</span></p>
  </div>`;
}
function toggleTheme(k){
  if(selThemes.has(k)){ if(selThemes.size>1) selThemes.delete(k); }
  else selThemes.add(k);
  intro();
}
function start(n){
  if(selThemes.size===0)return;
  roundSize=n; buildDeck(n);
  if(total===0){ const h=$('themehint'); if(h)h.innerHTML='Pick at least one topic.<span class="tr">escolha ao menos um tema</span>'; return; }
  render();
}
function render(){
  $('bar').style.width=(cur/total*100)+'%';
  const it=deck[cur];
  ({mc:renderMC,vf:renderVF,open:renderOpen,fill:renderFill,match:renderMatch,order:renderOrder}[it.type])(it);
  addRedoBtn();
  updateArrows();
}
/* redo THIS question — clears the answer, no score effect (accidental taps) */
function addRedoBtn(){
  const b=document.createElement('button');
  b.className='redoq';b.id='redoq';b.title='Do this question again';
  b.innerHTML='↺<span class="rl">again</span>';
  b.onclick=redoQ;
  $('card').appendChild(b);
}
function redoQ(){
  try{speechSynthesis.cancel();}catch(e){}
  deck[cur]=makeItem(deck[cur]._type,deck[cur]._src);
  render();
}
function head(it,label,cls){return `<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge ${cls}">${label}</span></div>
  ${it.fig?`<div class="qfig">${it.fig}</div>`:''}${it.en?`<div class="q">${it.en}</div><div class="tr qtr">${it.pt}</div>`:''}
  ${it.en?`<button class="speak" onclick="say('${esc(it.en)}')">&#128266; Listen</button>`:''}`;}
/* ============================================================
   REVELAR O BOTAO DEPOIS DE RESPONDER — e o caminho para o resultado.

   BUG QUE ISTO CORRIGE (10/08/2026): nextBtn() nasce com o atributo
   style="display:none" enquanto a pergunta nao foi respondida. Tres dos seis
   tipos (MC, V/F e completar) so faziam classList.add('show') ao responder — e
   estilo INLINE vence regra de classe, entao o botao continuava invisivel. Na
   ultima pergunta isso deixava a crianca sem saida: respondia e nao aparecia
   como ver o resultado.

   Alem de mostrar, aqui se REESCREVE o rotulo: a resposta que acabou de ser
   dada pode ter sido a ultima que faltava, e ai o botao deixa de ser "Next"
   e passa a ser "See my score". O rotulo tinha sido calculado no render,
   antes dessa resposta existir.
   ============================================================ */
function mostraNext(){
  const b=$('next'); if(!b)return;
  const acabou=(cur===total-1)||allAnswered();
  b.style.display='block'; b.classList.add('show');
  b.classList.toggle('result',acabou);
  b.innerHTML=acabou?'See my score \u{1F389}':'Next \u2192';
  updateArrows();                       /* a seta de cima tambem vira Resultado */
  if(acabou){
    /* em tela pequena o botao pode nascer abaixo da dobra: traz para a vista */
    try{ b.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){}
  }
}
function nextBtn(hidden){return `<button class="next" id="next" ${hidden?'style="display:none"':''} onclick="next()">${(cur===total-1||allAnswered())?'See my score \u{1F389}':'Next →'}</button>`;}

/* MC */
function renderMC(it){
  $('card').innerHTML=head(it,'Pick one','mc')+
   `<div class="task">Tap the right answer<span class="tr">toque na resposta certa</span></div>
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt" onclick="ansMC(${i})"><span>${o.t}</span>${o.pt?`<span class="otr">${o.pt}</span>`:''}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`+nextBtn(!it.done);
  if(it.done) paintMC(it);
}
function ansMC(i){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.pick=i;
  it.pts=it.opts[i].ok?1:0; it.wrong=!it.opts[i].ok;
  paintMC(it);
}
function paintMC(it){
  const b=document.querySelectorAll('.opt'), i=it.pick;
  b.forEach(x=>x.disabled=true);
  if(it.opts[i].ok){b[i].classList.add('ok');$('fb').textContent='Isso mesmo! \u{1F31F}';$('fb').className='fb ok';}
  else{b[i].classList.add('no');it.opts.forEach((o,k)=>{if(o.ok)b[k].classList.add('ok');});
    $('fb').innerHTML='The green one is right \u{1F60A}<span class="tr">a verde é a certa</span>';$('fb').className='fb no';}
  mostraNext();
}

/* V/F */
function renderVF(it){
  $('card').innerHTML=head(it,'Verdadeiro ou falso','vf')+
   `<div class="task">Tap True or False<span class="tr">toque em Verdadeiro ou Falso</span></div>
    <div class="vfwrap">
      <button class="vfbtn" id="vT" onclick="ansVF(true)"><span class="big">✅</span>Verdadeiro</button>
      <button class="vfbtn" id="vF" onclick="ansVF(false)"><span class="big">❌</span>Falso</button>
    </div><div class="fb" id="fb"></div>`+nextBtn(!it.done);
  if(it.done) paintVF(it);
}
function ansVF(val){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.pick=val;
  it.pts=(val===it.ans)?1:0; it.wrong=(val!==it.ans);
  paintVF(it);
}
function paintVF(it){
  const T=$('vT'),F=$('vF'); T.disabled=F.disabled=true;
  const rightBtn=it.ans?T:F;
  if(it.pick===it.ans){rightBtn.classList.add('ok');$('fb').textContent='Isso mesmo! \u{1F31F}';$('fb').className='fb ok';}
  else{(it.pick?T:F).classList.add('no');rightBtn.classList.add('ok');
    $('fb').innerHTML='The green one is right \u{1F60A}<span class="tr">a verde é a certa</span>';$('fb').className='fb no';}
  mostraNext();
}

/* COMPLETE */
function renderFill(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge fill">Finish the sentence</span></div>
   <button class="speak" onclick="say('${esc(it.pre+' '+it.ans+' '+it.post)}')">&#128266; Listen</button>
   <div class="fillsent">${it.pre} <span class="blank" id="blank">_____</span> ${it.post}</div>
   <div class="tr qtr">${it.pt}</div>
   <div class="task">Tap the word that fits<span class="tr">toque na palavra que completa</span></div>
   <div class="wbank">${it.chips.map((c,i)=>`<button class="wchip" onclick="ansFill(${i})"><span>${c.w}</span>${WPT[c.w]?`<span class="otr">${WPT[c.w]}</span>`:''}</button>`).join('')}</div>
   <div class="fb" id="fb"></div>`+nextBtn(!it.done);
  if(it.done) paintFill(it);
}
function ansFill(i){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.pick=i;
  it.pts=it.chips[i].ok?1:0; it.wrong=!it.chips[i].ok;
  paintFill(it);
}
function paintFill(it){
  const chips=document.querySelectorAll('.wchip'), i=it.pick, chosen=it.chips[i];
  chips.forEach(c=>c.disabled=true);
  $('blank').textContent=chosen.w;
  if(chosen.ok){chips[i].classList.add('ok');$('blank').classList.add('ok');$('fb').textContent='Isso mesmo! \u{1F31F}';$('fb').className='fb ok';}
  else{chips[i].classList.add('no');$('blank').classList.add('no');
    it.chips.forEach((c,k)=>{if(c.ok)chips[k].classList.add('ok');});
    $('blank').textContent=it.ans;$('blank').classList.remove('no');$('blank').classList.add('ok');
    $('fb').innerHTML='The right word is "'+it.ans+'" \u{1F60A}<span class="tr">a palavra certa</span>';$('fb').className='fb no';}
  mostraNext();
}

/* MATCH */
function renderMatch(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge match">Match</span></div>
   <div class="q">${it.t}</div>
   <div class="tr qtr">${it.tpt}</div>
   <button class="speak" onclick="say('${esc(it.t)}')">&#128266; Listen</button>
   <div class="task">Tap the item, then the right group<span class="tr">toque no item, depois no grupo certo</span></div>
   <div class="mboard" id="mboard"></div>
   <div class="mcats" id="mcats">${it.cats.map((c,ci)=>`<button class="mcat" onclick="pickCat(${ci})"><span>${c[0]}</span>${c[1]?`<span class="otr">${c[1]}</span>`:''}</button>`).join('')}</div>
   <div class="fb" id="fb"></div>
   <button class="next" id="mcheck" style="display:none" onclick="checkMatch()">Check &#9989;</button>`+nextBtn(true);
  drawMatch();
  if(it.done) paintMatch(it);
}
function drawMatch(){
  const it=deck[cur];
  $('mboard').innerHTML=it.items.map((m,mi)=>{
    const cho=it.cho[mi];
    const slot=cho>=0?`<span class="mslot set">${it.cats[cho][0]}</span>`:`<span class="mslot">?</span>`;
    return `<button class="mitem${mi===it.active?' active':''}" id="mi${mi}" onclick="pickItem(${mi})">
      <span class="mlbl"><span>${m[0]}</span><span class="mtr">${m[1]}</span></span>${slot}</button>`;
  }).join('');
  const done=it.cho.every(c=>c>=0);
  $('mcheck').style.display=done?'block':'none';
}
function pickItem(mi){const it=deck[cur];if(it.locked)return;it.active=mi;drawMatch();}
function pickCat(ci){
  const it=deck[cur];if(it.locked)return;
  it.cho[it.active]=ci;
  let nxt=it.cho.findIndex(c=>c<0); it.active=nxt<0?it.active:nxt;
  drawMatch();
}
function checkMatch(){
  const it=deck[cur]; if(it.done)return;
  it.locked=true; it.done=true;
  let right=0; it.items.forEach((m,mi)=>{ if(it.cho[mi]===m[2]) right++; });
  const all=it.items.length;
  it.pts=right/all; it.wrong=(right<all);
  paintMatch(it);
}
function paintMatch(it){
  let right=0;
  it.items.forEach((m,mi)=>{
    const el=$('mi'+mi); if(!el)return; el.disabled=true;
    if(it.cho[mi]===m[2]){el.classList.add('ok');right++;}
    else{el.classList.add('no');const sl=el.querySelector('.mslot');if(sl)sl.textContent=it.cats[m[2]][0];}
  });
  document.querySelectorAll('.mcat').forEach(c=>c.disabled=true);
  $('mcheck').style.display='none';
  const all=it.items.length;
  if(right===all){$('fb').textContent='Tudo certo! \u{1F31F}';$('fb').className='fb ok';}
  else{$('fb').innerHTML=right+' of '+all+' right — the green shows the answer \u{1F60A}<span class="tr">o verde mostra a resposta</span>';$('fb').className='fb mid';}
  mostraNext();
}

/* ORDER */
function renderOrder(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge order">Put in order</span></div>
   <div class="q">${it.t}</div>
   <div class="tr qtr">${it.tpt}</div>
   <button class="speak" onclick="say('${esc(it.t)}')">&#128266; Listen</button>
   <div class="task">Tap them in the right order — tap again to take one out<span class="tr">toque na ordem certa; toque de novo para tirar</span></div>
   <div class="oseq" id="oseq"></div>
   <div class="opool" id="opool"></div>
   <div class="fb" id="fb"></div>
   <button class="next" id="ocheck" style="display:none" onclick="checkOrder()">Check &#9989;</button>`+nextBtn(true);
  drawOrder();
  if(it.done) paintOrder(it);
}
function drawOrder(){
  const it=deck[cur], n=it.order.length;
  let seqHtml='';
  for(let p=0;p<n;p++){
    const chip=it.seq[p];
    seqHtml+=chip!=null
      ? `<button class="oslot filled" onclick="orderRemove(${p})"><span class="onum">${p+1}</span><span>${it.order[chip].t}</span></button>`
      : `<div class="oslot"><span class="onum">${p+1}</span><span>...</span></div>`;
  }
  $('oseq').innerHTML=seqHtml;
  $('opool').innerHTML=it.order.map((o,i)=>`<button class="opiece${it.seq.includes(i)?' used':''}" onclick="orderPlace(${i})">${o.t}</button>`).join('');
  $('ocheck').style.display=it.seq.length===n?'block':'none';
}
function orderPlace(i){const it=deck[cur];if(it.locked)return;if(it.seq.includes(i))return;it.seq.push(i);drawOrder();}
function orderRemove(p){const it=deck[cur];if(it.locked)return;it.seq.splice(p,1);drawOrder();}
function checkOrder(){
  const it=deck[cur]; if(it.done)return;
  it.locked=true; it.done=true;
  let right=0; it.seq.forEach((chip,p)=>{ if(it.order[chip].rank===p) right++; });
  const all=it.order.length;
  it.pts=right/all; it.wrong=(right<all);
  paintOrder(it);
}
function paintOrder(it){
  let right=0;
  const slots=document.querySelectorAll('#oseq .oslot');
  it.seq.forEach((chip,p)=>{
    const ok=it.order[chip].rank===p;
    if(slots[p]){if(ok){slots[p].classList.add('ok');right++;}else slots[p].classList.add('no');}else if(ok)right++;
  });
  document.querySelectorAll('.opiece').forEach(c=>c.classList.add('used'));
  $('ocheck').style.display='none';
  const all=it.order.length;
  if(right===all){$('fb').innerHTML='Correct order! \u{1F31F}<span class="tr">ordem certa!</span>';$('fb').className='fb ok';}
  else{
    const correct=it._src.items.join('  →  ');
    $('fb').innerHTML=right+' of '+all+' in the right place \u{1F60A}<span class="tr">'+right+' de '+all+' no lugar certo</span><div class="ocorrect">Correct order: '+correct+'<span class="tr">ordem certa: '+correct+'</span></div>';
    $('fb').className='fb mid';
  }
  mostraNext();
}

/* OPEN */
function renderOpen(it){
  $('card').innerHTML=head(it,'Your answer','open')+
   `<div class="task">Answer in your head, then check<span class="tr">responda de cabeça e depois confira</span></div>
    <div class="writeline">&#9999;&#65039; Say your answer out loud<span class="tr">responda em voz alta</span></div>
    <button class="next show" id="seebtn" onclick="reveal()">Show the answer &#128065;&#65039;</button>
    <div class="reveal" id="rev"><span class="lab">Answer<span class="tr">resposta</span></span>${it.men}<div class="tr">${it.menpt||''}</div></div>
    <div class="hint" id="selfhint" style="display:none">Did you get it?<span class="tr">você acertou?</span></div>
    <div class="selfwrap" id="self">
      <button class="selfbtn acertei" onclick="self('ok')"><span class="big">\u{1F604}</span>I got it</button>
      <button class="selfbtn parcial" onclick="self('mid')"><span class="big">\u{1F610}</span>Almost</button>
      <button class="selfbtn errei" onclick="self('no')"><span class="big">\u{1F605}</span>Not yet</button>
    </div>
    <div class="fb" id="fb"></div>`+nextBtn(true);
  if(it.revealed||it.done){$('rev').classList.add('show');$('seebtn').style.display='none';$('selfhint').style.display='block';$('self').classList.add('show');}
  if(it.done) paintSelf(it);
}
function reveal(){const it=deck[cur];it.revealed=true;$('rev').classList.add('show');$('seebtn').style.display='none';$('selfhint').style.display='block';$('self').classList.add('show');}
function self(v){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.selfv=v;
  if(v==='ok'){it.pts=1;it.wrong=false;}else if(v==='mid'){it.pts=0.5;it.wrong=true;}else{it.pts=0;it.wrong=true;}
  paintSelf(it);
}
function paintSelf(it){
  document.querySelectorAll('.selfbtn').forEach(b=>b.disabled=true);
  if(it.selfv==='ok'){document.querySelector('.selfbtn.acertei').classList.add('sel');$('fb').innerHTML='Well done! \u{1F31F}<span class="tr">muito bem!</span>';$('fb').className='fb ok';}
  else if(it.selfv==='mid'){document.querySelector('.selfbtn.parcial').classList.add('sel');$('fb').innerHTML='Almost there! \u{1F44D}<span class="tr">quase lá!</span>';$('fb').className='fb mid';}
  else{document.querySelector('.selfbtn.errei').classList.add('sel');$('fb').innerHTML='Now you know! \u{1F4AA}<span class="tr">agora você sabe!</span>';$('fb').className='fb no';}
  mostraNext();
}

function next(){ if(allAnswered()){fim();return;} cur++; if(cur<total)render(); else fim(); }
function redoWrong(){
  const w=wrongItems().map(it=>({type:it._type,src:it._src}));
  deck=shuffle(w).map(x=>makeItem(x.type,x.src));
  total=deck.length;cur=0;
  render();
}
function fim(){
  $('bar').style.width='100%';
  $('qnav').classList.remove('show');
  const score=curScore(), s=Math.round(score*10)/10, pct=total?score/total:0;
  const msg=pct>=.9?'You nailed it! \u{1F3C6}<span class="tr">você arrasou!</span>':pct>=.6?'Well done! Keep practising.<span class="tr">muito bem! continue treinando.</span>':'Good practice — play again to learn more!<span class="tr">bom treino: jogue de novo.</span>';
  const nWrong=wrongItems().length;
  const redoBtn=nWrong?`<button class="endbtn redo" onclick="redoWrong()">↺ Redo the ones I missed (${nWrong})<span class="etr">refazer as que errei</span></button>`:'';
  $('card').innerHTML=`<div class="fim"><div class="big">\u{1F3C6}</div>
    <div class="score">${s} / ${total}</div>
    <div class="sub">${msg}</div>
    <div class="endbtns">
      ${redoBtn}
      <button class="endbtn" onclick="intro()">\u{1F3B2} New practice test<span class="etr">novo simulado</span></button>
      <button class="endbtn" onclick="goHome()">\u{1F3E0} Site menu<span class="etr">menu do site</span></button>
    </div></div>`;
}

intro();
</script>
