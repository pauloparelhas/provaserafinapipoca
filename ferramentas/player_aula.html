<!DOCTYPE html>
<html lang="pt-BR">
<!-- ===================================================================
  PLAYER DE AULA EM MARKDOWN (kids) — inspirado no player do projeto Pratico.
  Toca um arquivo .md slide a slide (split por "## "), lendo a narracao de
  cada slide FRASE A FRASE com destaque, usando voz nativa (prioriza Thalita).
  Uso:  player_aula.html?file=aulas/lp2_portugues.md&voice=thalita
  GitHub Pages compativel (fetch same-origin). Offline file:// nao busca o md.
==================================================================== -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<title>Aula em Audio</title>
<style>
:root{--fs:1;--bg:#fff7ed;--bg2:#ffe7cf;--ink:#3b2f2f;--ink2:#6b5d52;--card:#fff;--accent:#fb923c;--soft:#fde9c8;--hl:#fde68a;--rad:22px;--shadow:0 10px 28px rgba(180,120,30,.16)}
body.dark{--bg:#171428;--bg2:#221d3a;--ink:#f5f3ff;--ink2:#c7bfe6;--card:#2a2548;--soft:#3a3160;--hl:#5a4a1e;--shadow:0 10px 28px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Comic Sans MS','Trebuchet MS','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.topbar .ttl{font-weight:800;font-size:calc(1rem*var(--fs));color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:44px;height:44px;min-width:44px;border:none;border-radius:13px;background:var(--soft);color:var(--ink);font-size:1.15rem;cursor:pointer;display:grid;place-items:center}
.ic:active{transform:scale(.9)}
.sel{height:44px;max-width:130px;border:none;border-radius:11px;background:var(--soft);color:var(--ink);font-family:inherit;font-weight:700;font-size:.8rem;padding:0 6px;cursor:pointer}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:560px;background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:22px 20px 24px;min-height:46vh;display:flex;flex-direction:column}
.card h2{font-size:calc(1.5rem*var(--fs));color:var(--accent);margin-bottom:14px;line-height:1.2;text-align:center}
.txt{font-size:calc(1.3rem*var(--fs));line-height:1.7;color:var(--ink);flex:1}
.sent{transition:background .15s;border-radius:6px;padding:0 .1em;cursor:pointer}
.sent.cur{background:var(--hl);font-weight:700}
.sent.done{opacity:.55}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--soft)}
.dot.on{background:var(--accent);transform:scale(1.4)}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;background:var(--card);box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.cbtn{width:54px;height:54px;border:none;border-radius:50%;background:var(--soft);color:var(--ink);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.cbtn:active{transform:scale(.9)}
.cbtn.play{width:70px;height:70px;background:var(--accent);color:#fff;font-size:1.8rem;box-shadow:0 6px 18px rgba(251,146,60,.4)}
.cbtn:disabled{opacity:.35}
.spd{min-width:54px;height:44px;border:none;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:800;font-family:inherit;font-size:.9rem;cursor:pointer}
.msg{text-align:center;color:var(--ink2);padding:30px;font-size:1.05rem}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="ic" title="Inicio" onclick="goHome()">&#127968;</button>
    <span class="ttl" id="ttl">Aula em Audio</span>
    <select class="sel" id="voicesel" title="Voz" onchange="setVoice(this.value)"></select>
    <button class="ic" id="thBtn" title="Tema" onclick="theme()">&#127769;</button>
  </div>
  <div class="stage"><div class="card" id="card"><div class="msg">Carregando a aula…</div></div></div>
  <div class="controls">
    <button class="cbtn" id="prev" title="Slide anterior" onclick="goSlide(-1)">&#9664;</button>
    <button class="cbtn play" id="play" title="Tocar/Pausar" onclick="toggle()">&#9654;</button>
    <button class="cbtn" id="next" title="Proximo slide" onclick="goSlide(1)">&#9654;&#9654;</button>
    <button class="spd" id="spd" title="Velocidade" onclick="cycleSpd()">1.0x</button>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search);
const FILE=qs.get('file')||'aulas/lp2_portugues.md';
const WANT=(qs.get('voice')||'thalita').toLowerCase();
let slides=[], cur=0, sents=[], si=0, playing=false, rate=1.0, gen=0, autoTimer=null;
const RATES=[0.8,0.9,1.0,1.1];

/* ---------- vozes (nativas; prioriza Thalita) ---------- */
let VOICES=[], voice=null;
function loadVoices(){
  const all=speechSynthesis.getVoices();
  let pt=all.filter(v=>/pt[-_]?br/i.test(v.lang)||/portug/i.test(v.name));
  if(!pt.length) pt=all.filter(v=>/^pt/i.test(v.lang));
  VOICES=pt.length?pt:all;
  const saved=localStorage.getItem('aula_voice');
  voice=(saved&&VOICES.find(v=>v.name===saved))
      || VOICES.find(v=>new RegExp(WANT,'i').test(v.name))
      || VOICES.find(v=>/thalita/i.test(v.name))
      || VOICES.find(v=>/ant[oô]nio/i.test(v.name))
      || VOICES.find(v=>/pt[-_]?br/i.test(v.lang)) || VOICES[0] || null;
  buildMenu();
}
function buildMenu(){
  const sel=$('#voicesel');
  if(!VOICES.length){ sel.innerHTML='<option>voz padrão</option>'; return; }
  sel.innerHTML=VOICES.map(v=>{
    const n=v.name.replace(/Microsoft|Online|\(Natural\)|- Portuguese.*|\(.*?\)/gi,'').trim()||v.name;
    return `<option value="${v.name}" ${voice&&v.name===voice.name?'selected':''}>${n}</option>`;
  }).join('');
}
function setVoice(n){ voice=VOICES.find(v=>v.name===n)||voice; if(voice)localStorage.setItem('aula_voice',voice.name); }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }

/* ---------- carregar e parsear o MD ---------- */
fetch(FILE).then(r=>{if(!r.ok)throw 0;return r.text()}).then(parseMD).catch(()=>{
  $('#card').innerHTML='<div class="msg">Não consegui abrir a aula.<br>Abra pelo site (GitHub Pages), não direto do arquivo.</div>';
});
function parseMD(md){
  const lines=md.replace(/\r/g,'').split('\n');
  let title='Aula', body=[], gotTitle=false;
  for(const ln of lines){ if(!gotTitle && /^#\s+/.test(ln)){title=ln.replace(/^#\s+/,'').trim();gotTitle=true;} else body.push(ln); }
  $('#ttl').textContent=title; document.title=title;
  const chunks=('\n'+body.join('\n')).split(/\n##\s+/).map(s=>s.trim()).filter(Boolean);
  slides=chunks.map(c=>{
    const nl=c.indexOf('\n');
    const h=(nl<0?c:c.slice(0,nl)).replace(/^##\s*/,'').trim();
    const t=(nl<0?'':c.slice(nl+1)).replace(/\n+/g,' ').trim();
    return {h,t};
  });
  if(!slides.length){ $('#card').innerHTML='<div class="msg">Aula vazia.</div>'; return; }
  cur=0; render();
}
function splitSentences(t){
  const m=t.match(/[^.!?…]+[.!?…]+|\S[^.!?…]*$/g);
  return (m||[t]).map(s=>s.trim()).filter(Boolean);
}

/* ---------- render slide ---------- */
function render(){
  stop();
  const s=slides[cur];
  sents=splitSentences(s.t); si=0;
  const spans=sents.map((x,i)=>`<span class="sent" data-i="${i}" onclick="jump(${i})">${x}</span>`).join(' ');
  $('#card').innerHTML=`<h2>${s.h}</h2><div class="txt" id="txt">${spans}</div>
     <div class="dots">${slides.map((_,i)=>`<span class="dot ${i===cur?'on':''}"></span>`).join('')}</div>`;
  $('#prev').disabled=cur===0;
  $('#next').disabled=cur===slides.length-1;
}
function mark(){
  document.querySelectorAll('.sent').forEach((el,i)=>{
    el.classList.toggle('cur',i===si);
    el.classList.toggle('done',i<si);
  });
  const c=document.querySelector('.sent.cur'); if(c)c.scrollIntoView({block:'nearest'});
}

/* ---------- TTS engine (frase a frase) ---------- */
function speakCur(){
  if(si>=sents.length){ playing=false; setPlayIcon(); // fim do slide
    if(cur<slides.length-1){ const at=cur; if(autoTimer)clearTimeout(autoTimer);
      autoTimer=setTimeout(()=>{ autoTimer=null; if(at===cur && !playing){cur++;render();playing=true;setPlayIcon();speakCur();} },1000); }
    return; }
  mark();
  const myGen=++gen;
  const u=new SpeechSynthesisUtterance(sents[si]);
  u.lang='pt-BR'; u.rate=rate; u.pitch=1.05; if(voice)u.voice=voice;
  u.onend=()=>{ if(playing && myGen===gen){ si++; speakCur(); } };
  speechSynthesis.speak(u);
}
function toggle(){ if(playing) pause(); else play(); }
function play(){ if(!sents.length)return; playing=true; setPlayIcon(); if(si>=sents.length)si=0; speakCur(); }
function pause(){ playing=false; gen++; if(autoTimer){clearTimeout(autoTimer);autoTimer=null;} setPlayIcon(); speechSynthesis.cancel(); }
function stop(){ playing=false; gen++; if(autoTimer){clearTimeout(autoTimer);autoTimer=null;} setPlayIcon(); if('speechSynthesis' in window)speechSynthesis.cancel(); }
function setPlayIcon(){ $('#play').innerHTML=playing?'&#10073;&#10073;':'&#9654;'; }
function jump(i){ si=i; speechSynthesis.cancel(); if(playing)speakCur(); else mark(); }
function goSlide(d){ const n=Math.max(0,Math.min(slides.length-1,cur+d)); if(n!==cur){cur=n;render();} }
function cycleSpd(){ rate=RATES[(RATES.indexOf(rate)+1)%RATES.length]; $('#spd').textContent=rate.toFixed(1)+'x'; if(playing){speechSynthesis.cancel();speakCur();} }

/* ---------- controles ---------- */
function theme(){ document.body.classList.toggle('dark'); const d=document.body.classList.contains('dark'); localStorage.setItem('aula_theme',d?'d':'l'); $('#thBtn').textContent=d?'☀️':'\u{1F319}'; }
function goHome(){ stop(); if(confirm('Voltar ao início do site?'))location.href='../index.html'; }
(function init(){ if(localStorage.getItem('aula_theme')==='d'){document.body.classList.add('dark');$('#thBtn').textContent='☀️';} })();
</script>
</body>
</html>
