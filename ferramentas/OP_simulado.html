<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Simulado — Olimpíada de Português</title>
<link rel="stylesheet" href="serafina-core.css?v=20260908">
<link rel="stylesheet" href="OP_estilo.css?v=20260908b">
<style>
/* só o que é exclusivo desta tela */
.placar{font-size:calc(2.6rem*var(--fs));font-weight:900;line-height:1;color:var(--accent);text-align:center;margin:6px 0 2px}
.placarsub{text-align:center;font-size:calc(.9rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.45;margin-bottom:12px}
.fambar{display:flex;justify-content:space-between;gap:9px;font-size:calc(.86rem*var(--fs));font-weight:800;
  padding:7px 11px;border-radius:10px;background:var(--surf);border:1px solid var(--line);margin-bottom:6px}
.fambar.zero{opacity:.55}
.progresso{font-size:calc(.74rem*var(--fs));font-weight:800;color:var(--dim);text-align:center;margin-top:9px;line-height:1.4}
.bancobar{height:8px;border-radius:5px;background:var(--line);margin:14px 0 0;overflow:hidden}
.bancofill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
body.papel .bancobar{background:#e4e4e4}
body.papel .progresso{color:#555}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn sera-home" title="Início" onclick="goHome()">&#127968;</button>
    <span class="title">Simulado</span>
    <button class="iconbtn" title="Letra menor" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Letra maior" onclick="fs(1)">A+</button>
    <button class="iconbtn sombtn" id="sombtn" title="Som" onclick="toggleSom()">&#128266;</button>
    <button class="iconbtn" id="papelbtn" title="Como no papel da prova" onclick="togglePapel()">&#128196;</button>
    <button class="iconbtn" title="Tema" onclick="document.body.classList.toggle('light')">&#127769;</button>
    <button class="iconbtn lockbtn" id="lockbtn" title="Tela cheia" onclick="toggleLock()">&#128274;</button>
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="stage"><div class="card" id="raiz"></div></div>
</div>
<div class="qnav" id="qnav" style="display:none">
  <button class="qnav-btn" id="navPrev">&#8249; Voltar</button>
  <button class="qnav-btn forte" id="navNext">Avan&ccedil;ar &#8250;</button>
</div>

<script>window.SERA_CFG={trKey:null,lang:'pt-BR',rate:.86,home:'../index.html',somKey:'op_som',stars:90};</script>
<script src="serafina-core.js?v=20260908"></script>
<script>
/* MODO PAPEL — a folha da prova de verdade, com a interacao por cima.
   Ligado por padrao nesta tela: o objetivo e a crianca reconhecer no dia
   o que esta vendo. O botao da folha alterna para o visual do site, para
   quem preferir ler no escuro. A escolha fica salva. */
(function(){
  var K='op_papel';
  function ligado(){ try{ return localStorage.getItem(K)!=='0'; }catch(e){ return true; } }
  function pinta(){
    var on=ligado();
    document.body.classList.toggle('papel',on);
    var b=document.getElementById('papelbtn');
    if(b){
      b.innerHTML = on ? '&#128196;' : '&#128421;&#65039;';
      b.title = on ? 'Assim e a folha da prova. Tocar para ver na tela.' : 'Ver como na folha da prova';
    }
    var m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content', on ? '#8a8f98' : '#0d0b1e');
  }
  window.togglePapel=function(){
    try{ localStorage.setItem(K, ligado()?'0':'1'); }catch(e){}
    pinta();
  };
  pinta();
  document.addEventListener('DOMContentLoaded',pinta);
})();
</script>
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="OP_data.js?v=20260908b"></script>
<script src="OP_questao.js?v=20260908b"></script>
<script>
/* ============================================================
   SIMULADO — rodadas de 15, como a prova.

   O banco tem mais de 100 questões reais das seis provas oficiais. Uma
   rodada é sempre de 15, com as cotas por família que a prova real usa,
   e o motor NÃO repete: guarda em localStorage os ids que ela já viu e
   só volta a sortear os antigos quando o banco se esgota. Assim ela pode
   fazer sete rodadas seguidas sem reencontrar uma pergunta.

   Errar não fecha a questão: abre a correção (no componente único
   OP_questao.js) e insere logo em seguida uma questão-irmã da mesma
   família, fora da nota — para ela acertar uma igual enquanto o truque
   está fresco.
   ============================================================ */
'use strict';
var h=React.createElement, OP=window.OP, OPQ=window.OPQ;
var FAM={}; OP.FAMILIAS.forEach(function(f){ FAM[f.k]=f; });
var VISTOS='op_vistos';

function vistos(){ try{ return JSON.parse(localStorage.getItem(VISTOS)||'[]'); }catch(e){ return []; } }
function marcaVisto(ids){
  var v=vistos(); ids.forEach(function(i){ if(v.indexOf(i)<0) v.push(i); });
  try{ localStorage.setItem(VISTOS,JSON.stringify(v)); }catch(e){}
}
function zeraVistos(){ try{ localStorage.removeItem(VISTOS); }catch(e){} }

/* monta uma rodada de n questões respeitando as cotas da prova real e
   dando prioridade ao que ela ainda não viu */
function montaRodada(n){
  var jaVi=vistos(), escolhidas=[];
  function doEixo(k, quantas){
    var pool=OP.ITENS.filter(function(i){ return i.eixo===k && escolhidas.indexOf(i)<0; });
    var novas=OPQ.embaralha(pool.filter(function(i){ return jaVi.indexOf(i.id)<0; }));
    var velhas=OPQ.embaralha(pool.filter(function(i){ return jaVi.indexOf(i.id)>=0; }));
    escolhidas=escolhidas.concat(novas.concat(velhas).slice(0,quantas));
  }
  if(n>=15){ OP.FAMILIAS.forEach(function(f){ if(f.cota) doEixo(f.k,f.cota); }); }
  else { ['ler','letras','silabas','buraco','intruso'].forEach(function(k){ doEixo(k,1); }); }
  /* completa o que faltar, do que ela menos viu */
  var resto=OP.ITENS.filter(function(i){ return escolhidas.indexOf(i)<0; });
  var novasResto=OPQ.embaralha(resto.filter(function(i){ return jaVi.indexOf(i.id)<0; }));
  var velhasResto=OPQ.embaralha(resto.filter(function(i){ return jaVi.indexOf(i.id)>=0; }));
  escolhidas=escolhidas.concat(novasResto).concat(velhasResto);
  return OPQ.embaralha(escolhidas.slice(0,n));
}
/* A questao-irma tambem tem de respeitar o historico. Sem isso ela era
   sorteada so entre as que nao estavam na rodada ATUAL, e voltava a cair
   nas mesmas poucas rodada apos rodada — num teste de 4 rodadas, 47 das
   160 perguntas vistas eram repeticao, quase todas irmas. */
function irma(eixo, usados){
  var jaVi=vistos();
  var pool=OP.ITENS.filter(function(i){ return i.eixo===eixo && usados.indexOf(i.id)<0; });
  var novas=pool.filter(function(i){ return jaVi.indexOf(i.id)<0; });
  var escolhida=OPQ.embaralha(novas.length?novas:pool)[0];
  return escolhida||null;
}

function App(){
  var t=React.useState('inicio'), tela=t[0], setTela=t[1];
  var f=React.useState([]), fila=f[0], setFila=f[1];
  var c=React.useState(0), cur=c[0], setCur=c[1];
  var r=React.useState({}), resp=r[0], setResp=r[1];   /* id -> acertou */
  var e=React.useState({}), extra=e[0], setExtra=e[1]; /* ids que sao irmas */

  var totalBanco=OP.ITENS.length, jaVistas=vistos().length;

  function comeca(n){
    var q=montaRodada(n);
    setFila(q); setCur(0); setResp({}); setExtra({}); setTela('q');
    marcaVisto(q.map(function(i){ return i.id; }));
  }
  function responde(acertou,item){
    var novo={}; for(var k in resp) novo[k]=resp[k];
    novo[item.id]=acertou; setResp(novo);
    if(!acertou){
      var usados=fila.map(function(i){ return i.id; });
      var ir=irma(item.eixo, usados);
      if(ir){
        var nf=fila.slice(); nf.splice(cur+1,0,ir); setFila(nf);
        var ne={}; for(var j in extra) ne[j]=extra[j]; ne[ir.id]=1; setExtra(ne);
        marcaVisto([ir.id]);
      }
    }
  }
  function avanca(){ if(cur>=fila.length-1) setTela('fim'); else setCur(cur+1); }
  function volta(){ if(cur>0) setCur(cur-1); }

  /* barra de progresso e navegação de baixo, que vivem fora do React */
  React.useEffect(function(){
    var bar=document.getElementById('bar');
    var nav=document.getElementById('qnav');
    if(tela!=='q'){ nav.style.display='none'; bar.style.width = tela==='fim'?'100%':'0%'; return; }
    nav.style.display='flex';
    bar.style.width=Math.round(cur/fila.length*100)+'%';
    var p=document.getElementById('navPrev'), n=document.getElementById('navNext');
    p.disabled = cur===0; p.onclick=volta;
    n.onclick=avanca;
    n.innerHTML = (cur===fila.length-1) ? 'Ver como fui' : 'Avan&ccedil;ar &#8250;';
  });

  if(tela==='inicio'){
    var faltam=Math.max(0,totalBanco-jaVistas);
    var rodadas=Math.floor(totalBanco/15);
    return h('div',null,
      h('h1',{className:'tt'},'Simulado'),
      h('p',{className:'sub'},'Rodadas de 15, como a prova. Errou, o truque aparece na hora e vem outra igual para você acertar.'),
      h('div',{className:'grade duas'},
        h('button',{className:'linha',onClick:function(){ comeca(5); }},
          h('span',{className:'n'},'5'),
          h('span',null,h('b',null,'Aquecer'),h('small',null,'cinco perguntas, uns cinco minutos'))),
        h('button',{className:'linha',onClick:function(){ comeca(15); }},
          h('span',{className:'n'},'15'),
          h('span',null,h('b',null,'Prova inteira'),h('small',null,'quinze perguntas, igual à de verdade')))
      ),
      /* Barra de progresso do banco: com mais de cem perguntas, saber
         quanto falta é o que dá vontade de continuar — e mostra que não
         vai repetir tão cedo. */
      h('div',{className:'bancobar'},
        h('div',{className:'bancofill',style:{width:Math.round(jaVistas/totalBanco*100)+'%'}})),
      h('p',{className:'progresso'},
        faltam>0
          ? 'São '+totalBanco+' perguntas no banco — dá para '+rodadas+' rodadas sem repetir nenhuma. Você já viu '+jaVistas+' e ainda faltam '+faltam+'.'
          : 'Você já passou pelas '+totalBanco+' perguntas do banco. Daqui para a frente elas voltam a aparecer.'),
      jaVistas>0 && h('div',{className:'linhabtn',style:{justifyContent:'center'}},
        h('button',{className:'mini',onClick:function(){ zeraVistos(); setTela('inicio0'); setTimeout(function(){ setTela('inicio'); },0); }},
          'Recomeçar do zero'))
    );
  }
  if(tela==='inicio0') return h('div',null);

  if(tela==='q'){
    var item=fila[cur];
    var reais=fila.filter(function(i){ return !extra[i.id]; });
    var num=reais.indexOf(item)>=0 ? reais.indexOf(item)+1 : null;
    return h(OPQ.Questao,{
      key:item.id+'-'+cur,
      item:item,
      numero:num, total:num?reais.length:null,
      etiqueta: extra[item.id] ? 'mais uma do mesmo jeito' : null,
      respostaInicial: undefined,
      aoResponder:responde,
      aoAvancar:avanca,
      rotuloAvancar: cur===fila.length-1 ? 'Ver como fui' : 'Próxima'
    });
  }

  /* resultado */
  var reais=fila.filter(function(i){ return !extra[i.id]; });
  var acertos=reais.filter(function(i){ return resp[i.id]; }).length;
  var extras=fila.filter(function(i){ return extra[i.id]; });
  var extrasOk=extras.filter(function(i){ return resp[i.id]; }).length;
  var porFam={};
  reais.forEach(function(i){
    porFam[i.eixo]=porFam[i.eixo]||{ok:0,t:0};
    porFam[i.eixo].t++; if(resp[i.id]) porFam[i.eixo].ok++;
  });
  var msg = acertos===reais.length ? 'Gabaritou. É exatamente isso que a prova pede.'
          : acertos>=reais.length-2 ? 'Quase tudo. Olhe abaixo qual truque escapou e treine só ele.'
          : 'Cada erro aqui é uma pergunta que você não vai errar na prova.';
  return h('div',null,
    h('div',{className:'placar'},acertos+'/'+reais.length),
    h('p',{className:'placarsub'},msg),
    extras.length>0 && h('p',{className:'placarsub'},
      'Nas '+extras.length+' perguntas extras que vieram depois dos truques, você acertou '+extrasOk+'.'),
    h('div',{className:'secao'},'por tipo de pergunta'),
    OP.FAMILIAS.filter(function(f){ return porFam[f.k]; }).map(function(f){
      var v=porFam[f.k];
      return h('div',{key:f.k,className:'fambar'+(v.ok===0?' zero':'')},
        h('span',{style:{color:f.cor}},f.nome), h('b',null,v.ok+' de '+v.t));
    }),
    h('div',{className:'grade',style:{marginTop:'12px'}},
      acertos<reais.length && h('button',{className:'avancar',onClick:function(){
        var err=reais.filter(function(i){ return !resp[i.id]; });
        setFila(err); setCur(0); setResp({}); setExtra({}); setTela('q');
      }},'Refazer as que errei'),
      h('button',{className:'avancar calmo',onClick:function(){ comeca(15); }},'Outro simulado'),
      h('button',{className:'avancar calmo',onClick:function(){ setTela('inicio'); }},'Voltar ao início')
    )
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(h(App));
</script>
<script>window.SERA_ACCENT={accent:'#4ade80'};</script>
<script src="sera_theme.js?v=20260908"></script>
</body>
</html>
