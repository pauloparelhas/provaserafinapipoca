<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Arrasta e solta — Biomas</title>

<style>
/* GEO3_arrasta v2 (10/11/2026, pedido do Paulo): fauna e flora dos 6 biomas.
   Fonte unica: trabalho/3tri_geografia/_roteiro.md T11 (tabela S8 + fotos S9-S14). Fotos = recortes da aula (media/geo3/t_*).
   Modo A "Todos os biomas": TODOS os cartoes a vista desde o inicio; as caixas comecam pequenas e crescem com o que entra.
     Botao Dicas: cada cartao ganha a cor da caixa do seu bioma. Botao Fotos: cartao com foto grande ou so o nome.
   Modo B "Um bioma por vez": tocar em tudo o que e do bioma que aparece.
   Itens em 2 biomas (capivara, bromelia): o cartao fica ate entrar nos 2; a bromelia aparece com a foto de cada bioma
   (Mata Atlantica: "Bromelia"; Pantanal: "Bromelias em area alagada", S14). */
html,body{height:100%;overflow:hidden}
button{touch-action:manipulation}
.app{height:100vh;height:100dvh;min-height:0}
.palco{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:7px;max-width:1180px;width:100%;margin:0 auto}
/* ---------- inicio ---------- */
.ini{margin:auto;width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  box-shadow:0 8px 26px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:11px;max-height:100%;overflow:auto}
.ini h1{font-size:calc(1.25rem*var(--fs));font-weight:900;text-align:center;color:var(--accent)}
.ini .def{font-size:calc(.9rem*var(--fs));line-height:1.3;text-align:justify;text-align-last:left;-webkit-hyphens:auto;hyphens:auto;color:var(--ink);margin-top:-4px}
.ini h2{font-size:calc(.85rem*var(--fs));font-weight:900;color:var(--soft);text-align:center;margin-top:2px}
.filtros{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{min-height:46px;padding:0 15px;border-radius:23px;border:2px solid var(--line);background:var(--surf);color:var(--ink);
  font-family:inherit;font-weight:900;font-size:calc(.92rem*var(--fs));cursor:pointer}
.chip.on{border-color:var(--accent);background:rgba(34,197,94,.18)}
.chip small{font-weight:800;color:var(--soft);margin-left:4px}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
@media (max-width:420px){.modos{grid-template-columns:1fr}}
.modo{border:2px solid var(--line);border-radius:16px;background:linear-gradient(150deg,rgba(74,222,128,.16),rgba(251,191,36,.10));
  color:var(--ink);font-family:inherit;cursor:pointer;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:84px;text-align:center}
.modo:active{transform:scale(.97)}
.modo b{font-size:calc(1.05rem*var(--fs));font-weight:900}
.modo span{font-size:calc(.8rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.3}
/* ---------- cartao ---------- */
.it{position:relative;display:flex;align-items:center;justify-content:center;border-radius:12px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;font-weight:900;line-height:1.12;text-align:center;
  cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;box-shadow:var(--press)}
.it .nm{display:block;font-size:calc(.86rem*var(--fs)*var(--k,1))}
.it .nm small{display:block;font-size:calc(.7rem*var(--fs));font-weight:800;color:var(--soft);margin-top:1px}
.it.txt{min-height:44px;padding:5px 11px;max-width:172px}
.it.foto{flex-direction:column;justify-content:flex-start;width:var(--tw,108px);padding:4px;gap:3px;font-size:calc(.8rem*var(--fs)*var(--k,1))}
.it.foto .nm{font-size:1em}
.it.foto .ft{display:flex;gap:2px;width:100%;height:var(--th,74px);border-radius:8px;overflow:hidden;flex:0 0 auto}
.it.foto .ft img{flex:1;min-width:0;height:100%;object-fit:cover;pointer-events:none;background:#fff}
.it.foto .nm{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:2.3em}
.it.foto.semimg{justify-content:center}
.it.foto.semimg .nm{min-height:calc(var(--th,74px) + 2.3em);font-size:1.15em}
.it .dois{position:absolute;top:-9px;right:-5px;z-index:2;background:#f59e0b;color:#1a1200;font-size:11px;font-weight:900;
  border-radius:9px;padding:1px 7px;line-height:17px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.it.sel{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(251,191,36,.5)}
.it.erro{animation:treme .38s;border-color:var(--no)}
@keyframes treme{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* dicas: o cartao fica com a cor da caixa do bioma (2 biomas = metade de cada cor) */
.it.dica{border-color:var(--c1);border-width:3px;background:var(--card);
  background:linear-gradient(100deg,color-mix(in srgb,var(--c1) 38%,var(--card)) 50%,color-mix(in srgb,var(--c2) 38%,var(--card)) 50%)}
.fantasma{position:fixed;z-index:80;pointer-events:none;opacity:.95;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.it.vazio{visibility:hidden}
/* ---------- modo A ---------- */
.caixas{flex:0 0 auto;overflow:hidden;display:grid;gap:6px;grid-template-columns:repeat(var(--cc,3),minmax(0,1fr));grid-auto-rows:max-content;align-content:start}
.palco.acabou .caixas{max-height:none;flex:1;overflow-y:auto}
.cx{touch-action:manipulation;border-radius:13px;border:3px solid var(--cor);background:var(--surf);
  background:color-mix(in srgb,var(--cor) 13%,var(--card));overflow:hidden;transition:transform .12s;display:flex;flex-direction:column}
.cx .cab{display:flex;align-items:center;gap:6px;padding:3px 6px;min-height:40px;background:var(--cor);color:#10131a}
.cx .cab img{width:38px;height:28px;object-fit:cover;border-radius:6px;flex:0 0 38px}
.cx .cab b{font-size:calc(.92rem*var(--fs));font-weight:900;line-height:1.05;flex:1;min-width:0}
.cx .cab .cnt{flex:0 0 auto;font-size:calc(.76rem*var(--fs));font-weight:900;border-radius:10px;padding:2px 7px;background:rgba(255,255,255,.72);color:#10131a}
.cx.cheia .cab .cnt{background:#065f46;color:#fff}
.cx .dentro{display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;padding:4px 5px;max-height:var(--mx,none);overflow:hidden}
.cx .dentro:empty{padding:0}
.cx .dentro span{font-size:calc(.72rem*var(--fs));font-weight:800;border-radius:8px;padding:1px 6px;background:var(--card);border:1px solid var(--line);line-height:1.2;max-width:100%}
.cx .dentro span.novo{animation:entra .5s}
@keyframes entra{from{transform:scale(1.4);background:var(--ok)}}
.cx .dentro .mais{background:transparent;border:none;color:var(--soft)}
.cx.alvo{transform:scale(1.03);box-shadow:0 0 0 4px var(--accent2)}
.cx.certa{animation:pisca 1.6s}
@keyframes pisca{0%,50%,100%{box-shadow:0 0 0 0 transparent}25%,75%{box-shadow:0 0 0 5px var(--ok)}}
.cx.errada{animation:treme .38s}
.meio{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.aviso{flex:1;min-width:0;min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:calc(.86rem*var(--fs));
  border-radius:10px;padding:2px 8px;line-height:1.2}
.aviso.ok{color:var(--ok)}
.aviso.no{background:rgba(248,113,113,.14)}
.aviso.no b{color:var(--no)}
.tog{flex:0 0 auto;min-height:44px;min-width:44px;padding:0 11px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);
  font-family:inherit;font-weight:900;font-size:calc(.82rem*var(--fs));cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.tog.on{border-color:var(--accent2);background:rgba(251,191,36,.2)}
.tog svg{width:18px;height:18px}
.bandeja{flex:1;min-height:0;padding:9px 6px 6px;border-radius:14px;background:var(--surf);border:2px dashed var(--line)}
.bandeja.linhas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;overflow:hidden}
/* nao cabe tudo: colunas que deslizam para o lado (o dedo desliza a bandeja na horizontal e arrasta o cartao para cima) */
.bandeja.colunas{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,4),max-content);gap:8px;align-content:start;overflow-x:auto;overflow-y:hidden;justify-content:start}
.bandeja.colunas .it{touch-action:pan-x}
.bandeja.colunas .it.txt{width:150px;max-width:none;height:58px}
.bandeja.colunas .it.txt .nm{font-size:calc(.82rem*var(--fs))}
.bandeja.linhas .it.txt{width:var(--tw,auto);max-width:none;min-height:max(44px,calc(44px*var(--k,1)))}
.bandeja .it.foto{height:calc(var(--th,74px) + 2.9em + 13px)}
.bandeja .it.foto .nm{overflow:hidden}
.palco.acabou .bandeja{display:none}
/* ---------- modo B ---------- */
.bcab{flex:0 0 auto;display:flex;gap:10px;align-items:center;border-radius:14px;border:3px solid var(--cor);overflow:hidden;
  background:var(--surf);background:color-mix(in srgb,var(--cor) 16%,var(--card))}
.bcab img{width:118px;height:76px;object-fit:cover;flex:0 0 118px}
.bcab .tx{flex:1;min-width:0;padding:4px 0 4px 8px}
.bcab img+.tx{padding-left:0}
.bcab h1{font-size:calc(1.2rem*var(--fs));font-weight:900;line-height:1.05}
.bcab p{font-size:calc(.8rem*var(--fs));font-weight:800;color:var(--soft);margin-top:2px}
.bcab .cnt{margin:0 10px 0 auto;font-weight:900;font-size:calc(.9rem*var(--fs));border-radius:12px;padding:6px 10px;background:var(--line);white-space:nowrap}
.bcab .cnt.ok{background:var(--ok);color:#06281a}
.grade{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;padding:8px 2px 4px}
.grade .it{cursor:pointer}
.grade.aperto .it .ft{display:none}
.grade .it.txt{flex:0 0 var(--tw,calc(50% - 4px));max-width:240px}
.grade .it.acertou{border-color:var(--ok);border-width:3px;background:rgba(52,211,153,.2)}
.grade .it.acertou::after{content:'\2713';position:absolute;right:5px;top:2px;color:var(--ok);font-weight:900;font-size:16px}
.grade .it.errou{border-color:var(--no);opacity:.8}
.grade .it .de{display:block;font-size:calc(.7rem*var(--fs));font-weight:900;color:var(--no)}
.grade .it .tb{display:block;font-size:calc(.7rem*var(--fs));font-weight:900;color:var(--ok)}
.navb{flex:0 0 auto;display:flex;gap:8px;justify-content:space-between;align-items:center}
.navb button{white-space:nowrap;min-height:46px;padding:0 15px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:calc(.92rem*var(--fs));cursor:pointer}
.navb button.forte{border-color:var(--accent);background:linear-gradient(135deg,rgba(74,222,128,.32),rgba(251,191,36,.2))}
.navb button[disabled]{opacity:.4;cursor:default}
.navb .pts{display:flex;gap:5px}
.navb .pts i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.navb .pts i.on{background:var(--accent2)}
.navb .pts i.ok{background:var(--ok)}
/* ---------- fim ---------- */
.fimov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,7,18,.72)}
.fimov.show{display:flex}
.fimbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.fimbox h2{font-size:calc(1.3rem*var(--fs));font-weight:900;color:var(--accent)}
.fimbox p{font-weight:800;color:var(--soft)}
.fimbox{max-height:100%;overflow-y:auto}
.mais{list-style:none;display:flex;flex-direction:column;gap:5px;text-align:left}
/* MANDAMENTO TIPOGRAFICO (12/11): texto corrido justificado; sem filete vertical colorido (vetado): contorno fino na cor do bioma */
.mais li{border:1px solid color-mix(in srgb,var(--cor) 55%,transparent);background:var(--surf);border-radius:8px;padding:5px 8px;font-size:calc(.8rem*var(--fs));font-weight:700;line-height:1.3;text-align:justify;text-align-last:left;-webkit-hyphens:auto;hyphens:auto}
.mais li b{display:block;font-weight:900}
.fimbox button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer}
.fimbox button.forte{border-color:var(--accent);background:linear-gradient(135deg,rgba(74,222,128,.32),rgba(251,191,36,.2))}
/* ---------- telas pequenas ---------- */
@media (max-width:430px){.topbar{gap:3px;padding:6px}.topbar .title{display:none}.tog .rt{display:none}}
@media (max-height:500px) and (min-aspect-ratio:5/4){
  .palco.modoA{display:grid;grid-template-columns:56% 1fr;grid-template-rows:auto 1fr;column-gap:8px;row-gap:6px}
  .palco.modoA .caixas{grid-column:1;grid-row:1/3;max-height:none;min-height:0}
  .palco.modoA .meio{grid-column:2;grid-row:1}
  .palco.modoA .aviso{font-size:calc(.8rem*var(--fs))}
  .palco.modoA .bandeja{grid-column:2;grid-row:2}
  .palco.modoA.acabou{grid-template-columns:1fr}
  .palco.modoA.acabou .meio{display:none}
  .palco.modoB .bcab img{width:100%;height:58px;flex-basis:100%}
  .palco.modoB{display:grid;grid-template-columns:minmax(210px,32%) 1fr;grid-template-rows:auto 1fr auto;column-gap:10px}
  .palco.modoB .bcab{grid-column:1;grid-row:1;flex-wrap:wrap}
  .palco.modoB .bcab .cnt{margin:0 0 6px 8px}
  .palco.modoB .meio{grid-column:1;grid-row:2;flex-direction:column;justify-content:center}
  .palco.modoB .aviso{flex:0 0 auto}
  .palco.modoB .navb{grid-column:1;grid-row:3}
  .palco.modoB .navb .pts{display:none}
  .palco.modoB .navb button{padding:0 10px}
  .palco.modoB .grade{grid-column:2;grid-row:1/4}
}
@media (max-height:500px){.bcab img{width:84px;height:54px;flex-basis:84px}.cx .cab{min-height:36px}.cx .cab img{display:none}
  .ini{gap:6px;padding:10px 14px}.ini h1{font-size:calc(1.05rem*var(--fs))}.ini .def{font-size:calc(.8rem*var(--fs));line-height:1.2}.chip{min-height:44px}.modo{min-height:56px;padding:6px}.modo span{display:none}}
</style>

<script>
/* ===== DADOS — _roteiro.md T11 (tabela S8 + fotos S9-S14). Nada inventado. ===== */
var M='media/geo3/';
var BIOMAS=[
  {id:'amz',mais:'Árvores altas e muitas folhas. É o maior bioma do Brasil.',de:'da',nome:'Amazônia',onde:'Norte do Brasil',foto:'t_amazonia.jpg',cor:'#84cc16'},
  {id:'cer',mais:'Árvores tortas e grama. É o segundo maior bioma do Brasil.',de:'do',nome:'Cerrado',onde:'Centro do Brasil',foto:'t_cerrado.jpg',cor:'#f472b6'},
  {id:'caa',mais:'Plantas com espinhos (cactos). Só existe no Brasil.',de:'da',nome:'Caatinga',onde:'Nordeste do Brasil',foto:'t_caatinga.jpg',cor:'#facc15'},
  {id:'pam',mais:'Campos com capim baixo. Só existe no Rio Grande do Sul.',de:'do',nome:'Pampa',onde:'Sul do Brasil',foto:'t_pampa.jpg',cor:'#fb923c'},
  {id:'pan',mais:'Plantas que gostam de água. Tem alagamentos.',de:'do',nome:'Pantanal',onde:'Mato Grosso e Mato Grosso do Sul',foto:'t_pantanal.jpg',cor:'#c084fc'},
  {id:'mat',mais:'Floresta úmida e densa, no litoral. Está muito reduzida.',de:'da',nome:'Mata Atlântica',onde:'Litoral do Brasil',foto:'t_mata.jpg',cor:'#60a5fa'}
];
/* t: a = animal (fauna) · p = planta (flora) · v = vegetacao (frase da tabela, entra em "Plantas")
   f = foto da aula; por = como o item aparece em cada bioma quando o material mostra diferente */
var ITENS=[
  {n:'Onça-pintada',t:'a',b:['amz']},
  {n:'Macaco',t:'a',b:['amz']},
  {n:'Arara',t:'a',b:['amz'],f:['t_arara.jpg']},
  {n:'Lobo-guará',t:'a',b:['cer'],f:['t_loboguara.jpg']},
  {n:'Tamanduá-bandeira',t:'a',b:['cer']},
  {n:'Tatu',t:'a',b:['caa']},
  {n:'Veado-catingueiro',t:'a',b:['caa']},
  {n:'Asa-branca',t:'a',b:['caa'],f:['t_asabranca.jpg']},
  {n:'Cavalo',t:'a',b:['pam']},
  {n:'Ema',t:'a',b:['pam']},
  {n:'Quero-quero',t:'a',b:['pam'],f:['t_queroquero.jpg']},
  {n:'Capivara',t:'a',b:['pam','pan'],f:['t_capivara.jpg']},
  {n:'Jacaré',t:'a',b:['pan']},
  {n:'Tuiuiú',t:'a',b:['pan']},
  {n:'Sucuri',t:'a',b:['pan']},
  {n:'Mico-leão-dourado',t:'a',b:['mat'],f:['t_mico.jpg']},
  {n:'Preguiça',t:'a',b:['mat']},
  {n:'Vitória-régia',t:'p',b:['amz'],f:['t_vitoria.jpg']},
  {n:'Sempre-viva',t:'p',b:['cer'],f:['t_sempreviva.jpg']},
  {n:'Louro-preto',t:'p',b:['caa'],f:['t_louro.jpg']},
  {n:'Capim-dos-pampas',t:'p',b:['pam'],f:['t_capim.jpg']},
  {n:'Bromélia',t:'p',b:['mat','pan'],f:['t_bromelia.jpg','t_bromelia_agua.jpg'],
    por:{mat:{f:['t_bromelia.jpg']},pan:{sub:'em área alagada',f:['t_bromelia_agua.jpg']}}},
  {n:'Árvores tortas e grama',t:'v',b:['cer']},
  {n:'Plantas com espinhos (cactos)',t:'v',b:['caa']},
  {n:'Campos com capim baixo',t:'v',b:['pam']},
  {n:'Plantas que gostam de água',t:'v',b:['pan']}
];
/* MAIS (Paulo 10/11): o que o material diz de cada bioma (tabela S8 + cartazes S17) aparece DEPOIS que a crianca
   completa o bioma, como informacao, nao como cartao. Fora dos cartoes (Paulo 10/11): "Floresta úmida e densa" (Mata Atlantica) e "Arvores altas e muitas folhas" (Amazonia)
   servem para os dois biomas aos olhos da crianca; nao entram em nada que tenha Amazonia e Mata Atlantica como escolhas */
/* pares que se parecem: nao entram como distrator um do outro no modo B */
var PARES={'Floresta úmida e densa':['Árvores altas e muitas folhas'],'Árvores altas e muitas folhas':['Floresta úmida e densa'],
  'Árvores tortas e grama':['Campos com capim baixo'],'Campos com capim baixo':['Árvores tortas e grama'],
  'Macaco':['Mico-leão-dourado'],'Mico-leão-dourado':['Macaco']};
</script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var palco=$('palco');
function pega(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function guarda(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var filtro=pega('geo3_arrasta_filtro','tudo');
var comFoto=pega('geo3_arrasta_fotos','1')==='1';
var dicas=pega('geo3_arrasta_dicas','0')==='1';
function bio(id){ for(var i=0;i<BIOMAS.length;i++) if(BIOMAS[i].id===id) return BIOMAS[i]; }
function filtrados(){ return ITENS.filter(function(it){ return filtro==='tudo' || (filtro==='a' ? it.t==='a' : it.t!=='a'); }); }
function emb(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function barra(p){ $('bar').style.width=Math.round(p*100)+'%'; }
function nomes(bs){ return bs.map(function(id){return bio(id).nome;}).join(' e '); }
function noBioma(b){ return (b.de==='da'?'na ':'no ')+b.nome; }
/* nome como aparece na caixa do bioma (bromelia no Pantanal = "em area alagada") */
function rotulo(it,bId){ var v=it.por&&it.por[bId]; return it.n+(v&&v.sub?' ('+v.sub+')':''); }
/* um cartao. o: {tag, attrs, bioma (mostra a versao daquele bioma), cores (dicas), selo, cls, extra} */
function cartao(it,o){
  o=o||{};
  var v=(o.bioma&&it.por&&it.por[o.bioma])||{};
  var fotos=v.f||it.f, sub=v.sub||'';
  var cls='it '+(comFoto?'foto'+(fotos?'':' semimg'):'txt')+(o.cls?' '+o.cls:'');
  var st='';
  if(o.cores&&o.cores.length){ cls+=' dica'; st=' style="--c1:'+bio(o.cores[0]).cor+';--c2:'+bio(o.cores[o.cores.length-1]).cor+'"'; }
  var tag=o.tag||'div';
  var h='<'+tag+(tag==='button'?' type="button"':'')+' class="'+cls+'"'+st+(o.attrs||'')+'>';
  if(comFoto&&fotos){ h+='<span class="ft">'; fotos.forEach(function(f){ h+='<img src="'+M+f+'" alt="">'; }); h+='</span>'; }
  h+='<span class="nm">'+esc(it.n)+(sub?'<small>'+esc(sub)+'</small>':'')+(o.extra||'')+'</span>';
  if(o.selo) h+='<span class="dois">'+o.selo+'</span>';
  return h+'</'+tag+'>';
}
function togs(){
  return (palco.classList.contains('modoA')?'<button class="tog'+(dicas?' on':'')+'" id="tDicas" title="Dicas: cada cartão com a cor do seu bioma"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="rt">Dicas</span></button>':'')
   +'<button class="tog'+(comFoto?' on':'')+'" id="tFotos" title="Mostrar fotos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 16l5-5 4 4 3-3 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="9.5" r="1.6" fill="currentColor"/></svg><span class="rt">Fotos</span></button>';
}
function ligaTogs(redesenha){
  var d=$('tDicas'), f=$('tFotos');
  if(d) d.onclick=function(){ dicas=!dicas; guarda('geo3_arrasta_dicas',dicas?'1':'0'); d.classList.toggle('on',dicas);
    aviso(dicas?'Cada cartão está com a cor do seu bioma.':'Dicas desligadas.',''); redesenha(); };
  if(f) f.onclick=function(){ comFoto=!comFoto; guarda('geo3_arrasta_fotos',comFoto?'1':'0'); f.classList.toggle('on',comFoto); redesenha(); };
}
function aviso(html,cl){ var a=$('aviso'); if(!a) return; a.className='aviso'+(cl?' '+cl:''); a.innerHTML=html; }

/* ================= INICIO ================= */
window.inicio=function(){
  fechaFim(); palco.className='palco'; barra(0); A=null;
  var cont={tudo:ITENS.length,a:0,p:0}; ITENS.forEach(function(it){ if(it.t==='a') cont.a++; else cont.p++; });
  palco.innerHTML='<div class="ini">'
   +'<h1>Arrasta e solta: biomas</h1>'
   +'<p class="def"><b>Bioma</b> é uma grande área da natureza com o seu clima, as suas plantas e os seus animais. O Brasil tem 6 biomas.</p>'
   +'<h2>O que vamos colocar?</h2>'
   +'<div class="filtros" id="fF">'
   +'<button class="chip" data-f="tudo">Tudo<small>'+cont.tudo+'</small></button>'
   +'<button class="chip" data-f="a">Animais (fauna)<small>'+cont.a+'</small></button>'
   +'<button class="chip" data-f="p">Plantas (flora)<small>'+cont.p+'</small></button></div>'
   +'<h2>Cartões</h2>'
   +'<div class="filtros" id="fV"><button class="chip" data-v="1">Com fotos</button><button class="chip" data-v="0">Sem fotos</button></div>'
   +'<div class="modos">'
   +'<button class="modo" id="mA"><b>Todos os biomas</b><span>Arraste cada cartão para o bioma certo</span></button>'
   +'<button class="modo" id="mB"><b>Um bioma por vez</b><span>Toque em tudo o que é do bioma</span></button>'
   +'</div></div>';
  function pinta(){
    palco.querySelectorAll('#fF .chip').forEach(function(c){ c.classList.toggle('on',c.getAttribute('data-f')===filtro); });
    palco.querySelectorAll('#fV .chip').forEach(function(c){ c.classList.toggle('on',(c.getAttribute('data-v')==='1')===comFoto); });
  }
  palco.querySelectorAll('#fF .chip').forEach(function(c){ c.onclick=function(){ filtro=c.getAttribute('data-f'); guarda('geo3_arrasta_filtro',filtro); pinta(); }; });
  palco.querySelectorAll('#fV .chip').forEach(function(c){ c.onclick=function(){ comFoto=c.getAttribute('data-v')==='1'; guarda('geo3_arrasta_fotos',comFoto?'1':'0'); pinta(); }; });
  pinta();
  $('mA').onclick=modoA; $('mB').onclick=function(){ modoB(0,true); };
};

/* ================= FIM ================= */
function fim(titulo,txt,deNovo,rot){
  var lista='<ul class="mais">'+BIOMAS.map(function(b){ return '<li style="--cor:'+b.cor+'"><b>'+b.nome+'</b>'+esc(b.mais)+'</li>'; }).join('')+'</ul>';
  $('fimbox').innerHTML='<h2>'+titulo+'</h2><p>'+txt+'</p>'+lista+'<button class="forte" id="fimDeNovo">'+(rot||'Jogar de novo')+'</button><button id="fimMenu">Escolher outro jeito</button><button id="fimVer">Ver os biomas</button>';
  $('fimov').classList.add('show');
  $('fimDeNovo').onclick=function(){ fechaFim(); deNovo(); };
  $('fimMenu').onclick=inicio;
  $('fimVer').onclick=fechaFim;
}
function fechaFim(){ $('fimov').classList.remove('show'); }

/* ================= MODO A — todos os biomas ================= */
var A=null, arrastando=false;
function modoA(){
  fechaFim();
  var fila=emb(filtrados()).map(function(it){ return {it:it, falta:it.b.slice()}; });
  var total=0; fila.forEach(function(x){ total+=x.falta.length; });
  A={fila:fila, total:total, feitos:0, erros:0, dentro:{}, sel:null};
  BIOMAS.forEach(function(b){ A.dentro[b.id]=[]; });
  palco.className='palco modoA';
  var h='<div class="caixas" id="caixas">';
  BIOMAS.forEach(function(b){
    h+='<div class="cx" data-b="'+b.id+'" style="--cor:'+b.cor+'"><div class="cab"><img src="'+M+b.foto+'" alt=""><b>'+b.nome+'</b><span class="cnt"></span></div><div class="dentro"></div></div>';
  });
  h+='</div><div class="meio"><div class="aviso" id="aviso"></div>'+togs()+'</div><div class="bandeja" id="bandeja"></div>';
  palco.innerHTML=h;
  palco.querySelectorAll('.cx').forEach(function(cx){ cx.onclick=function(){ if(A&&A.sel!==null) solta(A.sel, cx.getAttribute('data-b')); }; });
  ligaTogs(desenhaA);
  aviso(dicas?'Cada cartão está com a cor do seu bioma.':'Arraste cada cartão para o bioma dele.','');
  desenhaA();
}
function desenhaA(){
  if(!A) return;
  var band=$('bandeja'), h='';
  palco.classList.toggle('acabou',!A.fila.length);
  A.fila.forEach(function(x,i){
    var selo='';
    if(x.it.b.length>1) selo=(x.falta.length<x.it.b.length)?'falta 1':'vai em 2';
    h+=cartao(x.it,{attrs:' data-i="'+i+'"', cls:(A.sel===i?'sel':''), cores:dicas?x.falta:null, selo:selo});
  });
  band.innerHTML=h;
  arrumaBandeja();
  band.querySelectorAll('.it').forEach(function(el){ arrastavel(el, +el.getAttribute('data-i')); });
  /* caixas: contagem e o que ja entrou */
  var porB={}; filtrados().forEach(function(it){ it.b.forEach(function(b){ porB[b]=(porB[b]||0)+1; }); });
  var cxs=$('caixas'), cc=cxs.clientWidth<520?2:3, deitado=matchMedia('(max-height:500px) and (min-aspect-ratio:5/4)').matches;
  cxs.style.setProperty('--cc',cc);
  palco.querySelectorAll('.cx .cab img').forEach(function(im){ im.style.display=(comFoto&&cc>2)?'':'none'; });
  /* altura maxima de cada caixa: as caixas crescem, mas a bandeja nunca some enquanto houver cartao */
  var cx0=palco.querySelector('.cx'), linhas=Math.ceil(6/cc), cab=cx0.querySelector('.cab').offsetHeight+6, cap=deitado?palco.clientHeight-20:palco.clientHeight-20-$('aviso').parentNode.offsetHeight-(comFoto?140:76)-14,
      lim=A.fila.length?(cap-(linhas-1)*6)/linhas-cab:9999;
  cxs.style.maxHeight=A.fila.length&&!deitado?cap+'px':'';
  palco.querySelectorAll('.cx').forEach(function(cx){
    var id=cx.getAttribute('data-b'), d=A.dentro[id], tot=porB[id]||0;
    cx.querySelector('.cnt').textContent=d.length+'/'+tot;
    cx.classList.toggle('cheia',d.length===tot);
    var box=cx.querySelector('.dentro'); box.style.setProperty('--mx',Math.max(24,Math.floor(lim))+'px');
    encaixa(box, d);
  });
  arrumaBandeja();
  barra(A.feitos/A.total);
}
/* todos os cartoes a vista; se nao cabem em linhas, viram colunas que deslizam para o lado */
function arrumaBandeja(){
  var band=$('bandeja');
  band.className='bandeja linhas'; ['--th','--tw','--k'].forEach(function(v){ band.style.removeProperty(v); });
  var tams=comFoto?[180,160,142,126,108]:[220,196,176,158,140];
  for(var t=0;t<tams.length;t++){
    var tw=tams[t];
    band.style.setProperty('--tw',tw+'px');
    band.style.setProperty('--k',Math.min(1.35,comFoto?tw/108:tw/150).toFixed(3));
    if(comFoto) band.style.setProperty('--th',Math.round(tw*.68)+'px');
    if(band.scrollHeight<=band.clientHeight+1) return;
  }
  ['--th','--tw','--k'].forEach(function(v){ band.style.removeProperty(v); });
  band.className='bandeja colunas';
  var it=band.querySelector('.it'); if(!it) return;
  var H=band.clientHeight-15, alt=it.offsetHeight;
  if(comFoto){
    /* foto ajustada para encher linhas inteiras (sem faixa vazia embaixo) */
    var rows=Math.max(1,Math.round((H+8)/(alt+8)));
    var sobra=(rows*alt+(rows-1)*8-H)/rows;
    if(sobra>0 && 74-sobra<44 && rows>1){ rows--; sobra=(rows*alt+(rows-1)*8-H)/rows; }
    band.style.setProperty('--th',Math.max(44,Math.min(110,Math.floor(74-sobra)))+'px');
    alt=it.offsetHeight;
  }
  band.style.setProperty('--rows',Math.max(1,Math.floor((H+8)/(alt+8))));
}
/* modo B: o maior cartao que deixa todos a vista sem rolar */
function ajustaGrade(){
  var g=$('grade'); if(!g) return;
  var W=g.clientWidth-4, n=g.children.length, tent=[];
  if(comFoto){
    for(var c=2;c<=8;c++){ var tw=Math.min(170,Math.floor((W-(c-1)*8)/c)); if(tw<78) break; tent.push({tw:tw,th:Math.round(tw*.62)}); }
    var u=tent[tent.length-1]||{tw:78,th:48};
    [40,32,26].forEach(function(t){ if(t<u.th) tent.push({tw:u.tw,th:t}); });
  } else {
    for(var c2=2;c2<=5;c2++){ var t2=Math.floor((W-(c2-1)*8)/c2); if(t2<112) break; tent.push({tw:t2}); }
  }
  g.classList.remove('aperto');
  for(var i=0;i<tent.length;i++){
    g.style.setProperty('--tw',tent[i].tw+'px');
    if(tent[i].th) g.style.setProperty('--th',tent[i].th+'px');
    if(g.scrollHeight<=g.clientHeight+1) return;
  }
  /* ultimo recurso (tela muito baixa): so a foto do cartao sai, o nome fica */
  if(comFoto) g.classList.add('aperto');
}
/* o que ja entrou na caixa; se nao cabe, os mais recentes ficam e o resto vira "+n" */
function encaixa(box, d){
  var spans=d.map(function(x){ return '<span>'+esc(x.n)+'</span>'; });
  box.innerHTML=spans.join('');
  var k=0;
  while(box.scrollHeight>box.clientHeight+1 && k<d.length){
    k++;
    box.innerHTML='<span class="mais">+'+k+'</span>'+spans.slice(k).join('');
  }
  var sp=box.querySelectorAll('span:not(.mais)'), base=d.length-sp.length;
  d.forEach(function(x,j){ if(x.novo && j>=base) sp[j-base].classList.add('novo'); x.novo=false; });
}
function solta(i, bId){
  var x=A.fila[i]; if(!x) return;
  var cx=palco.querySelector('.cx[data-b="'+bId+'"]');
  A.sel=null;
  if(x.falta.indexOf(bId)>=0){
    x.falta.splice(x.falta.indexOf(bId),1);
    A.dentro[bId].push({n:rotulo(x.it,bId),novo:true}); A.feitos++;
    if(!x.falta.length) A.fila.splice(i,1);
    var tot=filtrados().filter(function(it){ return it.b.indexOf(bId)>=0; }).length, bb=bio(bId);
    if(A.dentro[bId].length===tot) aviso('<b>'+esc(bb.nome)+'</b>&nbsp;completo! '+esc(bb.mais),'ok');
    else aviso(x.falta.length ? '<b>'+esc(x.it.n)+'</b>&nbsp;está em 2 biomas. Falta 1!' : 'Isso!','ok');
    desenhaA();
    if(!A.fila.length) setTimeout(function(){
      fim('Muito bem!', 'Você colocou os '+A.total+' cartões'+(A.erros? ' e errou '+A.erros+(A.erros>1?' vezes.':' vez.') : ' sem errar nenhum!'), modoA);
    },500);
    return;
  }
  if(x.it.b.indexOf(bId)>=0){ aviso(esc(x.it.n)+' já está '+esc(noBioma(bio(bId)))+'.',''); desenhaA(); return; }
  A.erros++;
  if(cx){ cx.classList.remove('errada'); void cx.offsetWidth; cx.classList.add('errada'); }
  x.falta.forEach(function(b){ var c=palco.querySelector('.cx[data-b="'+b+'"]'); if(c){ c.classList.remove('certa'); void c.offsetWidth; c.classList.add('certa'); } });
  aviso('<b>'+esc(x.it.n)+'</b>&nbsp;&rarr; '+esc(nomes(x.falta)),'no');
  desenhaA();
  var el=$('bandeja').querySelector('.it[data-i="'+i+'"]'); if(el) el.classList.add('erro');
}
/* arrastar com o dedo/mouse; toque sem arrastar = selecionar e depois tocar na caixa */
function arrastavel(el, i){
  el.addEventListener('pointerdown', function(ev){
    if(ev.button>0||!ev.isPrimary||arrastando) return;
    arrastando=true;
    var x0=ev.clientX, y0=ev.clientY, fant=null, alvo=null, feito=false;
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    function caixaEm(x,y){
      if(fant) fant.style.display='none';
      var e=document.elementFromPoint(x,y);
      if(fant) fant.style.display='';
      return e && e.closest ? e.closest('.cx') : null;
    }
    function move(e){
      if(!fant && Math.hypot(e.clientX-x0,e.clientY-y0)>8){
        fant=el.cloneNode(true); fant.classList.add('fantasma'); fant.classList.remove('sel','erro');
        fant.style.width=el.offsetWidth+'px'; document.body.appendChild(fant); el.classList.add('vazio');
      }
      if(!fant) return;
      fant.style.left=e.clientX+'px'; fant.style.top=e.clientY+'px';
      var c=caixaEm(e.clientX,e.clientY);
      if(c!==alvo){ if(alvo) alvo.classList.remove('alvo'); alvo=c; if(alvo) alvo.classList.add('alvo'); }
    }
    function up(e){
      if(feito) return; feito=true; arrastando=false;
      el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); el.removeEventListener('lostpointercapture',up);
      if(alvo) alvo.classList.remove('alvo');
      if(fant){
        var c=caixaEm(e.clientX,e.clientY);
        fant.remove(); el.classList.remove('vazio');
        if(c && e.type==='pointerup') solta(i, c.getAttribute('data-b')); else desenhaA();
        return;
      }
      if(e.type!=='pointerup') return;
      A.sel=(A.sel===i)?null:i;
      if(A.sel!==null) aviso('Agora toque no bioma de <b>'+esc(A.fila[i].it.n)+'</b>.','');
      desenhaA();
    }
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up);
  });
}

/* ================= MODO B — um bioma por vez ================= */
var B=null;
function modoB(k,novo){
  fechaFim(); A=null;
  if(novo||!B) B={erros:0,feitos:{},k:0,cartas:{}};
  B.k=k;
  var b=BIOMAS[k], pool=filtrados();
  var certos=pool.filter(function(it){ return it.b.indexOf(b.id)>=0; });
  if(!B.cartas[k]){
    /* nunca distrator (pedagogico e detector, 10/11): pares parecidos; vitoria-regia e onca no Pantanal; agua na Amazonia */
    var veta={}; certos.forEach(function(it){ (PARES[it.n]||[]).forEach(function(n){ veta[n]=1; }); });
    if(b.id==='pan'){ veta['Vitória-régia']=1; veta['Onça-pintada']=1; }
    if(b.id==='amz') veta['Plantas que gostam de água']=1;
    var outros=emb(pool.filter(function(it){ return it.b.indexOf(b.id)<0 && !veta[it.n]; }));
    var nDis=Math.min(outros.length, Math.max(3, certos.length));
    /* distratores do mesmo tipo que os certos, na mesma proporcao (nada de pista pelo formato) */
    var tipos={}; certos.forEach(function(it){ tipos[it.t]=(tipos[it.t]||0)+1; });
    var dis=[];
    Object.keys(tipos).forEach(function(t){ outros.filter(function(o){return o.t===t;}).slice(0,Math.ceil(nDis*tipos[t]/certos.length)).forEach(function(o){ if(dis.indexOf(o)<0) dis.push(o); }); });
    outros.forEach(function(o){ if(dis.length<nDis && dis.indexOf(o)<0) dis.push(o); });
    B.cartas[k]={lista:emb(certos.concat(dis.slice(0,nDis))), estado:{}};
  }
  var C=B.cartas[k];
  palco.className='palco modoB';
  function desenha(){
    var achou=0; C.lista.forEach(function(it,i){ if(C.estado[i]==='ok') achou++; });
    var h='<div class="bcab" style="--cor:'+b.cor+'">'+(comFoto?'<img src="'+M+b.foto+'" alt="">':'')+'<div class="tx"><h1>'+b.nome+'</h1><p>'+esc(b.onde)+'</p></div><span class="cnt'+(achou===certos.length?' ok':'')+'" id="bcnt">'+achou+' de '+certos.length+'</span></div>';
    h+='<div class="meio"><div class="aviso" id="aviso"></div>'+togs()+'</div><div class="grade" id="grade">';
    C.lista.forEach(function(it,i){
      var e=C.estado[i], extra='', cls='';
      if(e==='ok'){ cls='acertou'; var outro=it.b.filter(function(x){return x!==b.id;}); if(outro.length) extra='<span class="tb">também '+esc(noBioma(bio(outro[0])))+'</span>'; }
      if(e==='no'){ cls='errou'; extra='<span class="de">'+esc(nomes(it.b))+'</span>'; }
      h+=cartao(it,{tag:'button', attrs:' data-i="'+i+'"', bioma:it.b.indexOf(b.id)>=0?b.id:null, cls:cls, extra:extra});
    });
    h+='</div><div class="navb"><button id="bPrev">&#8249; Voltar</button><span class="pts">';
    BIOMAS.forEach(function(x,j){ h+='<i class="'+(j===k?'on':(B.feitos[j]?'ok':''))+'"></i>'; });
    h+='</span><button id="bNext" class="forte">Próximo &#8250;</button></div>';
    palco.innerHTML=h;
    barra((k+achou/certos.length)/BIOMAS.length);
    ligaTogs(function(){ var a=$('aviso').innerHTML, c=$('aviso').className; desenha(); $('aviso').innerHTML=a; $('aviso').className=c; });
    ajustaGrade();
    $('grade').querySelectorAll('.it').forEach(function(el){ el.onclick=function(){ toca(+el.getAttribute('data-i')); }; });
    $('bPrev').disabled=(k===0);
    $('bPrev').onclick=function(){ if(k>0) modoB(k-1); };
    $('bNext').onclick=function(){
      if(k<BIOMAS.length-1){ modoB(k+1); return; }
      var falta=BIOMAS.filter(function(x,j){ return !B.feitos[j]; });
      if(falta.length) fim('Faltou um pouco','Ainda falta achar tudo em: '+esc(falta.map(function(x){return x.nome;}).join(', '))+'.',function(){ modoB(BIOMAS.indexOf(falta[0])); },'Ir para o que falta');
      else fim('Muito bem!','Você achou tudo dos 6 biomas.',function(){ modoB(0,true); });
    };
    return achou;
  }
  function toca(i){
    var it=C.lista[i]; if(C.estado[i]) return;
    if(it.b.indexOf(b.id)>=0){
      C.estado[i]='ok'; var achou=desenha();
      if(achou===certos.length){
        B.feitos[k]=true; aviso('Achou tudo! '+esc(b.mais),'ok'); ajustaGrade();
        if(Object.keys(B.feitos).length===BIOMAS.length) setTimeout(function(){
          fim('Muito bem!','Você achou tudo dos 6 biomas'+(B.erros? ' e errou '+B.erros+(B.erros>1?' vezes.':' vez.') : ' sem errar nenhum!'), function(){ modoB(0,true); });
        },600);
      } else { var f=certos.length-achou; aviso('Isso! '+(f===1?'Falta 1.':'Faltam '+f+'.'),'ok'); }
    } else {
      B.erros++; C.estado[i]='no'; desenha();
      var el=$('grade').querySelector('.it[data-i="'+i+'"]'); if(el) el.classList.add('erro');
      aviso('<b>'+esc(it.n)+'</b>&nbsp;&rarr; '+esc(nomes(it.b)),'no');
    }
  }
  desenha();
  aviso('São '+certos.length+' cartões '+b.de+' '+esc(b.nome)+'. Toque neles!','');
}

var tm=null;
addEventListener('resize',function(){ clearTimeout(tm); tm=setTimeout(function(){
  if(palco.classList.contains('modoA')&&A&&!arrastando) desenhaA();
  if(palco.classList.contains('modoB')) ajustaGrade();
},120); });
inicio();
})();
</script>
