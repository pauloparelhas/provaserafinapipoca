<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Geografia · Teoria</title>
<link rel="stylesheet" href="serafina-core.css?v=c4d84e01221">
<style>
/* ============================================================
   GEO3_estudo — a TEORIA de Geografia (3º tri, prova ESCRITA em português
   em 12/11). Motor herdado da teoria de Ciências (telinhas de oclusão,
   arrastar e "Na prova"); tudo em português, sem bandeira e sem tradução.
   Dados: GEO3_estudo_licoes.js (fonte única: trabalho/3tri_geografia/_roteiro.md).
   ============================================================ */
:root{
  --fs:1;
  --bg:#0d0b1e; --bg2:#11253a;
  --ink:#f2f7ff; --soft:rgba(255,255,255,.66); --dim:rgba(255,255,255,.46);
  --card:#15243c; --line:rgba(255,255,255,.14); --surf:rgba(255,255,255,.06);
  --accent:#f472b6; --accent2:#fbbf24; --ok:#34d399; --no:#f87171;
  --lc:#f472b6;
}
body.light{ --surf:rgba(11,32,51,.05); --dim:rgba(11,32,51,.55); }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0d0b1e}
html,body{min-height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--ink);overflow-x:hidden}
button{font-family:inherit;color:inherit}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}

/* ---------- topo ---------- */
.topbar{display:flex;align-items:center;gap:5px;padding:6px 8px;background:var(--card);
  box-shadow:0 2px 10px rgba(0,0,0,.22);position:sticky;top:0;z-index:30}
.topbar .title{font-weight:900;font-size:calc(.88rem*var(--fs));flex:1;min-width:0;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:11px;background:var(--line);color:var(--ink);
  font-size:.95rem;font-weight:900;cursor:pointer;padding:0 6px;flex-shrink:0;display:inline-flex;
  align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{transform:scale(.92)}
.bar{height:5px;background:var(--line)}
.bar span{display:block;height:100%;width:0;background:var(--lc);transition:width .3s}

/* ---------- palco ---------- */
.stage{flex:1;display:flex;justify-content:center;padding:10px 10px 84px}
.card{width:100%;max-width:780px;background:var(--card);border-radius:18px;border:1px solid var(--line);
  box-shadow:0 8px 26px rgba(0,0,0,.25);padding:14px 14px 18px;--lcx:var(--lc)}
body.light .card{--lcx:color-mix(in srgb,var(--lc) 58%,#000)}

/* ---------- grade de lições ---------- */
.capa h1{font-size:calc(1.35rem*var(--fs));font-weight:900;line-height:1.15}
.capa p.sub{font-size:calc(.92rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.4;margin:4px 0 12px}
.licoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.lic{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 12px;
  border-radius:16px;border:2px solid color-mix(in srgb,var(--lc) 55%,transparent);cursor:pointer;text-align:center;
  background:linear-gradient(170deg,color-mix(in srgb,var(--lc) 26%,var(--card)),var(--card));min-height:150px}
.lic:active{transform:translateY(1px)}
.lic .icone{width:72px;height:72px}
.lic .num{position:absolute;top:7px;left:8px;min-width:26px;height:26px;border-radius:9px;background:var(--lc);
  color:#1a1530;font-weight:900;font-size:.82rem;display:flex;align-items:center;justify-content:center;padding:0 5px}
.lic b{font-size:calc(.95rem*var(--fs));font-weight:900;line-height:1.18}
.lic .feito{position:absolute;top:7px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--ok);
  display:none;align-items:center;justify-content:center}
.lic .feito svg{width:16px;height:16px}
.lic.ok .feito{display:flex}
.lic.ok{border-color:var(--ok)}
.placarcapa{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-weight:900;font-size:calc(.86rem*var(--fs));color:var(--soft)}
.placarcapa .trilho{flex:1;height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.placarcapa .trilho i{display:block;height:100%;background:var(--ok)}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;min-height:52px;border-radius:14px;
  border:2px solid var(--line);background:var(--surf);color:var(--ink);font-weight:900;font-size:calc(.95rem*var(--fs));
  text-decoration:none;padding:0 14px}

/* ---------- cabeçalho de cada telinha ---------- */
.lh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.lh .icone{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:color-mix(in srgb,var(--lc) 22%,transparent);padding:3px}
.lh .lhtx{flex:1;min-width:0}
.lh small{display:block;font-size:calc(.7rem*var(--fs));font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--lcx)}
.lh h2{font-size:calc(1.18rem*var(--fs));font-weight:900;line-height:1.18}
.ouvir{min-width:48px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surf);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:900;
  font-size:calc(.8rem*var(--fs));padding:0 10px;flex-shrink:0}
.ouvir svg{width:20px;height:20px}
/* voz natural ou nada (OP_voz.js): sem a voz certa, nada de botão de ouvir */
.ouvir,#sombtn{display:none!important}
body.voz-ok .ouvir,body.voz-ok #sombtn{display:inline-flex!important}

/* ---------- regra e exemplos ---------- */
.regra{font-size:calc(1.08rem*var(--fs));font-weight:800;line-height:1.48;padding:11px 13px;border-radius:14px;
  background:color-mix(in srgb,var(--lc) 13%,transparent);margin-bottom:12px}
.regra b{color:var(--lcx)}
.regra + .regra{margin-top:-4px}
.pals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px}
.pal{min-height:56px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surf);
  font-size:calc(1.45rem*var(--fs));font-weight:900;letter-spacing:1.5px;cursor:pointer;line-height:1.2}
.pal:active{transform:scale(.96)}
.pal small{display:block;font-size:calc(.72rem*var(--fs));letter-spacing:.3px;color:var(--soft);font-weight:800}
.pals.grandes .pal{font-size:calc(1.9rem*var(--fs));min-width:120px}
.hl{color:var(--lcx);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.mudo{opacity:.34;border-bottom:3px dotted currentColor}
.qt{opacity:.4;text-decoration:line-through;text-decoration-thickness:3px}
.sil{display:inline-block;font-size:calc(.95rem*var(--fs));letter-spacing:2px;font-weight:900;color:var(--soft);margin-top:2px}
.dupla{display:grid;gap:10px;margin:6px 0 10px}
@media(min-width:620px){.dupla{grid-template-columns:1fr 1fr}}
.caixa{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surf)}
.caixa h3{font-size:calc(.98rem*var(--fs));font-weight:900;margin-bottom:6px;color:var(--lcx)}
.caixa .pal{font-size:calc(1.15rem*var(--fs));min-height:48px;padding:5px 11px}
.caixa p{font-size:calc(.98rem*var(--fs));font-weight:800;line-height:1.45}
.frase{font-size:calc(1.08rem*var(--fs));font-weight:800;line-height:1.5}
.troca{background:color-mix(in srgb,var(--lc) 30%,transparent);border-radius:6px;padding:0 4px}
.muda{background:rgba(248,113,113,.28);border-radius:6px;padding:0 4px}
.chave{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.chave div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);
  font-size:calc(1rem*var(--fs));font-weight:900;line-height:1.35}
.chave .tag{flex-shrink:0;min-width:92px;text-align:center;padding:6px 8px;border-radius:10px;background:var(--lc);color:#1a1530}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:8px 0 12px}
.abc span{height:44px;border-radius:10px;background:var(--surf);border:2px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-weight:900;font-size:calc(1.05rem*var(--fs))}
.abc span.on{background:var(--lc);color:#1a1530;border-color:var(--lc)}
.fig{width:100%;height:auto;display:block}
/* a página de dicionário desenhada */
.pagdic{border:2px solid var(--line);border-radius:12px;background:#fffdf7;color:#1f2937;padding:8px 12px 10px;margin:4px 0 12px;font-size:calc(.95rem*var(--fs));line-height:1.45}
.pagdic .guias{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:2px solid #1d4ed8;padding-bottom:5px;margin-bottom:6px;font-weight:900;color:#1d4ed8}
.pagdic .guias em{font-style:normal;font-size:calc(.7rem*var(--fs));background:#dbeafe;border-radius:8px;padding:2px 8px;color:#1e3a8a}
.pagdic p{font-weight:700;margin:3px 0}
.pagdic p b{font-weight:900;margin-right:4px}
.pagdic .verb{background:#fef3c7;border:2px dashed #d97706;border-radius:8px;padding:3px 6px}
.pagdic .verb em{display:block;font-style:normal;font-size:calc(.7rem*var(--fs));font-weight:900;color:#92400e;letter-spacing:.5px;text-transform:uppercase}
.cena{width:100%;height:auto;display:block;border-radius:12px}

/* ---------- botões de ação ---------- */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:none;border-radius:14px;
  background:var(--lc);color:#1a1530;font-weight:900;font-size:calc(1rem*var(--fs));cursor:pointer;padding:6px 14px;
  margin-top:10px;line-height:1.2;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.calmo{background:var(--surf);color:var(--ink);border:2px solid var(--line)}
.btnrow{display:grid;gap:8px}
@media(min-width:560px){.btnrow{grid-template-columns:1fr 1fr}}

/* ---------- tocar para revelar ---------- */
.revs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:4px 0}
.rev{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:96px;padding:10px;border-radius:14px;
  border:2px dashed color-mix(in srgb,var(--lc) 70%,transparent);background:var(--surf);cursor:pointer;text-align:left}
.rev .fig{width:56px;height:56px;align-self:center}
.rev b{font-size:calc(1rem*var(--fs));font-weight:900;text-align:center}
.rev .tras{display:none;font-size:calc(.95rem*var(--fs));font-weight:800;line-height:1.4;text-align:center}
.rev .toque{font-size:calc(.72rem*var(--fs));font-weight:900;color:var(--dim);text-align:center;letter-spacing:.4px}
.rev.aberto{border-style:solid;border-color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent)}
.rev.aberto .tras{display:block}
.rev.aberto .toque{display:none}

/* ---------- escolher (uma palavra por vez) ---------- */
.esc{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--surf);text-align:center}
.esc .cont{font-size:calc(.74rem*var(--fs));font-weight:900;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
.esc .perg{font-size:calc(1rem*var(--fs));font-weight:900;margin:4px 0 6px;color:var(--soft)}
.esc .alvo{font-size:calc(2rem*var(--fs));font-weight:900;letter-spacing:2px;line-height:1.25;margin:6px 0 10px;word-break:break-word}
.esc .alvo.frasealvo{font-size:calc(1.08rem*var(--fs));letter-spacing:0;line-height:1.45;text-align:left}
.esc .buraco{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--lcx);color:var(--lcx)}
.ops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.op{min-width:84px;min-height:56px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  font-size:calc(1.25rem*var(--fs));font-weight:900;cursor:pointer;letter-spacing:1px}
.ops.longas .op{flex:1 1 140px;font-size:calc(1rem*var(--fs));letter-spacing:0}
.op:active{transform:scale(.96)}
.op.certa{background:var(--ok);border-color:var(--ok);color:#06251a}
.op.errada{background:var(--no);border-color:var(--no);color:#3a0a0a}
.op[disabled]{cursor:default}
.fbk{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:calc(1rem*var(--fs));font-weight:800;line-height:1.45;text-align:left}
.fbk.ok{background:rgba(52,211,153,.16);border:2px solid var(--ok)}
.fbk.no{background:rgba(248,113,113,.14);border:2px solid var(--no)}
.fbk b.t{display:block;font-weight:900;margin-bottom:2px}
.fbk.ok b.t{color:var(--ok)}
.fbk.no b.t{color:var(--no)}
.esc .alvo.medio{font-size:calc(1.35rem*var(--fs));letter-spacing:1px}
.esc .alvo:empty{display:none}
.fimesc{font-size:calc(1.1rem*var(--fs));font-weight:900;margin:6px 0}

/* ---------- quadrinhos ---------- */
.quads{display:grid;gap:9px}
@media(min-width:620px){.quads{grid-template-columns:1fr 1fr}}
.quad{display:grid;grid-template-columns:44% 1fr;gap:10px;align-items:center;padding:7px;border-radius:14px;
  background:var(--surf);border:2px solid var(--line)}
.quad .qimg{position:relative}
.quad .qn{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:8px;background:var(--lc);color:#1a1530;
  font-weight:900;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.quad p{font-size:calc(.98rem*var(--fs));font-weight:800;line-height:1.38}
.quad p b{color:var(--lcx)}
.conselho{margin-top:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--accent2);
  font-size:calc(1.02rem*var(--fs));font-weight:900;line-height:1.4;background:rgba(251,191,36,.1)}

/* ---------- ordenar tocando ---------- */
.ord{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.oq{position:relative;display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:14px;border:2px solid var(--line);
  background:var(--surf);cursor:pointer;text-align:left}
.oq span.cap{font-size:calc(.84rem*var(--fs));font-weight:800;line-height:1.3;padding:0 2px 2px}
.oq .ob{position:absolute;top:2px;right:2px;width:34px;height:34px;border-radius:50%;background:var(--ok);color:#06251a;
  font-weight:900;font-size:1.05rem;display:none;align-items:center;justify-content:center;border:3px solid var(--card)}
.oq.feito{border-color:var(--ok)}
.oq.feito .ob{display:flex}
.oq.erro{border-color:var(--no);animation:trem .35s}
@keyframes trem{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ordmsg{margin-top:10px;min-height:1.4em;font-size:calc(1rem*var(--fs));font-weight:900;line-height:1.4;text-align:center}

/* ---------- diálogo do lobo ---------- */
.dial{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.bal{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:18px;font-size:calc(1.02rem*var(--fs));
  font-weight:900;line-height:1.38;border:2px solid var(--line);cursor:pointer;background:var(--surf);min-height:48px}
.bal.menina{border-color:#ef4444;border-bottom-left-radius:4px}
.bal.menina small{display:block;font-size:calc(.72rem*var(--fs));color:var(--dim);font-weight:900;letter-spacing:.4px}
.bal .resp{display:none;margin-top:7px;padding:8px 12px;border-radius:14px;border-bottom-right-radius:4px;
  background:rgba(148,163,184,.22);border:2px solid #94a3b8}
.bal.aberto .resp{display:block}
.bal.aberto small.toque{display:none}

/* ---------- pares que mudam o sentido ---------- */
.pares{display:grid;gap:8px}
@media(min-width:560px){.pares{grid-template-columns:1fr 1fr}}
.par{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:14px;border:2px solid var(--line);
  background:var(--surf);cursor:pointer;font-size:calc(1.35rem*var(--fs));font-weight:900;letter-spacing:1.5px;padding:6px 10px}
.par .seta{color:var(--dim);font-size:1.1rem}
.par .depois{opacity:.15}
.par.aberto .depois{opacity:1}
.par.aberto{border-color:var(--lc)}

/* ---------- personagens ---------- */
.pers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.pers.compacto{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
.pers.compacto .per{flex-direction:column;text-align:center;gap:5px;padding:8px 5px}
.pers.compacto .per .fig{width:60px;height:60px}
.per{display:flex;align-items:center;gap:9px;padding:7px;border-radius:14px;background:var(--surf);border:2px solid var(--line)}
.per .fig{width:64px;height:64px;flex-shrink:0}
.per b{display:block;font-size:calc(.98rem*var(--fs));font-weight:900;line-height:1.15}
.per span{display:block;font-size:calc(.82rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.3;margin-top:2px}
.per.vilao{border-color:rgba(248,113,113,.7)}

/* ---------- v2: passos (avó > mãe > filhos; começo > meio > fim) ---------- */
.passos{display:flex;align-items:stretch;justify-content:center;gap:3px;margin:4px 0 12px}
.passo{flex:1 1 0;min-width:0;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
  padding:6px 4px 8px;border-radius:14px;background:var(--surf);border:2px solid var(--line)}
.passo .fig{width:100%;max-width:72px;height:auto}
.passo b{font-size:calc(.86rem*var(--fs));font-weight:900;line-height:1.15;color:var(--lcx)}
.passo span{font-size:calc(.82rem*var(--fs));font-weight:800;line-height:1.3;color:var(--ink)}
.pseta{align-self:center;font-size:1.5rem;font-weight:900;color:var(--dim);flex:0 0 auto}

/* ---------- v2: capas de livro ---------- */
.capas{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin:4px 0}
.capa1{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 12px 14px;border-radius:6px 14px 14px 6px;
  color:#fff;text-align:center;box-shadow:inset 7px 0 0 rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.25)}
.capa1 .fig{width:64px;height:64px}
.capa1 b{font-size:calc(.95rem*var(--fs));font-weight:900;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* ---------- v2: ficha de elementos de uma história ---------- */
.ficha{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:10px;padding:8px 10px;background:color-mix(in srgb,var(--lc) 18%,transparent)}
.fhead .fig{width:52px;height:52px;flex-shrink:0}
.fhead b{font-size:calc(1.05rem*var(--fs));font-weight:900;line-height:1.2}
.flin{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center;padding:8px 10px;border-top:2px solid var(--line)}
.flin .rot{font-size:calc(.8rem*var(--fs));font-weight:900;letter-spacing:.3px;text-transform:uppercase;color:var(--lcx);line-height:1.15}
.flin .figs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.flin .figs .fig{width:40px;height:40px}
.flin p{font-size:calc(.98rem*var(--fs));font-weight:800;line-height:1.35}
@media(max-width:480px){.flin{grid-template-columns:1fr;gap:3px}}

/* ---------- v2: lista de completar (como a folha da professora) ---------- */
.lista{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:5px 6px 5px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surf)}
.lrow .lnum{flex:0 0 auto;min-width:22px;font-size:calc(.78rem*var(--fs));font-weight:900;color:var(--dim)}
.lrow .lw{flex:1 1 auto;min-width:0;font-size:calc(1.3rem*var(--fs));font-weight:900;letter-spacing:1.5px;line-height:1.2;word-break:break-word}
.lrow .lw .buraco{display:inline-block;min-width:1.3em;border-bottom:4px solid var(--lcx);color:var(--lcx);text-align:center}
.lrow .lops{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
.lop{min-width:54px;min-height:46px;padding:4px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);
  font-size:calc(1.08rem*var(--fs));font-weight:900;cursor:pointer;letter-spacing:.5px}
.lop:active{transform:scale(.95)}
.lop.certa{background:var(--ok);border-color:var(--ok);color:#06251a}
.lop.errada{background:var(--no);border-color:var(--no);color:#3a0a0a}
.lop[disabled]{cursor:default}
.lrow.ok{border-color:var(--ok)}
.lrow.no{border-color:var(--no)}
.lrow .lmark{flex:0 0 auto;font-weight:900;font-size:calc(.8rem*var(--fs))}
.lrow.ok .lmark{color:var(--ok)}
.lrow.no .lmark{color:var(--no)}
.lplacar{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surf);border:2px solid var(--line);
  font-size:calc(1rem*var(--fs));font-weight:900;text-align:center;line-height:1.4}

/* ---------- v2: ligar pares (sinônimos) ---------- */
.liga{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.liga .col{display:flex;flex-direction:column;gap:8px}
.lg{min-height:52px;padding:6px 8px;border-radius:12px;border:2px solid var(--line);background:var(--surf);
  font-size:calc(1rem*var(--fs));font-weight:900;cursor:pointer;letter-spacing:.5px;line-height:1.15;word-break:break-word}
.lg.sel{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 26%,transparent)}
.lg.feito{border-color:var(--ok);background:rgba(52,211,153,.18);cursor:default}
.lg.feito::before{content:attr(data-n)' · ';color:var(--ok)}
.lg.erro{border-color:var(--no);animation:trem .35s}


/* ---------- arrastar para o lugar (03/11) ---------- */
.arr-itens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px;min-height:60px}
.arr-it{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border:2px solid var(--line);background:var(--surf);border-radius:12px;padding:5px 9px;font-weight:900;font-size:calc(1rem*var(--fs));line-height:1.15;text-align:center;min-height:48px;min-width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.arr-it img{width:72px;height:72px;object-fit:cover;border-radius:9px;display:block;pointer-events:none}
.arr-it.sel{border-color:var(--lc);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 45%,transparent)}
.arr-it.erro{border-color:var(--no);animation:trem .35s}
.arr-it.voa{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.arr-cx{display:grid;gap:10px}
.arr-c{border:2px dashed color-mix(in srgb,var(--cc,var(--lc)) 70%,transparent);border-radius:14px;padding:8px;background:color-mix(in srgb,var(--cc,var(--lc)) 10%,transparent);min-height:112px;cursor:pointer;display:flex;flex-direction:column;transition:background .15s,transform .15s}
.arr-den:empty::after{content:'Solte aqui';display:block;margin:auto;padding:10px 0;font-weight:800;opacity:.45;font-size:calc(.85rem*var(--fs))}
.arr-den{flex:1;align-content:center}
.arr-c.alvo{border-style:solid;transform:scale(1.04);background:color-mix(in srgb,var(--cc,var(--lc)) 24%,transparent)}
.arr-c h4{margin:0 0 6px;font-size:calc(1.05rem*var(--fs));font-weight:900;color:var(--cc,var(--lc));text-align:center}
.arr-c>img{display:block;width:100%;max-height:120px;object-fit:contain;border-radius:10px;background:#fff;margin:0 0 6px;pointer-events:none}
.arr-den{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.arr-den .arr-it{cursor:default;border-color:var(--ok);background:rgba(52,211,153,.16);min-height:0;padding:3px 7px;font-size:calc(.9rem*var(--fs))}
.arr-den .arr-it img{width:46px;height:46px}
/* frases: o banco de palavras gruda no topo enquanto rola */
.arr-cx1 .arr-itens{position:sticky;top:60px;z-index:6;background:var(--card);padding:8px 4px;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
body.light .arr-cx1 .arr-itens{background:#fff}
.arr-fr{min-height:0;display:block;padding:8px 10px;border-style:solid;border-width:2px;font-weight:800;line-height:1.9}
.arr-fr p{margin:0}
.arr-vaga{display:inline-flex;vertical-align:middle;min-width:96px;min-height:40px;margin:0 3px;border:2px dashed var(--lc);border-radius:10px;align-items:center;justify-content:center}
.arr-vaga:empty::after{content:'';padding:0}
.arr-fr.cheia{border-color:var(--ok)}
.arr-fr.cheia .arr-vaga{border:none;min-width:0}
/* sem rolagem (03/11): frases 3 por vez, figura ao lado; peca com pegador; mao que demonstra */
.arr-c.fora,.arr-c.feita{display:none!important}
.arr-itens .arr-it{box-shadow:0 4px 0 color-mix(in srgb,var(--line) 85%,#000),0 6px 12px rgba(0,0,0,.25);transition:transform .12s}
.arr-itens .arr-it:hover{transform:translateY(-2px)}
.arr-itens .arr-it::before{content:'';display:block;width:22px;height:8px;opacity:.55;background:radial-gradient(circle,currentColor 1.5px,transparent 1.8px) 0 0/7px 4px}
.arr-it.demo{opacity:1;box-shadow:0 12px 26px rgba(0,0,0,.5)}
.arr-it .mao{position:absolute;right:-16px;bottom:-26px;width:40px;height:40px;fill:#fff;stroke:#111;stroke-width:1.2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.arr-prog{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.arr-prog i{width:12px;height:12px;border-radius:50%;border:2px solid var(--lc);opacity:.6}
.arr-prog i.ok{background:var(--ok);border-color:var(--ok);opacity:1}
.arr-cx1 .arr-itens{position:static;box-shadow:none;padding:4px 0;background:none}
body.light .arr-cx1 .arr-itens{background:none}
.arr-fig .fescb{max-height:190px;width:auto;max-width:100%}
@media (min-width:700px){
  .comfig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
  .arr-fig{position:sticky;top:70px}
  .arr-fig .fescb{max-height:none;width:100%;margin:0}
}
@media (max-width:480px){
  .arr-c{min-height:86px}
  .arr-c>img{max-height:92px}
  .arr-itens .arr-it img{width:62px;height:62px}
}
.sec{display:inline-flex;align-items:center;justify-content:center;min-width:1.45em;height:1.45em;padding:0 .2em;margin:0 .1em;border:2px solid currentColor;border-radius:6px;font-weight:900;line-height:1;vertical-align:.05em}
.naprova li.npf{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border:2px solid var(--line);border-radius:14px;background:var(--surf)}
.naprova li.npf>img{width:116px;height:88px;object-fit:contain;margin:0;max-width:none;border-radius:10px;background:#fff}
/* cabe na janela (03/11) */
.arr-cx{grid-template-columns:repeat(var(--c,2),minmax(0,1fr))}
@media (min-width:700px){ .arr-cx{grid-template-columns:repeat(var(--cw,2),minmax(0,1fr))} }
.arr-pe{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.arr-pe .arr-prog{margin:0}
.arr-pe .ordmsg{margin:0;min-height:0}
.arr-re{border:1px solid var(--line);background:none;color:inherit;opacity:.75;border-radius:999px;padding:6px 12px;font:inherit;font-weight:800;font-size:calc(.8rem*var(--fs));cursor:pointer;min-height:44px}
.arr-den:empty::after{padding:6px 0}
@media (max-width:480px){ .arr-itens{gap:6px;margin-bottom:8px} .arr-fig .fescb{max-height:160px} .arr-c>img{max-height:80px} .arr-c{min-height:78px} }
/* pergunta-chave e historia (03/11) */
.lembra{display:flex;gap:10px;align-items:center;margin:10px 0 0;padding:10px 12px;border-radius:14px;border:2px dashed var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent);font-weight:800;line-height:1.4}
.lembra .lb-ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--lc);color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2em}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;font-weight:800;line-height:1.35}
.hist li img{width:84px;height:64px;object-fit:cover;border-radius:10px;background:#fff}
@media (min-width:900px){ .hist{grid-template-columns:1fr 1fr} }
/* encaixe sem rolagem (03/11) */
.corpo.duas{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:row dense;gap:12px;align-items:start}.corpo.duas>:not(.caixa){grid-column:1/-1}.corpo.duas>.caixa{margin:0}
.linhas{line-height:1.75}

.corpo.encx img{max-height:var(--imx)!important;width:auto!important;max-width:100%!important;object-fit:contain;margin-left:auto;margin-right:auto}
/* ---------- treininho ---------- */
.tq .tqnum{font-size:calc(.74rem*var(--fs));font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--lcx)}
.tq .tqp{font-size:calc(1.18rem*var(--fs));font-weight:900;line-height:1.35;margin:6px 0 10px}
.tops{display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);
  background:var(--surf);font-size:calc(1.05rem*var(--fs));font-weight:800;text-align:left;cursor:pointer;line-height:1.3}
.top .let{flex:0 0 30px;height:30px;border-radius:9px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:900}
.top.certa{background:var(--ok);border-color:var(--ok);color:#06251a}
.top.errada{background:var(--no);border-color:var(--no);color:#3a0a0a}
.top.certa .let,.top.errada .let{background:rgba(0,0,0,.16)}
.top[disabled]{cursor:default}
.dicabtn{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surf);font-weight:900;
  font-size:calc(.85rem*var(--fs));padding:0 14px;cursor:pointer;margin-top:10px}
.dicabox{margin-top:8px;padding:9px 12px;border-radius:12px;border:2px dashed var(--accent2);background:rgba(251,191,36,.1);
  font-size:calc(.95rem*var(--fs));font-weight:800;line-height:1.4}

/* ---------- fim da lição ---------- */
.fim{text-align:center}
.fim .selo{width:96px;height:96px;margin:6px auto 8px}
.fim h2{font-size:calc(1.5rem*var(--fs));font-weight:900}
.fim p{font-size:calc(1rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.45;margin:6px 0 4px}

/* ---------- barra de baixo ---------- */
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:8px;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);
  box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.qnav-btn{flex:1;min-height:50px;border:none;border-radius:13px;background:var(--line);color:var(--ink);
  font-weight:900;font-size:calc(.98rem*var(--fs));cursor:pointer;max-width:260px}
.qnav-btn[disabled]{opacity:.35;cursor:default}
.qnav-btn.forte{background:var(--lc);color:#1a1530}
.qpos{flex:0 0 auto;min-width:54px;text-align:center;font-weight:900;font-size:calc(.8rem*var(--fs));color:var(--soft)}
@media(min-width:700px){.qnav{justify-content:center}}

/* ---------- sair (confirmação dentro da página, não o confirm() do navegador) ---------- */
.sairov{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(5,7,18,.72);backdrop-filter:blur(3px)}
.sairov.show{display:flex}
.sairbox{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;
  text-align:center;--lc:#f472b6}
.sairbox h2{font-size:calc(1.2rem*var(--fs));font-weight:900}
.sairbox p{font-size:calc(.92rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.4;margin:6px 0 4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.naprova{margin:6px 0 0;padding-left:0;list-style:none;font-weight:800;line-height:1.4}.npn{font-weight:900;color:var(--lcx)}.naprova li{margin:0 0 10px}.naprova .resp{color:#16a34a}body.light .naprova .resp{color:#15803d}.nptit{font-weight:900;margin:0 0 6px}
.dest{font-weight:900;color:#fbbf24}body.light .dest{color:#b45309}
.linhas{line-height:1.9}
.lw .fesc{display:block;width:100%;max-width:220px;margin:0 auto 6px;border-radius:10px;background:#fff}
.lw{min-width:0;max-width:100%}.fesc{max-width:100%}
b.ocl{display:inline-block;min-width:44px;min-height:28px;padding:0 6px;margin:1px 0;border-radius:7px;text-align:center;cursor:pointer;transition:background .2s,color .2s}
b.ocl.fechado,b.ocl.fechado *{color:transparent!important;text-shadow:none!important;-webkit-text-fill-color:transparent}
b.ocl.fechado{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink) 22%,transparent) 0 6px,color-mix(in srgb,var(--ink) 8%,transparent) 6px 12px);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px;user-select:none}
b.ocl.chama{animation:chama 1.1s ease-in-out infinite}
@keyframes chama{50%{transform:scale(1.08)}}
.maotoque{position:absolute;z-index:60;width:44px;height:44px;pointer-events:none;animation:toque 1.1s ease-in-out infinite}
.maotoque svg{width:100%;height:100%;fill:#fff;stroke:#111;stroke-width:1.2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
@keyframes toque{0%,100%{transform:translate(10px,14px)}50%{transform:translate(0,0) scale(.9)}}
.oclbtn{display:block;margin:10px auto 0;min-height:44px}.oclhint{font-weight:800;text-align:center;margin:0 0 8px}
/* capa: a trilha das 12 lições, Unidade 3 e Unidade 4, com o Bem-te-vi */
.mapa-capa{position:relative;max-width:1000px;margin:0 auto;border-radius:20px;overflow:hidden;color:#173b2a;
  background:linear-gradient(90deg,rgba(21,128,61,.07) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(rgba(21,128,61,.07) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(165deg,#f4fbea,#d9eecb);
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 3px #a7d58c}
.mc-top{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px 2px}
.mc-top svg{flex:0 0 auto;width:62px;height:50px}
.mc-ave{animation:mcbal 3s ease-in-out infinite;transform-origin:40% 90%}
@keyframes mcbal{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.mc-top h1{font-size:calc(1.4rem*var(--fs));font-weight:900;line-height:1.02;color:#14532d}
.mc-top p{font-size:calc(.85rem*var(--fs));font-weight:800;line-height:1.25;margin-top:3px;color:#3f5f2e}
.trilha{position:relative;padding:0 8px 8px}
.trilha>.rota{position:absolute;left:0;top:0;pointer-events:none}
.unid{position:relative}
.utit{position:relative;display:inline-block;font-size:calc(.8rem*var(--fs));font-weight:900;line-height:1.2;color:#14532d;background:rgba(255,255,255,.8);padding:3px 9px;border-radius:9px;margin:6px 0 0}
.uparadas{display:flex;flex-wrap:wrap;justify-content:center}
.parada{position:relative;flex:0 0 25%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 2px 2px;border:0;background:none;font:inherit;color:inherit;cursor:pointer;text-align:center;min-width:0}
.parada .foto{position:relative;flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:#fff center/cover no-repeat;box-shadow:0 0 0 4px var(--lc),0 5px 10px rgba(20,60,20,.35);transition:transform .15s}
.parada:hover .foto,.parada:focus-visible .foto{transform:scale(1.07)}
.parada .num{position:absolute;left:-7px;top:-7px;width:24px;height:24px;border-radius:50%;background:var(--lc);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3);text-shadow:0 0 2px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.9)}
.parada .ok{position:absolute;right:-7px;bottom:-5px;width:24px;height:24px;border-radius:50%;background:#16a34a;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}
.parada .nome{font-size:calc(.74rem*var(--fs));font-weight:900;line-height:1.1;color:#173b2a;background:rgba(255,255,255,.88);padding:2px 4px;border-radius:7px;max-width:100%;overflow-wrap:break-word;hyphens:auto}
.parada .aqui{position:absolute;top:-10px;right:-16px;width:22px;height:30px;animation:mcpin 1.3s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
@keyframes mcpin{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mc-pe{position:relative;display:flex;align-items:center;gap:10px;margin-top:6px}
.chegada{position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:14px;background:linear-gradient(180deg,#22c55e,#15803d);color:#fff;font-weight:900;font-size:calc(1rem*var(--fs));text-decoration:none;box-shadow:0 4px 0 #14532d}
.mc-placar{flex:1;display:flex;align-items:center;gap:8px;font-weight:900;font-size:calc(.8rem*var(--fs));color:#3f5f2e}
.mc-placar .trilho{flex:1;height:9px;border-radius:6px;background:#bfe3a9;overflow:hidden}.mc-placar .trilho i{display:block;height:100%;background:#16a34a}
@media (min-width:700px){ .parada{flex-basis:12.5%} .parada .foto{width:64px;height:64px} }
@media (min-width:700px) and (max-height:520px){
  .mc-top{padding:4px 12px 0}.mc-top svg{width:40px;height:32px}.mc-top h1{font-size:calc(1.1rem*var(--fs))}.mc-top p{display:inline;margin-left:6px}
  .mc-top>div{display:flex;align-items:baseline;flex-wrap:wrap}
  .trilha{display:grid;grid-template-columns:2fr 1fr;column-gap:6px}
  .mc-pe{grid-column:1/-1;margin-top:2px}
  .unid.u3 .parada{flex-basis:25%}.unid.u4 .parada{flex-basis:50%}.parada .nome{overflow-wrap:normal}
  .parada{padding-top:7px;gap:2px}.parada .foto{width:40px;height:40px;box-shadow:0 0 0 3px var(--lc),0 3px 6px rgba(20,60,20,.3)}
  .parada .num{width:20px;height:20px;font-size:11px;left:-6px;top:-6px}
  .parada .nome{font-size:calc(.64rem*var(--fs))}
  .utit{font-size:calc(.7rem*var(--fs));margin-top:2px;padding:2px 7px}
  .parada .aqui{top:-6px;right:-13px;width:18px;height:24px}
  .chegada{min-height:44px}
}
.fescb{display:block;width:100%;max-width:340px;margin:0 auto 8px;border-radius:10px;background:#fff}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0 10px}.figs figure{margin:0;text-align:center;font-weight:800}.figs img{width:100%;border-radius:10px;background:#fff;display:block;margin-bottom:3px}
@media(max-width:520px){.passos.vert{flex-direction:column;align-items:stretch}}
.licic{flex:0 0 auto}
@media (max-width:430px){.topbar{gap:3px;padding:6px;flex-wrap:wrap;justify-content:center}.topbar .title{display:none}.topbar .iconbtn{width:auto;min-width:44px;height:44px;padding:0}}
/* ---- GEO3: figura ao lado do texto, biomas, botão Mostrar tudo no cabeçalho ---- */
.lh .oclbtn{width:auto;flex:0 0 auto;margin:0;min-height:44px;padding:0 10px;font-size:calc(.78rem*var(--fs))}
.lado{display:block}
.lado .lfig img{display:block;width:100%;max-width:420px;margin:0 auto 10px;border-radius:12px;background:#fff}

    init:function(el){

        g.insertAdjacentHTML('beforeend','<svg class="mao" viewBox="0 0 24 24"><path d="M10 7.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v6h1.76c.19 0 .37.04.54.11l4.54 2.26c.53.22.91.76.91 1.38 0 .06-.01.13-.02.2l-.75 5.27c-.11.73-.69 1.28-1.44 1.28h-6.79c-.41 0-.79-.17-1.06-.44L4.75 18.6l.79-.8c.2-.2.48-.33.79-.33.09 0 .16.02.24.03l3.43.72z"/></svg>');

/* ---------- v2 (08/11): as mecânicas de atividade do Inglês, no visual do GEO3 ---------- */

/* cartões que se viram: frente = figura + nome + a pergunta do cartão (contexto); verso = o conteúdo, no mesmo lugar */
R.revela=function(t){

        }
        var it=itens[k], os=it.op||t.op;
        box.innerHTML='<div class="esc-a"><div class="cont">'+(k+1)+' / '+itens.length+'</div>'+
          (t.pergunta?'<div class="perg">'+t.pergunta+'</div>':'')+
          '<div class="alvo'+(it.img?' comimg':'')+(it.m&&it.m.length>26?' frasealvo':'')+'">'+(it.img?IM(it.img):'')+(it.m?'<span>'+it.m+'</span>':'')+'</div></div>'+
          '<div class="esc-b"><div class="ops'+(os.length>3?' muitas':'')+(os.some(function(o){ return o.length>9; })?' longas':'')+'">'+os.map(function(o){ return '<button class="op">'+o+'</button>'; }).join('')+'</div>'+
          '<div class="fbkslot"></div>'+pontos()+'</div>';
        box.querySelectorAll('.op').forEach(function(b){ b.onclick=function(){
          var certo=b.textContent===it.c;
          box.querySelectorAll('.op').forEach(function(x){ x.disabled=true; if(x.textContent===it.c) x.classList.add('certa'); });
          if(!certo) b.classList.add('errada'); else acertos++;
          box.querySelector('.ops').classList.add('respondida');
          marcas[k]=certo?'ok':'no';
          var pi=box.querySelectorAll('.arr-prog i')[k]; if(pi) pi.className=marcas[k];
          box.querySelector('.fbkslot').innerHTML='<div class="fbkrow"><div class="fbk '+(certo?'ok':'no')+'"><b class="t">'+(certo?'Isso!':'Ainda não!')+'</b> '+(it.d||'')+'</div>'+
            '<button class="btn" data-a="prox">'+(k<itens.length-1?'Próximo &#8250;':'Placar &#8250;')+'</button></div>';
          box.querySelector('[data-a="prox"]').onclick=function(){ k++; mostra(); };
          fala((certo?'Isso! ':'Ainda não! ')+puro(it.d||it.c));
          encaixa();
        }; });
        encaixa();
      }
      novo();
    }};
};
/* pôr na ordem: tocar nos cartões, do primeiro ao último */
R.ordena=function(t){
  var lista=t.quadros.map(function(q,i){ return {q:q,i:i}; }), mostra=emb(lista);
  if(mostra.every(function(x,j){ return x.i===j; })) mostra.push(mostra.shift());
  return {html:(t.regra?'<div class="regra">'+t.regra+'</div>':'')+'<div class="ord'+(t.linha?' linha':'')+'" style="--oc:'+(t.cols||2)+'">'+mostra.map(function(x){
      return '<button class="oq" data-i="'+x.i+'">'+(x.q.img?IM(x.q.img):'')+'<span class="cap">'+x.q.cap+'</span><span class="ob"></span></button>';
    }).join('')+'</div><div class="arr-pe"><div class="ordmsg">'+(t.dica||'Toque no primeiro.')+'</div><button class="arr-re" data-a="re">&#8634; Recomeçar</button></div>',
    init:function(el){
      var prox=0, msg=el.querySelector('.ordmsg');
      el.querySelectorAll('.oq').forEach(function(b){ b.onclick=function(){
        if(b.classList.contains('feito')) return;
        var i=+b.dataset.i;
        if(i===prox){
          b.classList.add('feito'); b.querySelector('.ob').textContent=prox+1; prox++;
          if(prox===t.quadros.length){ msg.innerHTML='<span class="estrelas">'+estrelas(1,1)+'</span> '+(t.fimMsg||'Muito bem! Tudo na ordem.'); fala(puro(t.fimMsg||'Muito bem! Tudo na ordem.')); }
          else { msg.textContent='Isso! E depois?'; fala(puro(t.quadros[i].cap)); }
        }else{
          b.classList.remove('erro'); void b.offsetWidth; b.classList.add('erro');
          msg.textContent='Ainda não. O que vem antes?';
          setTimeout(function(){ b.classList.remove('erro'); },450);
        }
      }; });
      el.querySelector('[data-a="re"]').onclick=function(){ render(); };
    }};
};
/* ligar: toque num item e depois no par dele (o lado pode ser figura: {img,t,f}) */
function lgRot(x){ return typeof x==='string'?x:((x.img?IM(x.img):'')+(x.t?'<span>'+x.t+'</span>':'')); }
function lgFala(x){ return typeof x==='string'?puro(x):(x.f||x.t||''); }
R.liga=function(t){
  var esq=t.pares.map(function(p,i){ return {s:p[0],i:i}; }), dir=emb(t.pares.map(function(p,i){ return {s:p[1],i:i}; }));
  if(dir.every(function(x,j){ return x.i===j; })) dir.push(dir.shift());
  function bt(lado){ return function(x){ return '<button class="lg'+(typeof x.s==='string'?'':' lgimg')+'" data-l="'+lado+'" data-i="'+x.i+'">'+lgRot(x.s)+'</button>'; }; }
  return {html:(t.regra?'<div class="regra">'+t.regra+'</div>':'')+
    '<div class="liga'+(t.figs?' ligafig':'')+'"><div class="col">'+esq.map(bt('e')).join('')+'</div><div class="col">'+dir.map(bt('d')).join('')+'</div></div>'+
    '<div class="arr-pe"><div class="ordmsg">Toque num item e depois no par dele.</div><button class="arr-re" data-a="re">&#8634; Recomeçar</button></div>',
    init:function(el){
      var sel=null, feitos=0, msg=el.querySelector('.ordmsg');
      el.querySelectorAll('.lg').forEach(function(b){ b.onclick=function(){
        if(b.classList.contains('feito')) return;
        if(!sel || sel.dataset.l===b.dataset.l){
          if(sel) sel.classList.remove('sel');
          sel=(sel===b)?null:b; if(sel){ sel.classList.add('sel'); msg.textContent='Agora toque no par.'; }
          return;
        }
        var a=sel; sel=null; a.classList.remove('sel');
        if(a.dataset.i===b.dataset.i){
          feitos++; [a,b].forEach(function(x){ x.classList.add('feito'); x.dataset.n=feitos; });
          var p=t.pares[+a.dataset.i];
          if(feitos===t.pares.length) msg.innerHTML='<span class="estrelas">'+estrelas(1,1)+'</span> Muito bem! Tudo ligado.'; else msg.textContent='Isso!';
          fala(lgFala(p[0])+', '+lgFala(p[1]));
        }else{
          [a,b].forEach(function(x){ x.classList.remove('erro'); void x.offsetWidth; x.classList.add('erro'); });
          setTimeout(function(){ a.classList.remove('erro'); b.classList.remove('erro'); },450);
          msg.textContent='Não é o par. Tente de novo.';
        }
      }; });
      el.querySelector('[data-a="re"]').onclick=function(){ render(); };
    }};
};
/* pares: o começo da frase à vista; o toque mostra o resto (revisão do que acabou de aparecer na tela anterior) */
R.pares=function(t){
  /* p = [frase com ___ , o pedaço escondido (até 3 palavras)] */
  return {html:(t.regra?'<div class="regra">'+t.regra+'</div>':'')+'<div class="pares fr">'+t.pares.map(function(p,i){
    var d='<span class="depois">'+p[1]+'</span>';
    return '<button class="par" data-i="'+i+'"><span class="pfr">'+(p[0].indexOf('___')>=0?p[0].replace('___',d):p[0]+' '+d)+'</span></button>';
  }).join('')+'</div><div class="ordmsg">0 de '+t.pares.length+'</div>',
    init:function(el){ var k=0, msg=el.querySelector('.ordmsg');
      el.querySelectorAll('.par').forEach(function(b){ b.onclick=function(){
        if(!b.classList.contains('aberto')){ b.classList.add('aberto'); k++; }
        msg.innerHTML=k===t.pares.length?'<span class="estrelas">'+estrelas(1,1)+'</span> Muito bem!':(k+' de '+t.pares.length);
        var p=t.pares[+b.dataset.i]; fala(puro(p[0].replace('___',p[1]))); }; }); }};
};
R.fim=function(){
  var lic=LICOES[est.lic], ac=0, tot=0;
  for(var k in sessao.resp){ tot++; if(sessao.resp[k].ok) ac++; }
  marca(lic.k);
  var prox=LICOES[est.lic+1];
  return {html:'<div class="fim"><svg class="selo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--ok)"/>'+
      '<path d="M28 52l15 15 30-32" stroke="#06251a" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '<h2>Lição concluída!</h2><p>'+lic.nome+'</p>'+
      
      '<div class="btnrow">'+(prox?'<button class="btn" data-a="prox">Próxima lição: '+prox.nome+'</button>':'')+
      '<a class="btn" href="GEO3_simulado.html?v=c4d84e01221" style="text-decoration:none;text-align:center">Simulado &#8250;</a><button class="btn calmo" data-a="capa">Todas as lições</button></div></div>',
    fala:'Lição concluída! '+puro(lic.nome),
    init:function(el){
      var p=el.querySelector('[data-a="prox"]'); if(p) p.onclick=function(){ abre(est.lic+1); };
      el.querySelector('[data-a="capa"]').onclick=capa;
    }};
};

/* ---------------- capa: a grade das 15 lições ---------------- */
/* a rota sai do centro real de cada foto e termina na chegada */
function desenhaRota(){
  var tr=tela.querySelector('.trilha'); if(!tr) return;
  var s=tr.querySelector('.rota'), o=tr.getBoundingClientRect(), pts=[].map.call(tr.querySelectorAll('.foto'),function(f){ var r=f.getBoundingClientRect(); return [r.left+r.width/2-o.left,r.top+r.height/2-o.top]; });
  var c=tr.querySelector('.chegada').getBoundingClientRect(); pts.push([c.left+c.width/2-o.left,c.top-o.top+6]);
  var d='M'+pts[0][0]+' '+pts[0][1]; for(var i=1;i<pts.length;i++){ var m=(pts[i-1][1]+pts[i][1])/2; d+=' C'+pts[i-1][0]+' '+m+','+pts[i][0]+' '+m+','+pts[i][0]+' '+pts[i][1]; }
  s.setAttribute('width',o.width); s.setAttribute('height',o.height); s.setAttribute('viewBox','0 0 '+o.width+' '+o.height);
  s.innerHTML='<path d="'+d+'" fill="none" stroke="#15803d" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round"/>';
}
window.addEventListener('resize',desenhaRota);
var BEMTEVI='<svg viewBox="0 0 80 64" aria-hidden="true"><g class="mc-ave"><path d="M10 40c4-14 18-22 34-20 10 1 18 6 22 14l10 4-11 3c-4 9-15 15-28 14-16-1-27-6-27-15z" fill="#facc15"/><path d="M30 22c10-6 24-6 32 2 3 3 4 7 4 10-10-4-22-6-36-2z" fill="#7c5a2e"/><path d="M44 30c10 2 18 8 20 16-12 2-22-2-28-10z" fill="#8b6b3d"/><path d="M40 16c6-5 15-5 20 0 2 3 2 6 1 8-6-3-14-4-21-2z" fill="#1f2937"/><path d="M41 21c6-2 13-2 19 1" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="56" cy="19" r="2.4" fill="#fff"/><circle cx="56.5" cy="19" r="1.2" fill="#111"/><path d="M62 21l10-1-9 4z" fill="#1f2937"/><path d="M24 54l-3 8M32 55l-1 8" stroke="#7c5a2e" stroke-width="2.4" stroke-linecap="round"/></g></svg>';
function renderCapa(){
  var f=feitas(), n=0;
  LICOES.forEach(function(l){ if(f[l.k]) n++; });
  document.body.style.setProperty('--lc','#22c55e');
  titulo.textContent='Guardiões da Casa Maior · Teoria';
  var PIN='<svg class="aqui" viewBox="0 0 30 40" aria-hidden="true"><path d="M15 39C8 27 2 21 2 14a13 13 0 0 1 26 0c0 7-6 13-13 25z" fill="#e11d2e" stroke="#7f1d1d" stroke-width="1.5"/><circle cx="15" cy="14" r="6" fill="#fff"/></svg>';
  var prox=-1; LICOES.some(function(l,i){ if(!f[l.k]){ prox=i; return true; } return false; });
  function parada(l,i){
    return '<button class="parada" data-i="'+i+'" style="--lc:'+corDe(l)+'"><span class="foto" style="background-image:url(media/geo3/'+l.capa+'.jpg)"><span class="num">'+(i+1)+'</span>'+(f[l.k]?'<span class="ok" aria-label="feita">&#10003;</span>':'')+(i===prox?PIN:'')+'</span><span class="nome">'+l.curto+'</span></button>';
  }
  function unidade(u,tit){
    return '<div class="unid u'+u+'"><h2 class="utit">'+tit+'</h2><div class="uparadas">'+LICOES.map(function(l,i){ return l.unid===u?parada(l,i):''; }).join('')+'</div></div>';
  }
  tela.innerHTML='<div class="mapa-capa"><div class="mc-top">'+BEMTEVI+
    '<div><h1>Guardiões da Casa Maior</h1><p>Teoria de Geografia · prova em 12/11</p></div></div>'+
    '<div class="trilha"><svg class="rota" aria-hidden="true"></svg>'+
    unidade(3,'Unidade 3 · Ruas, deslocamentos e transportes')+unidade(4,'Unidade 4 · Meio ambiente, nossa casa maior')+
    '<div class="mc-pe"><a class="chegada" href="GEO3_simulado.html?v=c4d84e01221">Simulado &#8250;</a>'+
    '<div class="mc-placar"><span>'+n+' de '+LICOES.length+' feitas</span><span class="trilho"><i style="width:'+Math.round(n/LICOES.length*100)+'%"></i></span></div></div></div></div>';
  tela.querySelectorAll('.parada').forEach(function(b){ b.onclick=function(){ abre(+b.dataset.i); }; });
  desenhaRota();
  bar.style.width=Math.round(n/LICOES.length*100)+'%';
  navPrev.disabled=true; navNext.disabled=false;
  navNext.innerHTML=(n?'Continuar':'Começar')+' &#8250;';
  navPos.textContent=n+'/'+LICOES.length;
}

/* sem rolagem: figuras encolhem (busca binaria na altura maxima) ate a tela caber */
function encaixa(){
  var c=tela.querySelector('.corpo'); if(!c||c.querySelector('.arr-itens')) return;
  var ims=c.querySelectorAll('img'); if(!ims.length) return;
  ims.forEach(function(im){ if(!im.complete && !im.dataset.enc){ im.dataset.enc=1; im.addEventListener('load',function(){ if(c.isConnected) encaixa(); }); } });
  c.classList.remove('encx'); c.style.removeProperty('--imx');
  function sobra(){ return document.documentElement.scrollHeight-innerHeight; }
  if(sobra()<=2) return;
  /* tela larga: dois quadros lado a lado antes de encolher figura */
  var qs=c.querySelectorAll(':scope>.caixa'); c.classList.remove('duas');
  if(innerWidth>=900 && qs.length===2){ c.classList.add('duas'); if(sobra()<=2) return; }
  c.classList.add('encx'); var lo=c.querySelector('.revf')?44:(innerWidth<600?84:60), hi=Math.max(64,Math.round(innerHeight*.6));
  for(var k=0;k<9;k++){ var m=Math.round((lo+hi)/2); c.style.setProperty('--imx',m+'px'); if(sobra()<=2) lo=m; else hi=m-1; }
  c.style.setProperty('--imx',lo+'px');
}
addEventListener('resize',function(){ clearTimeout(window._encT); window._encT=setTimeout(function(){ if(est.lic>=0) encaixa(); },150); });
function render(){
  try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll('.arr-it.demo').forEach(function(x){ x.remove(); }); tiraMao(); /* a mao da tela anterior nao fica flutuando */
  if(est.lic<0){ renderCapa(); window.scrollTo(0,0); return; }
  var lic=LICOES[est.lic], t=sessao.telas[est.i], cor=corDe(lic);
  document.body.style.setProperty('--lc',cor);
  titulo.textContent=lic.nome;
  var r=(R[t.tipo]||R.texto)(t);
  tela.innerHTML='<div class="lh">'+icDe(lic)+'<div class="lhtx"><small>Lição '+(est.lic+1)+' · '+lic.nome+'</small>'+
    '<h2>'+t.tit+'</h2></div><button class="ouvir" aria-label="Ouvir">'+OUVIR+'</button></div>'+
    '<div class="corpo">'+r.html+'</div>';
  if(r.init) r.init(tela.querySelector('.corpo'));
  encaixa();
  tela.querySelectorAll('.pal').forEach(function(b){ if(!b.onclick) b.onclick=function(){ fala((b.dataset.f||b.textContent).toLowerCase()); }; });
  tela.querySelector('.ouvir').onclick=function(){
    /* v2: cada tela tem sua fala curta; sem ela, lê título + instrução, e nunca o que está hachurado */
    if(r.fala || t.fala) return fala(r.fala || t.fala);
    if(t.tipo!=='texto') return fala(t.tit+'. '+puro(t.regra||t.pergunta||''));
    var cp=tela.querySelector('.corpo').cloneNode(true); cp.querySelectorAll('.fechado').forEach(function(b){ b.textContent='…'; });
    cp.querySelectorAll('button').forEach(function(b){ b.remove(); });
    fala(t.tit+'. '+cp.innerText);
  };
  var n=sessao.telas.length;
  bar.style.width=Math.round((est.i+1)/n*100)+'%';
  navPrev.disabled=false;
  navPrev.innerHTML='&#8249; Voltar';
  navNext.disabled=false;
  navNext.innerHTML = est.i<n-1 ? 'Avançar &#8250;' : (est.lic<LICOES.length-1 ? 'Próxima lição &#8250;' : 'Todas as lições &#8250;');
  navPos.textContent=(est.i+1)+'/'+n;
  window.scrollTo(0,0);
}

navPrev.onclick=volta; navNext.onclick=avanca;

/* casinha: confirma dentro da página antes de sair */
var sairov=$('sairov'), irEmbora=window.goHome;
window.goHome=function(){ if(window.screenLocked) return; sairov.classList.add('show'); $('sairNao').focus(); };
$('sairSim').onclick=function(){ sairov.classList.remove('show'); irEmbora(); };
$('sairNao').onclick=function(){ sairov.classList.remove('show'); };
sairov.onclick=function(e){ if(e.target===sairov) sairov.classList.remove('show'); };

document.addEventListener('keydown',function(e){
  if(sairov.classList.contains('show')){ if(e.key==='Escape') sairov.classList.remove('show'); return; }
  var m=document.getElementById('ctMenu'); if(m && m.classList.contains('show')) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); avanca(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); volta(); }
  else if(e.key==='Enter'){
    var a=document.activeElement;
    if(a && (a.tagName==='BUTTON'||a.tagName==='A')) return;   /* Enter no botão = clicar nele */
    e.preventDefault(); avanca();
  }
});

render();
window.GEO3_ESTUDO={abre:abre, capa:capa, estado:function(){ return {lic:est.lic,i:est.i,n:sessao?sessao.telas.length:0}; }};
})();
