<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Truques de prova — Olimpíada de Português</title>
<link rel="stylesheet" href="serafina-core.css?v=20260908">
<link rel="stylesheet" href="OP_estilo.css?v=20260908b">
<style>
/* exclusivo desta tela */
.bloco{border:1px solid var(--line);border-radius:13px;background:var(--surf);margin-bottom:9px;overflow:hidden}
.blocotopo{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;background:none;border:none;
  color:var(--ink);font-family:inherit;cursor:pointer;text-align:left;min-height:56px}
.blocotopo .n{flex:0 0 28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.82rem;background:var(--line)}
.blocotopo b{display:block;font-size:calc(.98rem*var(--fs));font-weight:900;line-height:1.2}
.blocotopo small{display:block;font-size:calc(.76rem*var(--fs));font-weight:800;color:var(--dim);line-height:1.3;margin-top:1px}
.blocotopo .qtd{margin-left:auto;font-size:calc(.68rem*var(--fs));font-weight:900;color:var(--dim);white-space:nowrap}
.bloco.aberto .blocotopo{border-bottom:1px solid var(--line)}
.bloco.mestre{border-color:var(--accent2);background:rgba(251,191,36,.08)}
.bloco.mestre .blocotopo .n{background:var(--accent2);color:#3a2a00}
.bloco.mestre .truquefrase{background:rgba(251,191,36,.2)}
.blococorpo{display:none;padding:11px 13px 13px}
.bloco.aberto .blococorpo{display:block}
.truquefrase{font-size:calc(1rem*var(--fs));font-weight:900;line-height:1.38;padding:9px 11px;border-radius:10px;
  background:rgba(251,191,36,.13);border-left:5px solid var(--accent2);margin-bottom:9px}
.como{font-size:calc(.88rem*var(--fs));font-weight:800;color:var(--soft);line-height:1.45;margin-bottom:9px}
.passos{list-style:none;margin-bottom:10px}
.passos li{font-size:calc(.88rem*var(--fs));font-weight:800;line-height:1.4;padding:6px 10px 6px 24px;border-radius:9px;
  background:var(--card);margin-bottom:5px;position:relative}
.passos li::before{content:"\2022";position:absolute;left:9px;color:var(--accent);font-size:1.2rem;line-height:1}
.apoio{font-size:calc(.8rem*var(--fs));font-weight:800;color:var(--dim);line-height:1.4;padding:8px 10px;
  border-radius:9px;border:1px dashed var(--line);margin-bottom:10px}
.acoes{display:grid;gap:7px}
@media(min-width:560px){.acoes{grid-template-columns:1fr 1fr}}
.acao{min-height:46px;border-radius:11px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  font-family:inherit;font-weight:900;font-size:calc(.88rem*var(--fs));cursor:pointer;padding:0 12px}
.acao:active{transform:translateY(1px)}
.acao.forte{border-color:var(--accent);background:rgba(74,222,128,.14)}
.feitoselo{display:inline-block;font-size:calc(.64rem*var(--fs));font-weight:900;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ok);border:1px solid var(--ok);border-radius:14px;padding:2px 8px;margin-left:6px}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn sera-home" title="Início" onclick="goHome()">&#127968;</button>
    <span class="title">Truques de prova</span>
    <button class="iconbtn" title="Letra menor" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Letra maior" onclick="fs(1)">A+</button>
    <button class="iconbtn sombtn" id="sombtn" title="Som" onclick="toggleSom()">&#128266;</button>
    <button class="iconbtn" title="Tema" onclick="document.body.classList.toggle('light')">&#127769;</button>
    <button class="iconbtn lockbtn" id="lockbtn" title="Tela cheia" onclick="toggleLock()">&#128274;</button>
  </div>
  <div class="stage"><div class="card" id="raiz"></div></div>
</div>

<script>window.SERA_CFG={trKey:null,lang:'pt-BR',rate:.86,home:'../index.html',somKey:'op_som',stars:90};</script>
<script src="serafina-core.js?v=20260908"></script>
<script src="OP_voz.js?v=20260909"></script>
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="OP_data.js?v=20260908b"></script>
<script src="OP_questao.js?v=20260908b"></script>
<script>
/* ============================================================
   O QUE CAI E COMO RESOLVER — a parte teórica.

   Oito tipos de pergunta, um por bloco, todos fechados de início: a tela
   abre mostrando o mapa inteiro da prova em uma dobra, e ela abre o que
   quiser. (Na primeira versão cada tipo era um cartão de tela cheia com
   parágrafo de introdução; dava meia tela de preliminar antes do
   conteúdo.)

   Cada bloco tem: o truque em uma frase, os passos, e DOIS atalhos —
   "ver perguntas de prova desse tipo", que abre um popup com as questões
   REAIS que cobraram aquilo, e "treinar", que leva ao simulado.

   O popup guarda a posição da página: fecha e ela volta exatamente onde
   estava, com o bloco ainda aberto e o que já respondeu preservado.
   ============================================================ */
'use strict';
var h=React.createElement, OP=window.OP, OPQ=window.OPQ;
var FAM={}; OP.FAMILIAS.forEach(function(f){ FAM[f.k]=f; });
var LIDOS='op_blocos_lidos';

function lidos(){ try{ return JSON.parse(localStorage.getItem(LIDOS)||'{}'); }catch(e){ return {}; } }
function marcaLido(k){ var l=lidos(); l[k]=1; try{ localStorage.setItem(LIDOS,JSON.stringify(l)); }catch(e){} }
function doEixo(k){ return OP.ITENS.filter(function(i){ return i.eixo===k; }); }
/* As questoes que um bloco mostra no popup. O bloco mestre ("o que a
   pergunta esta pedindo") nao tem eixo proprio: ele lista ids a dedo,
   porque o que reune essas questoes e o comando, nao o assunto. */
function itensDo(c){
  if(c.itens) return c.itens.map(function(id){ return OP.acha(id); }).filter(Boolean);
  /* um bloco pode cobrir mais de um eixo — "Codigo, tabela e placa" reune
     os dois, e sem isso as questoes de placa ficavam sem porta de entrada */
  if(c.eixos) return OP.ITENS.filter(function(i){ return c.eixos.indexOf(i.eixo)>=0; });
  return doEixo(c.k);
}

/* ---------- o popup ---------- */
function Popup(props){
  var itens=props.itens;
  var r=React.useState(props.respostas||{}), resp=r[0], setResp=r[1];
  /* reabrir a janela cai na primeira que ela ainda nao respondeu, e nao
     no comeco: quem volta quer continuar, nao repetir */
  var primeira=(function(){
    for(var i=0;i<itens.length;i++) if(!(itens[i].id in (props.respostas||{}))) return i;
    return 0;
  })();
  var c=React.useState(primeira), cur=c[0], setCur=c[1];

  function responde(acertou,item){
    var novo={}; for(var k in resp) novo[k]=resp[k];
    novo[item.id]=acertou; setResp(novo);
    if(props.aoResponder) props.aoResponder(novo);
  }
  React.useEffect(function(){
    function esc(e){ if(e.key==='Escape') props.aoFechar(); }
    document.addEventListener('keydown',esc);
    return function(){ document.removeEventListener('keydown',esc); };
  },[]);

  var item=itens[cur];
  var respondidas=Object.keys(resp).length;
  return h('div',{className:'modalbg', onClick:function(e){ if(e.target.className==='modalbg') props.aoFechar(); }},
    h('div',{className:'modal'},
      h('div',{className:'modalhead'},
        h('b',null,props.titulo),
        h('span',{className:'conta'},(cur+1)+' de '+itens.length),
        h('button',{className:'fechar', title:'Fechar', onClick:props.aoFechar},'✕')
      ),
      h(OPQ.Questao,{
        key:item.id,
        item:item,
        aoResponder:responde
      }),
      h('div',{className:'modalnav'},
        h('button',{disabled:cur===0, onClick:function(){ setCur(cur-1); }},'‹ Anterior'),
        h('button',{className:'forte', onClick:function(){
          if(cur<itens.length-1) setCur(cur+1); else props.aoFechar();
        }}, cur<itens.length-1 ? 'Próxima ›' : 'Fechar e voltar')
      ),
      respondidas>0 && h('p',{style:{textAlign:'center',fontSize:'.74rem',fontWeight:800,color:'var(--dim)',marginTop:'8px'}},
        'Você já respondeu '+respondidas+' desta janela. Fechar não perde nada.')
    )
  );
}

/* ---------- a tela ---------- */
function App(){
  var a=React.useState({}), abertos=a[0], setAbertos=a[1];
  var p=React.useState(null), popup=p[0], setPopup=p[1];
  var l=React.useState(lidos()), lido=l[0], setLido=l[1];
  var rr=React.useState({}), respPorEixo=rr[0], setRespPorEixo=rr[1];
  var scroll=React.useRef(0);

  function alterna(k){
    var n={}; for(var i in abertos) n[i]=abertos[i];
    n[k]=!n[k]; setAbertos(n);
    if(n[k]){ marcaLido(k); setLido(lidos()); }
  }
  /* Travar o fundo com overflow:hidden nao basta — a pagina perde a
     posicao e volta perto do topo. Fixamos o body no deslocamento atual
     e devolvemos a rolagem ao fechar. */
  function abrePopup(cartao){
    scroll.current = window.scrollY;
    var b=document.body;
    b.style.position='fixed'; b.style.top=(-scroll.current)+'px';
    b.style.left='0'; b.style.right='0'; b.style.width='100%';
    setPopup(cartao);
  }
  function fechaPopup(){
    var b=document.body;
    b.style.position=''; b.style.top=''; b.style.left=''; b.style.right=''; b.style.width='';
    setPopup(null);
    window.scrollTo(0,scroll.current);
  }

  var quantosLidos=OP.CARTOES.filter(function(c){ return lido[c.k]; }).length;

  return h('div',null,
    h('h1',{className:'tt'},'Truques de prova'),
    h('p',{className:'sub'},'Comece pelo de estrela: ele vale para as quinze perguntas. Depois, os oito tipos que caem — cada um com o truque em uma frase e as perguntas de verdade que já cobraram aquilo.'),

    OP.CARTOES.map(function(c,idx){
      var fam=FAM[c.k]||{cor:'var(--accent)'};
      var itens=itensDo(c);
      var aberto=!!abertos[c.k];
      return h('div',{key:c.k, className:'bloco'+(aberto?' aberto':'')+(c.mestre?' mestre':'')},
        h('button',{className:'blocotopo', onClick:function(){ alterna(c.k); }},
          h('span',{className:'n', style:aberto&&fam.cor?{background:fam.cor,color:'#06251a'}:null}, c.mestre?'★':idx),
          h('span',null,
            h('b',null, c.titulo, lido[c.k] && !aberto ? h('span',{className:'feitoselo'},'lido') : null),
            h('small',null, aberto ? 'toque para fechar' : c.truque.split('.')[0]+'.')),
          h('span',{className:'qtd'}, itens.length+' perguntas')
        ),
        aberto && h('div',{className:'blococorpo'},
          h('div',{className:'truquefrase'}, c.truque),
          h('button',{className:'mini', onClick:function(){ if(window.say) say(c.truque); }},'Ouvir'),
          c.texto && h('p',{className:'como'}, c.texto),
          c.extras && h('ul',{className:'passos'}, c.extras.map(function(e,i){ return h('li',{key:i},e); })),
          c.apoio && h('p',{className:'apoio'}, c.apoio),
          h('div',{className:'acoes'},
            h('button',{className:'acao forte', onClick:function(){ abrePopup(c); }},
              'Ver perguntas de prova · '+itens.length),
            h('a',{className:'acao', style:{display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none'},
                   href:'OP_simulado.html'},'Treinar no simulado')
          )
        )
      );
    }),

    h('p',{style:{textAlign:'center',fontSize:'.76rem',fontWeight:800,color:'var(--dim)',margin:'12px 0 4px',lineHeight:1.4}},
      quantosLidos+' de '+OP.CARTOES.length+' abertos'),
    h('div',{className:'grade duas',style:{marginTop:'8px'}},
      h('a',{className:'acao forte',href:'OP_simulado.html',style:{display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none'}},'Fazer um simulado'),
      h('a',{className:'acao',href:'OP_provas.html',style:{display:'flex',alignItems:'center',justifyContent:'center',textDecoration:'none'}},'Fazer uma prova anterior')
    ),

    popup && h(Popup,{
      titulo: popup.titulo,
      itens: itensDo(popup),
      respostas: respPorEixo[popup.k]||{},
      aoResponder:function(novo){
        var n={}; for(var i in respPorEixo) n[i]=respPorEixo[i];
        n[popup.k]=novo; setRespPorEixo(n);
      },
      aoFechar: fechaPopup
    })
  );
}

ReactDOM.createRoot(document.getElementById('raiz')).render(h(App));
</script>
<script>window.SERA_ACCENT={accent:'#4ade80'};</script>
<script src="sera_theme.js?v=20260908"></script>
</body>
</html>
