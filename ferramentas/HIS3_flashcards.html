<style>
/* HIS3_flashcards (24/11/2026, pedidos do Paulo): FRENTE COMPLETA + 2 OPCOES (certa e um distrator plausivel);
   a crianca toca numa e a carta vira. VERSO: no alto o enunciado em letra menor; "Acertou!" ou "Errou" e a resposta
   certa em destaque. So entra carta com cara real de flashcard e nota >= 9,5 do porteiro. Sem som. Botao Baralhos e o
   voltar do celular levam aos baralhos. Fonte: _roteiro.md. */
html,body{height:100%;overflow:hidden}
button{touch-action:manipulation}
.app{height:100vh;height:100dvh;min-height:0}
.palco{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;max-width:640px;width:100%;margin:0 auto}
/* ---- baralhos ---- */
.ini{margin:auto 0;width:100%;display:flex;flex-direction:column;gap:9px;max-height:100%;overflow:auto;padding:2px}
.ini h1{font-size:calc(1.2rem*var(--fs));font-weight:900;text-align:center;color:var(--accent)}
.ini p{font-size:calc(.86rem*var(--fs));font-weight:800;color:var(--soft);text-align:center}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:420px){.decks{grid-template-columns:1fr}}
.deck{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px;border:2px solid var(--line);border-radius:15px;color:var(--ink);font-family:inherit;cursor:pointer;text-align:left;
  background:linear-gradient(150deg,color-mix(in srgb,var(--dc) 22%,var(--card)),var(--card))}
.deck:active{transform:scale(.97)}
.deck b{flex:1;font-size:calc(.98rem*var(--fs));font-weight:900;line-height:1.15}
.deck i{font-style:normal;font-size:calc(.74rem*var(--fs));font-weight:900;border-radius:12px;padding:3px 9px;border:1.5px solid var(--dc)}
.deck.feito i{background:var(--ok);border-color:var(--ok);color:#06281a}
.todos{min-height:52px;border:none;border-radius:15px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#241500;font-family:inherit;font-weight:900;font-size:calc(1rem*var(--fs));cursor:pointer}
/* ---- carta ---- */
.topo{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.topo b{flex:1;min-width:0;font-weight:900;font-size:calc(.92rem*var(--fs));color:var(--dc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo span{font-weight:900;font-size:calc(.8rem*var(--fs));color:var(--soft);background:var(--line);border-radius:12px;padding:4px 10px;white-space:nowrap}
.flip{flex:1;min-height:0;perspective:1400px}
.fc{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.fc.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:16px;border-radius:22px;border:3px solid var(--dc);background:linear-gradient(140deg,var(--card),color-mix(in srgb,var(--dc) 10%,var(--card)));box-shadow:0 14px 34px rgba(0,0,0,.32);overflow:hidden}
.face img{max-width:100%;max-height:44%;min-height:0;object-fit:contain;border-radius:12px;background:#fff;flex:0 1 auto}
.face .q{font-weight:900;font-size:calc(clamp(1.15rem,3.2vmin + .6rem,1.6rem)*var(--fs));line-height:1.25}
.back{transform:rotateY(180deg);border-color:var(--ok);background:linear-gradient(140deg,color-mix(in srgb,var(--ok) 16%,var(--card)),var(--card))}
.back .a{font-weight:900;font-size:calc(clamp(1.4rem,4.2vmin + .7rem,2.1rem)*var(--fs));line-height:1.2;color:var(--ink)}
.back .qq{font-weight:800;font-size:calc(.85rem*var(--fs));color:var(--soft);line-height:1.25}
.ops{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.op{min-height:56px;padding:8px 14px;border-radius:16px;border:3px solid var(--dc);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:calc(clamp(1.05rem,2.6vmin + .55rem,1.4rem)*var(--fs));cursor:pointer;line-height:1.15}
.op:active{transform:scale(.97)}
.back.ok{border-color:var(--ok);background:linear-gradient(140deg,color-mix(in srgb,var(--ok) 18%,var(--card)),var(--card))}
.back.err{border-color:#f87171;background:linear-gradient(140deg,color-mix(in srgb,#f87171 16%,var(--card)),var(--card))}
.back .qq{margin-bottom:auto}
.back::after{content:"";margin-top:auto}
.ver{font-weight:900;font-size:calc(clamp(1.3rem,3.6vmin + .6rem,1.9rem)*var(--fs))}
.back.ok .ver{color:var(--ok)}
.back.err .ver{color:#f87171}
.back .rot{font-weight:800;font-size:calc(.85rem*var(--fs));color:var(--soft)}
.back .a{border:3px solid var(--ok);border-radius:16px;padding:6px 18px;background:color-mix(in srgb,var(--ok) 14%,transparent)}
.back .tua{font-weight:800;font-size:calc(.85rem*var(--fs));color:var(--soft)}
.back .tua s{color:#f87171}
/* ---- tema Detetives do Tempo (Paulo 24/11): carta de pista em papel antigo, tinta escura (leitura), opcoes lado a lado,
   carimbo de Acertou/Errou e resposta com marca-texto ---- */
.face{border:2px solid #b9925a;color:#2a1f14;
  background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.6),transparent 38%),radial-gradient(circle at 92% 96%,rgba(140,96,40,.2),transparent 42%),#f5e8cb;
  box-shadow:inset 0 0 0 7px #f5e8cb,inset 0 0 0 9px rgba(150,108,55,.38),0 14px 34px rgba(0,0,0,.38)}
.face .tarja{margin-bottom:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 8px;border-radius:20px;background:var(--dc);color:#1f1a12;
  font-weight:900;font-size:calc(.74rem*var(--fs));letter-spacing:.02em;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.face .tarja svg{width:18px;height:18px;flex:0 0 18px}
.face::after{content:"";margin-top:auto}
.face .q{color:#2a1f14}
.front{gap:20px}
.ops{flex-direction:row;gap:10px;max-width:520px}
.op{flex:1 1 0;min-width:0;background:#fffaf0;color:#2a1f14;border:3px solid var(--dc);border-bottom-width:6px;border-radius:16px;overflow-wrap:break-word;hyphens:auto}
.op:active{transform:translateY(2px);border-bottom-width:4px}
.back,.back.ok,.back.err{border-color:#b9925a;background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.6),transparent 38%),radial-gradient(circle at 92% 96%,rgba(140,96,40,.2),transparent 42%),#f5e8cb}
.back .qq{margin-bottom:0;color:#6b5a45}
.back::after{display:block}
.ver{display:inline-block;padding:2px 16px;border:4px solid currentColor;border-radius:12px;transform:rotate(-5deg);text-transform:uppercase;letter-spacing:.06em;margin:4px 0}
.back.ok .ver{color:#15803d}
.back.err .ver{color:#b91c1c}
.back .rot{color:#6b5a45}
.back .a{color:#2a1f14;border:none;border-radius:4px;padding:0 10px;background:linear-gradient(transparent 52%,#fde047 52%,#fde047 92%,transparent 92%)}
.back .tua{color:#6b5a45}
.back .tua s{color:#b91c1c}
.volta{flex:0 0 auto;min-height:44px;padding:0 13px;border-radius:13px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:calc(.86rem*var(--fs));cursor:pointer}
.nav{flex:0 0 auto;display:flex;gap:10px}
.nav button{flex:1;min-height:52px;border-radius:15px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:calc(.98rem*var(--fs));cursor:pointer}
.nav button.forte{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 34%,transparent),rgba(251,191,36,.18))}
.nav button[disabled]{opacity:.4;cursor:default}
/* ---- fim ---- */
.fim{margin:auto;width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.fim h2{font-size:calc(1.3rem*var(--fs));font-weight:900;color:var(--accent)}
.fim p{font-weight:800;color:var(--soft)}
.fim button{min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer}
.fim button.forte{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 34%,transparent),rgba(251,191,36,.18))}
@media (max-width:430px){.topbar{gap:3px;padding:6px}.topbar .title{display:none}}
@media (max-height:500px){.face{flex-direction:row;gap:16px}.face img{max-height:80%;max-width:42%}.face .tx{display:flex;flex-direction:column;gap:8px;align-items:center}.front{flex-direction:column;gap:8px}.ops{flex-direction:row;max-width:none}.op{flex:1;min-height:48px}.back .qq{margin-bottom:0}.back::after{display:none}.back{flex-direction:column;gap:4px;padding:10px 14px}.back .rot{display:none}.ver{font-size:calc(1.2rem*var(--fs))}.back .a{font-size:calc(1.35rem*var(--fs));padding:3px 14px}.front .q{font-size:calc(1.05rem*var(--fs))}.face .tarja{padding:2px 10px 2px 6px}.face::after{display:none}.face .tarja{margin-bottom:0}.front{padding:10px 14px}.nav button{min-height:46px}.palco{gap:6px;padding-top:6px}}
</style>
</head>

<script>
/* ===== DADOS — trabalho/3tri_historia/_roteiro.md. Verso curto e inequivoco. f = foto da aula (media/his3/). ===== */
var M='media/his3/';
var BARALHOS=[
 {id:'tipos',titulo:'Tipos de fonte',cor:'#f472b6',cartas:[
  {q:'Relatos e histórias contadas por pessoas são fonte…',a:'Oral',x:'Escrita'},
  {q:'Diários, leis, jornais e cartas são fonte…',a:'Escrita',x:'Material'},
  {q:'Pinturas, fotografias e mapas são fonte…',a:'Visual',x:'Material'},
  {q:'Brinquedos, roupas, construções e utensílios são fonte…',a:'Material',x:'Visual'},
  {q:'Uma pessoa contando uma história num vídeo é fonte…',a:'Oral',x:'Visual'},
  {q:'A foto de um castelo é fonte…',a:'Visual',x:'Material'}]},
 {id:'historiador',titulo:'Pensar como historiador',cor:'#60a5fa',cartas:[
  {q:'As pistas do passado se chamam…',a:'Fontes históricas',x:'Linhas do tempo'},
  {q:'Para chegar mais perto da verdade, o historiador usa…',a:'Várias fontes',x:'Uma fonte só'},
  {q:'Olhando a mesma foto, as pessoas veem do mesmo jeito ou de jeitos diferentes?',a:'Jeitos diferentes',x:'Mesmo jeito'},
  {q:'Alunos, professores e funcionários têm memórias iguais ou diferentes da mesma escola?',a:'Diferentes',x:'Iguais'},
  {q:'Anúncios e propagandas de jornal foram feitos para…',a:'Vender',x:'Ensinar'},
  {q:'Quando não temos todas as informações sobre uma foto, fazemos…',a:'Suposições',x:'Certezas'}]},
 {id:'prof',titulo:'Profissões e tempo',cor:'#22d3ee',cartas:[
  {q:'O acendedor de lampião deixou de ser necessário com a chegada da…',a:'Energia elétrica',x:'Internet'},
  {q:'A profissão de carteiro acabou ou continua existindo?',a:'Continua',x:'Acabou'},
  {q:'Na história do Doutor João, o cuidado com o paciente mudou ou continuou igual?',a:'Continuou igual',x:'Mudou'},
  {q:'O relógio marca o tempo igual ou diferente para todos?',a:'Igual',x:'Diferente'},
  {q:'O relógio de areia se chama…',a:'Ampulheta',x:'Calendário'}]},
 {id:'mundo',titulo:'Povos antigos',cor:'#fb923c',cartas:[
  {q:'Quem viajava de um lugar para outro em busca de comida era…',a:'Nômade',x:'Agricultor'},
  {q:'Cultivar a terra se chama…',a:'Agricultura',x:'Caça'},
  {q:'O grande rio do Egito é o rio…',a:'Nilo',x:'Amarelo'},
  {q:'Os rios da Mesopotâmia são o Tigre e o…',a:'Eufrates',x:'Nilo'},
  {q:'O grande rio da China é o rio…',a:'Amarelo',x:'Nilo'}]}
];
</script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var palco=$('palco');
function pega(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function guarda(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var vistos={}; try{ vistos=JSON.parse(pega('his3_flash_vistos','{}'))||{}; }catch(e){ vistos={}; }
function emb(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function barra(p){ $('bar').style.width=Math.round(p*100)+'%'; }
var S=null;

window.inicio=function(){
  S=null; barra(0);
  var h='<div class="ini"><h1>Flashcards: História</h1><p>Leia a frase e toque na resposta certa.</p><div class="decks">';
  BARALHOS.forEach(function(d,i){
    h+='<button class="deck'+(vistos[d.id]?' feito':'')+'" data-d="'+i+'" style="--dc:'+d.cor+'"><b>'+esc(d.titulo)+'</b><i>'+(vistos[d.id]?'visto':d.cartas.length)+'</i></button>';
  });
  h+='</div><button class="todos" id="todos">Todas misturadas</button></div>';
  palco.innerHTML=h;
  palco.querySelectorAll('.deck').forEach(function(b){ b.onclick=function(){ abre([BARALHOS[+b.getAttribute('data-d')]]); }; });
  $('todos').onclick=function(){ abre(BARALHOS,true); };
};
function abre(lista,mistura){
  var cartas=[];
  lista.forEach(function(d){ d.cartas.forEach(function(c){ cartas.push({c:c,d:d,ops:emb([c.a,c.x])}); }); });
  S={lista:lista, cartas:emb(cartas), i:0, mistura:!!mistura};
  try{ history.pushState({his3:'carta'},''); }catch(e){}
  carta();
}
function carta(){
  var x=S.cartas[S.i], c=x.c, d=x.d, n=S.cartas.length;
  barra((S.i+1)/n);
  var tarja='<div class="tarja"><svg viewBox="0 0 24 24" fill="none" stroke="#1f1a12" stroke-width="2.6" stroke-linecap="round"><circle cx="10" cy="10" r="6.5" fill="rgba(255,255,255,.55)"/><path d="M15 15l6 6"/></svg>Detetives do Tempo · pista '+(S.i+1)+'</div>';
  palco.innerHTML='<div class="topo" style="--dc:'+d.cor+'"><button class="volta" id="volta">&#8249; Baralhos</button><b>'+esc(d.titulo)+'</b><span>'+(S.i+1)+' de '+n+'</span></div>'
   +'<div class="flip" style="--dc:'+d.cor+'"><div class="fc" id="fc">'
   +'<div class="face front">'+tarja+(c.f?'<img src="'+M+c.f+'" alt="">':'')+'<div class="q">'+esc(c.q)+'</div><div class="ops">'
   +x.ops.map(function(o,k){ return '<button class="op" data-k="'+k+'">'+esc(o)+'</button>'; }).join('')+'</div></div>'
   +'<div class="face back" id="bk"></div>'
   +'</div></div>'
   +'<div class="nav"><button id="ant">&#8249; Anterior</button><button class="forte" id="prox">'+(S.i===n-1?'Terminar':'Próxima &#8250;')+'</button></div>';
  var fc=$('fc');
  function mostra(esc_){
    var ok=esc_===c.a, bk=$('bk');
    bk.className='face back '+(ok?'ok':'err');
    bk.innerHTML=tarja+'<div class="qq">'+esc(c.q)+'</div><div class="ver">'+(ok?'Acertou!':'Errou')+'</div>'
      +'<div class="rot">'+(ok?'A resposta é':'A resposta certa é')+'</div><div class="a">'+esc(c.a)+'</div>'
      +(ok?'':'<div class="tua">Você tocou em <s>'+esc(esc_)+'</s></div>');
    fc.classList.add('on');
  }
  if(x.r!==undefined){ mostra(x.r); }
  fc.querySelectorAll('.op').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); if(x.r!==undefined) return; x.r=x.ops[+b.getAttribute('data-k')]; mostra(x.r); }; });
  $('volta').onclick=function(){ history.back(); };
  $('ant').disabled=S.i===0;
  $('ant').onclick=function(){ if(S.i>0){ S.i--; carta(); } };
  $('prox').onclick=avanca;
  /* deslizar para o lado tambem passa a carta */
  var x0=null, y0=null;
  fc.addEventListener('pointerdown',function(e){ x0=e.clientX; y0=e.clientY; });
  fc.addEventListener('pointerup',function(e){ if(x0===null) return; var dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){ e.stopPropagation(); fc.onclick=null; setTimeout(function(){ if(dx<0) avanca(); else if(S.i>0){ S.i--; carta(); } },0); } });
}
function avanca(){
  if(S.i<S.cartas.length-1){ S.i++; carta(); return; }
  S.lista.forEach(function(d){ vistos[d.id]=1; }); guarda('his3_flash_vistos',JSON.stringify(vistos));
  var ac=S.cartas.filter(function(y){ return y.r===y.c.a; }).length;
  palco.innerHTML='<div class="fim"><h2>Muito bem!</h2><p>Você acertou '+ac+' de '+S.cartas.length+'.</p>'
   +'<button class="forte" id="dn">Ver de novo, em outra ordem</button><button id="ob">Outro baralho</button></div>';
  var l=S.lista, m=S.mistura;
  $('dn').onclick=function(){ abre(l,m); };
  $('ob').onclick=function(){ history.back(); };
}
addEventListener('keydown',function(e){
  if(!S||!$('fc')) return;
  if(e.key==='ArrowRight') avanca();
  if(e.key==='ArrowLeft'&&S.i>0){ S.i--; carta(); }
});
addEventListener('popstate',function(){ if(S) inicio(); });
inicio();
})();
</script>
