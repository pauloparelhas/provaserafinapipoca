/* HIS3_flashcards (24/11/2026, pedido do Paulo): frente = pergunta curta (com foto da aula quando ajuda),
   verso = resposta curta e inequivoca. Toque vira a carta; sem "acertei/errei" (deixa lento). Fonte: _roteiro.md. */
html,body{height:100%;overflow:hidden}
button{touch-action:manipulation}
.app{height:100vh;height:100dvh;min-height:0}
.palco{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:10px;max-width:640px;width:100%;margin:0 auto}
/* ---- baralhos ---- */
.ini{margin:auto 0;width:100%;display:flex;flex-direction:column;gap:9px;max-height:100%;overflow:auto;padding:2px}
.ini h1{font-size:calc(1.2rem*var(--fs));font-weight:900;text-align:center;color:var(--accent)}
.ini p{font-size:calc(.86rem*var(--fs));font-weight:800;color:var(--soft);text-align:center}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:420px){.decks{grid-template-columns:1fr}}
.deck{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px;border:2px solid var(--line);border-radius:15px;color:var(--ink);font-family:inherit;cursor:pointer;text-align:left;
  background:linear-gradient(150deg,color-mix(in srgb,var(--dc) 22%,var(--card)),var(--card))}
.deck:active{transform:scale(.97)}
.deck b{flex:1;font-size:calc(.98rem*var(--fs));font-weight:900;line-height:1.15}
.deck i{font-style:normal;font-size:calc(.74rem*var(--fs));font-weight:900;border-radius:12px;padding:3px 9px;border:1.5px solid var(--dc)}
.deck.feito i{background:var(--ok);border-color:var(--ok);color:#06281a}
.todos{min-height:52px;border:none;border-radius:15px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#241500;font-family:inherit;font-weight:900;font-size:calc(1rem*var(--fs));cursor:pointer}
/* ---- carta ---- */
.topo{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.topo b{flex:1;min-width:0;font-weight:900;font-size:calc(.92rem*var(--fs));color:var(--dc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo span{font-weight:900;font-size:calc(.8rem*var(--fs));color:var(--soft);background:var(--line);border-radius:12px;padding:4px 10px;white-space:nowrap}
.flip{flex:1;min-height:0;perspective:1400px}
.fc{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.fc.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:16px;border-radius:22px;border:3px solid var(--dc);background:linear-gradient(140deg,var(--card),color-mix(in srgb,var(--dc) 10%,var(--card)));box-shadow:0 14px 34px rgba(0,0,0,.32);overflow:hidden}
.face img{max-width:100%;max-height:44%;min-height:0;object-fit:contain;border-radius:12px;background:#fff;flex:0 1 auto}
.face .q{font-weight:900;font-size:calc(clamp(1.15rem,3.2vmin + .6rem,1.6rem)*var(--fs));line-height:1.25}
.back{transform:rotateY(180deg);border-color:var(--ok);background:linear-gradient(140deg,color-mix(in srgb,var(--ok) 16%,var(--card)),var(--card))}
.back .a{font-weight:900;font-size:calc(clamp(1.4rem,4.2vmin + .7rem,2.1rem)*var(--fs));line-height:1.2;color:var(--ink)}
.back .qq{font-weight:800;font-size:calc(.85rem*var(--fs));color:var(--soft);line-height:1.25}
.vira{font-weight:900;font-size:calc(.78rem*var(--fs));color:var(--accent);border:2px dashed var(--accent);border-radius:18px;padding:5px 13px;animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:.75}50%{opacity:1}}
.fala{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-size:1.1rem;cursor:pointer}
.nav{flex:0 0 auto;display:flex;gap:10px}
.nav button{flex:1;min-height:52px;border-radius:15px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:calc(.98rem*var(--fs));cursor:pointer}
.nav button.forte{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 34%,transparent),rgba(251,191,36,.18))}
.nav button[disabled]{opacity:.4;cursor:default}
/* ---- fim ---- */
.fim{margin:auto;width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.fim h2{font-size:calc(1.3rem*var(--fs));font-weight:900;color:var(--accent)}
.fim p{font-weight:800;color:var(--soft)}
.fim button{min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer}
.fim button.forte{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 34%,transparent),rgba(251,191,36,.18))}
@media (max-width:430px){.topbar{gap:3px;padding:6px}.topbar .title{display:none}}
@media (max-height:500px){.face{flex-direction:row;gap:16px}.face img{max-height:80%;max-width:42%}.face .tx{display:flex;flex-direction:column;gap:8px;align-items:center}.nav button{min-height:46px}.palco{gap:6px;padding-top:6px}}
</style>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var palco=$('palco');
function pega(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function guarda(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var vistos={}; try{ vistos=JSON.parse(pega('his3_flash_vistos','{}'))||{}; }catch(e){ vistos={}; }
function emb(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function barra(p){ $('bar').style.width=Math.round(p*100)+'%'; }
function fala(t){ if(window.say) say(t); }
var S=null;

window.inicio=function(){
  S=null; barra(0);
  var h='<div class="ini"><h1>Flashcards: História</h1><p>Leia a pergunta, pense na resposta e toque na carta para ver.</p><div class="decks">';
  BARALHOS.forEach(function(d,i){
    h+='<button class="deck'+(vistos[d.id]?' feito':'')+'" data-d="'+i+'" style="--dc:'+d.cor+'"><b>'+esc(d.titulo)+'</b><i>'+(vistos[d.id]?'visto':d.cartas.length)+'</i></button>';
  });
  h+='</div><button class="todos" id="todos">Todas misturadas</button></div>';
  palco.innerHTML=h;
  palco.querySelectorAll('.deck').forEach(function(b){ b.onclick=function(){ abre([BARALHOS[+b.getAttribute('data-d')]]); }; });
  $('todos').onclick=function(){ abre(BARALHOS,true); };
};
function abre(lista,mistura){
  var cartas=[];
  lista.forEach(function(d){ d.cartas.forEach(function(c){ cartas.push({c:c,d:d}); }); });
  S={lista:lista, cartas:emb(cartas), i:0, mistura:!!mistura};
  carta();
}
function carta(){
  var x=S.cartas[S.i], c=x.c, d=x.d, n=S.cartas.length;
  barra((S.i+1)/n);
  palco.innerHTML='<div class="topo" style="--dc:'+d.cor+'"><b>'+esc(d.titulo)+'</b><span>'+(S.i+1)+' de '+n+'</span></div>'
   +'<div class="flip" style="--dc:'+d.cor+'"><div class="fc" id="fc">'
   +'<div class="face front">'+(c.f?'<img src="'+M+c.f+'" alt="">':'')+'<div class="tx"><div class="q">'+esc(c.q)+'</div><div class="vira">Toque para virar</div></div><button class="fala" id="f1" title="Ouvir">&#128266;</button></div>'
   +'<div class="face back"><div class="tx"><div class="qq">'+esc(c.q)+'</div><div class="a">'+esc(c.a)+'</div></div><button class="fala" id="f2" title="Ouvir">&#128266;</button></div>'
   +'</div></div>'
   +'<div class="nav"><button id="ant">&#8249; Anterior</button><button class="forte" id="prox">'+(S.i===n-1?'Terminar':'Próxima &#8250;')+'</button></div>';
  var fc=$('fc');
  fc.onclick=function(e){ if(e.target.closest('.fala')) return; fc.classList.toggle('on'); if(fc.classList.contains('on')) fala(c.a); };
  $('f1').onclick=function(){ fala(c.q); };
  $('f2').onclick=function(){ fala(c.a); };
  $('ant').disabled=S.i===0;
  $('ant').onclick=function(){ if(S.i>0){ S.i--; carta(); } };
  $('prox').onclick=avanca;
  /* deslizar para o lado tambem passa a carta */
  var x0=null, y0=null;
  fc.addEventListener('pointerdown',function(e){ x0=e.clientX; y0=e.clientY; });
  fc.addEventListener('pointerup',function(e){ if(x0===null) return; var dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){ e.stopPropagation(); fc.onclick=null; setTimeout(function(){ if(dx<0) avanca(); else if(S.i>0){ S.i--; carta(); } },0); } });
}
function avanca(){
  if(S.i<S.cartas.length-1){ S.i++; carta(); return; }
  S.lista.forEach(function(d){ vistos[d.id]=1; }); guarda('his3_flash_vistos',JSON.stringify(vistos));
  palco.innerHTML='<div class="fim"><h2>Muito bem!</h2><p>Você viu as '+S.cartas.length+' cartas.</p>'
   +'<button class="forte" id="dn">Ver de novo, em outra ordem</button><button id="ob">Outro baralho</button></div>';
  var l=S.lista, m=S.mistura;
  $('dn').onclick=function(){ abre(l,m); };
  $('ob').onclick=inicio;
}
addEventListener('keydown',function(e){
  if(!S||!$('fc')) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); $('fc').classList.toggle('on'); }
  if(e.key==='ArrowRight') avanca();
  if(e.key==='ArrowLeft'&&S.i>0){ S.i--; carta(); }
});
inicio();
})();
</script>
