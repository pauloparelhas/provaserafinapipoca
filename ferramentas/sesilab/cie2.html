/* ---- home hero: 3 personagens (solido/liquido/gas) em canvas ---- */
function heroStates(cv,S){
  const ctx=cv.getContext('2d');
  function size(){cv.width=cv.clientWidth||900;cv.height=cv.clientHeight||300;}
  size();
  let t=0;
  function blob(x,y,r,col,face){
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();
    ctx.fillStyle='#0d0b1e';ctx.beginPath();ctx.arc(x-r*0.32,y-r*0.1,r*0.11,0,6.28);ctx.arc(x+r*0.32,y-r*0.1,r*0.11,0,6.28);ctx.fill();
    ctx.strokeStyle='#0d0b1e';ctx.lineWidth=r*0.06;ctx.beginPath();ctx.arc(x,y+r*0.12,r*0.34,0.15,Math.PI-0.15);ctx.stroke();
  }
  (function loop(){
    if(!cv.isConnected)return;
    ctx.clearRect(0,0,cv.width,cv.height);
    const W=cv.width,H=cv.height,cy=H*0.52;t+=0.03;
    blob(W*0.28,cy+Math.sin(t)*3,Math.min(46,H*0.20),'#ff9a5b');       // solid
    blob(W*0.5, cy+Math.sin(t+1)*6,Math.min(46,H*0.20),'#4fd1ff');     // liquid
    blob(W*0.72,cy+Math.sin(t+2)*10,Math.min(46,H*0.20),'#b58cff');    // gas
    ctx.fillStyle='#cfe0f5';ctx.font='bold 13px Nunito,sans-serif';ctx.textAlign='center';
    ctx.fillText('SOLID',W*0.28,cy+H*0.28);ctx.fillText('LIQUID',W*0.5,cy+H*0.28);ctx.fillText('GAS',W*0.72,cy+H*0.28);
    ctx.textAlign='left';
    requestAnimationFrame(loop);
  })();
}

/* ===== m2 · PARTICLES (sim caixa de particulas) ===== */
function stateFromHeat(h){return h<34?'SOLID':h<67?'LIQUID':'GAS';}
M.push({ id:'m2', nav:'2 · Particles', icon:'🔬', crumb:'Module 2', title:'Particles — the WHY', blocks:[
  {type:'callout', tone:'green', icon:'🔬', label:'Big idea '+say('The more heat, the more the particles move'),
   html:'The particles are the <b>why</b>. Heat them: <b>more heat → particles move more → solid becomes liquid becomes gas</b>. '+pt('Mais calor → partículas se movem mais → sólido vira líquido vira gás.')},
  {type:'sim', title:'Heat the particles', icon:'🔥', tag:'move the slider', height:300, animate:true, w:640,
   controls:[{id:'heat',label:'Heat 🔥',min:0,max:100,value:10,step:1,unit:'°'}],
   draw:(ctx,cv,P)=>{
     const w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
     ctx.fillStyle='#0d1830';ctx.fillRect(0,0,w,h);
     const bx=w*0.14,by=h*0.14,bw=w*0.72,bh=h*0.74;
     ctx.strokeStyle='#4fd1ff';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
     const st=stateFromHeat(P.heat),t=P._t||0,n=28,cols=7,rows=4;
     for(let i=0;i<n;i++){
       let x,y;
       if(st==='SOLID'){const cx=i%cols,cy=Math.floor(i/cols);
         x=bx+bw*0.16+cx*(bw*0.68/(cols-1))+Math.sin(t*4+i)*2;
         y=by+bh*0.30+cy*(bh*0.5/(rows-1))+Math.cos(t*4+i)*2;
       }else if(st==='LIQUID'){
         x=bx+bw*0.08+((i*53%100)/100)*bw*0.84+Math.sin(t*1.6+i)*9;
         y=by+bh*0.48+((i*29%100)/100)*bh*0.46+Math.cos(t*1.3+i)*7;
       }else{
         x=bx+bw*0.05+((i*53%100)/100)*bw*0.9+Math.sin(t*3+i)*22;
         y=by+bh*0.05+((i*97%100)/100)*bh*0.9+Math.cos(t*3.4+i)*22;
       }
       x=Math.max(bx+6,Math.min(bx+bw-6,x));y=Math.max(by+6,Math.min(by+bh-6,y));
       ctx.fillStyle=st==='SOLID'?'#ff9a5b':st==='LIQUID'?'#4fd1ff':'#b58cff';
       ctx.beginPath();ctx.arc(x,y,6,0,6.28);ctx.fill();
     }
     ctx.fillStyle='#ffce5a';ctx.font='bold 20px Nunito,sans-serif';ctx.fillText(st,bx,by-8);
   },
   readout:(P)=>{const st=stateFromHeat(P.heat);return '<b>'+st+'</b> — '+(st==='SOLID'?'particles packed and just vibrate':st==='LIQUID'?'particles slide around each other':'particles fly free, far apart');},
   insight:()=>'Same particles, different movement. Heat is the key! '+pt('Mesmas partículas, movimento diferente. O calor é a chave!')},
]});

/* ===== m5 · VISCOSITY RACE — FECHA A Q6 ===== */
M.push({ id:'m5', nav:'5 · Viscosity', icon:'🍯', crumb:'Module 5 · exam Q6', title:'Viscosity race', blocks:[
  {type:'callout', tone:'blue', icon:'🍯', label:'Viscosity '+say('Viscosity is a liquid resistance to flow'),
   html:'<b>Viscosity</b> is a liquid’s <b>resistance to flow</b>. Thick liquids (high viscosity) flow <b>slowly</b>. Thin liquids (low viscosity) flow <b>fast</b>. '+pt('Viscosidade é a resistência do líquido a fluir.')},
  {type:'predict', title:'Predict the winner', icon:'🏁',
   prompt:'We pour water, oil and honey. Which reaches the bottom <b>first</b>? '+pt('Qual chega ao fundo primeiro?'),
   options:[{label:'Water 💧 (thin)',correct:true},{label:'Oil 🛢️',correct:false},{label:'Honey 🍯 (thick)',correct:false}],
   reveal:'Water is thinnest → it wins! Order: <b>1º water, 2º oil, 3º honey</b>. '+pt('Ordem: 1º água, 2º óleo, 3º mel.')},
  {type:'sim', title:'Watch the race', icon:'🏁', tag:'press restart', height:320, animate:true, w:640,
   controls:[],
   draw:(ctx,cv,P)=>{
     const w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0d1830';ctx.fillRect(0,0,w,h);
     const lanes=[{n:'Water',c:'#4fd1ff',s:0.9},{n:'Oil',c:'#ffce5a',s:0.5},{n:'Honey',c:'#ff9a5b',s:0.28}];
     const top=h*0.16,bot=h*0.86,t=P._t||0;
     lanes.forEach((L,i)=>{
       const x=w*(0.26+i*0.24);
       ctx.strokeStyle='rgba(127,224,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bot);ctx.stroke();
       ctx.fillStyle='#cfe0f5';ctx.font='bold 13px Nunito,sans-serif';ctx.textAlign='center';ctx.fillText(L.n,x,top-8);
       const prog=Math.min(1,t*L.s*0.4);
       const y=top+prog*(bot-top);
       ctx.fillStyle=L.c;ctx.beginPath();ctx.moveTo(x,y-9);ctx.quadraticCurveTo(x+9,y+3,x,y+9);ctx.quadraticCurveTo(x-9,y+3,x,y-9);ctx.fill();
       if(prog>=1){ctx.fillStyle=L.c;ctx.font='16px Nunito';ctx.fillText('✓',x,bot+16);}
     });
     ctx.textAlign='left';ctx.fillStyle='#5fe39b';ctx.font='12px Nunito,sans-serif';ctx.fillText('bottom '+String.fromCharCode(8595),w*0.02,bot);
   },
   readout:()=>'Water reaches first, then oil, then honey. '+pt('Água primeiro, depois óleo, depois mel.'),
   insight:()=>'Thin = low viscosity = fast. Thick = high viscosity = slow. '+pt('Fino=rápido, grosso=devagar.')},
]});

  }catch(e){}
  /* botao bandeira BR (liga PT) no topbar */
  const FLAG='<svg viewBox="0 0 28 20"><rect width="28" height="20" rx="2" fill="#2e9e42"/><path d="M14 3l10 7-10 7L4 10z" fill="#ffd21e"/><circle cx="14" cy="10" r="4" fill="#2b3f8c"/></svg>';
  const zc=document.querySelector('#topbar .zoomctl');
  if(zc){
    const fb=document.createElement('button');
    fb.id='flagBtn';fb.title='Português / English';fb.innerHTML=FLAG;
    fb.onclick=()=>{document.body.classList.toggle('show-tr');fb.classList.toggle('on',document.body.classList.contains('show-tr'));};
    zc.insertBefore(fb, zc.firstChild);
  }
  /* TTS en-US ao tocar em .say (delegado — sobrevive a re-render) */
  document.addEventListener('click',e=>{
    const btn=e.target.closest('.say'); if(!btn)return;
    e.preventDefault();e.stopPropagation();
    const txt=btn.getAttribute('data-say'); if(!txt||!window.speechSynthesis)return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=0.85;speechSynthesis.speak(u);}catch(err){}
  }, true);
})();
</script>
</body></html>
