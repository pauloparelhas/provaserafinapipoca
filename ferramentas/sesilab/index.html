<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serafina Lab</title>
<link rel="stylesheet" href="assets/sesilab.css?v=cie2a">
<style>
:root{ --bg:#0d0b1e; }
body{ background:radial-gradient(1200px 700px at 70% -10%, #241a52 0%, #0d0b1e 55%); color:var(--txt,#eaf1ff);
  font-family:Nunito,'Segoe UI',system-ui,sans-serif; margin:0; min-height:100vh; }
.wrap{ max-width:760px; margin:0 auto; padding:42px 20px 60px; }
.brand{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.brand .logo{ width:44px; height:44px; }
h1{ font-size:30px; margin:0; }
.sub{ color:var(--txt-dim,#9fb0d0); margin:4px 0 28px; font-size:15px; }
.labgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
a.lab{ display:block; text-decoration:none; color:inherit; background:var(--card,#141a33);
  border:1px solid var(--stroke2,#2a3b63); border-radius:16px; padding:20px; transition:.2s; }
a.lab:hover{ transform:translateY(-4px); border-color:var(--accent,#4fd1ff); }
a.lab .ic{ font-size:34px; }
a.lab h3{ margin:8px 0 6px; font-size:18px; }
a.lab p{ margin:0; font-size:13px; color:var(--txt-dim,#9fb0d0); line-height:1.55; }
a.lab .go{ margin-top:12px; font-size:13px; color:var(--accent,#4fd1ff); font-weight:700; }
</style>
</head><body>
<div class="wrap">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M9 3v5l-5 9a2 2 0 002 3h12a2 2 0 002-3l-5-9V3" stroke="#7fe0ff" stroke-width="1.6" stroke-linecap="round"/><circle cx="10.5" cy="15" r="1" fill="#b58cff"/><circle cx="13.5" cy="17.5" r="1.3" fill="#5fe39b"/></svg></div>
    <div><h1>Serafina Lab</h1></div>
  </div>
  <p class="sub">Interactive science labs · Y2 Maple Bear · tap 🔊 to listen, tap 🇧🇷 for Portuguese</p>
  <div class="labgrid">
    <a class="lab" href="cie2.html">
      <div class="ic">🧊💧☁️</div>
      <h3>Properties of Matter</h3>
      <p>Solids, liquids, gases · particles · which state(s)? · light · absorb/repel. Science 2nd trimester.</p>
      <div class="go">Enter the lab ›</div>
    </a>
  </div>
</div>
</body></html>
