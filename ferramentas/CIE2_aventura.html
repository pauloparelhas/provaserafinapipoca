<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Matter Quest — Adventure</title>
<link rel="stylesheet" href="serafina-core.css">
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#1b1440;--ink:#f0f9ff;--soft:rgba(255,255,255,.55);--card:#161233;--line:rgba(255,255,255,.12);--accent:#38bdf8;--accent2:#fbbf24;--tr:#fcd34d;--rad:20px}
body.light{--bg:#e0f2fe;--bg2:#ede9fe;--ink:#0c1e33;--soft:rgba(0,0,0,.5);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.95rem*var(--fs));color:var(--accent);flex:1;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;padding:0 8px}
.iconbtn:active{transform:scale(.9)}
.flagbtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.4;filter:grayscale(1)}
.flagbtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .flagbtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.wrap{flex:1;width:100%;max-width:560px;margin:0 auto;padding:14px 12px 40px}
.tr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.82em}
body.show-tr .tr{display:block}

/* ===== mapa (trilha) ===== */
.adv-map{padding:4px 0}
.adv-maptitle{text-align:center;font-weight:900;font-size:calc(1.25rem*var(--fs));margin:6px 0 16px;text-shadow:0 4px 14px rgba(0,0,0,.4)}
.adv-trail{display:flex;flex-direction:column;gap:14px;position:relative;padding:4px 0}
.adv-trail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);border-radius:4px;background:linear-gradient(180deg,rgba(56,189,248,.5),rgba(244,114,182,.5));opacity:.35}
.adv-node-row{display:flex;position:relative;z-index:1}
.adv-node-row.left{justify-content:flex-start}
.adv-node-row.right{justify-content:flex-end}
.adv-node{display:flex;flex-direction:column;align-items:center;gap:4px;width:74%;min-height:76px;padding:10px 12px;border-radius:22px;border:2px solid var(--pc);cursor:pointer;font-family:inherit;color:var(--ink);background:linear-gradient(135deg,var(--card),rgba(255,255,255,.04));box-shadow:0 10px 26px rgba(0,0,0,.3)}
.adv-node.open{animation:advPulse 2.2s infinite}
.adv-node.done{opacity:.92;border-style:solid}
.adv-node.locked{opacity:.42;border-color:var(--line);cursor:default;filter:grayscale(.6)}
.adv-node.boss{background:linear-gradient(135deg,#3b1030,var(--card));border-width:3px}
@keyframes advPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.adv-nicon{font-size:1.9rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.adv-nname{font-weight:900;font-size:calc(.95rem*var(--fs));text-align:center;line-height:1.15}
.adv-nstars{font-size:.85rem;letter-spacing:1px}
.adv-starghost{opacity:.4}
.adv-redo{font-size:.68rem;font-weight:800;color:var(--soft)}

/* ===== lição ===== */
.adv-lesson{display:flex;flex-direction:column;gap:12px}
.adv-lesson.boss{align-items:center;text-align:center}
.adv-lhead{display:flex;align-items:center;gap:10px;margin-top:2px}
.adv-licon{font-size:2.1rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.adv-ltitle{font-weight:900;font-size:calc(1.15rem*var(--fs))}
.adv-ltitle.center{text-align:center}
.adv-lcard{background:linear-gradient(135deg,var(--card),rgba(255,255,255,.05));border:2px solid var(--pc);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.adv-lline{display:flex;align-items:flex-start;gap:9px;font-weight:800;font-size:calc(1rem*var(--fs));line-height:1.35}
.adv-lline.small{font-size:calc(.88rem*var(--fs))}
.adv-lline.center{justify-content:center}
.adv-lemo{font-size:1.4rem;flex-shrink:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.adv-listen{min-height:46px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:.9rem;border-radius:18px;padding:6px 16px;cursor:pointer;font-family:inherit}
.adv-listen:active{transform:scale(.96)}
.adv-go{min-height:54px;border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:calc(1.02rem*var(--fs));cursor:pointer;padding:8px 22px;background:linear-gradient(90deg,#34d399,#10b981);color:#04261c;box-shadow:0 10px 24px rgba(16,185,129,.35)}
.adv-go:active{transform:scale(.96)}
.adv-go.ghost{background:var(--line);color:var(--ink);box-shadow:none}
.adv-mapbtn{align-self:flex-start;min-height:44px;border:2px solid var(--line);background:transparent;color:var(--soft);font-weight:800;font-size:.82rem;border-radius:15px;padding:6px 14px;cursor:pointer;font-family:inherit}

/* ===== desafio ===== */
.adv-ch{display:flex;flex-direction:column;gap:12px}
.adv-prog{font-weight:900;color:var(--soft);font-size:.85rem}
.adv-q{font-weight:900;font-size:calc(1.12rem*var(--fs));line-height:1.3;background:linear-gradient(135deg,var(--card),rgba(255,255,255,.05));border:2px solid var(--pc);border-radius:var(--rad);padding:14px}
.adv-hint{font-weight:800;color:var(--accent2);font-size:calc(.9rem*var(--fs))}
.adv-opts{display:flex;flex-direction:column;gap:10px}
.adv-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(135deg,var(--card),rgba(255,255,255,.03));color:var(--ink);font-family:inherit;font-weight:800;font-size:calc(1rem*var(--fs));cursor:pointer;text-align:left;line-height:1.3}
.adv-opt:active{transform:scale(.98)}
.adv-opt.sel{border-color:var(--accent);background:rgba(56,189,248,.14)}
.adv-opt.good{border-color:#34d399;background:rgba(52,211,153,.16)}
.adv-opt.bad{border-color:#f87171;background:rgba(248,113,113,.14);animation:advShake .4s}
@keyframes advShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.adv-otxt{flex:1}
.adv-say{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(56,189,248,.12);color:var(--accent);font-size:1rem;cursor:pointer;flex-shrink:0;vertical-align:middle}
.adv-check{min-height:54px;border:none;border-radius:18px;font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer;background:linear-gradient(90deg,#38bdf8,#818cf8);color:#04141f}
.adv-check:disabled{opacity:.5}
.adv-sortitem{font-weight:900;font-size:calc(1.2rem*var(--fs));text-align:center;background:linear-gradient(135deg,var(--card),rgba(255,255,255,.06));border:2px dashed var(--pc);border-radius:var(--rad);padding:16px}
.adv-sortsub{text-align:center;color:var(--soft);font-weight:800;font-size:.8rem}
.adv-buckets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.adv-bucket{flex:1;min-width:100px;min-height:56px;border-radius:16px;border:2px solid var(--bc);background:linear-gradient(135deg,var(--card),rgba(255,255,255,.04));color:var(--ink);font-family:inherit;font-weight:900;font-size:calc(.95rem*var(--fs));cursor:pointer;padding:8px;overflow-wrap:anywhere}
.adv-bucket.good{background:rgba(52,211,153,.2);border-color:#34d399}
.adv-bucket.bad{background:rgba(248,113,113,.16);border-color:#f87171;animation:advShake .4s}
.adv-feed{margin-top:2px;display:flex;flex-direction:column;gap:10px}
.adv-feed>.adv-go{width:100%}
.adv-good{font-weight:900;font-size:1.15rem;color:#34d399;text-align:center;animation:advPop .4s}
@keyframes advPop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.adv-bad{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.4);border-radius:var(--rad);padding:12px;display:flex;flex-direction:column;gap:10px}
.adv-badt{font-weight:900;font-size:calc(.95rem*var(--fs))}
.adv-truth{font-weight:900;color:#34d399;font-size:calc(1.05rem*var(--fs));background:rgba(52,211,153,.1);border-radius:12px;padding:10px}
.adv-reteach{border-left:3px solid var(--accent2);padding:6px 0 6px 10px;display:flex;flex-direction:column;gap:6px}
.adv-rtt{font-weight:900;color:var(--accent2)}

/* ===== fase concluída / celebração ===== */
.adv-done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:16px}
.adv-bigicon{font-size:3.4rem;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));animation:advFloat 2.6s ease-in-out infinite}
@keyframes advFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.adv-donet{font-weight:900;font-size:calc(1.3rem*var(--fs))}
.adv-starrow{font-size:1.7rem;letter-spacing:3px}
.adv-anchor{border:2px solid var(--accent2);background:rgba(251,191,36,.1);color:var(--ink);border-radius:16px;padding:12px 14px;font-family:inherit;font-weight:800;font-size:calc(.95rem*var(--fs));cursor:pointer;line-height:1.35}
.adv-donebtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:6px}
.adv-celeb{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:10px}
.adv-celebtitle{font-weight:900;font-size:calc(1.5rem*var(--fs));text-shadow:0 4px 16px rgba(251,191,36,.4)}
.adv-badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.adv-badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:92px;min-height:88px;padding:10px 6px;border-radius:18px;border:2px solid var(--pc);background:linear-gradient(135deg,var(--card),rgba(255,255,255,.05));opacity:.18;transform:scale(.85);transition:all .45s;cursor:pointer}
.adv-badge.in{opacity:1;transform:scale(1)}
.adv-badge.now{opacity:1;transform:scale(1.08);box-shadow:0 0 24px rgba(251,191,36,.35)}
.adv-bicon{font-size:1.8rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.adv-bname{font-weight:900;font-size:.68rem;line-height:1.1}
.adv-karaoke{min-height:0;max-width:100%;opacity:0;transition:opacity .3s}
.adv-karaoke.show{opacity:1}
.adv-karwords{font-weight:900;font-size:calc(1.05rem*var(--fs));line-height:1.6;background:var(--card);border:2px solid var(--accent2);border-radius:16px;padding:12px 14px}
.adv-karwords span{padding:1px 3px;border-radius:6px}
.adv-karwords span.hot{background:var(--accent2);color:#241a00}
.adv-karwords span.don{color:var(--accent2)}
.adv-karpt{margin-top:6px}
.adv-confetti{position:fixed;top:-14px;width:10px;height:14px;border-radius:3px;z-index:80;pointer-events:none}

/* ===== sim de partículas (lição fase 2) ===== */
.psim{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:4px}
.psim canvas{width:100%;max-width:340px;border-radius:14px;background:#0d1830}
.pslider{display:flex;align-items:center;gap:10px;font-size:1.3rem;width:100%;max-width:340px}
.pslider input{flex:1;accent-color:#fb923c;height:34px}
.pstate{font-weight:900;font-size:calc(1rem*var(--fs));color:var(--accent2)}
@media(min-width:480px){ .adv-opts{gap:12px} .adv-node{width:64%} }
</style>
</head>

<canvas id="starfield"></canvas>
<div class="app">

<script>window.SERA_CFG={trKey:'cie2_tr',stars:140};</script>
<script src="serafina-core.js"></script>
<script src="serafina-adventure.js"></script>
<script>
/* ============================================================
   MATTER QUEST — dados da aventura (Ciências 2tri)
   Conteúdo 100% derivado de trabalho/2tri_ciencias/_roteiro.md
   (blocos 1, 1c, 2, 3, 3b, 4, 5). Viscosidade NÃO entra (fora do
   insumo = conta de chegada, ver roteiro 3c).
   ============================================================ */

/* --- sim de partículas (lição da fase 2, portada do sesilab) --- */
function particlesSim(box){
  box.innerHTML='<div class="psim">'
   +'<canvas id="pcv" width="340" height="210"></canvas>'
   +'<label class="pslider">🧊<input type="range" id="pheat" min="0" max="100" value="10" aria-label="Heat">🔥</label>'
   +'<div class="pstate" id="pstate"></div></div>';
  var cv=document.getElementById('pcv'),ctx=cv.getContext('2d');
  var heat=10,t=0;
  document.getElementById('pheat').addEventListener('input',function(){heat=+this.value;});
  function st(){return heat<34?'SOLID':heat<67?'LIQUID':'GAS';}
  (function loop(){
    if(!cv.isConnected)return;
    t+=0.03;
    var w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#0d1830';ctx.fillRect(0,0,w,h);
    var bx=w*0.1,by=h*0.16,bw=w*0.8,bh=h*0.72;
    ctx.strokeStyle='#4fd1ff';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
    var s=st(),n=24,cols=6,rows=4,x,y;
    for(var i=0;i<n;i++){
      if(s==='SOLID'){var cx=i%cols,cy=Math.floor(i/cols);
        x=bx+bw*0.16+cx*(bw*0.68/(cols-1))+Math.sin(t*4+i)*2;
        y=by+bh*0.3+cy*(bh*0.5/(rows-1))+Math.cos(t*4+i)*2;
      }else if(s==='LIQUID'){
        x=bx+bw*0.08+((i*53%100)/100)*bw*0.84+Math.sin(t*1.6+i)*9;
        y=by+bh*0.48+((i*29%100)/100)*bh*0.46+Math.cos(t*1.3+i)*7;
      }else{
        x=bx+bw*0.05+((i*53%100)/100)*bw*0.9+Math.sin(t*3+i)*20;
        y=by+bh*0.05+((i*97%100)/100)*bh*0.9+Math.cos(t*3.4+i)*20;
      }
      x=Math.max(bx+6,Math.min(bx+bw-6,x));y=Math.max(by+6,Math.min(by+bh-6,y));
      ctx.fillStyle=s==='SOLID'?'#ff9a5b':s==='LIQUID'?'#4fd1ff':'#b58cff';
      ctx.beginPath();ctx.arc(x,y,6,0,6.28);ctx.fill();
    }
    ctx.fillStyle='#ffce5a';ctx.font='bold 18px Nunito,sans-serif';ctx.fillText(s,bx,by-6);
    var ps=document.getElementById('pstate');
    if(ps)ps.textContent=s==='SOLID'?'Packed tight — they just vibrate!':s==='LIQUID'?'Close — they slide around!':'Far apart — they fly!';
    requestAnimationFrame(loop);
  })();
}

/* --- opções-estado reutilizadas --- */
function ST(ok){return [
  {en:'Solid 🧊',pt:'Sólido',ok:ok==='s'},
  {en:'Liquid 💧',pt:'Líquido',ok:ok==='l'},
  {en:'Gas 💨',pt:'Gás',ok:ok==='g'}];}

var ADVENTURE={
 storageKey:'cie2_adv',
 title:'Matter Quest', titlePt:'A Missão da Matéria', hero:'🧪',
 phases:[

 /* ===== FASE 1 — os três estados ===== */
 { id:'f1', icon:'🧊', color:'#38bdf8', name:'The three states', namePt:'Os três estados',
   anchor:'Matter has three states: solid, liquid and gas.',
   anchorPt:'A matéria tem três estados: sólido, líquido e gás.',
   lesson:{lines:[
    ['🌟','Everything around us is matter. Matter has three states.','Tudo à nossa volta é matéria. A matéria tem três estados.'],
    ['🧊','SOLID keeps its shape and does not flow.','O SÓLIDO mantém a forma e não flui.'],
    ['💧','LIQUID flows and takes the shape of its container.','O LÍQUIDO flui e toma a forma do recipiente.'],
    ['💨','GAS spreads out and can be squeezed.','O GÁS se espalha e pode ser comprimido.'],
   ]},
   pick:3,
   bank:[
    {t:'mc',q:'Which state keeps its own shape?',qpt:'Qual estado mantém a própria forma?',opts:ST('s')},
    {t:'mc',q:'Which state takes the shape of its container?',qpt:'Qual estado toma a forma do recipiente?',opts:ST('l')},
    {t:'mc',q:'Which state spreads out to fill the space?',qpt:'Qual estado se espalha para preencher o espaço?',opts:ST('g')},
    {t:'mc',q:'Is ice a solid, a liquid or a gas?',qpt:'O gelo é sólido, líquido ou gás?',opts:ST('s')},
    {t:'mc',q:'Is milk a solid, a liquid or a gas?',qpt:'O leite é sólido, líquido ou gás?',opts:ST('l')},
    {t:'mc',q:'You can squeeze the air in a balloon because a gas can be…',qpt:'Dá para apertar o ar do balão porque o gás pode ser…',opts:[
      {en:'squeezed (compressed) 💨',pt:'comprimido',ok:true},
      {en:'poured like a liquid 💧',pt:'derramado como líquido',ok:false},
      {en:'kept in a fixed shape 🧊',pt:'mantido numa forma fixa',ok:false}]},
    {t:'sort',q:'Solid, liquid or gas? Tap the right box!',qpt:'Sólido, líquido ou gás? Toque na caixa certa!',
     buckets:[{id:'s',en:'Solid 🧊',pt:'Sólido',color:'#ff9a5b'},{id:'l',en:'Liquid 💧',pt:'Líquido',color:'#4fd1ff'},{id:'g',en:'Gas 💨',pt:'Gás',color:'#b58cff'}],
     pick:4,
     items:[
      {en:'Ice',pt:'gelo',b:'s'},{en:'Pencil',pt:'lápis',b:'s'},{en:'Apple',pt:'maçã',b:'s'},{en:'Rock',pt:'pedra',b:'s'},
      {en:'Rain',pt:'chuva',b:'l'},{en:'Tea',pt:'chá',b:'l'},{en:'Milk',pt:'leite',b:'l'},
      {en:'Steam',pt:'vapor',b:'g'},{en:'Clouds',pt:'nuvens',b:'g'},{en:'The air around us',pt:'o ar à nossa volta',b:'g'}]},
   ]},

 /* ===== FASE 2 — partículas (o porquê) ===== */
 { id:'f2', icon:'🔬', color:'#a78bfa', name:'Particles — the why', namePt:'Partículas — o porquê',
   anchor:'Solid: packed tight. Liquid: sliding. Gas: far apart.',
   anchorPt:'Sólido: juntinhas. Líquido: escorregando. Gás: afastadas.',
   lesson:{lines:[
    ['🔬','The particles are the WHY of each state.','As partículas são o PORQUÊ de cada estado.'],
    ['🧊','Solid: particles packed tightly — they vibrate but stay in place.','Sólido: partículas bem juntinhas — vibram mas não saem do lugar.'],
    ['💧','Liquid: particles close together — they slide around each other.','Líquido: partículas juntas — escorregam umas nas outras.'],
    ['💨','Gas: particles far apart — they move freely and collide.','Gás: partículas afastadas — se movem livres e se batem.'],
   ], custom:particlesSim},
   pick:3,
   bank:[
    {t:'mc',q:'Why does a solid keep its shape?',qpt:'Por que o sólido mantém a forma?',opts:[
      {en:'Its particles are packed tightly together',pt:'As partículas estão bem juntinhas',ok:true},
      {en:'Its particles are far apart',pt:'As partículas estão afastadas',ok:false},
      {en:'Its particles move and collide',pt:'As partículas se movem e se batem',ok:false}]},
    {t:'mc',q:'In a liquid, the particles…',qpt:'No líquido, as partículas…',opts:[
      {en:'slide around each other',pt:'escorregam umas nas outras',ok:true},
      {en:'cannot move from their place',pt:'não saem do lugar',ok:false},
      {en:'fly far apart and collide',pt:'voam afastadas e se batem',ok:false}]},
    {t:'mc',q:'In a gas, the particles…',qpt:'No gás, as partículas…',opts:[
      {en:'are far apart and move freely',pt:'estão afastadas e se movem livres',ok:true},
      {en:'are packed tightly together',pt:'estão bem juntinhas',ok:false},
      {en:'only vibrate in one place',pt:'só vibram no lugar',ok:false}]},
