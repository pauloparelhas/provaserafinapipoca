<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Super review — key words</title>
<link rel="stylesheet" href="serafina-core.css">
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#102a3a;--ink:#f0f9ff;--soft:rgba(255,255,255,.55);--card:#13243a;--line:rgba(255,255,255,.12);--accent:#38bdf8;--accent2:#fbbf24;--tr:#fcd34d;--rad:20px}
body.light{--bg:#e0f2fe;--bg2:#dbeafe;--ink:#0c1e33;--soft:rgba(0,0,0,.5);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.95rem*var(--fs));color:var(--accent);flex:1;line-height:1.1}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;padding:0 8px}
.iconbtn:active{transform:scale(.9)}
.flagbtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.4;filter:grayscale(1)}
.flagbtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .flagbtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.wrap{flex:1;width:100%;max-width:640px;margin:0 auto;padding:14px 12px 44px}
.hint{text-align:center;font-size:.82rem;font-weight:800;color:var(--soft);margin:2px 0 14px;line-height:1.4}
/* ---- key-word block ---- */
.kblock{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bc,var(--accent));border-radius:var(--rad);box-shadow:0 10px 26px rgba(0,0,0,.26);margin-bottom:14px;padding:13px 14px 15px}
.kbhead{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:4px}
.kbhead .ke{font-size:1.5rem;filter:drop-shadow(0 4px 7px rgba(0,0,0,.3))}
.kbhead .kt{flex:1;min-width:0;font-weight:900;font-size:calc(1.05rem*var(--fs));line-height:1.15}
.kbhead .kt .ktr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.74rem}
body.show-tr .kbhead .kt .ktr{display:block}
.kaxis{font-size:.66rem;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:var(--soft);background:var(--line);border-radius:8px;padding:3px 8px;margin-left:auto;white-space:nowrap}
.kgroup{margin-top:10px}
.klabel{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:calc(.9rem*var(--fs));border-radius:999px;padding:5px 13px;min-height:34px;cursor:pointer;border:none;font-family:inherit}
.klabel .ltr{font-weight:800;font-style:italic;font-size:.74rem;opacity:.85}
body:not(.show-tr) .klabel .ltr{display:none}
.kchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.kchip{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:44px;border-radius:13px;padding:6px 12px;cursor:pointer;font-family:inherit;text-align:left;border:1.5px solid var(--cc,var(--line));background:var(--cb,rgba(255,255,255,.05));color:var(--ink)}
.kchip:active{transform:scale(.95)}
.kchip .en{font-weight:900;font-size:calc(.92rem*var(--fs));line-height:1.1}
.kchip .pt{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.74rem;line-height:1.1}
body.show-tr .kchip .pt{display:block}
.foot{text-align:center;color:var(--soft);font-weight:800;font-size:.82rem;margin-top:8px}
/* ---- lock / fullscreen ---- */
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn sera-home" title="Home" onclick="goHome()">&#127968;</button>
    <span class="title">Super review &mdash; key words</span>
    <button class="iconbtn flagbtn" id="flag" title="Mostrar tradução" onclick="toggleTr()">&#127463;&#127479;<span class="ft">PT</span></button>
    <button class="iconbtn" title="Smaller" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Bigger" onclick="fs(1)">A+</button>
    <button class="iconbtn" title="Theme" onclick="document.body.classList.toggle('light')">&#127769;</button>
    <button class="iconbtn lockbtn" id="lockbtn" title="Tela cheia e travar / Fullscreen &amp; lock" onclick="toggleLock()">&#128274;</button>
  </div>
  <div class="wrap">
    <div class="hint">Just the magic words! &#128064; Tap a word to hear it &#128266;, and tap the flag button (top) for Portuguese.</div>
    <div id="content"></div>
    <div class="foot">&#11088; You know it! Good luck on your Science test!</div>
  </div>
</div>
<script>
/* ===== SUPER REVIEW — key words only · Science Y2 · "Properties of Matter"
   English first; PT via the BR flag. Ultra-concise: just the words a child
   sees and associates. NO sentences, NO quiz — a wall of key words.
   Content anchored to ferramentas/CIE2_dragdrop.html (GAMES) and
   trabalho/2tri_ciencias/_roteiro.md. Validated by the `pedagogico` agent:
   - "condense" -> "steam cools back to water" (no new vocab)
   - "moves fast" moved out of STATES into the PARTICLES block (right axis)
   - explicit PARTICLES block added (the 25%-weight "why")
   - each axis is its own coloured block (state vs light never mixed). */

/* group colours (same palette as the games) */
var SOLID='#38bdf8', LIQUID='#34d399', GAS='#c084fc';

/* chip = [en, pt] · group = {name,pt,emo,co,chips} */
var BLOCKS=[
 { key:'states', emo:"\u{1F9EA}", en:"States", pt:"Estados", axis:"What it does",
   groups:[
    {name:'Solid', pt:'Sólido', emo:"\u{1F9CA}", co:SOLID, chips:[
      ["keeps its shape","mantém a forma"],["packed tightly","bem juntinhas"],["vibrate in place","vibram no lugar"]]},
    {name:'Liquid', pt:'Líquido', emo:"\u{1F4A7}", co:LIQUID, chips:[
      ["takes the cup's shape","forma do copo"],["flows / poured","flui / derrama"],["slides around","escorrega"]]},
    {name:'Gas', pt:'Gás', emo:"\u{1F4A8}", co:GAS, chips:[
      ["fills the space","enche o espaço"],["spreads out","espalha"],["far apart","afastadas"],["can be squeezed","pode comprimir"]]}
   ]},
 { key:'particles', emo:"\u{1F52C}", en:"Particles — the why", pt:"Partículas — o porquê", axis:"The why",
   groups:[
    {name:'Solid', pt:'Sólido', emo:"\u{1F9CA}", co:SOLID, chips:[
      ["packed tightly","bem juntas"],["vibrate, can't leave","vibram, não saem"]]},
    {name:'Liquid', pt:'Líquido', emo:"\u{1F4A7}", co:LIQUID, chips:[
      ["close, slide past","juntas, escorregam"]]},
    {name:'Gas', pt:'Gás', emo:"\u{1F4A8}", co:GAS, chips:[
      ["far apart","afastadas"],["move fast & collide","rápidas, colidem"]]}
   ]},
 { key:'examples', emo:"\u{1F3AF}", en:"Examples", pt:"Exemplos", axis:"Real things",
   groups:[
    {name:'Solid', pt:'Sólido', emo:"\u{1F9CA}", co:SOLID, chips:[
      ["ice","gelo"],["pencil","lápis"],["rock","pedra"]]},
    {name:'Liquid', pt:'Líquido', emo:"\u{1F4A7}", co:LIQUID, chips:[
      ["rain","chuva"],["tea","chá"],["milk","leite"],["water","água"]]},
    {name:'Gas', pt:'Gás', emo:"\u{1F4A8}", co:GAS, chips:[
      ["steam","vapor"],["water vapour","vapor d'água"],["air","ar"]]}
   ]},
 { key:'light', emo:"\u{1F4A1}", en:"Light — see through?", pt:"Luz — dá pra ver?", axis:"How much you see",
   groups:[
    {name:'Transparent', pt:'Transparente', emo:"\u{1F50D}", co:'#22d3ee', chips:[
      ["see ALL","vejo TUDO"],["water","água"],["window glass","vidro da janela"]]},
    {name:'Translucent', pt:'Translúcido', emo:"\u{1F327}\u{FE0F}", co:'#fbbf24', chips:[
      ["see a LITTLE","vejo POUCO"],["apple juice","suco de maçã"]]},
    {name:'Opaque', pt:'Opaco', emo:"\u{1F9F1}", co:'#94a3b8', chips:[
      ["see NOTHING","não vejo NADA"],["milk","leite"],["wooden door","porta de madeira"]]}
   ]},
 { key:'water', emo:"\u{1F9FD}", en:"Water — absorb / repel", pt:"Água — absorve / repele", axis:"Wet or dry",
   groups:[
    {name:'Absorbs', pt:'Absorve', emo:"\u{1F4A6}", co:'#38bdf8', chips:[
      ["drinks water in","suga a água"],["paper","papel"],["sponge","esponja"],["blanket","cobertor"],["soil","terra"]]},
    {name:'Repels', pt:'Repele', emo:"\u{1F6E1}\u{FE0F}", co:'#fb923c', chips:[
      ["water rolls off","água escorre"],["rain jacket","capa de chuva"],["glass","vidro"],["marble","bolinha de gude"],["duck feather","pena de pato"]]}
   ]},
 { key:'change', emo:"\u{1F321}\u{FE0F}", en:"Change — heat / cool", pt:"Mudança — aquecer / esfriar", axis:"Heat or cold",
   groups:[
    {name:'Heat', pt:'Aquece', emo:"\u{1F525}", co:'#fb7185', chips:[
      ["melt: ice → water","derrete: gelo → água"],["boil: water → steam","ferve: água → vapor"]]},
    {name:'Cool', pt:'Esfria', emo:"❄\u{FE0F}", co:'#60a5fa', chips:[
      ["freeze: water → ice","congela: água → gelo"],["steam cools back to water","vapor volta a água"]]}
   ]}
];

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;').replace(/'/g,"\\'");}
/* readable text colour on an arbitrary background, by luminance */
function textOn(hex){var h=hex.replace('#','');var r=parseInt(h.substr(0,2),16)/255,g=parseInt(h.substr(2,2),16)/255,b=parseInt(h.substr(4,2),16)/255;
  var L=.2126*r+.7152*g+.0722*b;return L>0.6?'#0c2238':'#ffffff';}
function rgba(hex,a){var h=hex.replace('#','');return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';}



/* ---- render the wall of key words ---- */
function build(){
  var html='';
  BLOCKS.forEach(function(b){
    html+='<div class="kblock" style="--bc:'+b.groups[0].co+'">'
        +'<div class="kbhead"><span class="ke">'+b.emo+'</span>'
        +'<span class="kt">'+b.en+'<span class="ktr">'+b.pt+'</span></span>'
        +'<span class="kaxis">'+b.axis+'</span></div>';
    b.groups.forEach(function(g){
      var allWords=g.chips.map(function(c){return c[0];}).join(', ');
      html+='<div class="kgroup">'
          +'<button class="klabel" style="background:'+g.co+';color:'+textOn(g.co)+'" onclick="say(\''+esc(g.name+'. '+allWords)+'\')">'
          +'<span>'+g.emo+'</span><span>'+g.name+'</span><span class="ltr">'+g.pt+'</span></button>'
          +'<div class="kchips">';
      g.chips.forEach(function(c){
        html+='<button class="kchip" style="--cc:'+rgba(g.co,.55)+';--cb:'+rgba(g.co,.14)+'" onclick="say(\''+esc(c[0])+'\')">'
            +'<span class="en">'+c[0]+'</span><span class="pt">'+c[1]+'</span></button>';
      });
      html+='</div></div>';
    });
    html+='</div>';
  });
  $('content').innerHTML=html;
}

build();
</script>
<script>window.SERA_CFG={trKey:'cie2_tr',rate:.8};</script>
<script src="serafina-core.js"></script>
<script src="cie2_theme.js"></script>
</body>
</html>
