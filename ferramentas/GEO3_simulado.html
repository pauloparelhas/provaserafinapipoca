/* MODO PAPEL — a folha da prova de verdade, com a interação por cima. Ligado por padrão; a escolha fica salva. */
(function(){
  var K='geo3_papel';
  function ligado(){ try{ return localStorage.getItem(K)!=='0'; }catch(e){ return true; } }
  function pinta(){
    var on=ligado();
    document.body.classList.toggle('papel',on);
    var b=document.getElementById('papelbtn');
    if(b){ b.innerHTML = on ? '&#128196;' : '&#128421;&#65039;'; b.title = on ? 'Folha da prova (como a de verdade)' : 'Folha da prova'; }
    var m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content', on ? '#8a8f98' : '#0d0b1e');
  }
  window.togglePapel=function(){ try{ localStorage.setItem(K, ligado()?'0':'1'); }catch(e){} pinta(); };
  pinta();
  document.addEventListener('DOMContentLoaded',pinta);
})();
</script>

<script>
'use strict';
/* ============================================================
   SIMULADO DE GEOGRAFIA (3º tri, prova escrita 12/11) — derivado do
   simulado de Ciências (OP_questao.js intacto). Dados: GEO3_simulado_data.js,
   GERADO do banco único GEO3_banco.js (trabalho/3tri_geografia/gen/gen_simulado_geo3.js).
   Português puro, sem bandeira. Rodada de 16 com o peso do roteiro.
   As questões "pode ser mais de uma" (multi) e "verdadeiro ou falso" (vf)
   usam o componente QG desta página: o OP_questao.js só aceita uma resposta
   e é de outras matérias.
   ============================================================ */
var h=React.createElement, OP=window.GEO3S, OPQ=window.OPQ;
var FAM={}; OP.FAMILIAS.forEach(function(f){ FAM[f.k]=f; });
var VISTOS='geo3_vistos', VBLITZ='geo3_blitz_vistos', KFILTRO='geo3_filtro';
var BANCO=OP.ITENS;
var RODADA=OP.FAMILIAS.reduce(function(s,f){ return s+(f.cota||0); },0);   /* 16 */
var AQUECER=5, BLITZ=10;
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function falar(t){ if(window.say && (!window.temVoz || window.temVoz())) window.say(OPQ.textoPuro(t)); }
function temVozBoa(){ return !window.temVoz || window.temVoz(); }

/* ---- filtro: tudo | u3 | u4 | <tema> ---- */
function famsDe(filtro){ return OP.FAMILIAS.filter(function(f){ return filtro==='tudo' || filtro==='u'+f.un || filtro===f.k; }); }
function poolDe(fams, soBlitz){ var ks=fams.map(function(f){ return f.k; }); return BANCO.filter(function(i){ return ks.indexOf(i.eixo)>=0 && (!soBlitz || i.blitz); }); }
function nomeFiltro(filtro){ return filtro==='tudo' ? 'Tudo (Unidades 3 e 4)' : filtro==='u3' ? 'Unidade 3: ruas, deslocamentos e transportes' : filtro==='u4' ? 'Unidade 4: meio ambiente' : (FAM[filtro]?FAM[filtro].nome:'Tudo'); }
function tamRodada(fams){ return Math.min(RODADA, poolDe(fams).length); }

function vistos(k){ return lsGet(k||VISTOS,[]); }
function marcaVisto(ids){ var v=vistos(); ids.forEach(function(i){ if(v.indexOf(i)<0) v.push(i); }); lsSet(VISTOS,v); }

/* rodada: com tudo e tamanho cheio, as cotas do roteiro; com filtro, a mesma proporção (divisor de D'Hondt)
   dentro do que foi escolhido; o aquecer pega um de cada tema, primeiro os que ela menos viu */
function montaRodada(n, fams){
  var jaVi=vistos(), escolhidas=[];
  function pegaDe(k, quantas){
    var pool=BANCO.filter(function(i){ return i.eixo===k && escolhidas.indexOf(i)<0; });
    var novas=OPQ.embaralha(pool.filter(function(i){ return jaVi.indexOf(i.id)<0; }));
    var velhas=OPQ.embaralha(pool.filter(function(i){ return jaVi.indexOf(i.id)>=0; }));
    escolhidas=escolhidas.concat(novas.concat(velhas).slice(0,quantas));
  }
  var disp={}; fams.forEach(function(f){ disp[f.k]=poolDe([f]).length; });
  if(n>=Math.min(RODADA,poolDe(fams).length)){
    var alvo={}; fams.forEach(function(f){ alvo[f.k]=0; });
    for(var j=0;j<n;j++){
      var best=null, bw=-1;
      OPQ.embaralha(fams).forEach(function(f){ if(alvo[f.k]>=disp[f.k]) return; var w=(f.cota||0.5)/(alvo[f.k]+1); if(w>bw){ bw=w; best=f; } });
      if(!best) break; alvo[best.k]++;
    }
    fams.forEach(function(f){ if(alvo[f.k]) pegaDe(f.k,alvo[f.k]); });
  } else {
    var ordem=OPQ.embaralha(fams).map(function(f){ return {k:f.k, novas:BANCO.filter(function(i){ return i.eixo===f.k && jaVi.indexOf(i.id)<0; }).length}; })
      .sort(function(a,b){ return b.novas-a.novas; });
    var volta=0;
    while(escolhidas.length<n && volta<n){ ordem.forEach(function(f){ if(escolhidas.length<n) pegaDe(f.k,1); }); volta++; }
  }
  return OPQ.embaralha(escolhidas.slice(0,n));
}
/* BLITZ: questões de bater o olho (q.blitz, regra no gen_simulado_geo3.js), as que ela ainda não viu no Blitz
   primeiro, um tema de cada vez; o resultado mostra o tempo para ela tentar bater o próprio recorde */
function montaBlitz(fams){
  var pool=poolDe(fams,true), n=Math.min(BLITZ,pool.length), v=vistos(VBLITZ), por={};
  if(pool.filter(function(i){ return v.indexOf(i.id)<0; }).length<n){ var ids=pool.map(function(i){ return i.id; }); v=v.filter(function(id){ return ids.indexOf(id)<0; }); }
  OPQ.embaralha(pool).forEach(function(i){ (por[i.eixo]=por[i.eixo]||[]).push(i); });
  Object.keys(por).forEach(function(k){ por[k].sort(function(a,b){ return (v.indexOf(a.id)>=0)-(v.indexOf(b.id)>=0); }); });
  var ks=OPQ.embaralha(Object.keys(por)), out=[];
  while(out.length<n && ks.some(function(k){ return por[k].length; })) ks.forEach(function(k){ if(out.length<n && por[k].length) out.push(por[k].shift()); });
  lsSet(VBLITZ, v.concat(out.map(function(i){ return i.id; })));
  return OPQ.embaralha(out);
}
function irma(eixo, usados){
  var jaVi=vistos();
  var pool=BANCO.filter(function(i){ return i.eixo===eixo && usados.indexOf(i.id)<0; });
  var novas=pool.filter(function(i){ return jaVi.indexOf(i.id)<0; });
  return OPQ.embaralha(novas.length?novas:pool)[0]||null;
}

  var d=React.useState(false), dica=d[0], setDica=d[1];
  var acertou = feito && alt.every(function(o,i){ return o.ok===marc[i]; });
  var algum = marc.some(function(x){ return x; });
  function confere(m){
    var marcados=alt.filter(function(o,i){ return m[i]; }).map(function(o){ return o.t; });

    if(props.aoResponder) props.aoResponder(alt.every(function(o,i){ return o.ok===m[i]; }), item, marcados.join(', '), marcados);

        modo==='blitz' && h('button',{className:'avancar'+(erradas.length?' calmo':''),onClick:blitz},'⚡ Próximo Blitz'),
        modo!=='blitz' && h('button',{className:'avancar'+(erradas.length?' calmo':''),onClick:function(){ comeca(tam); }},'Próximo simulado'),
        h('button',{className:'avancar calmo',onClick:function(){ setPainel('rever'); }},'Rever as questões'),
        modo!=='blitz' && h('button',{className:'avancar calmo',onClick:function(){ setPainel('temas'); }},'Por assunto'),
        h('button',{className:'avancar calmo',onClick:function(){ setTela('inicio'); }},'Voltar ao início'))),
    painelRever, painelTemas
  );
}

/* casinha: confirma dentro da página antes de sair */
(function(){
  var ov=document.getElementById('sairov'), irEmbora=window.goHome;
  window.goHome=function(){ if(window.screenLocked) return; ov.classList.add('show'); };
  document.getElementById('sairSim').onclick=function(){ ov.classList.remove('show'); irEmbora(); };
  document.getElementById('sairNao').onclick=function(){ ov.classList.remove('show'); };
  ov.onclick=function(e){ if(e.target===ov) ov.classList.remove('show'); };
  document.addEventListener('keydown',function(e){
    if(ov.classList.contains('show')){ if(e.key==='Escape') ov.classList.remove('show'); return; }
    var nav=document.getElementById('qnav'); if(nav.style.display==='none') return;
    if(e.key==='ArrowRight') document.getElementById('navNext').click();
    else if(e.key==='ArrowLeft'){ var p=document.getElementById('navPrev'); if(!p.disabled) p.click(); }
  });
})();
