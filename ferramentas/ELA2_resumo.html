<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Study Summary — Animals &amp; Reptiles</title>
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#171334;--ink:#f5f3ff;--soft:rgba(255,255,255,.55);--card:#221c44;--line:rgba(255,255,255,.12);--accent:#34d399;--accent2:#60a5fa;--tr:#fcd34d;--rad:20px}
body.light{--bg:#eef2ff;--bg2:#e0e7ff;--ink:#1a1030;--soft:rgba(0,0,0,.5);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
#starfield{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:7px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.95rem*var(--fs));color:var(--accent);flex:1;line-height:1.1}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.1rem;font-weight:800;cursor:pointer;padding:0 9px}
.iconbtn:active{transform:scale(.9)}
.flagbtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.4;filter:grayscale(1)}
.flagbtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .flagbtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.wrap{flex:1;width:100%;max-width:600px;margin:0 auto;padding:16px 14px 40px}
.hint{text-align:center;font-size:.84rem;font-weight:800;color:var(--soft);margin:2px 0 14px;line-height:1.4}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:0 10px 30px rgba(0,0,0,.28);margin-bottom:16px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;user-select:none}
.sechead .si{font-size:1.7rem;filter:drop-shadow(0 4px 7px rgba(0,0,0,.3))}
.sechead .st{flex:1;font-weight:900;font-size:calc(1.08rem*var(--fs));line-height:1.2}
.sechead .stt{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.8rem}
body.show-tr .sechead .stt{display:block}
.sechead .chev{font-size:1rem;color:var(--soft);transition:transform .25s}
.sec.open .chev{transform:rotate(180deg)}
.secbody{display:none;padding:0 16px 16px}
.sec.open .secbody{display:block}
.listen{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:2px solid var(--accent2);background:transparent;color:var(--accent2);font-weight:800;font-size:.85rem;border-radius:18px;padding:6px 16px;cursor:pointer;font-family:inherit;margin:2px 0 10px}
.listen:active{transform:scale(.95)}
/* group / fact rows */
.grp{border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:8px 0;background:rgba(255,255,255,.03)}
.grp .gname{font-weight:900;font-size:calc(1rem*var(--fs));display:flex;align-items:center;gap:8px}
.grp .gname .gpt{color:var(--tr);font-style:italic;font-weight:700;font-size:.8rem;display:none}
body.show-tr .grp .gname .gpt{display:inline}
.line{margin:6px 0 0;font-weight:700;font-size:calc(.96rem*var(--fs));line-height:1.35}
.line .lpt{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.85rem;line-height:1.25}
body.show-tr .line .lpt{display:block}
.cols{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:140px;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.col.real{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.35)}
.col.make{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.35)}
.col h4{font-size:.92rem;font-weight:900;margin-bottom:7px}
.col h4 .gpt{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.78rem}
body.show-tr .col h4 .gpt{display:inline}
.col .ci{font-weight:800;font-size:calc(.95rem*var(--fs));margin:4px 0;display:flex;align-items:center;gap:7px}
.col .ci .cpt{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.78rem}
body.show-tr .col .ci .cpt{display:inline}
.tip{display:flex;gap:9px;align-items:flex-start;margin:7px 0;font-weight:800;font-size:calc(.97rem*var(--fs));line-height:1.35}
.tip .tk{flex-shrink:0}
.tip .tpt{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.83rem}
body.show-tr .tip .tpt{display:block}
.qa{border-left:3px solid var(--accent2);padding:6px 0 6px 12px;margin:11px 0}
.qa .qq{font-weight:900;font-size:calc(.98rem*var(--fs));line-height:1.3}
.qa .qpt{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.83rem;margin:2px 0}
body.show-tr .qa .qpt{display:block}
.qa .aa{font-weight:900;color:var(--accent);font-size:calc(1rem*var(--fs));margin-top:4px}
.qa .aa::before{content:"→ "}
.foot{text-align:center;color:var(--soft);font-weight:800;font-size:.82rem;margin-top:8px}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" title="Home" onclick="if(confirm('Voltar ao início?'))location.href='../index.html'">&#127968;</button>
    <span class="title">Study Summary &mdash; Animals &amp; Reptiles</span>
    <button class="iconbtn flagbtn" id="flag" title="Mostrar tradução" onclick="toggleTr()">&#127463;&#127479;<span class="ft">PT</span></button>
    <button class="iconbtn" title="Letra menor" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Letra maior" onclick="fs(1)">A+</button>
    <button class="iconbtn" title="Tema" onclick="document.body.classList.toggle('light')">&#127769;</button>
  </div>
  <div class="wrap">
    <div class="hint">Everything is in <b>English</b>. Tap the &#127463;&#127479; flag to see the <b>Portuguese</b> below each line, and &#128266; to listen.<br>
      <span class="tr" style="display:none">Tudo em inglês. Toque na bandeira para ver o português embaixo, e no alto-falante para ouvir.</span>
    </div>
    <div id="content"></div>
    <div class="foot">&#127808; Good luck on your test! &middot; <span class="tr" style="display:none">Boa sorte na prova!</span></div>
  </div>
</div>
<script>
/* ===== Study summary — Unit 4 (Animal Inquiry) + Unit 7 (Reptiles) =====
   English first; PT toggled by the BR flag. Content from the study material. */

const GROUPS = [
 {ic:"\u{1F436}",en:"Mammals",pt:"mamíferos",say:"Mammals have hair or fur and drink milk when they are babies. Examples: dog, cat, lion, elephant.",
  lines:[["Have hair or fur.","Têm pelo."],["Drink milk when they are babies.","Tomam leite quando bebês."],["Examples: dog, cat, lion, elephant.","Exemplos: cão, gato, leão, elefante."]]},
 {ic:"\u{1F426}",en:"Birds",pt:"aves",say:"Birds have feathers and wings and lay eggs. Examples: parrot, chicken, eagle.",
  lines:[["Have feathers and wings.","Têm penas e asas."],["Lay eggs.","Botam ovos."],["Examples: parrot, chicken, eagle.","Exemplos: papagaio, galinha, águia."]]},
 {ic:"\u{1F41F}",en:"Fish",pt:"peixes",say:"Fish live in water and have scales and fins. Examples: goldfish, shark.",
  lines:[["Live in water.","Vivem na água."],["Have scales and fins.","Têm escamas e nadadeiras."],["Examples: goldfish, shark.","Exemplos: peixinho-dourado, tubarão."]]},
 {ic:"\u{1F40D}",en:"Reptiles",pt:"répteis",say:"Reptiles have dry scales, lay eggs, and are cold-blooded. Examples: snake, turtle, crocodile, lizard.",
  lines:[["Have dry scales.","Têm escamas secas."],["Lay eggs (on land).","Botam ovos (na terra)."],["Are cold-blooded.","Têm sangue frio."],["Examples: snake, turtle, crocodile, lizard.","Exemplos: cobra, tartaruga, crocodilo, lagarto."]]},
 {ic:"\u{1F438}",en:"Amphibians",pt:"anfíbios",say:"Amphibians live in water and on land. Examples: frog and toad.",
  lines:[["Live in water and on land.","Vivem na água e na terra."],["Have moist (wet) skin.","Têm a pele molhadinha."],["Examples: frog, toad.","Exemplos: rã, sapo."]]},
 {ic:"\u{1F98B}",en:"Insects",pt:"insetos",say:"Insects have six legs. Examples: butterfly, bee, ant.",
  lines:[["Have six legs.","Têm seis patas."],["Examples: butterfly, bee, ant.","Exemplos: borboleta, abelha, formiga."]]},
 {ic:"\u{1FAB8}",en:"Invertebrates",pt:"invertebrados",say:"Invertebrates do not have a backbone. Examples: octopus, jellyfish, worm.",
  lines:[["Do NOT have a backbone.","NÃO têm coluna vertebral."],["Examples: octopus, jellyfish, worm.","Exemplos: polvo, água-viva, minhoca."]]}
];

const REPT_CHARS=[
 ["Have dry scales.","Têm escamas secas."],
 ["Are cold-blooded (the sun warms them).","São de sangue frio (o sol esquenta)."],
 ["Lay eggs on land.","Botam ovos na terra."],
 ["Breathe with lungs.","Respiram com pulmões."],
 ["Most live on land.","A maioria vive na terra."]
];
const REPT_FAM=[
 ["\u{1F422} Turtles — have a shell.","Tartarugas — têm casco."],
 ["\u{1F40D} Snakes — no legs, they slither.","Cobras — sem patas, deslizam."],
 ["\u{1F98E} Lizards — four legs, like an iguana.","Lagartos — quatro patas, como a iguana."],
 ["\u{1F40A} Crocodilians — big, live near water.","Crocodilianos — grandes, perto da água."]
];
const REPT_FACTS=[
 ["Snakes can smell with their tongues.","Cobras cheiram com a língua."],
 ["Turtles can live for many years.","Tartarugas vivem muitos anos."],
 ["Crocodiles are excellent swimmers.","Crocodilos nadam muito bem."],
 ["Some lizards can lose their tail and grow it again.","Alguns lagartos perdem o rabo e ele cresce de novo."]
];
const REAL=[["\u{1F436} Dog","cachorro"],["\u{1F408} Cat","gato"],["\u{1F40D} Snake","cobra"],["\u{1F422} Turtle","tartaruga"],["\u{1F40A} Crocodile","crocodilo"],["\u{1F438} Frog","rã"]];
const MAKE=[["\u{1F409} Dragon","dragão"],["\u{1F984} Unicorn","unicórnio"],["\u{1F9DC} Mermaid","sereia"],["\u{1F40E} Pegasus","pégaso"]];

const TIPS=[
 ["\u{1F436}","Mammals → have fur.","Mamíferos → têm pelo."],
 ["\u{1F426}","Birds → have feathers.","Aves → têm penas."],
 ["\u{1F41F}","Fish → live in water.","Peixes → vivem na água."],
 ["\u{1F40D}","Reptiles → have dry scales.","Répteis → têm escamas secas."],
 ["\u{1F438}","Amphibians → live in water and on land.","Anfíbios → vivem na água e na terra."],
 ["\u{1F41C}","Insects → have six legs.","Insetos → têm seis patas."],
 ["✨","Know how to tell real from make-believe animals.","Saiba diferenciar animais reais e imaginários."]
];
const FAQ=[
 ["What animal group does a snake belong to?","A qual grupo a cobra pertence?","Reptile"],
 ["What covers a reptile's body?","O que cobre o corpo do réptil?","Scales"],
 ["Is a dragon real or make-believe?","O dragão é real ou faz de conta?","Make-believe"],
 ["What animal group does a frog belong to?","A qual grupo a rã pertence?","Amphibian"]
];

/* ===== render ===== */
function esc(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,"\\'");}
function say(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/en-US|en_US|English \(United States\)/i.test(v.lang+v.name));if(v)u.voice=v;
  speechSynthesis.speak(u);}catch(e){}}
function lineHTML(l){return `<div class="line">${l[0]}<div class="lpt">${l[1]}</div></div>`;}

function build(){
  let groupsBody=GROUPS.map(g=>`<div class="grp">
     <div class="gname">${g.ic} ${g.en} <span class="gpt">(${g.pt})</span>
       <button class="listen" style="margin:0 0 0 auto" onclick="say('${esc(g.say)}')">&#128266;</button></div>
     ${g.lines.map(lineHTML).join('')}</div>`).join('');

  let reptSay="Reptiles have dry scales, are cold-blooded, lay eggs on land, breathe with lungs, and most live on land. There are four families: turtles, snakes, lizards and crocodilians.";
  let reptBody=`<button class="listen" onclick="say('${esc(reptSay)}')">&#128266; Listen</button>
    <div class="grp"><div class="gname">\u{1F50D} Characteristics <span class="gpt">(características)</span></div>${REPT_CHARS.map(lineHTML).join('')}</div>
    <div class="grp"><div class="gname">\u{1F46A} The 4 families <span class="gpt">(as 4 famílias)</span></div>${REPT_FAM.map(lineHTML).join('')}</div>
    <div class="grp"><div class="gname">\u{1F4A1} Interesting facts <span class="gpt">(fatos curiosos)</span></div>${REPT_FACTS.map(lineHTML).join('')}</div>`;

  let rmBody=`<div class="cols">
     <div class="col real"><h4>✅ Real <span class="gpt" style="color:var(--tr)">(reais)</span></h4>
       ${REAL.map(r=>`<div class="ci">${r[0]}<span class="cpt">${r[1]}</span></div>`).join('')}</div>
     <div class="col make"><h4>✨ Make-believe <span class="gpt" style="color:var(--tr)">(faz de conta)</span></h4>
       ${MAKE.map(r=>`<div class="ci">${r[0]}<span class="cpt">${r[1]}</span></div>`).join('')}</div>
   </div>`;

  let tipsBody=TIPS.map(t=>`<div class="tip"><span class="tk">${t[0]}</span><span>${t[1]}<span class="tpt">${t[2]}</span></span></div>`).join('');
  let faqBody=FAQ.map(q=>`<div class="qa"><div class="qq">${q[0]}<div class="qpt">${q[1]}</div></div><div class="aa">${q[2]}</div></div>`).join('');

  const sections=[
   {ic:"\u{1F43E}",en:"The 7 Animal Groups",pt:"Os 7 grupos de animais",body:groupsBody,open:true},
   {ic:"\u{1F40D}",en:"All about Reptiles",pt:"Tudo sobre os répteis",body:reptBody,open:true},
   {ic:"\u{1F31F}",en:"Real or Make-believe?",pt:"Real ou faz de conta?",body:rmBody,open:true},
   {ic:"⭐",en:"Tips for the test",pt:"Dicas para a prova",body:tipsBody,open:true},
   {ic:"❓",en:"Questions that often come up",pt:"Perguntas que costumam cair",body:faqBody,open:true}
  ];
  $('content').innerHTML=sections.map((s,i)=>`<div class="sec${s.open?' open':''}" id="sec${i}">
     <div class="sechead" onclick="toggleSec(${i})">
       <span class="si">${s.ic}</span>
       <span class="st">${s.en}<span class="stt">${s.pt}</span></span>
       <span class="chev">▼</span></div>
     <div class="secbody">${s.body}</div></div>`).join('');
}
const $=id=>document.getElementById(id);
function toggleSec(i){$('sec'+i).classList.toggle('open');}
function fs(d){window._fsStep=Math.max(-2,Math.min(3,(window._fsStep||0)+d));document.documentElement.style.setProperty('--fs',1+window._fsStep*0.12);}
function toggleTr(){const on=document.body.classList.toggle('show-tr');try{localStorage.setItem('ela2_tr',on?'1':'0');}catch(e){}
  document.querySelectorAll('.hint .tr,.foot .tr').forEach(e=>e.style.display=on?'inline':'none');}

/* starfield */
(function(){var c=document.getElementById('starfield'),x=c.getContext('2d'),s=[];
function rz(){c.width=innerWidth;c.height=innerHeight;s=[];for(var i=0;i<120;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.2,a:Math.random(),da:(Math.random()-.5)*.004,sp:Math.random()*.1+.02});}
function d(){x.clearRect(0,0,c.width,c.height);s.forEach(function(t){t.y-=t.sp;if(t.y<-5)t.y=c.height+5;t.a+=t.da;if(t.a>1||t.a<.1)t.da*=-1;x.save();x.globalAlpha=t.a;x.fillStyle='#fff';x.beginPath();x.arc(t.x,t.y,t.r,0,Math.PI*2);x.fill();x.restore();});requestAnimationFrame(d);}
rz();addEventListener('resize',rz);d();})();
build();
try{if(localStorage.getItem('ela2_tr')==='1'){document.body.classList.add('show-tr');document.querySelectorAll('.hint .tr,.foot .tr').forEach(e=>e.style.display='inline');}}catch(e){}
if('speechSynthesis' in window){speechSynthesis.getVoices();}
</script>
</body>
</html>
