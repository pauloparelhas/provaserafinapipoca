  var box = document.getElementById('temas'), h = '';
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

    h += '<section style="--c:' + T.c + ';--t:' + T.tint + ';--d:' + T.d + '"><h2 data-tipo="rotulo">' + esc(T.t) + '</h2><div class="fichas">';

    h += '</div></section>';
  });

})();
