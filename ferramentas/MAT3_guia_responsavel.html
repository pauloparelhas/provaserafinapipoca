<script>
(function () {
  var D = window.MAT3D, h = '';
  h += '<h1>Math 3º tri · Guia do responsável</h1><div class="sub" data-tipo="rotulo">Respostas escritas · AF de 18/11/2026 · acompanha a folha "Math · Written answers"</div>';
  h += '<div class="quadro"><h3 data-tipo="rotulo">Por que esta folha</h3><p>A prova sempre traz questões em que a criança <b>escreve</b> a resposta: uma frase, uma conta, um nome, ' +
       'um desenho, uma barra pintada no gráfico. Marcar alternativa não treina isso. Em Matemática é ainda mais forte: vêm figuras ' +
       '(sólidos, gráficos, grupos de objetos) e pedidos como "write the addition sentence" e "write a multiplication sentence", que ' +
       'é o formato da atividade da página 240 do livro, marcada pela professora como AP.</p></div>';
  h += '<div class="quadro"><h3 data-tipo="rotulo">Como aplicar</h3><ol>' +
       '<li>Em <b>duas sessões</b> de uns 15 minutos: na primeira, os temas 1 e 2 (medidas, perímetro e sólidos); na segunda, os temas 3 a 5 (gráficos, probabilidade, multiplicação e divisão).</li>' +
       '<li>Ela lê sozinha o enunciado em inglês. Se travar, leia em voz alta em inglês; só depois, se ainda precisar, diga em português o que a pergunta pede, sem dar a resposta.</li>' +
       '<li>Lápis e borracha; nada de régua ou calculadora (o material desta prova não ensina medir com régua).</li>' +
       '<li>Corrija junto, questão por questão, com este guia: primeiro elogie o que está certo, depois faça a pergunta de conversa.</li>' +
       '<li>Também funciona <b>sem imprimir</b>, como conversa: você lê a pergunta e ela responde em voz alta, em frase inteira, e escreve só as contas.</li></ol></div>';
  h += '<div class="quadro"><h3 data-tipo="rotulo">A receita da resposta escrita (vale para todas as matérias)</h3><ol>' +
       D.receita.pt.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ol>' +
       '<p>No alto da folha dela está a mesma receita, em inglês.</p></div>';
  h += '<div class="quadro"><h3 data-tipo="rotulo">Palavras para saber escrever</h3><p>No treino, erro de ortografia não tira ponto, mas estas palavras-chave se corrigem na hora:</p>' +
       '<div class="palavras">' + D.palavras.map(function (p) { return '<span lang="en">' + p + '</span>'; }).join('') + '</div></div>';
  h += '<div class="quadro aviso"><h3 data-tipo="rotulo">Dois avisos de conteúdo</h3><ul>' +
       '<li><b>Divisão e números ímpares.</b> O slide da professora diz que números ímpares "cannot be divided equally". Isso vale para repartir entre <b>2</b>; por isso, na folha, toda questão de par/ímpar fala em "between 2 friends". Se a prova perguntar "Can odd numbers be divided equally?", a resposta que a escola espera é <b>"No"</b>.</li>' +
       '<li><b>Cone e cilindro.</b> Livros diferentes contam de jeitos diferentes os vértices do cone e as arestas do cilindro; o vídeo indicado pela professora diz que não têm nenhum. Não cobramos esses números. O que é certo em qualquer livro: a <b>esfera</b> não tem face plana, nem aresta, nem vértice.</li></ul></div>';
  D.blocos.forEach(function (b) {
    h += '<h2 data-tipo="rotulo">' + b.titulo.replace(/^\d+ · /, function (m) { return m; }) + ' <span style="font-weight:400">· ' + b.pt + '</span></h2>';
    b.questoes.forEach(function (q) {
      h += '<div class="q"><div class="top"><span class="n">' + q.n + '</span><span class="en" lang="en" data-tipo="rotulo">' + q.en + '</span></div>';
      if (q.fig) h += '<div class="figs" lang="en">' + q.fig + '</div>';
      h += '<div class="campo m"><b>Resposta-modelo:</b> <span lang="en">' + q.modelo + '</span></div>';
      h += '<div class="campo"><b>Aceite também:</b> ' + q.aceitar + '</div>';
      h += '<div class="campo o"><b>O que observar:</b> ' + q.observar + '</div>';
      h += '<div class="campo"><b>Pergunta de conversa:</b> ' + q.conversa + '</div>';
      h += '<div class="campo"><b>Conceito-base:</b> <span lang="en">' + q.conceito + '</span></div></div>';
    });
  });
  document.getElementById('guia').innerHTML = h;
})();
</script>
