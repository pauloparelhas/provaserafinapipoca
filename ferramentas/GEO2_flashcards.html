<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Flashcards — Geografia · Comunidades e lugares</title>
<link rel="stylesheet" href="serafina-core.css?v=20260810">
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#10322a;--ink:#f0fdf4;--soft:rgba(255,255,255,.58);--card:#13303a;--line:rgba(255,255,255,.13);--accent:#34d399;--accent2:#fbbf24;--tr:#fcd34d;--ok:#34d399;--no:#f87171;--rad:22px}
body.light{--bg:#eafaf1;--bg2:#dcf5e8;--ink:#0c2a1e;--soft:rgba(0,0,0,.52);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.95rem*var(--fs));color:var(--accent);flex:1;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;padding:0 8px}
.iconbtn:active{transform:scale(.9)}
.dicabtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.4;filter:grayscale(1)}
.dicabtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .dicabtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.bar{height:9px;background:var(--line)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .35s}
.wrap{flex:1;width:100%;max-width:620px;margin:0 auto;padding:14px 12px 28px}
.tr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.84em;line-height:1.3}
body.show-tr .tr{display:block}

/* ---- menu de baralhos ---- */
.intro{text-align:center}
.intro .em{font-size:calc(clamp(2.2rem,6vmin,3rem)*var(--fs));filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));margin:6px 0 2px}
.intro h1{font-size:calc(clamp(1.15rem,3.2vmin,1.35rem)*var(--fs));font-weight:900;line-height:1.25}
.intro p{color:var(--soft);font-weight:700;font-size:calc(clamp(.86rem,2.4vmin,.95rem)*var(--fs));line-height:1.5;margin:8px auto 4px;max-width:46ch}
.decks{display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0 4px}
.deck{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;border:2px solid var(--line);border-left:8px solid var(--dc);border-radius:18px;background:linear-gradient(135deg,var(--card),rgba(255,255,255,.04));color:var(--ink);font-family:inherit;cursor:pointer;text-align:left}
.deck:active{transform:scale(.98)}
.deck .de{font-size:1.6rem;width:48px;height:48px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--dc) 20%,transparent)}
.deck .dt{flex:1;font-weight:900;font-size:calc(1.02rem*var(--fs));line-height:1.2}
.deck .dn{font-size:.72rem;font-weight:900;color:var(--dc);border:1.5px solid var(--dc);background:color-mix(in srgb,var(--dc) 10%,transparent);border-radius:20px;padding:5px 11px;white-space:nowrap}
.deck.feito{border-style:dashed;border-left-style:solid;opacity:.88}
.deck.feito .dn{background:var(--ok);border-color:var(--ok);color:#06251a}
.allbtn{width:100%;min-height:56px;margin-top:12px;border:none;border-radius:18px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04261c;font-family:inherit;font-weight:900;font-size:calc(1.02rem*var(--fs));cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.allbtn:active{transform:scale(.97)}

/* ---- carta ---- */
.chead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chead .ce{font-size:1.4rem}
.chead .ct{flex:1;font-weight:900;font-size:calc(clamp(.88rem,2.4vmin,1rem)*var(--fs));line-height:1.15}
.chead .cn{font-size:.72rem;font-weight:900;color:var(--soft);letter-spacing:1px;background:var(--line);border-radius:14px;padding:4px 10px;white-space:nowrap}
.flip{perspective:1400px;margin:2px 0 12px}
.fc{position:relative;width:100%;min-height:280px;min-height:clamp(220px,46dvh,380px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.fc.on{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:10px;text-align:center;padding:18px 18px 14px;border-radius:var(--rad);border:3px solid var(--dc);background:linear-gradient(135deg,var(--card),rgba(255,255,255,.05));box-shadow:0 14px 36px rgba(0,0,0,.35);overflow-y:auto}
.fc .back{transform:rotateY(180deg);border-style:solid;background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 15%,transparent),var(--card))}
.face .lab{flex-shrink:0;font-size:.64rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px 10px}
.back .lab{color:var(--ok);border-color:var(--ok)}
.face .txt{font-weight:900;font-size:calc(clamp(1rem,2.2vmin + .55rem,1.22rem)*var(--fs));line-height:1.35}
.back .txt{font-size:calc(clamp(.9rem,2vmin + .5rem,1.06rem)*var(--fs))}
.face .tap{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:900;color:var(--accent);border:2px dashed var(--accent);border-radius:20px;padding:7px 14px;animation:tapPulse 1.6s ease-in-out infinite}
@keyframes tapPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.face .dica{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;width:100%;flex-shrink:0}
.speak{min-height:44px;flex-shrink:0;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:.84rem;border-radius:18px;padding:6px 15px;cursor:pointer;font-family:inherit}
.speak:active{transform:scale(.94)}

/* ---- respostas ---- */
.judge{display:flex;gap:10px;margin-top:4px}
.jb{flex:1;min-height:58px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:900;font-size:calc(.98rem*var(--fs));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.jb .je{font-size:1.3rem}
.jb.sim{border-color:var(--ok)}
.jb.nao{border-color:var(--no)}
.jb:active{transform:scale(.96)}
.navrow{display:flex;gap:10px;margin-top:12px}
.nb{flex:1;min-height:50px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:900;font-size:.95rem;cursor:pointer}
.nb:disabled{opacity:.35;cursor:default}
.hintline{text-align:center;color:var(--soft);font-weight:800;font-size:.82rem;margin-top:12px;line-height:1.45}

/* ---- fim ---- */
.fim{text-align:center;padding-top:8px}
.fim .big{font-size:3.6rem}
.fim .score{font-size:1.7rem;font-weight:900;color:var(--accent);margin:8px 0 2px}
.fim .sub{font-weight:800;color:var(--soft);font-size:.96rem;margin-bottom:14px;line-height:1.4}
.fimbtns{display:flex;flex-direction:column;gap:10px}
.fimbtn{min-height:54px;border-radius:17px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer}
.fimbtn.primary{border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04261c}
.fimbtn.redo{border-color:var(--no)}

.sombtn{transition:opacity .15s}
.sombtn.off{opacity:.45;background:rgba(248,113,113,.18)}

/* ---------- mouse (notebook): affordance de hover ---------- */
@media (hover:hover){
  .deck:hover,.jb:hover,.fimbtn:hover,.nb:not(:disabled):hover{border-color:var(--accent)}
  .allbtn:hover,.fimbtn.primary:hover{opacity:.93}
}
/* ---------- telas largas (notebook) ---------- */
@media (min-width:1000px){
  .wrap{max-width:720px}
  .fc{min-height:clamp(260px,42dvh,400px)}
}
/* ---------- celular em PAISAGEM: a altura e o recurso escasso ----------
   carta a esquerda, julgamento e navegacao a direita */
@media (orientation:landscape) and (max-height:520px){
  .topbar{padding:5px 8px}
  .bar{height:6px}
  .wrap{max-width:none;padding:8px 12px 12px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);column-gap:14px;align-content:start}
  .wrap>.intro,.wrap>.fim{grid-column:1/-1}
  .chead{grid-column:1/-1;margin-bottom:6px}
  .chead .ce{font-size:1.15rem}
  .flip{grid-column:1;grid-row:2/span 2;margin:0}
  .fc{min-height:clamp(140px,62dvh,260px)}
  .fc .face{padding:12px 14px 10px;gap:7px}
  .face .txt{font-size:calc(1.02rem*var(--fs))}
  .back .txt{font-size:calc(.94rem*var(--fs))}
  .face .tap{font-size:.7rem;padding:5px 11px}
  .speak{min-height:44px;padding:4px 12px;font-size:.78rem}
  #judge{grid-column:2;grid-row:2}
  .judge{flex-direction:column;gap:8px;margin-top:0}
  .jb{min-height:52px}
  .navrow{grid-column:2;grid-row:3;flex-wrap:wrap;gap:8px;margin-top:8px}
  .nb{min-height:44px;font-size:.85rem}
  .intro .em{margin:0}
  .intro p{margin:4px auto 2px}
  .decks{grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
  .deck{min-height:56px;padding:8px 12px}
  .deck .de{width:40px;height:40px;font-size:1.3rem}
  .allbtn{min-height:50px;margin-top:8px}
  .hintline{margin-top:8px}
  .fim{padding-top:0}
  .fim .big{font-size:2.2rem}
  .fim .score{font-size:1.3rem;margin:2px 0}
  .fim .sub{margin-bottom:8px}
  .fimbtns{flex-direction:row;flex-wrap:wrap}
  .fimbtn{flex:1 1 44%;min-width:180px;min-height:48px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn sera-home" title="Início" onclick="goHome()">&#127968;</button>
    <span class="title">Flashcards &mdash; Comunidades e lugares</span>
    <button class="iconbtn dicabtn" id="dica" title="Mostrar dica" onclick="toggleTr()">&#128161;<span class="ft">Dica</span></button>
    <button class="iconbtn" title="Letra menor" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Letra maior" onclick="fs(1)">A+</button>
    <button class="iconbtn sombtn" id="sombtn" title="Desligar a voz" aria-pressed="false" onclick="toggleSom()">&#128266;</button>
    <button class="iconbtn" title="Tema" onclick="document.body.classList.toggle('light')">&#127769;</button>
    <button class="iconbtn lockbtn" id="lockbtn" title="Tela cheia e travar" onclick="toggleLock()">&#128274;</button>
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="wrap" id="stage"></div>
</div>

<script>
/* ============================================================
   FLASHCARDS — Geografia 2tri · Unidade 2
   Banco em media/flashcards_geo2.json (mesma fonte do roteiro).
   Ciclo: pergunta -> vira a carta -> "acertei / ainda não".
   O que a criança marcou como "ainda não" volta na rodada de
   revisão — é o único jeito de flashcard ensinar alguma coisa.
   ============================================================ */
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;').replace(/'/g,"\\'");}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

var DB=null, deck=[], idx=0, errados=[], acertos=0, atual=null, revisao=false;
var feitos={};
try{feitos=JSON.parse(localStorage.getItem('geo2_fc_feitos')||'{}');}catch(e){feitos={};}

fetch('media/flashcards_geo2.json?v=20260810').then(function(r){return r.json();})
 .then(function(j){DB=j;intro();})
 .catch(function(){ $('stage').innerHTML='<div class="intro"><div class="em">&#128533;</div>'
   +'<h1>Não consegui abrir os flashcards</h1><p>Se você abriu o arquivo direto do computador, '
   +'abra pelo site — o navegador bloqueia a leitura do banco em <i>file://</i>.</p></div>'; });

function intro(){
  revisao=false;
  $('bar').style.width='0%';
  var total=DB.baralhos.reduce(function(n,b){return n+b.cards.length;},0);
  var h='<div class="intro"><div class="em">&#127183;</div>'
   +'<h1>Flashcards</h1>'
   +'<p>Leia a pergunta, responda <b>de cabeça</b> e só depois vire a carta. '
   +'O que você marcar como <b>ainda não</b> volta no fim para você treinar de novo.</p>'
   +'<div class="decks">';
  DB.baralhos.forEach(function(b,i){
    h+='<button class="deck'+(feitos[b.key]?' feito':'')+'" style="--dc:'+b.cor+'" onclick="abrir('+i+')">'
     +'<span class="de">'+b.emo+'</span>'
     +'<span class="dt">'+b.nome+'</span>'
     +'<span class="dn">'+(feitos[b.key]?'&#10003; '+b.cards.length:b.cards.length+' cartas')+'</span></button>';
  });
  h+='</div><button class="allbtn" onclick="abrirTudo()">&#127922; Embaralhar tudo ('+total+' cartas)</button>'
   +'<div class="hintline">Dica: 10 minutos por dia valem mais que 1 hora na véspera. &#128522;</div></div>';
  $('stage').innerHTML=h;
}

function abrir(i){
  var b=DB.baralhos[i];
  deck=shuffle(b.cards).map(function(c){return {c:c,cor:b.cor,emo:b.emo,nome:b.nome,key:b.key};});
  idx=0;errados=[];acertos=0;revisao=false;carta();
}
function abrirTudo(){
  var all=[];
  DB.baralhos.forEach(function(b){b.cards.forEach(function(c){
    all.push({c:c,cor:b.cor,emo:b.emo,nome:b.nome,key:b.key});});});
  deck=shuffle(all);idx=0;errados=[];acertos=0;revisao=false;carta();
}

function carta(){
  if(idx>=deck.length){fim();return;}
  atual=deck[idx];
  var c=atual.c;
  $('bar').style.width=(idx/deck.length*100)+'%';
  $('stage').innerHTML='<div class="chead"><span class="ce">'+atual.emo+'</span>'
   +'<span class="ct">'+atual.nome+(revisao?' &middot; revisão':'')+'</span>'
   +'<span class="cn">'+(idx+1)+' / '+deck.length+'</span></div>'
   +'<div class="flip"><div class="fc" id="fc" style="--dc:'+atual.cor+'" onclick="virar()">'
     +'<div class="face front">'
       +'<span class="lab">Pergunta</span>'
       +'<span class="txt">'+c.f+'</span>'
       +(c.d?'<span class="dica tr">&#128161; '+c.d+'</span>':'')
       +'<span class="tap">&#128072; toque na carta para ver a resposta</span>'
     +'</div>'
     +'<div class="face back">'
       +'<span class="lab">Resposta</span>'
       +'<span class="txt">'+c.v+'</span>'
       +'<button class="speak" onclick="say(\''+esc(c.v)+'\');event.stopPropagation()">&#128266; Ouvir</button>'
     +'</div>'
   +'</div></div>'
   +'<div id="judge"></div>'
   +'<div class="navrow">'
     +'<button class="nb" id="prev" onclick="voltar()"'+(idx===0?' disabled':'')+'>&#8249; Anterior</button>'
     +'<button class="nb" onclick="intro()">&#127968; Menu</button>'
     +'<button class="nb" onclick="pular()">Pular &#8250;</button>'
   +'</div>';
}
function virar(){
  var fc=$('fc'); if(!fc)return;
  var aberta=fc.classList.toggle('on');
  $('judge').innerHTML = aberta
    ? '<div class="judge">'
      +'<button class="jb sim" onclick="julgar(true)"><span class="je">&#128522;</span>Acertei!</button>'
      +'<button class="jb nao" onclick="julgar(false)"><span class="je">&#129300;</span>Ainda não</button>'
      +'</div>'
    : '';
}
function julgar(ok){
  if(ok)acertos++; else errados.push(atual);
  idx++; carta();
}
function pular(){ errados.push(atual); idx++; carta(); }
function voltar(){ if(idx>0){idx--;carta();} }

function fim(){
  $('bar').style.width='100%';
  var total=deck.length;
  if(!revisao && atual && atual.key){ feitos[atual.key]=true;
    try{localStorage.setItem('geo2_fc_feitos',JSON.stringify(feitos));}catch(e){} }
  var pct=total?acertos/total:0;
  var msg=pct>=.9?'Você mandou muito bem! &#127942;'
        :pct>=.6?'Muito bem! Treine as que faltaram.'
        :'Bom treino — repita as difíceis e você pega.';
  var h='<div class="fim"><div class="big">&#127942;</div>'
   +'<div class="score">'+acertos+' / '+total+'</div>'
   +'<div class="sub">'+msg+'</div><div class="fimbtns">';
  if(errados.length)
    h+='<button class="fimbtn redo" onclick="treinarErradas()">&#8635; Treinar as '+errados.length+' que faltaram</button>';
  h+='<button class="fimbtn primary" onclick="abrirTudo()">&#127922; Embaralhar tudo de novo</button>'
   +'<button class="fimbtn" onclick="intro()">&#127183; Escolher outro baralho</button>'
   +'<button class="fimbtn" onclick="goHome()">&#127968; Menu do site</button>'
   +'</div></div>';
  $('stage').innerHTML=h;
}
function treinarErradas(){
  deck=shuffle(errados);idx=0;errados=[];acertos=0;revisao=true;carta();
}
</script>
<script>window.SERA_CFG={trKey:'geo2_dica',lang:'pt-BR',rate:.9,stars:120,somKey:'geo2_som',voicePrefs:['Thalita','Antonio','Antônio','Google portugu','Maria','Daniel']};</script>
<script src="serafina-core.js?v=20260810"></script>
<script>window.SERA_ACCENT={accent:'#34d399'};</script>
