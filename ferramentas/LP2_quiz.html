<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7ed">
<title>Quiz de Portugues</title>
<style>
:root{--fs:1;--bg:#fff7ed;--bg2:#ffedd5;--ink:#3b2f2f;--card:#fff;--accent:#fb923c;--accent-soft:#fde68a;--ok:#16a34a;--no:#ef4444;--rad:24px}
body.dark{--bg:#1a1730;--bg2:#241f3d;--ink:#f5f3ff;--card:#2a2548;--accent-soft:#4c3f7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Comic Sans MS','Trebuchet MS','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{display:flex;flex-direction:column;min-height:100dvh}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.topbar .title{font-weight:800;font-size:calc(1.05rem*var(--fs));color:var(--accent);flex:1}
.iconbtn{width:44px;height:44px;border:none;border-radius:13px;background:var(--accent-soft);color:var(--ink);font-size:1.2rem;cursor:pointer}
.iconbtn:active{transform:scale(.9)}
.bar{height:8px;background:var(--accent-soft)}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:520px;background:var(--card);border-radius:var(--rad);box-shadow:0 10px 30px rgba(180,120,30,.18);padding:24px 20px;text-align:center}
.qnum{font-size:.85rem;font-weight:800;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.qfig{font-size:calc(3.2rem*var(--fs));margin:8px 0;filter:drop-shadow(0 5px 8px rgba(0,0,0,.15))}
.q{font-size:calc(1.3rem*var(--fs));font-weight:800;line-height:1.35;margin:6px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 16px;border:2px solid var(--accent-soft);border-radius:16px;background:transparent;color:var(--ink);font-size:calc(1.1rem*var(--fs));font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;font-size:calc(1.1rem*var(--fs));font-weight:800;min-height:1.4em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.next{margin-top:16px;width:100%;height:54px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer;display:none}
.next.show{display:block}
.next:active{transform:scale(.97)}
.fim .big{font-size:4rem}
.fim .score{font-size:1.6rem;font-weight:900;color:var(--accent);margin:10px 0}
.again{margin-top:12px;background:var(--accent-soft);border:none;border-radius:14px;padding:12px 22px;font-size:1rem;font-weight:800;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" title="Inicio" onclick="if(confirm('Voltar ao inicio?'))location.href='../index.html'">&#127968;</button>
    <span class="title">Quiz de Portugues</span>
    <button class="iconbtn" title="Tema" onclick="document.body.classList.toggle('dark')">&#127769;</button>
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="stage"><div class="card" id="card"></div></div>
</div>
<script>
const QUESTIONS = [
  { fig:"\u{1F3A8}", q:"Qual destes e um tipo de ARTE?", opts:["Musica","Correr","Dormir"], correct:0 },
  { fig:"\u{1F407}", q:"O que os homens das cavernas mais desenhavam na arte rupestre?", opts:["Animais","Carros","Celulares"], correct:0 },
  { fig:"\u{1F9F8}", q:"Quem e a boneca de pano falante do Sitio?", opts:["Emilia","Narizinho","Dona Benta"], correct:0 },
  { fig:"\u{1F9B5}", q:"Quem tem uma perna so e um gorro vermelho?", opts:["Saci","Pedrinho","Visconde"], correct:0 },
  { fig:"\u{2753}", q:"“Voce quer brincar__”  Qual sinal completa?", opts:["?",".","!"], correct:0 },
  { fig:"\u{2757}", q:"Qual sinal mostra alegria ou susto?", opts:["!",".",","], correct:0 },
  { fig:"\u{1F4AC}", q:"No dialogo, o que vem antes da fala de cada pessoa?", opts:["Travessao (—)","Virgula (,)","Til (~)"], correct:0 },
  { fig:"\u{1F445}", q:"ca__po  —  e M ou N?", opts:["M (campo)","N (canpo)","Os dois"], correct:0 },
  { fig:"\u{1F445}", q:"pe__te  —  e M ou N?", opts:["N (pente)","M (pemte)","Os dois"], correct:0 },
  { fig:"\u{1F4A1}", q:"Usamos a letra M antes de quais letras?", opts:["P e B","S e T","A e E"], correct:0 }
];
// embaralha as opcoes guardando o indice correto
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const deck = QUESTIONS.map(q=>{
  const idx=q.opts.map((t,i)=>({t,ok:i===q.correct}));
  shuffle(idx);
  return {fig:q.fig,q:q.q,opts:idx};
});
let cur=0, score=0;
const $=id=>document.getElementById(id);
function render(){
  $('bar').style.width=(cur/deck.length*100)+'%';
  const it=deck[cur];
  $('card').innerHTML=`
    <div class="qnum">Pergunta ${cur+1} de ${deck.length}</div>
    <div class="qfig">${it.fig}</div>
    <div class="q">${it.q}</div>
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt" onclick="answer(${i})">${o.t}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <button class="next" id="next" onclick="next()">${cur===deck.length-1?'Ver resultado \u{1F389}':'Proximo →'}</button>`;
}
function answer(i){
  const it=deck[cur];
  const btns=document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  const chosen=it.opts[i];
  if(chosen.ok){ btns[i].classList.add('ok'); $('fb').textContent='Acertou! \u{1F31F}'; $('fb').className='fb ok'; score++; }
  else{
    btns[i].classList.add('no');
    it.opts.forEach((o,k)=>{ if(o.ok) btns[k].classList.add('ok'); });
    $('fb').textContent='Quase! A resposta certa esta em verde. \u{1F60A}'; $('fb').className='fb no';
  }
  $('next').classList.add('show');
}
function next(){ cur++; if(cur<deck.length) render(); else fim(); }
function fim(){
  $('bar').style.width='100%';
  const msg = score===deck.length?'Voce gabaritou!':score>=7?'Muito bem!':'Bom treino — tente de novo!';
  $('card').innerHTML=`<div class="fim"><div class="big">\u{1F3C6}</div>
    <div class="score">${score} de ${deck.length}</div>
    <div style="font-weight:800">${msg}</div>
    <button class="again" onclick="location.reload()">↺ Jogar de novo</button></div>`;
}
render();
</script>
</body>
</html>
