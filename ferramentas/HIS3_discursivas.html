(function(){
  var L='abcdef', h='';
  function ln(n){ var s=''; for(var i=0;i<n;i++) s+='<div class="ln"></div>'; return s; }
  function ops(q,ce){ return '<ul class="ops">'+q.ops.map(function(o,i){ return '<li><b>'+L[i]+')</b><span class="p">('+(ce?'     ':'     ')+')</span><span class="tx">'+o+'</span></li>'; }).join('')+'</ul>'; }
  function corpo(q){
    var s='<p class="pede">'+q.pede+'</p>';
    if(q.figs) s+='<div class="figs">'+q.figs.map(function(f){ return '<img src="'+f+'" alt="">'; }).join('')+'</div>';
    if(q.figs2) s+='<div class="f2">'+q.figs2.map(function(f){ return '<figure><img src="'+f[0]+'" alt="'+f[1]+'"><figcaption>'+f[1]+'</figcaption></figure>'; }).join('')+'</div>';
    if(q.tipo==='marca') s+=ops(q);
    if(q.tipo==='ce') s+=ops(q,true);
    if(q.tipo==='classifica') s+='<div class="g9">'+q.itens.map(function(i){ return '<div><img src="'+i[0]+'" alt="'+i[1]+'"><small>'+i[1]+'</small><i></i></div>'; }).join('')+'</div>';
    if(q.tipo==='linhas') s+=ln(q.linhas);
    if(q.tipo==='desenho') s+='<div class="des"><div></div><div></div><div></div><span></span><span></span><span></span></div>';
    if(q.tipo==='texto') s+='<div class="txt"><b>'+q.tit+'</b><p>'+q.texto+'</p></div>'+q.subs.map(function(x,i){ return '<p class="sub"><b>'+L[i]+')</b> '+x[0]+'</p>'+ln(x[1]); }).join('');
    if(q.tipo==='campos') s+=q.campos.map(function(c){ return '<div class="cp"><span>'+c[0]+'</span><div class="ln"></div></div>'+ln(c[1]-1); }).join('');
    return s;
  }
  HIS3D.provas.forEach(function(p){
    for(var pag=1;pag<=4;pag++){
      h+='<section class="fl" data-p="'+p.id+'"><div class="marca" data-tipo="rotulo">SIMULADO</div><div class="mold">';
      if(pag===1) h+='<div><table class="cab"><tr><td><b>História</b></td><td><b>'+p.nome+'</b></td><td>Year 2 · 3º trimestre</td><td>Valor: 10,0</td></tr></table><div class="nome"><span>Nome:</span><span class="d">Data:</span></div><div class="inst"><b>INSTRUÇÕES</b><ul><li>Leia cada questão duas vezes.</li><li>Escreva com letra legível e confira a ortografia.</li><li>Dê respostas completas: diga de quem você está falando.</li><li>Não deixe questão em branco.</li><li>No fim, revise a prova inteira.</li></ul></div></div>';
      p.questoes.filter(function(q){ return q.pag===pag; }).forEach(function(q){ h+='<div class="q" id="'+p.id+q.n+'"><div class="qt"><span>Questão '+q.n+'</span><span>Pontuação: '+q.pts+' / ______</span></div>'+corpo(q)+'</div>'; });
      h+='<div class="pg">'+pag+'</div></div></section>';
    }
  });
  document.getElementById('folha').innerHTML=h;
  if(/prova=2/.test(location.search)) prova('B');
})();
</script>
