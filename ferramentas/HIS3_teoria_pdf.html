<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teoria de História (PDF)</title>
<!-- Página de IMPRESSÃO da teoria (HIS3): o gen/pdf_geo3.py imprime com o Chrome em A4 retrato.
     ?img=1 → com as fotos da aula; ?img=0 → resumo estruturado só com texto.
     Conteúdo = o MESMO window.HIS3_LICOES da teoria (nada escrito aqui). -->
<style>
@font-face{font-family:"Nunito";font-weight:200 1000;src:url(assets/fonts/nunito-latin.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:400 800;src:url(assets/fonts/baloo2-latin.woff2) format("woff2")}
@page{size:A4 portrait;margin:12mm 12mm 13mm}
:root{--tinta:#1d2b29;--tinta2:#4b5b58;--linha:#d5ddd8;--papel:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font:10.5pt/1.38 "Nunito",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.capa{display:flex;align-items:center;gap:5mm;padding:0 0 4mm;border-bottom:1.2pt solid var(--tinta);margin-bottom:5mm}
.qr{width:13mm;height:13mm;flex:0 0 auto;align-self:flex-start;opacity:.85}
.capa h1{font:800 20pt/1.05 "Baloo 2",sans-serif;margin:0}
.capa p{margin:1mm 0 0;font-weight:700;color:var(--tinta2)}
.lic{break-before:auto}
.lich{display:flex;align-items:center;gap:3.5mm;padding:2.6mm 4mm;border-radius:3.5mm;margin:0 0 3.5mm;
  background:color-mix(in srgb,var(--lc) 15%,#fff);border:1pt solid color-mix(in srgb,var(--lc) 55%,#fff);break-after:avoid}
.lich .n{flex:0 0 auto;width:9mm;height:9mm;border-radius:50%;display:grid;place-items:center;background:var(--lc);color:#fff;font:800 13pt/1 "Baloo 2",sans-serif}
.lich small{display:block;font-weight:800;font-size:7.5pt;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2)}
.lich b{font:800 14pt/1.1 "Baloo 2",sans-serif}
.tela{break-inside:avoid;margin:0 0 4mm;padding:0 0 3.5mm;border-bottom:.6pt solid var(--linha)}
.tela:last-child{border-bottom:none}
.tela h3{font:800 12pt/1.15 "Baloo 2",sans-serif;margin:0 0 2mm;color:var(--lcx)}
.tela h3 em{font-style:normal}
/* conteúdo vindo do HIS3_LICOES */
.m1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4mm;align-items:center}
.m1.topo{grid-template-columns:1fr}
.mg{display:grid;grid-template-columns:repeat(var(--mc),minmax(0,1fr));gap:4mm}
.mcol{display:flex;flex-direction:column;gap:2mm;min-width:0}
.mfig{margin:0;min-width:0}
.mfig>img{display:block;width:100%;max-height:50mm;object-fit:contain;border-radius:2mm;background:#f3f5f2}
.mg .mfig>img{max-height:40mm}
figcaption{text-align:justify;text-align-last:center;hyphens:auto;-webkit-hyphens:auto;font-size:8pt;font-weight:700;color:var(--tinta2);margin-top:1mm}
.mq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.5mm}
.mq3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mqf{margin:0;min-width:0}
.mqf img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2mm}
.mlin{display:flex;flex-direction:column;gap:1.6mm;min-width:0}
.m1.bio .mlin{display:grid;grid-template-columns:1fr 1fr;column-gap:5mm;row-gap:1.2mm;margin-top:2mm}
.mrod{margin-top:2.5mm}
.ml{margin:0}
.ml .mt,.mt{font-weight:900;color:var(--lcx)}
.mtab{border-collapse:collapse;width:100%;font-size:9pt}.mtab th,.mtab td{border:.5pt solid var(--linha);padding:1mm 1.5mm;text-align:left}
/* sem imagens: resumo estruturado em 2 colunas */
body.semimg .licgrid{column-count:2;column-gap:7mm;column-rule:.5pt solid var(--linha)}
body.semimg .tela{margin:0 0 2.6mm;padding:0 0 2.2mm}
body.semimg .tela h3{font-size:11pt;margin-bottom:1.2mm}
body.semimg .m1,body.semimg .mg{display:block}
body.semimg .mcol{display:block}
body.semimg .mlin{gap:1mm}
body.semimg .m1.bio .mlin{display:flex}
body.semimg .lic{break-inside:avoid;margin-bottom:3mm}
/* MANDAMENTO TIPOGRÁFICO (12/11): texto corrido justificado; itens apertados separados por linha fina na cor da lição */
.ml{text-align:justify;text-align-last:left;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.mlin{gap:1mm}
.mlin>.ml+.ml{padding-top:1mm;border-top:.5pt solid color-mix(in srgb,var(--lc) 25%,transparent)}
.m1.bio .mlin{row-gap:1mm}
.m1.bio .mlin>.ml:nth-child(2){padding-top:0;border-top:none}
body.semimg .mlin{gap:.8mm}
body.semimg .mlin>.ml+.ml{padding-top:.8mm}
body.semimg .m1.bio .mlin>.ml:nth-child(2){padding-top:.8mm;border-top:.5pt solid color-mix(in srgb,var(--lc) 25%,transparent)}
/* com imagens: o cabeçalho da lição nunca fica sozinho no pé da página (vai junto com a 1ª tela) */
.cab1{break-inside:avoid}
/* HIS3: preto e branco, tabela do conceito nas duas versões */
.lich{background:#f2f2f2!important;border-color:#777!important}.lich .n{background:#222!important}
.tela h3,.tela h3 em,.ml .mt,.mt{color:#000!important}
.mtab{border-collapse:collapse;width:100%}.mtab th{text-align:left;font-size:9pt}.mtab td{border:.6pt solid #999;padding:1mm 2.4mm}.mtab td:first-child{font-weight:800;white-space:nowrap}
.mfig.tab{align-items:stretch;width:100%}
svg.lamp{height:44mm;width:auto;filter:grayscale(1)}
.mg.h3 .mfig>img{height:32mm;object-fit:contain}
.mq{display:grid;grid-template-columns:1fr 1fr;gap:2mm}.mq3{grid-template-columns:repeat(3,1fr)}.mqf{margin:0}.mqf img{width:100%;height:26mm;object-fit:contain}
body.semimg{font-size:9.9pt;line-height:1.32}body.semimg .tela{margin-bottom:2mm!important;padding-bottom:1.6mm!important}body.semimg .m1 .mfig.tab{margin:0 0 2mm}
/* sem imagens: a matéria inteira corre em 2 colunas, sem sobra de página */
body.semimg #doc{column-count:2;column-gap:7mm;column-rule:.5pt solid #bbb}body.semimg .licgrid{column-count:auto!important}body.semimg .lic{break-inside:auto}
body.semimg .lich{margin:2mm 0 2.5mm;padding:1.6mm 3mm}body.semimg .lich .n{width:7mm;height:7mm;font-size:11pt}body.semimg .lich b{font-size:12pt}
.mfig,.mfig>img,.mqf img{background:#fff!important}.mfig>img{max-height:41mm!important}.mg .mfig>img{max-height:27mm!important;height:27mm}.mqf img{height:23mm}svg.lamp{height:36mm}.tela{margin-bottom:3mm!important;padding-bottom:2.4mm!important}
</style>

<body>
<div class="capa"><div style="flex:1"><h1>História · Teoria</h1><p data-tipo="rotulo">2º ano · 3º trimestre</p></div></div>
<main id="doc"></main>
<script src="HIS3_estudo_licoes.js?v=b64329b1137"></script>
<script>
(function(){
  var COM = !/[?&]img=0/.test(location.search);
  document.body.classList.toggle('semimg', !COM);
  if(!COM) document.title='Teoria de História (resumo, sem imagens)';
  function esc(s){ return String(s); }
  function escurece(h){ /* cor do texto legível no branco: escurece a cor da lição */
    h=h.replace('#',''); var c=[0,2,4].map(function(i){ return parseInt(h.substr(i,2),16); });
    var l=(0.299*c[0]+0.587*c[1]+0.114*c[2]); var f=l>120?120/l:1; f=Math.min(f,.78);
    return 'rgb('+c.map(function(v){ return Math.round(v*f); }).join(',')+')'; }
  var doc=document.getElementById('doc'), out='';
  HIS3_LICOES.forEach(function(l,i){
    var cor=l.cor||'#16a34a';
    out+='<section class="lic" style="--lc:'+cor+';--lcx:'+escurece(cor)+'"><div class="lich"><span class="n">'+(i+1)+'</span><div><small>Lição '+(i+1)+' de '+HIS3_LICOES.length+'</small><b>'+esc(l.nome)+'</b></div></div><div class="licgrid">';
    l.telas.forEach(function(t){
      if(t.tipo!=='texto'||t.desafio) return;
      var h=t.html;
      out+='<div class="tela"><h3>'+t.tit+'</h3>'+h+'</div>';
    });
    out+='</div></section>';
  });
  doc.innerHTML=out; doc.querySelectorAll('td,th').forEach(function(e){ e.setAttribute('data-tipo','rotulo'); });
  if(COM) doc.querySelectorAll('.lic').forEach(function(l){ var h=l.querySelector('.lich'), t=l.querySelector('.tela');
    if(h&&t){ var w=document.createElement('div'); w.className='cab1'; h.parentNode.insertBefore(w,h); w.appendChild(h); w.appendChild(t); } });
  /* impressão em preto e branco: figura em cinza clareado (gen/figuras_pb.py) */
  doc.querySelectorAll('img').forEach(function(e){ e.src=e.getAttribute('src').replace('media/his3/','media/his3/pb/'); });
  doc.querySelectorAll('.mfig').forEach(function(f){ if(f.querySelector('table')) f.classList.add('tab'); });
  if(!COM) doc.querySelectorAll('.mfig:not(.tab),.mq,img').forEach(function(e){ e.remove(); });
  /* o gerador espera este sinal (todas as fotos carregadas) */
  var imgs=[].slice.call(document.images), falta=imgs.length;
  function pronto(){ document.body.setAttribute('data-pronto','1'); }
  if(!falta) pronto(); else imgs.forEach(function(im){ if(im.complete){ if(--falta===0) pronto(); } else { im.onload=im.onerror=function(){ if(--falta===0) pronto(); }; } });
})();
</script>
</body>
