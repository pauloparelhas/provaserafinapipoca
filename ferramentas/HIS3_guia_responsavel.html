<script>
(function(){
  var L='abcdef', h='<h1>História · Guia do responsável</h1><div class="sub" data-tipo="rotulo">Duas provas de treino · Year 2 · 3º trimestre</div>';
  h+='<div class="quadro"><h3 data-tipo="rotulo">Como são as provas</h3><p>Cada prova tem 10 questões e vale 10 pontos: 5 sobre fontes históricas e 5 sobre profissões e mudanças no tempo. Mais da metade dos pontos depende de escrever: classificar imagens, desenhar e nomear, comparar antes e hoje, ler um texto e explicar.</p></div>';
  h+='<div class="quadro"><h3 data-tipo="rotulo">Como aplicar</h3><ol><li>Uma prova por dia, de uma vez só, com lápis e borracha. Reserve uns 50 minutos, sem pressa.</li><li>A criança lê sozinha. Se travar, leia o enunciado em voz alta, sem explicar a resposta.</li><li>As respostas saem na última folha impressa: guarde antes de começar.</li><li>Corrija junto no mesmo dia. O que errou na Prova 1 volta na Prova 2 com outras imagens.</li></ol></div>';
  h+='<div class="quadro"><h3 data-tipo="rotulo">O que mais tira pontos na resposta escrita</h3><ul><li><b>Não dizer de quem se fala.</b> “Para saber como eles viviam”: eles quem? Melhor: “como as pessoas viviam”.</li><li><b>Contar só um dos tempos.</b> Quando a pergunta pede a diferença, a frase precisa de “Antigamente…” e “Hoje…”.</li><li><b>Responder metade.</b> “Escreva e explique”, “desenhe e escreva”, “as alternativas”: são dois pedidos.</li><li><b>Ortografia das palavras-chave:</b> visual, escrita, tecnologia, avançou, antigamente, profissão.</li></ul></div>';
  h+='<div class="quadro"><h3 data-tipo="rotulo">Dois casos que confundem</h3><ul><li><b>Livro.</b> Livros fechados, como objeto, são fonte material; o que está escrito neles é fonte escrita.</li><li><b>Mapa.</b> É imagem: fonte visual. As palavras escritas nele podem ser consideradas escrita. Se a pergunta aceitar só uma resposta, comece por visual.</li></ul></div>';
  HIS3D.provas.forEach(function(p){
    h+='<h2 data-tipo="rotulo">'+p.nome+'</h2>';
    p.questoes.forEach(function(q){
      h+='<div class="q"><div class="top"><span class="n">'+q.n+'</span><span class="pede" data-tipo="rotulo">'+q.pede+' <small>('+q.pts+')</small></span></div>';
      if(q.ops&&q.tipo==='ce') h+='<div class="campo">'+q.ops.map(function(o,i){ return '<b>'+L[i]+')</b> '+o; }).join(' ')+'</div>';
      if(q.subs) h+='<div class="campo">'+q.subs.map(function(o,i){ return '<b>'+L[i]+')</b> '+o[0]; }).join(' ')+'</div>';
      h+='<div class="campo m"><b>Resposta-modelo:</b> '+q.modelo+'</div><div class="campo"><b>Aceite também:</b> '+q.aceitar+'</div><div class="campo o"><b>O que observar:</b> '+q.observar+'</div><div class="campo"><b>Pergunta de conversa:</b> '+q.conversa+'</div></div>';
    });
  });
  document.getElementById('guia').innerHTML=h;
})();
</script>
