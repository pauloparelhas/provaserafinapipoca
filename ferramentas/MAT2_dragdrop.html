<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Sort it! — Math · 2-D Figures</title>
<link rel="stylesheet" href="serafina-core.css?v=20260817">
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#102a3a;--ink:#f0f9ff;--soft:rgba(255,255,255,.55);--card:#13243a;--line:rgba(255,255,255,.12);--accent:#a78bfa;--accent2:#fbbf24;--tr:#fcd34d;--ok:#34d399;--no:#f87171;--mid:#fbbf24;--rad:22px}
body.light{--bg:#e0f2fe;--bg2:#dbeafe;--ink:#0c1e33;--soft:rgba(0,0,0,.5);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.92rem*var(--fs));color:var(--accent);flex:1;line-height:1.1}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;padding:0 8px}
.iconbtn:active{transform:scale(.9)}
.dicabtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.4;filter:grayscale(1)}
.dicabtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .dicabtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.bar{height:9px;background:var(--line)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .35s}
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:14px 12px 110px}
.card{position:relative;width:100%;max-width:600px;background:var(--card);border-radius:var(--rad);box-shadow:0 14px 40px rgba(0,0,0,.35);padding:18px 14px 22px;border:1px solid var(--line)}
/* translation (BR flag) */
.tr{display:none;color:var(--tr);font-style:italic;font-weight:700;line-height:1.25}
body.show-tr .tr{display:block}
/* ---- INTRO ---- */
.intro{text-align:center}
.qfig{font-size:calc(3rem*var(--fs));margin:6px 0 2px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.q{font-size:calc(1.22rem*var(--fs));font-weight:900;line-height:1.3;margin:6px 0 2px}
.intro p{font-size:calc(.98rem*var(--fs));font-weight:700;line-height:1.5;color:var(--soft);margin:8px 0}
.gamelist{display:flex;flex-direction:column;gap:9px;margin:14px 0 4px}
.gamechip{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:transparent;color:var(--ink);font-weight:900;cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
.gamechip:active{transform:scale(.98)}
.gamechip:hover{border-color:var(--accent);background:linear-gradient(135deg,rgba(56,189,248,.14),rgba(251,146,60,.08))}
.gamechip .ge{font-size:1.7rem;flex-shrink:0;width:46px;height:46px;border-radius:13px;background:var(--line);display:flex;align-items:center;justify-content:center}
.gamechip .gt{flex:1}
.gamechip .gt b{font-size:calc(1rem*var(--fs));display:block}
.gamechip .gt .gtr{font-size:.78rem}
.gamechip .gn{font-size:.7rem;font-weight:900;color:var(--soft);background:var(--line);border-radius:20px;padding:3px 9px}
.gamechip.done{border-color:var(--ok)}
.gamechip.done .gn{background:var(--ok);color:#06251a}
.startbtn{width:100%;height:54px;border:none;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08263a;font-size:1.08rem;font-weight:900;cursor:pointer;font-family:inherit;margin-top:8px}
.startbtn:active{transform:scale(.97)}
/* ---- GAME HEADER ---- */
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-right:50px}
.ghead .gemo{font-size:1.8rem}
.ghead .gname{font-weight:900;font-size:calc(1.06rem*var(--fs));line-height:1.1;flex:1}
.gnum{font-size:.68rem;font-weight:900;color:var(--soft);letter-spacing:1px;text-transform:uppercase}
/* a TAREFA (o que a crianca tem de fazer) e a linha mais legivel da tela */
.ginfo{font-size:calc(1rem*var(--fs));font-weight:900;color:var(--ink);line-height:1.3;margin:10px 0 2px;padding:10px 12px;border-radius:14px;background:rgba(52,211,153,.12);border-left:5px solid var(--accent);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ginfo .tr{font-size:.84rem;font-weight:700}
.listen{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:.78rem;border-radius:18px;padding:5px 14px;cursor:pointer;font-family:inherit}
.listen:active{transform:scale(.95)}
/* ---- BOARD (colour-coded drop columns) ---- */
.board{display:flex;gap:8px;margin:14px 0 4px;align-items:stretch}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;border:3px solid var(--line);border-radius:16px;padding:6px 5px 9px;min-height:152px;transition:.12s;background:rgba(255,255,255,.04)}
.col.over{box-shadow:0 0 0 3px var(--cc,#38bdf8) inset,0 0 18px var(--cc,#38bdf8);transform:translateY(-2px)}
.col-head{text-align:center;font-weight:900;line-height:1.05;padding:6px 2px 7px;margin-bottom:2px;border-radius:11px}
.col-head .che{font-size:1.5rem;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.col-head .cnm{font-size:calc(.86rem*var(--fs))}
.col-head .ctr{display:none;font-style:italic;font-weight:700;font-size:.66rem;opacity:.9}
body.show-tr .col-head .ctr{display:block}
.col-cards{display:flex;flex-direction:column;gap:6px;flex:1}
.col-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:1.5rem;opacity:.22;min-height:46px}
/* ---- POOL ("bag" of cards to sort) ---- */
.poolwrap{margin-top:14px;border-top:1px dashed var(--line);padding-top:11px}
.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:8px 0 2px;min-height:30px}
.poolhint{text-align:center;font-size:.78rem;font-weight:800;color:var(--soft);letter-spacing:.3px;line-height:1.4}
/* ---- DRAGGABLE CARDS (high contrast tiles) ---- */
.dcard{position:relative;padding:11px 13px;border:2.5px solid #5ab0e0;border-radius:14px;background:linear-gradient(135deg,#eaf4ff,#c7e2fb);color:#0c1e33;font-size:calc(.95rem*var(--fs));font-weight:800;cursor:grab;font-family:inherit;line-height:1.2;touch-action:none;transition:transform .1s,box-shadow .12s;box-shadow:0 4px 12px rgba(0,0,0,.42);user-select:none;text-align:center}
body.light .dcard{background:#fff;border-color:#1d6fa5;box-shadow:0 3px 9px rgba(0,0,0,.18)}
.dcard:active{cursor:grabbing}
.dcard.incol{border-color:var(--cc,#5ab0e0);background:#fff;font-size:calc(.85rem*var(--fs));padding:10px 24px 10px 11px;min-height:44px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.32)}
.dcard.sel{border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.5);transform:scale(1.05)}
.dcard.ok{background:var(--ok)!important;color:#06251a!important;border-color:#059669!important}
.dcard.no{background:var(--no)!important;color:#3a0a0a!important;border-color:#b91c1c!important}
.dcard.locked{cursor:default}
.dcard .dtr{display:none;color:#1d6fa5;font-style:italic;font-weight:700;font-size:.72rem;margin-top:2px}
body.show-tr .dcard .dtr{display:block}
.dcard.ok .dtr,.dcard.no .dtr{color:inherit;opacity:.85}
.dcard .rm{display:none;position:absolute;top:50%;right:5px;transform:translateY(-50%);width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.16);color:#0c1e33;font-size:.82rem;font-weight:900;line-height:19px;text-align:center}
.dcard.incol:not(.locked) .rm{display:block}
.dcard .fix{display:none;font-size:.64rem;font-weight:900;margin-top:3px;color:#3a0a0a;text-transform:uppercase;letter-spacing:.3px}
.dcard.no .fix{display:block}
.dclone{position:fixed;z-index:999;pointer-events:none;box-shadow:0 14px 30px rgba(0,0,0,.55);transform:scale(1.08) rotate(-2deg);opacity:.97}
/* ---- FEEDBACK / BUTTONS ---- */
.fb{margin-top:14px;text-align:center;font-size:calc(1.02rem*var(--fs));font-weight:900;min-height:1.3em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.tip{display:none;margin:10px 0 2px;padding:11px 13px;border-radius:14px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);font-weight:800;font-size:calc(.9rem*var(--fs));line-height:1.4;color:var(--ink)}
.tip.show{display:block}
.tip .lab{display:block;font-size:.66rem;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.tip .tptr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.8rem;margin-top:4px}
body.show-tr .tip .tptr{display:block}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.btn{width:100%;padding:14px 14px;border:2px solid var(--line);border-radius:15px;background:transparent;color:var(--ink);font-size:1rem;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.primary{border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08263a}
.btn.redo{border-color:var(--no);background:rgba(248,113,113,.14);color:var(--ink)}
.btn.show{border-color:var(--accent2);background:rgba(251,191,36,.14);color:var(--ink)}
.btn.ghost{opacity:.85;font-size:.92rem;padding:11px 12px}
.btn:disabled{opacity:.4;cursor:default}
.btn .etr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.74rem}
body.show-tr .btn .etr{display:block}
/* ---- FINISH ---- */
.fim{text-align:center}
.fim .big{font-size:4rem}
.fim .score{font-size:1.6rem;font-weight:900;color:var(--accent);margin:8px 0 2px}
.fim .sub{font-weight:800;color:var(--soft);font-size:.95rem;margin-bottom:6px}
/* ---- question/game nav arrows ---- */
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;justify-content:center;gap:14px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--card) 55%,rgba(0,0,0,0))}
.qnav.show{display:flex}
.qnav-btn{flex:1;max-width:170px;height:50px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);font-size:1.4rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.qnav-btn .ql{font-size:.76rem;font-weight:900;letter-spacing:.5px}
.qnav-btn:disabled{opacity:.32;cursor:default;box-shadow:none}
.qnav-btn:active:not(:disabled){transform:scale(.96)}
/* ---- lock / fullscreen ---- */
/* confetti */
.confetti{position:fixed;top:-12px;width:11px;height:14px;z-index:80;pointer-events:none;border-radius:2px}
@media(max-width:380px){.col-head .cnm{font-size:.72rem}.dcard{font-size:.84rem;padding:8px 8px}}
/* GEO: 5 regioes nao cabem em 1 linha no celular - quebra em grade */
.board{flex-wrap:wrap}
.board .col{flex:1 1 30%;min-width:96px}
@media(max-width:520px){.board .col{flex:1 1 30%;min-width:88px;min-height:118px}.col-head{flex-direction:column;gap:0;padding:4px 2px}.col-head .cnm{font-size:.7rem;line-height:1.05;text-align:center}.col-head .ctr{font-size:.6rem;text-align:center}}


.sombtn{transition:opacity .15s}
.sombtn.off{opacity:.45;background:rgba(248,113,113,.18)}

/* ---------- a sacola de cartas: fica claro que e DALI que se arrasta ---------- */
.poolwrap{border-top:2px dashed var(--accent2);background:rgba(251,191,36,.07);border-radius:0 0 16px 16px;padding:11px 8px 4px;margin-left:-6px;margin-right:-6px}
.poolhint{color:var(--ink);font-weight:900;font-size:.84rem}
/* ---------- mouse (notebook) ---------- */
@media (hover:hover){
  .btn:not(:disabled):hover{border-color:var(--accent)}
  .btn.primary:hover,.startbtn:hover{opacity:.93}
  .dcard:hover{transform:translateY(-2px)}
}
/* ---------- telas largas (notebook) ---------- */
@media (min-width:1000px){
  .card{max-width:820px;padding:22px 22px 26px}
  .col{min-height:180px}
  .actions{flex-direction:row;flex-wrap:wrap}
  .actions .btn{flex:1 1 42%;width:auto}
}
/* ---------- celular em PAISAGEM: tabuleiro a esquerda, sacola e botoes a direita
   (a altura e o recurso escasso; assim nada fica escondido abaixo da dobra) ---------- */
@media (orientation:landscape) and (max-height:520px){
  .topbar{padding:5px 8px}
  .bar{height:6px}
  .stage{padding:8px 10px 66px}
  .card{max-width:min(97vw,920px);padding:12px 14px 14px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);column-gap:14px;align-content:start}
  .card>.intro,.card>.fim{grid-column:1/-1}
  .ghead{grid-column:1/-1;margin-bottom:2px;padding-right:0}
  .ghead .gemo{font-size:1.4rem}
  .ginfo{grid-column:1/-1;margin:6px 0 0;padding:7px 10px;font-size:calc(.92rem*var(--fs))}
  .board{grid-column:1;grid-row:3/span 4;margin:8px 0 0}
  .col{min-height:96px}
  .poolwrap{grid-column:2;grid-row:3;margin:8px 0 0;border-top:none;border:2px dashed var(--accent2);border-radius:14px;padding:8px 6px 4px}
  .tip{grid-column:2;grid-row:4;margin:8px 0 0;padding:8px 10px}
  .fb{grid-column:2;grid-row:5;margin-top:8px;font-size:calc(.92rem*var(--fs))}
  .actions{grid-column:2;grid-row:6;gap:6px;margin-top:8px}
  .btn{min-height:44px;padding:8px 10px;font-size:.88rem;border-radius:13px}
  .btn.ghost{min-height:44px;padding:8px 10px;font-size:.8rem}
  .dcard{padding:8px 10px;font-size:calc(.86rem*var(--fs))}
  .qnav{padding:4px 10px calc(4px + env(safe-area-inset-bottom))}
  .qnav-btn{height:44px}
  .gamelist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
  .gamechip{padding:8px 12px}
  .gamechip .ge{width:38px;height:38px;font-size:1.3rem}
  .qfig{font-size:calc(1.8rem*var(--fs));margin:0}
  .startbtn{height:48px}
  .fim .big{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

/* ---- 360px: a barra de cima nao cabia numa linha ----------------------
   8 botoes de 44px + gaps dao 427px: a lockbtn nascia CORTADA fora da tela
   (defeito herdado do GEO2, medido no QA de 17/08). O titulo sobe para a
   propria linha e os botoes dividem a largura restante; a altura de toque
   continua 44px. */
@media(max-width:420px){
  .topbar{flex-wrap:wrap;gap:4px}
  .topbar .title{flex:0 0 100%;order:-1;margin-bottom:1px}
  .topbar .iconbtn{min-width:0;flex:1 1 0;padding:0 4px}
}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn sera-home" title="Início" onclick="goHome()">&#127968;</button>
    <span class="title">Arrasta e classifica</span>
    <button class="iconbtn dicabtn" id="dica" title="Ver em português" onclick="toggleTr()">&#127463;&#127479;<span class="ft">PT</span></button>
    <button class="iconbtn" title="Letra menor" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Letra maior" onclick="fs(1)">A+</button>
    <button class="iconbtn sombtn" id="sombtn" title="Desligar a voz" aria-pressed="false" onclick="toggleSom()">&#128266;</button>
    <button class="iconbtn" title="Tema" onclick="document.body.classList.toggle('light')">&#127769;</button>
    <button class="iconbtn lockbtn" id="lockbtn" title="Tela cheia e travar" onclick="toggleLock()">&#128274;</button>
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="stage"><div class="card" id="card"></div></div>
</div>
<div class="qnav" id="qnav">
  <button class="qnav-btn" id="navPrev" onclick="prevGame()" title="Jogo anterior">&#8249;<span class="ql">Voltar</span></button>
  <button class="qnav-btn" id="navNext" onclick="nextGame()" title="Próximo jogo">&#8250;<span class="ql">Próximo</span></button>
</div>
<script src="MAT2_data.js?v=20260817"></script>
<script>
/* ============================================================
   ARRASTA E CLASSIFICA · Matematica Y2 · Unit 9 (2-D Geometry)
   English first; PT translation toggled by the BR flag.
   ALL data anchored to trabalho/2tri_ciencias/_roteiro.md and
   validated by the `pedagogico` agent (3 fixes applied).
   Each card belongs to EXACTLY ONE column. No mixed axes
   (state vs optical never on the same board). No cross-state
   synthesis (never a property common to all three states).
   ============================================================ */

/* ---- state ---- */
var gi=0;                 // current game index
var place={};             // cardId -> colId (or undefined = in pool)
var locked={};            // cardId -> true (correct & frozen after check)
var sel=null;             // selected card id (tap mode)
var checked=false;
var doneGames={};         // game index -> true (all correct)
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;').replace(/'/g,"\\'");}

/* ---- helpers ---- */
function G(){return GAMES[gi];}
function cardId(i){return 'c'+i;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function poolOrder(){ // shuffled order of card ids not yet placed
  var ids=G().cards.map((_,i)=>cardId(i)).filter(id=>!place[id]);
  return shuffle(ids);
}
var _poolCache=[];

/* ============================================================
   INTRO — list of the games
   ============================================================ */
function intro(){
  $('bar').style.width='0%';
  $('qnav').classList.remove('show');
  checked=false;sel=null;
  $('card').innerHTML='<div class="intro">'
    +'<div class="qfig">\u{1F9F2}</div>'
    +'<div class="q">Arrasta e classifica</div>'
    +'<div class="tr" style="font-size:1rem;margin-top:2px">Toque na 🇧🇷 para ler em português.</div>'
    +'<p>Arraste cada carta para a caixa certa. Depois toque em <b>Conferir</b> para ver o que acertou — e refaça as que errar.'
    +'<span class="tr">Leia a carta em voz alta em inglês antes de arrastar. Se não entender, toque na 🇧🇷.</span></p>'
    +'<div class="gamelist">'
    +GAMES.map((g,i)=>'<button class="gamechip'+(doneGames[i]?' done':'')+'" onclick="openGame('+i+')">'
        +'<span class="ge">'+g.emo+'</span>'
        +'<span class="gt"><b>'+g.en+'</b><span class="gtr tr">'+g.pt+'</span></span>'
        +'<span class="gn">'+(doneGames[i]?'✔':(i+1))+'</span></button>').join('')
    +'</div>'
    +'<button class="startbtn" onclick="openGame(0)">▶ Começar pelo jogo 1<span class="tr" style="display:inline;color:#08263a"></span></button>'
    +'<p style="font-size:.78rem;margin-top:10px">Como jogar: <b>toque</b> numa carta e depois numa caixa para colocar · toque numa carta <b>dentro da caixa</b> para tirá-la.</p>'
    +'</div>';
}
function openGame(i){ gi=i; place={}; locked={}; sel=null; checked=false; _poolCache=poolOrder(); render(); }

/* ============================================================
   RENDER a game board
   ============================================================ */
function render(){
  /* clear any clone left floating from a drag that got interrupted by this render */
  if(!drag){ var _cl=document.querySelectorAll('.dclone'); for(var _i=0;_i<_cl.length;_i++)_cl[_i].remove(); }
  var g=G();
  $('bar').style.width=((gi+(checked?1:0.5))/GAMES.length*100)+'%';
  // keep pool order stable across re-renders, but add any cards sent back to pool
  var inPool=g.cards.map((_,i)=>cardId(i)).filter(id=>!place[id]);
  _poolCache=_poolCache.filter(id=>inPool.indexOf(id)>-1);
  inPool.forEach(id=>{ if(_poolCache.indexOf(id)<0) _poolCache.push(id); });

  var html='<div class="ghead"><span class="gemo">'+g.emo+'</span>'
    +'<span class="gname">'+g.en+'<div class="tr" style="font-size:.82rem">'+g.pt+'</div></span>'
    +'<span class="gnum">'+(gi+1)+'/'+GAMES.length+'</span></div>'
    +'<div class="ginfo"><span>'+g.info+'<span class="tr">'+g.infopt+'</span></span>'
    +'<button class="listen" onclick="say(\''+esc(g.info)+'\')">\u{1F50A} Ouvir</button></div>'
    +'<div class="board">';
  g.cols.forEach(c=>{
    var placed=g.cards.map((card,i)=>i).filter(i=>place[cardId(i)]===c.id);
    html+='<div class="col" data-col="'+c.id+'" style="--cc:'+c.co+';border-color:'+c.co+';background:'+rgba(c.co,.10)+'">'
      +'<div class="col-head" style="color:'+c.co+';background:'+rgba(c.co,.18)+'"><span class="che">'+c.emo+'</span>'
      +'<span class="cnm">'+c.en+'</span><span class="ctr">'+c.pt+'</span></div><div class="col-cards" data-col="'+c.id+'">';
    placed.forEach(i=>{ html+=dcardHTML(i,true,c.co); });
    if(!placed.length) html+='<div class="col-empty">⬇</div>';
    html+='</div></div>';
  });
  html+='</div>';
  // pool
  html+='<div class="poolwrap"><div class="poolhint" id="poolhint"></div><div class="pool" id="pool">';
  _poolCache.forEach(id=>{ var i=+id.slice(1); html+=dcardHTML(i,false); });
  html+='</div></div>';
  // tip (revealed after check)
  html+='<div class="tip" id="tip"><span class="lab">\u{1F4A1} Lembre-se</span>'+g.tip+'<div class="tptr">'+g.tippt+'</div></div>';
  html+='<div class="fb" id="fb"></div>';
  html+='<div class="actions" id="actions"></div>';
  $('card').innerHTML=html;
  buildActions();
  bindBoard();
  bindCards();
  updatePoolHint();
  // re-apply check colors if already checked
  if(checked) paintCheck();
  showNav();
}
function dcardHTML(i,incol,co){
  var c=G().cards[i];var id=cardId(i);
  var cls='dcard'+(incol?' incol':'')+(sel===id?' sel':'')+(locked[id]?' locked ok':'');
  var st=(incol&&co)?' style="border-color:'+co+'"':'';
  return '<div class="'+cls+'" data-id="'+id+'"'+st+'>'
    +(incol?'<span class="rm">✕</span>':'')+c.en
    +'<div class="dtr">'+c.pt+'</div>'
    +'<div class="fix"></div></div>';
}
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function updatePoolHint(){
  var n=_poolCache.length, tot=G().cards.length;
  var h=$('poolhint'); if(!h)return;
  if(n===0) h.innerHTML='Tudo colocado! Toque em <b>Conferir</b>.';
  else h.innerHTML='Arraste estas &darr; · <b>'+(tot-n)+' / '+tot+'</b> colocadas';
}

/* ============================================================
   DRAG (pointer) + TAP placement
   ============================================================ */
function bindCards(){
  document.querySelectorAll('.dcard').forEach(el=>{
    if(el.classList.contains('locked'))return;
    el.addEventListener('pointerdown',onDown);
  });
}
var drag=null;
/* remove ANY floating clone + reset the dragged card's opacity.
   Belt-and-suspenders against a clone getting orphaned on the screen. */
function killClones(){
  var cl=document.querySelectorAll('.dclone');
  for(var i=0;i<cl.length;i++) cl[i].remove();
  if(drag && drag.el) drag.el.style.opacity='';
  clearHighlight();
}
function endDrag(){
  if(drag){
    try{drag.el.releasePointerCapture(drag.pid);}catch(_){}
    if(drag.el) drag.el.style.opacity='';
  }
  window.removeEventListener('pointermove',onMove);
  window.removeEventListener('pointerup',onUp);
  window.removeEventListener('pointercancel',onUp);
  killClones();
  drag=null;
}
function onDown(e){
  if(checked && drag===null && !canMove(e.currentTarget.dataset.id))return;
  var el=e.currentTarget;
  if(locked[el.dataset.id])return;
  if(drag) endDrag();                 // never start a 2nd drag with one still live
  e.preventDefault();
  drag={el:el,id:el.dataset.id,sx:e.clientX,sy:e.clientY,moved:false,clone:null,pid:e.pointerId};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  /* listen on window, not the card: survives a re-render that would wipe the
     card's own listeners and otherwise strand the clone mid-screen */
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);
}
function canMove(id){ return !locked[id]; }
function onMove(e){
  if(!drag)return;
  if(e.pointerId!==drag.pid)return;   // ignore a second finger
  var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy)>8){
    drag.moved=true;
    var r=drag.el.getBoundingClientRect();
    var cl=drag.el.cloneNode(true);
    cl.classList.add('dclone');cl.classList.remove('sel');
    cl.style.width=r.width+'px';cl.style.left=r.left+'px';cl.style.top=r.top+'px';
    document.body.appendChild(cl);
    drag.clone=cl;drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;
    drag.el.style.opacity='.25';
  }
  if(drag.moved && drag.clone){
    drag.clone.style.left=(e.clientX-drag.ox)+'px';
    drag.clone.style.top=(e.clientY-drag.oy)+'px';
    highlight(colUnder(e));
  }
}
function onUp(e){
  if(!drag)return;
  if(e.pointerId!==drag.pid && e.type!=='pointercancel')return;
  var d=drag, col=d.moved?colUnder(e):null;
  endDrag();                          // tears down listeners + clone FIRST, always
  if(d.moved){
    if(col) placeCard(d.id,col);
    else if(place[d.id]) removeFromCol(d.id);   // dragged a placed card out → back to bag
    else render();
  }else{
    if(place[d.id]) removeFromCol(d.id);         // tap a placed card → take it out
    else selectCard(d.id);                       // tap a bag card → select it
  }
}
/* if the tab loses focus mid-drag (notification, app switch), clean up */
window.addEventListener('blur',function(){ if(drag) endDrag(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden && drag) endDrag(); });
function removeFromCol(id){
  if(locked[id])return;
  delete place[id];
  if(checked)checked=false;
  sel=null;
  if(_poolCache.indexOf(id)<0)_poolCache.push(id);
  render();
}
function colUnder(e){
  var el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el)return null;
  var c=el.closest('.col');
  return c?c.dataset.col:null;
}
function highlight(col){
  document.querySelectorAll('.col').forEach(c=>c.classList.toggle('over',c.dataset.col===col));
}
function clearHighlight(){document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));}

function selectCard(id){
  if(locked[id])return;
  sel = (sel===id)? null : id;
  // speak the card when picked up
  if(sel){ var i=+id.slice(1); say(G().cards[i].en); }
  document.querySelectorAll('.dcard').forEach(el=>el.classList.toggle('sel',el.dataset.id===sel));
}
function placeCard(id,col){
  if(locked[id])return;
  place[id]=col;
  sel=null;
  if(checked){ checked=false; }   // moving after a check re-opens it
  render();
  var i=+id.slice(1); say(G().cards[i].en);
}
/* tapping a column with a selected card */
function bindBoard(){
  document.querySelectorAll('.col').forEach(c=>{
    c.addEventListener('click',function(ev){
      if(sel && !drag){ placeCard(sel,c.dataset.col); }
    });
  });
}

/* ============================================================
   ACTIONS (Check / Redo wrong / Next)
   ============================================================ */
function buildActions(){
  var a=$('actions'); if(!a)return;
  var reveal='<button class="btn show" onclick="revealAnswers()">\u{1F5C2}️ Ver as respostas<span class="etr"></span></button>';
  var summary='<button class="btn" onclick="cieSummary.show(G())">\u{1F4CB} Ver o resumo<span class="etr"></span></button>';
  var reset='<button class="btn ghost" onclick="resetGame()">↺ Recomeçar este jogo<span class="etr"></span></button>';
  if(!checked){
    a.innerHTML='<button class="btn primary" id="checkBtn" onclick="check()">✅ Conferir minhas respostas<span class="etr"></span></button>'
      +summary+reveal+reset;
  }else{
    var wrong=wrongIds();
    var allRight=wrong.length===0;
    var redo = wrong.length? '<button class="btn redo" onclick="redoWrong()">↺ Refazer as que errei ('+wrong.length+')<span class="etr"></span></button>':'';
    var nextLbl = gi<GAMES.length-1 ? '▶ Próximo jogo<span class="etr"></span>' : '\u{1F3C6} Terminar<span class="etr"></span>';
    a.innerHTML=redo
      +(allRight?'<button class="btn primary" onclick="afterGame()">'+nextLbl+'</button>'
                :'<button class="btn" onclick="afterGame()">'+(gi<GAMES.length-1?'Pular para o próximo jogo →':'Terminar')+'<span class="etr"></span></button>')
      +(allRight?'':reveal)
      +summary
      +reset
      +'<button class="btn" onclick="intro()">\u{1F3AE} Menu dos jogos<span class="etr"></span></button>';
  }
}
/* reset only the current game (phase) — back to a shuffled bag */
function resetGame(){ place={}; locked={}; sel=null; checked=false; _poolCache=poolOrder(); render(); }
/* SHOW THE ANSWERS — organise every card into its correct box (study mode) */
function revealAnswers(){
  G().cards.forEach((c,i)=>{ place[cardId(i)]=c.col; locked[cardId(i)]=true; });
  checked=true; _poolCache=[]; sel=null;
  render();
  if($('tip'))$('tip').classList.add('show');
  var fb=$('fb'); if(fb){fb.className='fb ok';fb.innerHTML='\u{1F5C2}️ Aqui estão as respostas — leia cada caixa com calma!';}
}
function wrongIds(){
  return G().cards.map((c,i)=>cardId(i)).filter(id=>{var i=+id.slice(1);return place[id] && place[id]!==G().cards[i].col;});
}
function unplacedIds(){
  return G().cards.map((c,i)=>cardId(i)).filter(id=>!place[id]);
}
function check(){
  if(unplacedIds().length>0){
    var h=$('poolhint'); if(h)h.innerHTML='<span style="color:var(--no)">Coloque todas as cartas primeiro!</span>';
    return;
  }
  checked=true;
  // lock the correct ones
  G().cards.forEach((c,i)=>{ var id=cardId(i); if(place[id]===c.col) locked[id]=true; });
  render();
  var fb=$('fb'); var n=G().cards.length; var right=n-wrongIds().length;
  if($('tip'))$('tip').classList.add('show');
  if(wrongIds().length===0){
    fb.className='fb ok'; fb.innerHTML='\u{1F389} Perfeito! '+n+' / '+n+' certas!';
    doneGames[gi]=true; celebrate();
  }else{
    fb.className='fb no'; fb.innerHTML=right+' / '+n+' certas — tente as vermelhas de novo.';
  }
}
function paintCheck(){
  G().cards.forEach((c,i)=>{
    var id=cardId(i); var el=document.querySelector('.dcard[data-id="'+id+'"]'); if(!el)return;
    if(place[id]===c.col){ el.classList.add('ok'); }
    else if(place[id]){ el.classList.add('no');
      var col=G().cols.find(x=>x.id===c.col);
      var f=el.querySelector('.fix'); if(f)f.textContent='→ '+(col?col.en:c.col);
    }
  });
}
function redoWrong(){
  // send wrong cards back to pool, keep correct ones locked in place
  wrongIds().forEach(id=>{ delete place[id]; });
  checked=false; sel=null;
  // refresh pool order with the returned cards
  _poolCache=poolOrder().filter(id=>!locked[id]);
  render();
}
function afterGame(){
  if(gi<GAMES.length-1){ openGame(gi+1); }
  else finish();
}

/* ============================================================
   NAV ARROWS (between games)
   ============================================================ */
function showNav(){
  $('qnav').classList.add('show');
  $('navPrev').disabled = gi<=0;
  $('navNext').disabled = gi>=GAMES.length-1;
}
function prevGame(){ if(gi>0) openGame(gi-1); }
function nextGame(){ if(gi<GAMES.length-1) openGame(gi+1); }

/* ============================================================
   FINISH
   ============================================================ */
function finish(){
  $('qnav').classList.remove('show');
  var n=Object.keys(doneGames).length;
  $('card').innerHTML='<div class="fim"><div class="big">\u{1F3C6}</div>'
    +'<div class="score">'+n+' / '+GAMES.length+' jogos sem erro</div>'
    +'<div class="sub">Muito bem, explorador do Brasil! \u{1F5FA}\u{FE0F}</div>'
    +'<div class="actions">'
    +'<button class="btn primary" onclick="intro()">\u{1F3AE} Jogar de novo<span class="etr"></span></button>'
    +'<button class="btn" onclick="goHome()">\u{1F3E0} Menu<span class="etr">Menu do site</span></button>'
    +'</div></div>';
  celebrate();
}


/* ---- confetti ---- */
function celebrate(){
  var cols=['#38bdf8','#fbbf24','#34d399','#f472b6','#a78bfa'];
  for(var i=0;i<40;i++){(function(i){
    var d=document.createElement('div');d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';d.style.background=cols[i%cols.length];
    d.style.transform='rotate('+(Math.random()*360)+'deg)';
    document.body.appendChild(d);
    var dur=1200+Math.random()*1400, x=(Math.random()-.5)*180;
    d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+x+'px,'+(window.innerHeight+40)+'px) rotate(720deg)',opacity:.9}],{duration:dur,easing:'cubic-bezier(.3,.6,.7,1)'});
    setTimeout(function(){d.remove();},dur);
  })(i);}
}

/* MAT: conteudo em INGLES; o botao da bandeira revela a traducao PT (body.show-tr) */
intro();
</script>
