<style>
  @page { size: A4; margin: 11mm 12mm 12mm; }
  :root { --c: #c62828; --ink: #1d1d1f; --soft: #5b5b66; --line: #9aa0b4; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; background: #e9e6f2; color: var(--ink);
         font: 15px/1.45 "Comic Sans MS", "Comic Neue", "Trebuchet MS", Arial, sans-serif; }
  .tools { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
           padding: 10px 16px; background: #2b2540; }
  .tools a, .tools button { font: 600 15px Arial, sans-serif; color: #fff; background: #4a3f72; border: 0; border-radius: 10px;
           min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
  .tools button.pri { background: var(--c); }
  main { max-width: 186mm; margin: 16px auto 40px; background: #fff; padding: 12mm 12mm 14mm;
         box-shadow: 0 6px 24px rgba(0,0,0,.15); hyphens: auto; -webkit-hyphens: auto; }
  h1 { margin: 0; font-size: 24px; color: var(--c); text-align: center; }
  .sub { text-align: center; color: var(--soft); margin: 2px 0 10px; font-size: 14px; }
  .nome { display: flex; gap: 18px; margin: 6px 0 12px; font-size: 15px; }
  .nome span { flex: 1; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
  .nome span.d { flex: .45; }
  .receita { border: 2px solid var(--c); border-radius: 14px; padding: 8px 14px 8px; margin: 0 0 14px; }
  .receita b.t { color: var(--c); display: block; margin-bottom: 2px; }
  .receita ol { margin: 0; padding-left: 22px; }
  .receita li { margin: 4px 0; }
  .bloco { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
  .bloco > * { grid-column: 1 / -1; min-width: 0; }
  .bloco > .q.meia { grid-column: auto; }
  .bloco h2 { margin: 0 0 8px; font-size: 17px; color: #fff; background: var(--c); border-radius: 10px; padding: 5px 12px; break-after: avoid; }
  .q { break-inside: avoid; page-break-inside: avoid; padding: 8px 0 12px;
       border-top: 1px solid color-mix(in srgb, var(--c) 18%, transparent); }
  .bloco h2 + .q, .bloco h2 + .q.meia + .q.meia { border-top: 0; padding-top: 2px; }
  .q .en { display: flex; gap: 8px; align-items: flex-start; font-size: 15.5px; }
  .q .n { flex: 0 0 auto; min-width: 28px; height: 28px; border-radius: 50%; background: #2b2540; color: #fff;
          font: 700 14px Arial, sans-serif; display: inline-flex; align-items: center; justify-content: center; }
  .q .txt { flex: 1; }
  .q .figs { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: flex-end; justify-content: center; margin: 6px 0 4px; }
  .q svg { max-width: 100%; height: auto; }
  .linha { height: 12mm; border-bottom: 1.3px solid var(--line); margin: 0 4px; }
  .lab { font-size: 14px; color: var(--soft); margin: 6px 4px 0; }
  .caixa { border: 1.6px dashed var(--line); border-radius: 12px; min-height: 120px; margin: 6px 4px 0; }
  .blanks { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 8px 4px 0; font-size: 15.5px; }
  .blanks.larga span { flex: 0 0 29%; } .blanks.larga span i { min-width: 0; width: calc(100% - 30px); }
  .blanks span i { display: inline-block; min-width: 54px; border-bottom: 1.5px solid var(--ink); }
  .item { display: flex; gap: 10px; align-items: flex-end; margin: 8px 4px 0; }

  .item .w { flex: 1; border-bottom: 1.3px solid var(--line); height: 10mm; }

<script>
(function () {
  var D = window.MAT3D, h = '';
  h += '<h1>Math · Written answers</h1><div class="sub">Year 2 · 3rd term · practice for the test</div>';
  h += '<div class="nome"><span>Name:</span><span class="d">Date:</span></div>';
  h += '<div class="receita"><b class="t">' + D.receita.titulo + '<span class="tr" lang="pt-BR">Como escrever uma boa resposta</span></b><ol>' + D.receita.passos.map(function (p, i) { return '<li data-tipo="rotulo">' + p + '<span class="tr" lang="pt-BR">' + D.receita.pt[i] + '</span></li>'; }).join('') + '</ol></div>';
  function area(r) {
    if (!r) return '';
    var s = '';
    (r.partes || [r]).forEach(function (p) {
      if (p.lab) s += '<div class="lab" data-tipo="rotulo">' + p.lab + '</div>';
      if (p.tipo === 'linhas') for (var i = 0; i < p.n; i++) s += '<div class="linha"></div>';
      if (p.tipo === 'caixa') s += '<div class="caixa" style="min-height:' + (p.alt || 120) + 'px"></div>';
      if (p.tipo === 'blanks') s += '<div class="blanks' + (p.larga ? ' larga' : '') + '">' + p.itens.map(function (b) { return '<span data-tipo="rotulo">' + b.replace('___', '<i></i>') + '</span>'; }).join('') + '</div>';
      if (p.tipo === 'itens') s += p.itens.map(function (b) { return '<div class="item"><span class="s" data-tipo="rotulo">' + b + '</span><span class="w"></span></div>'; }).join('');
    });
    return s;
  }
  D.blocos.forEach(function (b) {
    h += '<section class="bloco"><h2>' + b.titulo + '<span class="tr" lang="pt-BR">' + b.pt + '</span></h2>';
    b.questoes.forEach(function (q) {
      h += '<div class="q' + (q.meia ? ' meia' : '') + '" id="' + q.id + '"><div class="en"><span class="n">' + q.n + '</span><span class="txt" data-tipo="rotulo">' + q.en + (q.pt ? '<span class="tr" lang="pt-BR">' + q.pt + '</span>' : '') + '</span></div>';
      if (q.fig) h += '<div class="figs">' + q.fig + '</div>';
      h += area(q.resp) + '</div>';
    });
    h += '</section>';
  });
  h += '<div class="fim">Great job! Check your answers with a grown-up. 🙂</div>';
  document.getElementById('folha').innerHTML = h;
})();
/* bandeira: mesma chave da home (cie3_tr), entao ligar la entra traduzido aqui */
function pintaTr(){ var on=false; try{ on=localStorage.getItem('cie3_tr')==='1'; }catch(e){} document.body.classList.toggle('show-tr',on); document.getElementById('trBtn').setAttribute('aria-pressed',String(on)); }
function alternaTr(){ var on=!document.body.classList.contains('show-tr'); try{ localStorage.setItem('cie3_tr',on?'1':'0'); }catch(e){} pintaTr(); }
pintaTr();
</script>
