<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math · Written answers · Year 2 · 3rd term</title>
<style>
  @page { size: A4; margin: 11mm 12mm 12mm; }
  :root { --c: #c62828; --ink: #1d1d1f; --soft: #5b5b66; --line: #9aa0b4; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; background: #e9e6f2; color: var(--ink);
         font: 15px/1.45 "Comic Sans MS", "Comic Neue", "Trebuchet MS", Arial, sans-serif; }
  .tools { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
           padding: 10px 16px; background: #2b2540; }
  .tools a, .tools button { font: 600 15px Arial, sans-serif; color: #fff; background: #4a3f72; border: 0; border-radius: 10px;
           min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
  .tools button.pri { background: var(--c); }
  main { max-width: 186mm; margin: 16px auto 40px; background: #fff; padding: 12mm 12mm 14mm;
         box-shadow: 0 6px 24px rgba(0,0,0,.15); hyphens: auto; -webkit-hyphens: auto; }
  h1 { margin: 0; font-size: 24px; color: var(--c); text-align: center; }
  .sub { text-align: center; color: var(--soft); margin: 2px 0 10px; font-size: 14px; }
  .nome { display: flex; gap: 18px; margin: 6px 0 12px; font-size: 15px; }
  .nome span { flex: 1; border-bottom: 1.5px solid var(--ink); padding-bottom: 2px; }
  .nome span.d { flex: .45; }
  .receita { border: 2px solid var(--c); border-radius: 14px; padding: 8px 14px 8px; margin: 0 0 14px; }
  .receita b.t { color: var(--c); display: block; margin-bottom: 2px; }
  .receita ol { margin: 0; padding-left: 22px; }
  .receita li { margin: 4px 0; }
  .bloco { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
  .bloco > * { grid-column: 1 / -1; min-width: 0; }
  .bloco > .q.meia { grid-column: auto; }
  .bloco h2 { margin: 0 0 8px; font-size: 17px; color: #fff; background: var(--c); border-radius: 10px; padding: 5px 12px; break-after: avoid; }
  .q { break-inside: avoid; page-break-inside: avoid; padding: 8px 0 12px;
       border-top: 1px solid color-mix(in srgb, var(--c) 18%, transparent); }
  .bloco h2 + .q, .bloco h2 + .q.meia + .q.meia { border-top: 0; padding-top: 2px; }
  .q .en { display: flex; gap: 8px; align-items: flex-start; font-size: 15.5px; }
  .q .n { flex: 0 0 auto; min-width: 28px; height: 28px; border-radius: 50%; background: #2b2540; color: #fff;
          font: 700 14px Arial, sans-serif; display: inline-flex; align-items: center; justify-content: center; }
  .q .txt { flex: 1; }
  .q .figs { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: flex-end; justify-content: center; margin: 6px 0 4px; }
  .q svg { max-width: 100%; height: auto; }
  .linha { height: 12mm; border-bottom: 1.3px solid var(--line); margin: 0 4px; }
  .lab { font-size: 14px; color: var(--soft); margin: 6px 4px 0; }
  .caixa { border: 1.6px dashed var(--line); border-radius: 12px; min-height: 120px; margin: 6px 4px 0; }
  .blanks { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 8px 4px 0; font-size: 15.5px; }
  .blanks.larga span { flex: 0 0 29%; } .blanks.larga span i { min-width: 0; width: calc(100% - 30px); }
  .blanks span i { display: inline-block; min-width: 54px; border-bottom: 1.5px solid var(--ink); }
  .item { display: flex; gap: 10px; align-items: flex-end; margin: 8px 4px 0; }
  .item .s { flex: 0 0 auto; }
  .item .w { flex: 1; border-bottom: 1.3px solid var(--line); height: 10mm; }
  main[lang=en] { hyphens: manual; -webkit-hyphens: manual; }   /* L2: palavra partida atrapalha (pedagógico 13/11) */
  .wbox { border: 2px solid var(--ink); border-radius: 10px; padding: 4px 14px; font-weight: bold; text-align: center; }
  .tr { display: none; }
  body.show-tr .tr { display: block; color: #2e7d32; font-size: .9em; font-weight: 600; margin-top: 2px; }
  .flag { background: #1b5e20 !important; } body.show-tr .flag { outline: 3px solid #fde047; outline-offset: 2px; }
  .tabela { border-collapse: collapse; margin: 4px auto; font-size: 15px; }
  .tabela td, .tabela th { border: 1.5px solid var(--ink); padding: 3px 14px; text-align: center; }
  .gabarito { break-inside: avoid; page-break-inside: avoid; margin-top: 18px; }
  .gvira { transform: rotate(180deg); border: 2px dashed var(--line); border-radius: 14px; padding: 10px 14px; font-size: 12.5px; line-height: 1.35; }
  .gvira .gt { display: block; color: var(--c); font-size: 14px; margin-bottom: 4px; }
  .gvira ol { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 22px; }
  .gvira li { break-inside: avoid; margin: 0 0 4px; }
  @media (max-width: 720px) { .gvira ol { columns: 1; } }
  /* 13/11 tarde: na TELA, cada questão tem "Show answer" (revela a resposta curta ali mesmo); some na impressão */
  .q .en .txt { min-width: 0; }
  .bresp { flex: 0 0 auto; font: 700 13px Arial, sans-serif; color: #2b2540; background: #f1edf9; border: 1.5px solid #b9add8;
           border-radius: 10px; min-height: 44px; padding: 0 12px; cursor: pointer; }
  .bresp[aria-expanded="true"] { background: #e8f5e9; border-color: #66bb6a; color: #1b5e20; }
  .rtela { display: none; margin: 6px 4px 0; padding: 6px 12px; border-radius: 10px; background: #e8f5e9; color: #1b5e20; font-weight: 700;
           text-align: justify; text-align-last: left; }
  .q.aberta .rtela { display: block; }
  .fim { text-align: center; color: var(--soft); font-size: 13px; margin-top: 14px; }
  @media (max-width: 720px) { main { margin: 0; padding: 16px; box-shadow: none; } .bloco { grid-template-columns: 1fr; } .blanks span i { min-width: 40px; } }
  /* IMPRESSÃO = 2 páginas A4 (frente e verso) com o gabarito de cabeça para baixo no fim (13/11 tarde):
     a folha corre em 2 colunas; cada questão inteira numa coluna */
  @media print {
    body { font-size: 13px; line-height: 1.35; }
    main { column-count: 2; column-gap: 7mm; column-rule: .5pt solid #d9d4e6; }
    main > h1, main > .sub, main > .nome { column-span: all; }
    h1 { font-size: 20px; } .sub { margin: 0 0 4px; font-size: 12px; } .nome { margin: 2px 0 8px; font-size: 13px; }
    .receita { break-inside: avoid; padding: 5px 10px; margin: 0 0 8px; border-radius: 10px; font-size: 12px; }
    .receita li { margin: 1px 0; }
    .bloco { display: block; margin-top: 6px; }
    .bloco h2 { font-size: 13.5px; padding: 3px 10px; margin: 0 0 4px; border-radius: 8px; }
    .q { padding: 5px 0 8px; }
    .q .en { font-size: 13.5px; gap: 6px; } .q .n { min-width: 22px; height: 22px; font-size: 12px; }
    .q .figs { margin: 4px 0 2px; gap: 4px 12px; }
    .q .figs svg { max-height: 34mm; }
    .linha { height: 9mm; } .lab { font-size: 12px; margin-top: 3px; }
    .item { margin-top: 5px; flex-wrap: wrap; } .item .w { min-width: 22mm; height: 8mm; }
    .blanks { font-size: 13.5px; margin-top: 5px; gap: 6px 16px; }
    .wbox { padding: 2px 8px; font-size: 12.5px; }
    .tabela { font-size: 12.5px; }
    .fim { margin-top: 6px; font-size: 12px; }
    .gabarito { margin-top: 8px; }
    .gvira { padding: 6px 10px; font-size: 11px; } .gvira ol { columns: 1; } .gvira .gt { font-size: 12px; }
  }
  @media print { body { background: #fff; } .tools, .bresp, .rtela, .q.aberta .rtela { display: none !important; } main { margin: 0; padding: 0; max-width: none; box-shadow: none; } }
</style>
</head>

<div class="tools">
  <span style="color:#ffd54f;font:700 14px Arial,sans-serif;align-self:center" data-tipo="rotulo">&#x1F6A7; Under construction</span>
  <a href="../index.html?v=08b66841640" class="sera-home">Home</a>
  <button class="flag" id="trBtn" onclick="alternaTr()" aria-pressed="false" title="Português" aria-label="Português"><svg viewBox="0 0 28 20" width="26" height="19" aria-hidden="true"><rect width="28" height="20" rx="2" fill="#16a34a"/><path d="M14 3 25 10 14 17 3 10z" fill="#facc15"/><circle cx="14" cy="10" r="4" fill="#1d4ed8"/></svg></button>
  <button id="todasBtn" onclick="mostraTodas()" aria-pressed="false">Show all answers</button>
  <a href="MAT3_guia_responsavel.html?v=08b66841640">Guia do responsável (PT)</a>
  <button class="pri" onclick="window.print()">Print / Imprimir</button>
</div>

<script src="MAT3_discursivas_data.js?v=08b66841640"></script>
<script>
(function () {
  var D = window.MAT3D, h = '';
  h += '<h1>Math · Written answers</h1><div class="sub">Year 2 · 3rd term · practice for the test</div>';
  h += '<div class="nome"><span>Name:</span><span class="d">Date:</span></div>';
  h += '<div class="receita"><b class="t">' + D.receita.titulo + '<span class="tr" lang="pt-BR">Como escrever uma boa resposta</span></b><ol>' + D.receita.passos.map(function (p, i) { return '<li data-tipo="rotulo">' + p + '<span class="tr" lang="pt-BR">' + D.receita.pt[i] + '</span></li>'; }).join('') + '</ol></div>';
  function area(r) {
    if (!r) return '';
    var s = '';
    (r.partes || [r]).forEach(function (p) {
      if (p.lab) s += '<div class="lab" data-tipo="rotulo">' + p.lab + '</div>';
      if (p.tipo === 'linhas') for (var i = 0; i < p.n; i++) s += '<div class="linha"></div>';
      if (p.tipo === 'caixa') s += '<div class="caixa" style="min-height:' + (p.alt || 120) + 'px"></div>';
      if (p.tipo === 'blanks') s += '<div class="blanks' + (p.larga ? ' larga' : '') + '">' + p.itens.map(function (b) { return '<span data-tipo="rotulo">' + b.replace('___', '<i></i>') + '</span>'; }).join('') + '</div>';
      if (p.tipo === 'itens') s += p.itens.map(function (b) { return '<div class="item"><span class="s" data-tipo="rotulo">' + b + '</span><span class="w"></span></div>'; }).join('');
    });
    return s;
  }
  /* FOLHA CURTA (13/11 tarde): só as questões kit:1, numeradas 1..N pelo campo n */
  var KIT = D.blocos.map(function (b) { return { b: b, qs: b.questoes.filter(function (q) { return q.kit; }) }; }).filter(function (x) { return x.qs.length; });
  KIT.forEach(function (x) { var b = x.b;
    h += '<section class="bloco"><h2>' + b.titulo + '<span class="tr" lang="pt-BR">' + b.pt + '</span></h2>';
    x.qs.forEach(function (q) {
      h += '<div class="q' + (q.meia ? ' meia' : '') + '" id="' + q.id + '"><div class="en"><span class="n">' + q.n + '</span><span class="txt" data-tipo="rotulo">' + q.en + (q.pt ? '<span class="tr" lang="pt-BR">' + q.pt + '</span>' : '') + '</span>' +
        '<button class="bresp" type="button" aria-expanded="false" onclick="mostraUma(this)">Show answer</button></div>';
      if (q.fig) h += '<div class="figs">' + q.fig + '</div>';
      h += '<div class="rtela" lang="en" data-tipo="rotulo">' + q.curta + '</div>';
      h += area(q.resp) + '</div>';
    });
    h += '</section>';
  });
  h += '<div class="fim">Great job! Check your answers with a grown-up. 🙂</div>';
  /* 13/11 (Paulo): gabarito curto no fim da propria folha, de cabeca para baixo: e treino, nao prova valendo */
  var gab = [];
  KIT.forEach(function (x) { x.qs.forEach(function (q) { gab.push('<li><b>' + q.n + '.</b> ' + q.curta + '</li>'); }); });
  h += '<section class="gabarito" aria-label="Answers"><div class="gvira"><b class="gt" data-tipo="rotulo">Answers · check after you finish<span class="tr" lang="pt-BR">Respostas · confira depois de terminar</span></b><ol data-tipo="rotulo">' + gab.join('') + '</ol></div></section>';
  document.getElementById('folha').innerHTML = h;
})();
/* bandeira: mesma chave da home (cie3_tr), entao ligar la entra traduzido aqui */
function pintaTr(){ var on=false; try{ on=localStorage.getItem('cie3_tr')==='1'; }catch(e){} document.body.classList.toggle('show-tr',on); document.getElementById('trBtn').setAttribute('aria-pressed',String(on)); rotulos(); }
/* botões de resposta (só na tela): inglês; com a bandeira ligada, português */
function rotulos(){ var pt=document.body.classList.contains('show-tr');
  document.querySelectorAll('.bresp').forEach(function(b){ var on=b.getAttribute('aria-expanded')==='true';
    b.textContent = pt ? (on?'Esconder resposta':'Mostrar resposta') : (on?'Hide answer':'Show answer'); });
  var t=document.getElementById('todasBtn'), all=t.getAttribute('aria-pressed')==='true';
  t.textContent = pt ? (all?'Esconder respostas':'Mostrar todas as respostas') : (all?'Hide all answers':'Show all answers'); }
function abre(q,on){ q.classList.toggle('aberta',on); q.querySelector('.bresp').setAttribute('aria-expanded',String(on)); }
function mostraUma(b){ var q=b.closest('.q'); abre(q,!q.classList.contains('aberta'));
  var qs=[].slice.call(document.querySelectorAll('.q')); document.getElementById('todasBtn').setAttribute('aria-pressed',String(qs.every(function(x){ return x.classList.contains('aberta'); }))); rotulos(); }
function mostraTodas(){ var t=document.getElementById('todasBtn'), on=t.getAttribute('aria-pressed')!=='true';
  document.querySelectorAll('.q').forEach(function(q){ abre(q,on); }); t.setAttribute('aria-pressed',String(on)); rotulos(); }
function alternaTr(){ var on=!document.body.classList.contains('show-tr'); try{ localStorage.setItem('cie3_tr',on?'1':'0'); }catch(e){} pintaTr(); }
pintaTr();
</script>
</body>
