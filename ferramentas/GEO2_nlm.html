<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Quiz explicado — Geografia · Comunidades e lugares</title>
<link rel="stylesheet" href="serafina-core.css?v=20260809b">
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#10322a;--ink:#f0fdf4;--soft:rgba(255,255,255,.58);--card:#13303a;--line:rgba(255,255,255,.13);--accent:#34d399;--accent2:#fbbf24;--tr:#fcd34d;--ok:#34d399;--no:#f87171;--rad:20px}
body.light{--bg:#eafaf1;--bg2:#dcf5e8;--ink:#0c2a1e;--soft:rgba(0,0,0,.52);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.95rem*var(--fs));color:var(--accent);flex:1;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;padding:0 8px}
.iconbtn:active{transform:scale(.9)}
.dicabtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.4;filter:grayscale(1)}
.dicabtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .dicabtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.bar{height:9px;background:var(--line)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .35s}
.wrap{flex:1;width:100%;max-width:640px;margin:0 auto;padding:14px 12px 60px}
.tr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.85em;line-height:1.35}
body.show-tr .tr{display:block}

.tabbar{display:flex;gap:8px;margin-bottom:14px}
.tabbtn{flex:1;min-height:52px;border-radius:16px;border:2px solid var(--line);background:transparent;color:var(--soft);font-family:inherit;font-weight:900;font-size:calc(.85rem*var(--fs));cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.tabbtn .te{font-size:1.2rem}
.tabbtn.on{border-color:var(--accent);background:rgba(52,211,153,.14);color:var(--ink)}
.tabbtn:active{transform:scale(.96)}
.pane{display:none}
.pane.on{display:block}
.hint{text-align:center;font-size:.83rem;font-weight:800;color:var(--soft);margin:2px 0 14px;line-height:1.45}

/* ---- quiz ---- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .qn{font-size:.72rem;font-weight:900;color:var(--soft);letter-spacing:1px;text-transform:uppercase;flex:1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px 15px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.q{font-weight:900;font-size:calc(1.1rem*var(--fs));line-height:1.35}
.qtools{display:flex;gap:8px;margin:11px 0 4px;flex-wrap:wrap}
.tbtn{min-height:44px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:.82rem;border-radius:18px;padding:6px 14px;cursor:pointer;font-family:inherit}
.tbtn.amarelo{border-color:var(--accent2);color:var(--accent2)}
.tbtn:active{transform:scale(.95)}
.dicabox{display:none;margin-top:10px;border:2px dashed var(--accent2);border-radius:14px;padding:11px 13px;font-weight:800;font-size:calc(.93rem*var(--fs));line-height:1.4;color:var(--ink)}
.dicabox.on{display:block}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;flex-direction:column;gap:0;text-align:left;border:2px solid var(--line);border-radius:16px;background:linear-gradient(135deg,var(--card),rgba(255,255,255,.03));color:var(--ink);font-family:inherit;cursor:pointer;overflow:hidden}
.opt .ot{display:flex;align-items:center;gap:10px;min-height:54px;padding:11px 14px;font-weight:800;font-size:calc(1rem*var(--fs));line-height:1.3}
.opt .om{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:900}
.opt:active{transform:scale(.99)}
.opt.good{border-color:var(--ok);background:rgba(52,211,153,.14)}
.opt.good .om{border-color:var(--ok);background:var(--ok);color:#06251a}
.opt.bad{border-color:var(--no);background:rgba(248,113,113,.12)}
.opt.bad .om{border-color:var(--no);background:var(--no);color:#3a0a0a}
.why{display:none;padding:0 14px 12px;font-weight:700;font-size:calc(.9rem*var(--fs));line-height:1.42;color:var(--soft);border-top:1px dashed var(--line);margin-top:-2px;padding-top:10px}
.opt.show .why{display:block}
.fb{text-align:center;font-weight:900;font-size:calc(1rem*var(--fs));margin-top:14px;min-height:24px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.navrow{display:flex;gap:10px;margin-top:14px}
.nb{flex:1;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:900;font-size:.96rem;cursor:pointer}
.nb.primary{border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04261c}
.nb:disabled{opacity:.35;cursor:default}

/* ---- revisão rápida ---- */
.rc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.rc .rf{font-weight:900;font-size:calc(.99rem*var(--fs));line-height:1.32;display:flex;align-items:flex-start;gap:9px}
.rc .rf .chev{margin-left:auto;color:var(--soft);font-size:.85rem;transition:transform .2s;flex-shrink:0}
.rc.on .rf .chev{transform:rotate(90deg)}
.rc .rb{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-weight:800;color:var(--accent);font-size:calc(.97rem*var(--fs));line-height:1.4}
.rc.on .rb{display:block}
.toolrow{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.toolbtn{border:2px solid var(--line);background:transparent;color:var(--soft);font-weight:800;font-size:.78rem;border-radius:16px;padding:7px 14px;cursor:pointer;font-family:inherit;min-height:44px}

/* ---- fim ---- */
.fim{text-align:center;padding-top:10px}
.fim .big{font-size:3.4rem}
.fim .score{font-size:1.7rem;font-weight:900;color:var(--accent);margin:8px 0 2px}
.fim .sub{font-weight:800;color:var(--soft);font-size:.95rem;margin-bottom:16px;line-height:1.4}
.fimbtns{display:flex;flex-direction:column;gap:10px}
.origem{text-align:center;color:var(--soft);font-weight:700;font-size:.76rem;margin-top:22px;line-height:1.5;opacity:.75}

.sombtn{transition:opacity .15s}
.sombtn.off{opacity:.45;background:rgba(248,113,113,.18)}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn sera-home" title="Início" onclick="goHome()">&#127968;</button>
    <span class="title">Quiz explicado &mdash; Comunidades e lugares</span>
    <button class="iconbtn dicabtn" id="dica" title="Mostrar dica" onclick="toggleTr()">&#128161;<span class="ft">Dica</span></button>
    <button class="iconbtn" title="Letra menor" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Letra maior" onclick="fs(1)">A+</button>
    <button class="iconbtn sombtn" id="sombtn" title="Desligar a voz" aria-pressed="false" onclick="toggleSom()">&#128266;</button>
    <button class="iconbtn" title="Tema" onclick="document.body.classList.toggle('light')">&#127769;</button>
    <button class="iconbtn lockbtn" id="lockbtn" title="Tela cheia e travar" onclick="toggleLock()">&#128274;</button>
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="wrap">
    <div class="tabbar">
      <button class="tabbtn on" id="tab-quiz" onclick="showTab('quiz')"><span class="te">&#129300;</span>Quiz explicado</button>
      <button class="tabbtn" id="tab-rev" onclick="showTab('rev')"><span class="te">&#9889;</span>Revisão rápida</button>
    </div>
    <div class="pane on" id="pane-quiz"><div id="quizStage"></div></div>
    <div class="pane" id="pane-rev">
      <div class="hint">Toque na pergunta para ver a resposta. São perguntas curtas para revisar rápido.</div>
      <div class="toolrow">
        <button class="toolbtn" onclick="todas(true)">&#11015;&#65039; Abrir tudo</button>
        <button class="toolbtn" onclick="todas(false)">&#11014;&#65039; Fechar tudo</button>
      </div>
      <div id="revStage"></div>
    </div>
    <div class="origem">Estas perguntas foram geradas pelo <b>NotebookLM</b> a partir do material da<br>Unidade 2 e conferidas uma a uma antes de entrar no site. &#128064;</div>
  </div>
</div>

<script>
/* ============================================================
   QUIZ EXPLICADO — Geografia 2tri
   Roda o quiz do NotebookLM (media/quiz_geo2_nlm.json), que traz
   uma coisa que o simulado nao tem: o PORQUE de cada alternativa,
   inclusive das erradas. Segunda aba: as cartas de revisao rapida
   (media/flashcards_geo2_nlm.json).
   Ambos gerados a partir das MESMAS fontes da unidade.
   ============================================================ */
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;').replace(/'/g,"\\'");}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

var QZ=null, RV=null, deck=[], idx=0, acertos=0, respondida=false;

function showTab(k){
  ['quiz','rev'].forEach(function(t){
    $('tab-'+t).classList.toggle('on',t===k);
    $('pane-'+t).classList.toggle('on',t===k);
  });
  try{localStorage.setItem('geo2_nlm_tab',k);}catch(e){}
}

Promise.all([
  fetch('media/quiz_geo2_nlm.json?v=20260809b').then(function(r){return r.json();}),
  fetch('media/flashcards_geo2_nlm.json?v=20260809b').then(function(r){return r.json();})
]).then(function(j){
  QZ=j[0]; RV=j[1];
  comecar(); montarRev();
  try{var t=localStorage.getItem('geo2_nlm_tab');if(t==='rev')showTab('rev');}catch(e){}
}).catch(function(){
  $('quizStage').innerHTML='<div class="qcard"><div class="q">&#128533; Não consegui abrir as perguntas</div>'
   +'<p style="margin-top:10px;font-weight:700;color:var(--soft);line-height:1.45">Se você abriu o arquivo '
   +'direto do computador, abra pelo site — o navegador bloqueia a leitura em <i>file://</i>.</p></div>';
});

function comecar(){
  deck=shuffle(QZ.questions);idx=0;acertos=0;pergunta();
}
function pergunta(){
  if(idx>=deck.length){fim();return;}
  respondida=false;
  var q=deck[idx];
  $('bar').style.width=(idx/deck.length*100)+'%';
  var opts=shuffle(q.answerOptions);
  var h='<div class="qhead"><span class="qn">Pergunta '+(idx+1)+' de '+deck.length+'</span></div>'
   +'<div class="qcard"><div class="q">'+q.question+'</div>'
   +'<div class="qtools">'
     +'<button class="tbtn" onclick="say(\''+esc(q.question)+'\')">&#128266; Ouvir</button>'
     +(q.hint?'<button class="tbtn amarelo" onclick="verDica()">&#128161; Ver a dica</button>':'')
   +'</div>'
   +(q.hint?'<div class="dicabox" id="dicabox">&#128161; '+q.hint+'</div>':'')
   +'<div class="opts" id="opts">';
  opts.forEach(function(o,i){
    h+='<button class="opt" id="op'+i+'" onclick="responder('+i+','+(o.isCorrect?1:0)+')">'
      +'<span class="ot"><span class="om" id="om'+i+'">'+String.fromCharCode(65+i)+'</span>'
      +'<span>'+o.text+'</span></span>'
      +'<span class="why">'+(o.isCorrect?'&#9989; ':'&#10060; ')+o.rationale+'</span></button>';
  });
  h+='</div><div class="fb" id="fb"></div></div>'
   +'<div class="navrow">'
     +'<button class="nb" onclick="pular()">Pular &#8250;</button>'
     +'<button class="nb primary" id="prox" onclick="proxima()" disabled>'
     +(idx===deck.length-1?'Ver o resultado &#127881;':'Próxima &#8250;')+'</button>'
   +'</div>';
  $('quizStage').innerHTML=h;
  window.__opts=opts;
}
function verDica(){ var d=$('dicabox'); if(d)d.classList.add('on'); }
function responder(i,ok){
  if(respondida)return; respondida=true;
  var opts=window.__opts;
  opts.forEach(function(o,k){
    var el=$('op'+k);
    el.classList.add('show', o.isCorrect?'good':'bad');
    $('om'+k).textContent = o.isCorrect?'✓':'✕';
    el.onclick=null;
  });
  if(ok){acertos++;$('fb').textContent='Isso mesmo! 🌟';$('fb').className='fb ok';}
  else{$('fb').textContent='Ainda não — leia o porquê de cada uma. 💡';$('fb').className='fb no';}
  var d=$('dicabox'); if(d)d.classList.add('on');
  $('prox').disabled=false;
}
function proxima(){ idx++; pergunta(); }
function pular(){ idx++; pergunta(); }
function fim(){
  $('bar').style.width='100%';
  var pct=deck.length?acertos/deck.length:0;
  var msg=pct>=.9?'Você mandou muito bem! 🏆'
        :pct>=.6?'Muito bem! Releia os porquês das que faltaram.'
        :'Bom treino — jogue de novo lendo cada explicação.';
  $('quizStage').innerHTML='<div class="fim"><div class="big">&#127881;</div>'
   +'<div class="score">'+acertos+' / '+deck.length+'</div>'
   +'<div class="sub">'+msg+'</div><div class="fimbtns">'
   +'<button class="nb primary" onclick="comecar()">&#127922; Jogar de novo</button>'
   +'<button class="nb" onclick="showTab(\'rev\')">&#9889; Ir para a revisão rápida</button>'
   +'<button class="nb" onclick="goHome()">&#127968; Menu do site</button>'
   +'</div></div>';
}

function montarRev(){
  $('revStage').innerHTML=RV.cards.map(function(c,i){
    return '<div class="rc" id="rc'+i+'" onclick="this.classList.toggle(\'on\')">'
     +'<div class="rf"><span>'+(i+1)+'.</span><span>'+c.front+'</span><span class="chev">&#9654;</span></div>'
     +'<div class="rb">'+c.back+'</div></div>';
  }).join('');
}
function todas(abrir){
  document.querySelectorAll('#revStage .rc').forEach(function(e){e.classList.toggle('on',abrir);});
}
</script>
<script>window.SERA_CFG={trKey:'geo2_dica',lang:'pt-BR',rate:.9,stars:110,somKey:'geo2_som',voicePrefs:['Thalita','Antonio','Antônio','Google portugu','Maria','Daniel']};</script>
<script src="serafina-core.js?v=20260809b"></script>
<script>window.SERA_ACCENT={accent:'#34d399'};</script>
<script src="cie2_theme.js?v=20260809b"></script>
</body>
</html>
