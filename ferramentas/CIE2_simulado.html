<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>Quiz — States of Matter</title>
<style>
:root{--fs:1;--bg:#0d0b1e;--bg2:#102a3a;--ink:#f0f9ff;--soft:rgba(255,255,255,.55);--card:#13243a;--line:rgba(255,255,255,.12);--accent:#38bdf8;--accent2:#fbbf24;--tr:#fcd34d;--ok:#34d399;--no:#f87171;--mid:#fbbf24;--rad:22px}
body.light{--bg:#e0f2fe;--bg2:#dbeafe;--ink:#0c1e33;--soft:rgba(0,0,0,.5);--card:#fff;--line:rgba(0,0,0,.1);--tr:#b45309}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);overflow-x:hidden}
#starfield{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.25)}
.topbar .title{font-weight:900;font-size:calc(.92rem*var(--fs));color:var(--accent);flex:1;line-height:1.1}
.iconbtn{min-width:44px;height:44px;border:none;border-radius:13px;background:var(--line);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer;padding:0 8px}
.iconbtn:active{transform:scale(.9)}
.flagbtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:1px;opacity:.4;filter:grayscale(1)}
.flagbtn .ft{font-size:.5rem;font-weight:900;letter-spacing:.5px}
body.show-tr .flagbtn{opacity:1;filter:none;background:rgba(252,211,77,.2)}
.bar{height:9px;background:var(--line)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .35s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 16px 92px}
.card{position:relative;width:100%;max-width:540px;background:var(--card);border-radius:var(--rad);box-shadow:0 14px 40px rgba(0,0,0,.35);padding:22px 20px 24px;text-align:center;border:1px solid var(--line)}
.qhead{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;padding:0 44px}
.qnum{font-size:.78rem;font-weight:900;color:var(--soft);letter-spacing:1px;text-transform:uppercase}
.badge{font-size:.66rem;font-weight:900;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.badge.mc{background:rgba(56,189,248,.2);color:#7dd3fc}
.badge.vf{background:rgba(251,191,36,.18);color:#fbbf24}
.badge.open{background:rgba(244,114,182,.2);color:#f9a8d4}
.badge.fill{background:rgba(52,211,153,.18);color:#6ee7b7}
.badge.match{background:rgba(167,139,250,.2);color:#c4b5fd}
.badge.order{background:rgba(251,146,60,.2);color:#fdba74}
/* tradução PT (bandeira BR) */
.tr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:calc(.9rem*var(--fs));line-height:1.3}
body.show-tr .tr{display:block}
.qtr{margin:2px 0 4px}
.qfig{font-size:calc(3.1rem*var(--fs));margin:10px 0 4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.q{font-size:calc(1.22rem*var(--fs));font-weight:900;line-height:1.35;margin:8px 0 2px}
.speak{margin:8px auto 16px;display:inline-flex;align-items:center;gap:7px;border:2px solid var(--accent);background:transparent;color:var(--accent);
  font-weight:800;font-size:.85rem;border-radius:20px;padding:6px 14px;cursor:pointer;font-family:inherit}
.speak:active{transform:scale(.95)}
/* botão refazer a questão (cliques acidentais) */
.redoq{position:absolute;top:10px;right:10px;width:44px;height:44px;border:2px solid var(--line);border-radius:50%;background:var(--card);color:var(--soft);font-size:1.2rem;font-weight:900;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.redoq:active{transform:scale(.88) rotate(-90deg)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:transparent;color:var(--ink);font-size:calc(1.05rem*var(--fs));font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;gap:1px}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--ok);color:#06251a;border-color:var(--ok)}.opt.ok .otr{color:#06251a}
.opt.no{background:var(--no);color:#3a0a0a;border-color:var(--no)}.opt.no .otr{color:#3a0a0a}
.opt:disabled{cursor:default;opacity:1}
.opt .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.78rem}
body.show-tr .opt .otr{display:block}
.vfwrap{display:flex;gap:12px;justify-content:center}
.vfbtn{flex:1;max-width:200px;padding:18px 10px;border:2px solid var(--line);border-radius:18px;background:transparent;color:var(--ink);
  font-size:calc(1.15rem*var(--fs));font-weight:900;cursor:pointer;font-family:inherit;transition:.15s}
.vfbtn .big{display:block;font-size:1.9rem;margin-bottom:2px}
.vfbtn .vtr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.72rem}
body.show-tr .vfbtn .vtr{display:block}
.vfbtn:active{transform:scale(.96)}
.vfbtn.ok{background:var(--ok);color:#06251a;border-color:var(--ok)}
.vfbtn.no{background:var(--no);color:#3a0a0a;border-color:var(--no)}
/* FILL */
.fillsent{font-size:calc(1.2rem*var(--fs));font-weight:900;line-height:1.6;margin:6px 4px 2px}
.blank{display:inline-block;min-width:78px;border-bottom:3px solid var(--accent);margin:0 4px;padding:0 6px;color:var(--accent)}
.blank.ok{color:#34d399}.blank.no{color:var(--no);border-color:var(--no)}
.wbank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 0 4px}
.wchip{padding:11px 16px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font-size:calc(1.02rem*var(--fs));font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;gap:1px}
.wchip:active{transform:scale(.95)}
.wchip.ok{background:var(--ok);color:#06251a;border-color:var(--ok)}
.wchip.no{background:var(--no);color:#3a0a0a;border-color:var(--no)}
.wchip .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.72rem}
body.show-tr .wchip .otr{display:block}
/* MATCH */
.mboard{display:flex;flex-direction:column;gap:8px;margin:4px 0}
.mitem{display:flex;align-items:center;gap:8px;min-height:48px;padding:9px 11px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font-weight:800;font-size:calc(.96rem*var(--fs));cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
.mitem .mlbl{flex:1;display:flex;flex-direction:column;gap:1px}
.mitem .mtr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.74rem}
body.show-tr .mitem .mtr{display:block}
.mitem.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(251,146,60,.4) inset}
.mslot{min-width:74px;text-align:center;font-size:.74rem;font-weight:900;padding:5px 7px;border-radius:10px;background:var(--line);color:var(--soft)}
.mslot.set{background:rgba(56,189,248,.25);color:#bae6fd}
.mitem.ok{background:rgba(52,211,153,.16);border-color:var(--ok)}.mitem.ok .mslot{background:var(--ok);color:#06251a}
.mitem.no{background:rgba(248,113,113,.14);border-color:var(--no)}.mitem.no .mslot{background:var(--no);color:#3a0a0a}
.mcats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 2px}
.mcat{min-height:44px;padding:9px 13px;border:2px solid var(--line);border-radius:13px;background:transparent;color:var(--ink);font-weight:900;font-size:calc(.9rem*var(--fs));cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;gap:1px}
.mcat:active{transform:scale(.95)}
.mcat .otr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.66rem}
body.show-tr .mcat .otr{display:block}
.mintro{font-size:.82rem;font-weight:800;color:var(--soft);margin:2px 0 10px}
/* ORDER */
.oseq{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px;min-height:40px}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;padding:8px 11px;border:2px dashed var(--line);border-radius:14px;color:var(--soft);font-weight:800;font-size:calc(.96rem*var(--fs));font-family:inherit;background:transparent;cursor:pointer;text-align:left;width:100%}
.oslot.filled{border-style:solid;color:var(--ink);background:rgba(56,189,248,.1)}
.oslot.ok{border-color:var(--ok);background:rgba(52,211,153,.14)}
.oslot.no{border-color:var(--no);background:rgba(248,113,113,.12)}
.onum{min-width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;background:var(--accent2);color:#3a1a00}
.opool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 2px}
.opiece{padding:11px 14px;border:2px solid var(--accent);border-radius:13px;background:transparent;color:var(--ink);font-weight:800;font-size:calc(.98rem*var(--fs));cursor:pointer;font-family:inherit;transition:.15s}
.opiece:active{transform:scale(.95)}
.opiece.used{opacity:.25;pointer-events:none}
.ocorrect{font-size:.85rem;font-weight:800;color:var(--soft);margin-top:8px;line-height:1.4}
/* OPEN */
.writeline{height:46px;border-bottom:3px dashed var(--line);margin:10px 4px 14px;display:flex;align-items:flex-end;justify-content:center;color:var(--soft);font-weight:700;font-size:.82rem;padding-bottom:4px}
.hint{font-size:.9rem;font-weight:800;color:var(--soft);margin-bottom:10px}
.reveal{display:none;margin:8px 0 4px;padding:13px 14px;border-radius:14px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);
  font-weight:800;font-size:calc(1.02rem*var(--fs));line-height:1.4;color:var(--ink)}
.reveal.show{display:block}
.reveal .lab{display:block;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.selfwrap{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.selfwrap.show{display:flex}
.selfbtn{flex:1;min-width:96px;padding:12px 8px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font-weight:900;font-size:.86rem;cursor:pointer;font-family:inherit;transition:.15s}
.selfbtn .big{display:block;font-size:1.5rem;margin-bottom:2px}
.selfbtn .str{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.66rem}
body.show-tr .selfbtn .str{display:block}
.selfbtn:active{transform:scale(.95)}
.selfbtn.acertei.sel{background:var(--ok);color:#06251a;border-color:var(--ok)}
.selfbtn.parcial.sel{background:var(--mid);color:#3a2c00;border-color:var(--mid)}
.selfbtn.errei.sel{background:var(--no);color:#3a0a0a;border-color:var(--no)}
.fb{margin-top:14px;font-size:calc(1.02rem*var(--fs));font-weight:900;min-height:1.3em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}.fb.mid{color:var(--mid)}
.next{margin-top:16px;width:100%;height:54px;border:none;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08263a;font-size:1.08rem;font-weight:900;cursor:pointer;display:none;font-family:inherit}
.next.show{display:block}
.next:active{transform:scale(.97)}
.fim .big{font-size:4rem}
.fim .score{font-size:1.7rem;font-weight:900;color:var(--accent);margin:8px 0 2px}
.fim .sub{font-weight:800;color:var(--soft);font-size:.95rem;margin-bottom:6px}
.intro p{font-size:calc(1rem*var(--fs));font-weight:700;line-height:1.5;color:var(--soft);margin:10px 0}
.themewrap{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:8px 0 4px}
.themechip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:96px;flex:1 1 96px;max-width:150px;padding:11px 10px;border:2px solid var(--line);border-radius:15px;background:transparent;color:var(--soft);font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit;transition:.15s;opacity:.5}
.themechip .tem{font-size:1.5rem}
.themechip .ttr{font-size:.62rem;font-weight:700}
.themechip.on{opacity:1;color:var(--ink);border-color:var(--accent);background:linear-gradient(135deg,rgba(56,189,248,.22),rgba(251,146,60,.15))}
.themechip:active{transform:scale(.95)}
.themehint{color:var(--no)!important;font-weight:900;font-size:.85rem;min-height:1em;margin:4px 0!important}
.startnote{font-size:.8rem;margin-top:8px}
.sizewrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 4px}
.sizebtn{min-width:64px;padding:16px 10px;border:2px solid var(--accent2);border-radius:16px;background:transparent;color:var(--ink);font-size:1.3rem;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.sizebtn .sl{font-size:.6rem;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.sizebtn:active{transform:scale(.95)}
.sizebtn.sel{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(251,146,60,.18));border-color:var(--accent)}
.endbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.endbtn{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:15px;background:transparent;color:var(--ink);font-size:1rem;font-weight:900;cursor:pointer;font-family:inherit;transition:.15s}
.endbtn.redo{border-color:var(--accent);background:linear-gradient(90deg,rgba(56,189,248,.22),rgba(251,146,60,.15))}
.endbtn .etr{display:none;color:var(--tr);font-style:italic;font-weight:700;font-size:.74rem}
body.show-tr .endbtn .etr{display:block}
.endbtn:active{transform:scale(.97)}
/* --- question nav arrows (always visible during quiz) --- */
.qnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;justify-content:center;gap:14px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--card) 55%,rgba(0,0,0,0))}
.qnav.show{display:flex}
.qnav-btn{flex:1;max-width:160px;height:50px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink);font-size:1.5rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.qnav-btn .ql{font-size:.78rem;font-weight:900;letter-spacing:.5px}
.qnav-btn:disabled{opacity:.32;cursor:default;box-shadow:none}
.qnav-btn:active:not(:disabled){transform:scale(.96)}
.qnav-btn.jump{max-width:130px;font-size:1.15rem;border-color:var(--accent2);color:var(--accent2);background:rgba(251,191,36,.12)}
.qnav-btn.jump:disabled{border-color:var(--line);color:var(--ink)}
/* --- lock / fullscreen --- */
.lockbtn.on{background:rgba(248,113,113,.28);color:#fecaca}
body.locked .iconbtn[onclick*="goHome"]{opacity:.3;pointer-events:none}
.unlockov{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:rgba(8,10,22,.93);backdrop-filter:blur(4px)}
.unlockov.show{display:flex}
.unlockov .ulk-emo{font-size:54px}
.unlockov h2{color:#fff;font-size:1.15rem;font-weight:900;line-height:1.3}
.unlockov h2 small{display:block;font-weight:600;opacity:.8;font-size:.8rem;margin-top:5px}
.unlockov button{height:54px;padding:0 26px;border:none;border-radius:16px;font-size:1.02rem;font-weight:900;cursor:pointer;font-family:inherit;width:100%;max-width:300px}
.unlockov .ulk-yes{background:linear-gradient(90deg,#34d399,#10b981);color:#04261c}
.unlockov .ulk-no{background:rgba(255,255,255,.14);color:#fff}
</style>
</head>

<canvas id="starfield"></canvas>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" title="Início" onclick="goHome()">&#127968;</button>
    <span class="title">Quiz &mdash; States of Matter</span>
    <button class="iconbtn flagbtn" id="flag" title="Mostrar tradução" onclick="toggleTr()">&#127463;&#127479;<span class="ft">PT</span></button>
    <button class="iconbtn" title="Smaller" onclick="fs(-1)">A-</button>
    <button class="iconbtn" title="Bigger" onclick="fs(1)">A+</button>
    <button class="iconbtn" title="Theme" onclick="document.body.classList.toggle('light')">&#127769;</button>
    <button class="iconbtn lockbtn" id="lockbtn" title="Tela cheia e travar / Fullscreen &amp; lock" onclick="toggleLock()">&#128274;</button>

</div>

  <button class="qnav-btn" id="navPrev" onclick="prevQ()" title="Voltar / Back">&#8249;<span class="ql">Voltar</span></button>
  <button class="qnav-btn jump" id="navJump" onclick="jumpUnanswered()" title="Próxima sem resposta / Next unanswered">&#9193;<span class="ql">Sem resposta</span></button>

  <button class="ulk-yes" onclick="doUnlock()">&#128275; Desbloquear / Unlock</button>
  <button class="ulk-no" onclick="cancelUnlock()">&#8617;&#65039; Continuar / Keep playing</button>

<script>
/* ============================================================
   QUESTION BANK — Science Y2 · Unit "Properties of Matter"
   English first; PT translation toggled by the BR flag.
   Everything anchored to trabalho/2tri_ciencias/_roteiro.md.
   Themes (th): states | particles | light | water | change
   DISTRACTOR RULE: every wrong option is a term from the material,
   thematically related, but UNEQUIVOCALLY wrong (no second truths,
   no "out-there" options). See _roteiro.md "Nota de qualidade".
   ============================================================ */

/* ---- MULTIPLE CHOICE ---- opts:[text, correct?1:0, pt] ---- */
const MC = [
 /* STATES & PROPERTIES */
 {th:'states',fig:"\u{1F9CA}",en:"Which state has a <b>fixed shape</b> and a fixed volume?",pt:"Qual estado tem forma fixa e volume fixo?",opts:[["Solid",1,"Sólido"],["Liquid",0,"Líquido"],["Gas",0,"Gás"]]},
 {th:'states',fig:"\u{1F964}",en:"Which state <b>takes the shape</b> of its container?",pt:"Qual estado toma a forma do recipiente?",opts:[["Liquid",1,"Líquido"],["Solid",0,"Sólido"],["Gas",0,"Gás"]]},
 {th:'states',fig:"\u{1F4A8}",en:"Which state has <b>no fixed shape and no fixed volume</b>?",pt:"Qual estado não tem forma fixa nem volume fixo?",opts:[["Gas",1,"Gás"],["Solid",0,"Sólido"],["Liquid",0,"Líquido"]]},
 {th:'states',fig:"\u{1FAA8}",en:"<b>Why</b> does a solid keep its shape?",pt:"Por que o sólido mantém a forma?",opts:[["Its particles are packed tightly together",1,"As partículas estão bem juntinhas"],["Its particles are far apart",0,"As partículas estão bem afastadas"],["Its particles slide around each other",0,"As partículas escorregam umas nas outras"]]},
 {th:'states',fig:"\u{1F388}",en:"What can a <b>gas</b> do that a solid cannot?",pt:"O que o gás faz que o sólido não faz?",opts:[["Be squeezed (compressed)",1,"Ser comprimido (apertado)"],["Keep a fixed shape",0,"Manter forma fixa"],["Stay in one place",0,"Ficar parado num lugar"]]},
 {th:'states',fig:"\u{1F6B0}",en:"Which one can <b>flow and be poured</b>?",pt:"Qual pode fluir e ser derramado?",opts:[["Liquid",1,"Líquido"],["Solid",0,"Sólido"],["Gas",0,"Gás"]]},
 {th:'states',fig:"\u{1F9CA}",en:"A liquid has a <b>fixed volume</b> but...",pt:"O líquido tem volume fixo, mas...",opts:[["no fixed shape",1,"não tem forma fixa"],["no mass at all",0,"não tem massa nenhuma"],["it can be compressed easily",0,"pode ser comprimido fácil"]]},

 /* PARTICLES */

/* weights — States + Particles dominate (pedagogico calibration) */
const TH_WEIGHT={states:30,particles:25,light:20,water:15,change:10};

/* ================= ENGINE ================= */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=id=>document.getElementById(id);
let deck=[], cur=0, total=0, fontStep=0, roundSize=25;
let selThemes=new Set(THEMES.map(t=>t.k));

/* score is derived from the items, so free navigation never double-counts */
function curScore(){return deck.reduce((s,it)=>s+(it.pts||0),0);}
function wrongItems(){return deck.filter(it=>it.done&&it.wrong);}

function makeItem(type,src){
  const it={_type:type,_src:src,type:type,...src};
  if(type==='mc') it.opts=shuffle(src.opts.map(p=>({t:p[0],ok:!!p[1],pt:p[2]})));
  if(type==='fill') it.chips=shuffle([{w:src.ans,ok:true},...src.bank.map(w=>({w,ok:false}))]);
  if(type==='match'){it.cho=new Array(src.items.length).fill(-1);it.active=0;it.locked=false;}
  if(type==='order'){it.order=shuffle(src.items.map((t,i)=>({t,rank:i})));it.seq=[];it.locked=false;}
  it.done=false; it.pts=0; it.wrong=false;
  return it;
}

function pickTheme(tag,count){
  const byType={mc:[],fill:[],vf:[],open:[],order:[],match:[]};
  const add=(arr,type)=>arr.forEach(o=>{if(o.th===tag)byType[type].push({type,src:o});});
  add(MC,'mc');add(FILL,'fill');add(VF,'vf');add(OPEN,'open');add(ORDER,'order');add(MATCH,'match');
  Object.keys(byType).forEach(k=>shuffle(byType[k]));
  const order=['mc','vf','fill','order','match','open'];
  const out=[]; let guard=0;
  while(out.length<count && guard<2000){
    let any=false;
    for(const t of order){ if(out.length>=count)break; if(byType[t].length){out.push(byType[t].shift());any=true;} }
    if(!any)break; guard++;
  }
  return out;
}

function buildDeck(n){
  const tags=[...selThemes];
  const sumW=tags.reduce((s,t)=>s+(TH_WEIGHT[t]||1),0)||1;
  let picks=[];
  tags.forEach(t=>{ picks=picks.concat(pickTheme(t,Math.round(n*(TH_WEIGHT[t]||1)/sumW))); });
  picks=shuffle(picks);
  if(picks.length>n) picks=picks.slice(0,n);
  if(picks.length<n){
    const used=new Set(picks.map(p=>p.src)); const rest=[];
    const addAll=(arr,type)=>arr.forEach(o=>{if(selThemes.has(o.th)&&!used.has(o))rest.push({type,src:o});});
    addAll(MC,'mc');addAll(VF,'vf');addAll(FILL,'fill');addAll(ORDER,'order');addAll(MATCH,'match');addAll(OPEN,'open');
    shuffle(rest);
    while(picks.length<n && rest.length) picks.push(rest.shift());
  }
  deck=shuffle(picks).map(p=>makeItem(p.type,p.src));
  total=deck.length; cur=0;
}

function fs(d){fontStep=Math.max(-2,Math.min(3,fontStep+d));document.documentElement.style.setProperty('--fs',1+fontStep*0.12);}
function esc(s){return String(s).replace(/<[^>]*>/g,'').replace(/"/g,'&quot;').replace(/'/g,"\\'");}
function goHome(){if(screenLocked)return;if(confirm('Voltar ao menu do site? / Back to the menu?'))location.href='../index.html';}
function toggleTr(){const on=document.body.classList.toggle('show-tr');try{localStorage.setItem('cie2_tr',on?'1':'0');}catch(e){}}

/* ---- lock / fullscreen (anti accidental exit) ---- */
var screenLocked=false;
function toggleLock(){ if(!screenLocked) doLock(); else $('unlockov').classList.add('show'); }
function doLock(){
  screenLocked=true;
  var el=document.documentElement;
  if(el.requestFullscreen){try{el.requestFullscreen().catch(function(){});}catch(e){}}
  $('lockbtn').classList.add('on'); document.body.classList.add('locked');
  try{history.pushState({lock:1},'');}catch(e){}
}
function doUnlock(){
  screenLocked=false;
  $('unlockov').classList.remove('show'); $('lockbtn').classList.remove('on'); document.body.classList.remove('locked');
  if(document.fullscreenElement&&document.exitFullscreen){try{document.exitFullscreen().catch(function(){});}catch(e){}}
}
function cancelUnlock(){ $('unlockov').classList.remove('show'); }
addEventListener('popstate',function(){ if(screenLocked){try{history.pushState({lock:1},'');}catch(e){}} });

/* ---- question navigation arrows ---- */
function prevQ(){ if(cur>0){cur--;render();} }
function nextQ(){ if(cur<total-1){cur++;render();} }
/* index of the next UNANSWERED question (search forward, wrap around); -1 if none */
function nextUnansweredIdx(){
  if(!deck||!total)return -1;
  for(var k=1;k<=total;k++){ var idx=(cur+k)%total; if(!deck[idx].done) return idx; }
  return -1;
}
function jumpUnanswered(){ var idx=nextUnansweredIdx(); if(idx>=0){ cur=idx; render(); } }
function updateArrows(){
  $('qnav').classList.add('show');
  $('navPrev').disabled = cur<=0;
  $('navNext').disabled = cur>=total-1;
  var ji=nextUnansweredIdx();
  $('navJump').disabled = ji<0 || ji===cur;   /* só habilita se houver OUTRA questão sem resposta */
}
function say(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/en-US|en_US|English \(United States\)/i.test(v.lang+v.name));if(v)u.voice=v;
  speechSynthesis.speak(u);}catch(e){}}

/* ---- screens ---- */
function intro(){
  $('bar').style.width='0%';
  $('qnav').classList.remove('show');
  $('card').innerHTML=`<div class="intro">
    <div class="qfig">\u{1F9EA}</div>
    <div class="q">Let's study for the test!</div>
    <div class="tr qtr">Vamos estudar para a prova!</div>
    <p>Choose your <b>topics</b> and how many <b>questions</b> you want.
       <span class="tr">Escolha os temas e quantas perguntas você quer.</span></p>
    <div class="themewrap">
      ${THEMES.map(t=>`<button class="themechip${selThemes.has(t.k)?' on':''}" onclick="toggleTheme('${t.k}')">
        <span class="tem">${t.emo}</span><span>${t.en}</span><span class="ttr tr">${t.pt}</span></button>`).join('')}
    </div>
    <p class="themehint" id="themehint"></p>
    <p><b>How many questions?</b> <span class="tr">Quantas perguntas?</span></p>
    <div class="sizewrap">
      ${[5,10,25,50,100].map(n=>`<button class="sizebtn${n===roundSize?' sel':''}" onclick="start(${n})">${n}<span class="sl">questions</span></button>`).join('')}
    </div>
    <p class="startnote">Tap a number to start. <span class="tr">Toque na quantidade para começar.</span></p>
  </div>`;
}
function toggleTheme(k){
  if(selThemes.has(k)){ if(selThemes.size>1) selThemes.delete(k); }
  else selThemes.add(k);
  intro();
}
function start(n){
  if(selThemes.size===0)return;
  roundSize=n; buildDeck(n);
  if(total===0){ const h=$('themehint'); if(h)h.textContent='Choose at least one topic. / Escolha ao menos um tema.'; return; }
  render();
}
function render(){
  $('bar').style.width=(cur/total*100)+'%';
  const it=deck[cur];
  ({mc:renderMC,vf:renderVF,open:renderOpen,fill:renderFill,match:renderMatch,order:renderOrder}[it.type])(it);
  addRedoBtn();
  updateArrows();
}
/* redo THIS question — clears the answer, no score effect (accidental taps) */
function addRedoBtn(){
  const b=document.createElement('button');
  b.className='redoq';b.id='redoq';b.title='Refazer esta questão / Redo this question';
  b.innerHTML='↺<span class="rl">redo</span>';
  b.onclick=redoQ;
  $('card').appendChild(b);
}
function redoQ(){
  try{speechSynthesis.cancel();}catch(e){}
  deck[cur]=makeItem(deck[cur]._type,deck[cur]._src);
  render();
}
function head(it,label,cls){return `<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge ${cls}">${label}</span></div>
  ${it.fig?`<div class="qfig">${it.fig}</div>`:''}${it.en?`<div class="q">${it.en}</div><div class="tr qtr">${it.pt}</div>`:''}
  ${it.en?`<button class="speak" onclick="say('${esc(it.en)}')">&#128266; Listen</button>`:''}`;}
function nextBtn(hidden){return `<button class="next" id="next" ${hidden?'style="display:none"':''} onclick="next()">${cur===total-1?'See results \u{1F389}':'Next →'}</button>`;}

/* MC */
function renderMC(it){
  $('card').innerHTML=head(it,'Circle','mc')+
   `<div class="opts">${it.opts.map((o,i)=>`<button class="opt" onclick="ansMC(${i})"><span>${o.t}</span>${o.pt?`<span class="otr">${o.pt}</span>`:''}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`+nextBtn(!it.done);
  if(it.done) paintMC(it);
}
function ansMC(i){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.pick=i;
  it.pts=it.opts[i].ok?1:0; it.wrong=!it.opts[i].ok;
  paintMC(it);
}
function paintMC(it){
  const b=document.querySelectorAll('.opt'), i=it.pick;
  b.forEach(x=>x.disabled=true);
  if(it.opts[i].ok){b[i].classList.add('ok');$('fb').textContent='Correct! \u{1F31F}';$('fb').className='fb ok';}
  else{b[i].classList.add('no');it.opts.forEach((o,k)=>{if(o.ok)b[k].classList.add('ok');});
    $('fb').textContent='The green one is right \u{1F60A}';$('fb').className='fb no';}
  $('next').classList.add('show');
}

/* V/F */
function renderVF(it){
  $('card').innerHTML=head(it,'True or False','vf')+
   `<div class="vfwrap">
      <button class="vfbtn" id="vT" onclick="ansVF(true)"><span class="big">✅</span>True<span class="vtr">verdadeiro</span></button>
      <button class="vfbtn" id="vF" onclick="ansVF(false)"><span class="big">❌</span>False<span class="vtr">falso</span></button>
    </div><div class="fb" id="fb"></div>`+nextBtn(!it.done);
  if(it.done) paintVF(it);
}
function ansVF(val){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.pick=val;
  it.pts=(val===it.ans)?1:0; it.wrong=(val!==it.ans);
  paintVF(it);
}
function paintVF(it){
  const T=$('vT'),F=$('vF'); T.disabled=F.disabled=true;
  const rightBtn=it.ans?T:F;
  if(it.pick===it.ans){rightBtn.classList.add('ok');$('fb').textContent='Correct! \u{1F31F}';$('fb').className='fb ok';}
  else{(it.pick?T:F).classList.add('no');rightBtn.classList.add('ok');
    $('fb').textContent='The green one is right \u{1F60A}';$('fb').className='fb no';}
  $('next').classList.add('show');
}

/* COMPLETE */
function renderFill(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge fill">Complete</span></div>
   <button class="speak" onclick="say('${esc(it.pre+' '+it.ans+' '+it.post)}')">&#128266; Listen</button>
   <div class="fillsent">${it.pre} <span class="blank" id="blank">_____</span> ${it.post}</div>
   <div class="tr qtr">${it.pt}</div>
   <div class="wbank">${it.chips.map((c,i)=>`<button class="wchip" onclick="ansFill(${i})"><span>${c.w}</span>${WPT[c.w]?`<span class="otr">${WPT[c.w]}</span>`:''}</button>`).join('')}</div>
   <div class="fb" id="fb"></div>`+nextBtn(!it.done);
  if(it.done) paintFill(it);
}
function ansFill(i){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.pick=i;
  it.pts=it.chips[i].ok?1:0; it.wrong=!it.chips[i].ok;
  paintFill(it);
}
function paintFill(it){
  const chips=document.querySelectorAll('.wchip'), i=it.pick, chosen=it.chips[i];
  chips.forEach(c=>c.disabled=true);
  $('blank').textContent=chosen.w;
  if(chosen.ok){chips[i].classList.add('ok');$('blank').classList.add('ok');$('fb').textContent='Correct! \u{1F31F}';$('fb').className='fb ok';}
  else{chips[i].classList.add('no');$('blank').classList.add('no');
    it.chips.forEach((c,k)=>{if(c.ok)chips[k].classList.add('ok');});
    $('blank').textContent=it.ans;$('blank').classList.remove('no');$('blank').classList.add('ok');
    $('fb').textContent='The right word is "'+it.ans+'" \u{1F60A}';$('fb').className='fb no';}
  $('next').classList.add('show');
}

/* MATCH */
function renderMatch(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge match">Match</span></div>
   <div class="q">${it.t}</div>
   <div class="tr qtr">${it.tpt}</div>
   <button class="speak" onclick="say('${esc(it.t)}')">&#128266; Listen</button>
   <div class="mintro">Tap the item, then the group. / Toque no item, depois no grupo.</div>
   <div class="mboard" id="mboard"></div>
   <div class="mcats" id="mcats">${it.cats.map((c,ci)=>`<button class="mcat" onclick="pickCat(${ci})"><span>${c[0]}</span>${c[1]?`<span class="otr">${c[1]}</span>`:''}</button>`).join('')}</div>
   <div class="fb" id="fb"></div>
   <button class="next" id="mcheck" style="display:none" onclick="checkMatch()">Check &#9989;</button>`+nextBtn(true);
  drawMatch();
  if(it.done) paintMatch(it);
}
function drawMatch(){
  const it=deck[cur];
  $('mboard').innerHTML=it.items.map((m,mi)=>{
    const cho=it.cho[mi];
    const slot=cho>=0?`<span class="mslot set">${it.cats[cho][0]}</span>`:`<span class="mslot">?</span>`;
    return `<button class="mitem${mi===it.active?' active':''}" id="mi${mi}" onclick="pickItem(${mi})">
      <span class="mlbl"><span>${m[0]}</span><span class="mtr">${m[1]}</span></span>${slot}</button>`;
  }).join('');
  const done=it.cho.every(c=>c>=0);
  $('mcheck').style.display=done?'block':'none';
}
function pickItem(mi){const it=deck[cur];if(it.locked)return;it.active=mi;drawMatch();}
function pickCat(ci){
  const it=deck[cur];if(it.locked)return;
  it.cho[it.active]=ci;
  let nxt=it.cho.findIndex(c=>c<0); it.active=nxt<0?it.active:nxt;
  drawMatch();
}
function checkMatch(){
  const it=deck[cur]; if(it.done)return;
  it.locked=true; it.done=true;
  let right=0; it.items.forEach((m,mi)=>{ if(it.cho[mi]===m[2]) right++; });
  const all=it.items.length;
  it.pts=right/all; it.wrong=(right<all);
  paintMatch(it);
}
function paintMatch(it){
  let right=0;
  it.items.forEach((m,mi)=>{
    const el=$('mi'+mi); if(!el)return; el.disabled=true;
    if(it.cho[mi]===m[2]){el.classList.add('ok');right++;}
    else{el.classList.add('no');const sl=el.querySelector('.mslot');if(sl)sl.textContent=it.cats[m[2]][0];}
  });
  document.querySelectorAll('.mcat').forEach(c=>c.disabled=true);
  $('mcheck').style.display='none';
  const all=it.items.length;
  if(right===all){$('fb').textContent='All correct! \u{1F31F}';$('fb').className='fb ok';}
  else{$('fb').textContent=right+' of '+all+' right — green shows the answer \u{1F60A}';$('fb').className='fb mid';}
  $('next').style.display='block';$('next').classList.add('show');
}

/* ORDER */
function renderOrder(it){
  $('card').innerHTML=`<div class="qhead"><span class="qnum">Question ${cur+1} of ${total}</span><span class="badge order">Order</span></div>
   <div class="q">${it.t}</div>
   <div class="tr qtr">${it.tpt}</div>
   <button class="speak" onclick="say('${esc(it.t)}')">&#128266; Listen</button>
   <div class="mintro">Tap them in order. Tap again to remove. / Toque na ordem. Toque de novo para tirar.</div>
   <div class="oseq" id="oseq"></div>
   <div class="opool" id="opool"></div>
   <div class="fb" id="fb"></div>
   <button class="next" id="ocheck" style="display:none" onclick="checkOrder()">Check &#9989;</button>`+nextBtn(true);
  drawOrder();
  if(it.done) paintOrder(it);
}
function drawOrder(){
  const it=deck[cur], n=it.order.length;
  let seqHtml='';
  for(let p=0;p<n;p++){
    const chip=it.seq[p];
    seqHtml+=chip!=null
      ? `<button class="oslot filled" onclick="orderRemove(${p})"><span class="onum">${p+1}</span><span>${it.order[chip].t}</span></button>`
      : `<div class="oslot"><span class="onum">${p+1}</span><span>...</span></div>`;
  }
  $('oseq').innerHTML=seqHtml;
  $('opool').innerHTML=it.order.map((o,i)=>`<button class="opiece${it.seq.includes(i)?' used':''}" onclick="orderPlace(${i})">${o.t}</button>`).join('');
  $('ocheck').style.display=it.seq.length===n?'block':'none';
}
function orderPlace(i){const it=deck[cur];if(it.locked)return;if(it.seq.includes(i))return;it.seq.push(i);drawOrder();}
function orderRemove(p){const it=deck[cur];if(it.locked)return;it.seq.splice(p,1);drawOrder();}
function checkOrder(){
  const it=deck[cur]; if(it.done)return;
  it.locked=true; it.done=true;
  let right=0; it.seq.forEach((chip,p)=>{ if(it.order[chip].rank===p) right++; });
  const all=it.order.length;
  it.pts=right/all; it.wrong=(right<all);
  paintOrder(it);
}
function paintOrder(it){
  let right=0;
  const slots=document.querySelectorAll('#oseq .oslot');
  it.seq.forEach((chip,p)=>{
    const ok=it.order[chip].rank===p;
    if(slots[p]){if(ok){slots[p].classList.add('ok');right++;}else slots[p].classList.add('no');}else if(ok)right++;
  });
  document.querySelectorAll('.opiece').forEach(c=>c.classList.add('used'));
  $('ocheck').style.display='none';
  const all=it.order.length;
  if(right===all){$('fb').innerHTML='Right order! \u{1F31F}';$('fb').className='fb ok';}
  else{
    const correct=it._src.items.join('  →  ');
    $('fb').innerHTML=right+' of '+all+' in the right place \u{1F60A}<div class="ocorrect">Right order: '+correct+'</div>';
    $('fb').className='fb mid';
  }
  $('next').style.display='block';$('next').classList.add('show');
}

/* OPEN */
function renderOpen(it){
  $('card').innerHTML=head(it,'Open answer','open')+
   `<div class="writeline">&#9999;&#65039; answer in your head</div>
    <button class="next show" id="seebtn" onclick="reveal()">See the answer &#128065;&#65039;</button>
    <div class="reveal" id="rev"><span class="lab">Answer</span>${it.men}<div class="tr">${it.menpt||''}</div></div>
    <div class="hint" id="selfhint" style="display:none">Did you get it? / Você acertou?</div>
    <div class="selfwrap" id="self">
      <button class="selfbtn acertei" onclick="self('ok')"><span class="big">\u{1F604}</span>I got it<span class="str">acertei</span></button>
      <button class="selfbtn parcial" onclick="self('mid')"><span class="big">\u{1F610}</span>Almost<span class="str">mais ou menos</span></button>
      <button class="selfbtn errei" onclick="self('no')"><span class="big">\u{1F605}</span>Not yet<span class="str">errei</span></button>
    </div>
    <div class="fb" id="fb"></div>`+nextBtn(true);
  if(it.revealed||it.done){$('rev').classList.add('show');$('seebtn').style.display='none';$('selfhint').style.display='block';$('self').classList.add('show');}
  if(it.done) paintSelf(it);
}
function reveal(){const it=deck[cur];it.revealed=true;$('rev').classList.add('show');$('seebtn').style.display='none';$('selfhint').style.display='block';$('self').classList.add('show');}
function self(v){
  const it=deck[cur]; if(it.done)return;
  it.done=true; it.selfv=v;
  if(v==='ok'){it.pts=1;it.wrong=false;}else if(v==='mid'){it.pts=0.5;it.wrong=true;}else{it.pts=0;it.wrong=true;}
  paintSelf(it);
}
function paintSelf(it){
  document.querySelectorAll('.selfbtn').forEach(b=>b.disabled=true);
  if(it.selfv==='ok'){document.querySelector('.selfbtn.acertei').classList.add('sel');$('fb').textContent='Well done! \u{1F31F}';$('fb').className='fb ok';}
  else if(it.selfv==='mid'){document.querySelector('.selfbtn.parcial').classList.add('sel');$('fb').textContent='Almost there! \u{1F44D}';$('fb').className='fb mid';}
  else{document.querySelector('.selfbtn.errei').classList.add('sel');$('fb').textContent='Now you know! \u{1F4AA}';$('fb').className='fb no';}
  $('next').style.display='block';$('next').classList.add('show');
}

function next(){cur++;if(cur<total)render();else fim();}
function redoWrong(){
  const w=wrongItems().map(it=>({type:it._type,src:it._src}));
  deck=shuffle(w).map(x=>makeItem(x.type,x.src));
  total=deck.length;cur=0;
  render();
}
function fim(){
  $('bar').style.width='100%';
  $('qnav').classList.remove('show');
  const score=curScore(), s=Math.round(score*10)/10, pct=total?score/total:0;
  const msg=pct>=.9?'You rocked it! \u{1F3C6}':pct>=.6?'Great job! Keep practising.':'Good practice — try again to learn more!';
  const nWrong=wrongItems().length;
  const redoBtn=nWrong?`<button class="endbtn redo" onclick="redoWrong()">↺ Redo the wrong ones (${nWrong})<span class="etr">Refazer as erradas</span></button>`:'';
  $('card').innerHTML=`<div class="fim"><div class="big">\u{1F3C6}</div>
    <div class="score">${s} / ${total}</div>
    <div class="sub">${msg}</div>
    <div class="endbtns">
      ${redoBtn}
      <button class="endbtn" onclick="intro()">\u{1F3B2} New quiz<span class="etr">Novo simulado</span></button>
      <button class="endbtn" onclick="goHome()">\u{1F3E0} Menu<span class="etr">Menu do site</span></button>
    </div></div>`;
}

/* starfield */
(function(){var c=document.getElementById('starfield'),x=c.getContext('2d'),s=[];
function rz(){c.width=innerWidth;c.height=innerHeight;s=[];for(var i=0;i<140;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.2,a:Math.random(),da:(Math.random()-.5)*.004,sp:Math.random()*.1+.02});}
function d(){x.clearRect(0,0,c.width,c.height);s.forEach(function(t){t.y-=t.sp;if(t.y<-5)t.y=c.height+5;t.a+=t.da;if(t.a>1||t.a<.1)t.da*=-1;x.save();x.globalAlpha=t.a;x.fillStyle='#fff';x.beginPath();x.arc(t.x,t.y,t.r,0,Math.PI*2);x.fill();x.restore();});requestAnimationFrame(d);}
rz();addEventListener('resize',rz);d();})();
if('speechSynthesis' in window){speechSynthesis.getVoices();}
try{if(localStorage.getItem('cie2_tr')==='1')document.body.classList.add('show-tr');}catch(e){}
intro();
</script>
