<style>
/* só o que é exclusivo desta tela */
.placar{font-size:calc(2.6rem*var(--fs));font-weight:900;line-height:1;color:var(--accent);text-align:center;margin:6px 0 2px}

.fambar.zero{opacity:.55}
.progresso{font-size:calc(.74rem*var(--fs));font-weight:800;color:var(--dim);text-align:center;margin-top:9px;line-height:1.4}
.bancobar{height:8px;border-radius:5px;background:var(--line);margin:14px 0 0;overflow:hidden}

body.papel .bancobar{background:#e4e4e4}

/* a folha é da prova de PORTUGUÊS da escola, não da Olimpíada: o

/* na folha branca, os botões de escolha e o placar precisam de tinta escura

.revtop{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:calc(.78rem*var(--fs));font-weight:900}
.revn{background:var(--line);border-radius:8px;padding:1px 8px}
.revf{flex:1}
.rev.ok .revst{color:var(--ok)} .rev.no .revst{color:var(--no)}
.revq{font-weight:800;line-height:1.4;margin:2px 0 6px}
.reva{font-size:calc(.92rem*var(--fs));font-weight:700;line-height:1.4;margin:3px 0;padding:5px 8px;border-radius:8px}
.reva.sua{background:rgba(198,40,40,.12)} .reva.certa{background:rgba(46,125,50,.14)}

body.papel .anelin{background:#fff} body.papel .anelin b{color:#111} body.papel .anelin small,body.papel .rn span,body.papel .revt{color:#555}
body.papel .rn,body.papel .rev{background:#f8f8f8;border-color:#ccc;color:#111}

body.papel .revn{background:#e2e2e2}

body.papel .reva{color:#111}
</style>

<script>
/* MODO PAPEL — a folha da prova de verdade, com a interacao por cima.
   Ligado por padrao nesta tela: o objetivo e a crianca reconhecer no dia
   o que esta vendo. O botao da folha alterna para o visual do site, para
   quem preferir ler no escuro. A escolha fica salva. */
(function(){
  var K='his3_papel';
  function ligado(){ try{ return localStorage.getItem(K)!=='0'; }catch(e){ return true; } }
  function pinta(){
    var on=ligado();
    document.body.classList.toggle('papel',on);
    var b=document.getElementById('papelbtn');
    if(b){
      b.innerHTML = on ? '&#128196;' : '&#128421;&#65039;';
      b.title = on ? 'Folha da prova (como a de verdade)' : 'Folha da prova';
    }
    var m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content', on ? '#8a8f98' : '#0d0b1e');
  }
  window.togglePapel=function(){
    try{ localStorage.setItem(K, ligado()?'0':'1'); }catch(e){}
    pinta();
  };
  pinta();
  document.addEventListener('DOMContentLoaded',pinta);
})();
</script>

<script>
'use strict';
/* ============================================================
   SIMULADO DE HISTÓRIA (3º tri) — fork do de Inglês — mesmo motor do simulado de
   Português (OP_questao.js intacto). Dados: HIS3_simulado_data.js, GERADO
   do banco único HIS3_banco.js (trabalho/3tri_historia/gen/gen_simulado_his3.js).
   Inglês na frente, português atrás da bandeira (body.show-tr).
   Rodada de 12 com as cotas por tema (fairy 3, real 2, circle 2, cause 2,
   poem 3). A rodada acaba na última questão; as questões-irmãs (mesmo tema)
   são oferecidas no resultado, em "Practise with similar questions".
   ============================================================ */
var h=React.createElement, OP=window.HIS3S, OPQ=window.OPQ, LP3E={zeraVistos:function(){},sorteia:function(){return [];}};
var FAM={}; OP.FAMILIAS.forEach(function(f){ FAM[f.k]=f; });
var VISTOS='his3_vistos';
var BANCO=OP.ITENS;
var RODADA=OP.FAMILIAS.reduce(function(s,f){ return s+(f.cota||0); },0);   /* 12 */
var AQUECER=5, ESC_PROVA=4, ESC_SO=8;

function vistos(){ try{ return JSON.parse(localStorage.getItem(VISTOS)||'[]'); }catch(e){ return []; } }
function marcaVisto(ids){
  var v=vistos(); ids.forEach(function(i){ if(v.indexOf(i)<0) v.push(i); });
  try{ localStorage.setItem(VISTOS,JSON.stringify(v)); }catch(e){}
}
function zeraVistos(){ try{ localStorage.removeItem(VISTOS); }catch(e){} }

/* monta uma rodada de n questões com as cotas do roteiro, dando prioridade
   ao que ela ainda não viu */
function montaRodada(n){
  var jaVi=vistos(), escolhidas=[];
  function pegaDe(k, quantas){
    var pool=BANCO.filter(function(i){ return i.eixo===k && escolhidas.indexOf(i)<0; });
    var novas=OPQ.embaralha(pool.filter(function(i){ return jaVi.indexOf(i.id)<0; }));
    var velhas=OPQ.embaralha(pool.filter(function(i){ return jaVi.indexOf(i.id)>=0; }));
    escolhidas=escolhidas.concat(novas.concat(velhas).slice(0,quantas));
  }
  function menosVistas(filtro){
    return OPQ.embaralha(OP.FAMILIAS.filter(filtro)).map(function(f){
      return {k:f.k, novas:BANCO.filter(function(i){ return i.eixo===f.k && jaVi.indexOf(i.id)<0; }).length};
    }).sort(function(a,b){ return b.novas-a.novas; });
  }
  if(n>=RODADA){
    OP.FAMILIAS.forEach(function(f){ if(f.cota) pegaDe(f.k,f.cota); });
  } else {
    /* aquecer: o mesmo peso em miniatura — 3 do bloco A, 2 dos blocos B/C */
    var a=Math.round(n*0.6);
    menosVistas(function(f){ return f.bloco==='A'; }).slice(0,a).forEach(function(f){ pegaDe(f.k,1); });
    menosVistas(function(f){ return f.bloco!=='A'; }).slice(0,n-a).forEach(function(f){ pegaDe(f.k,1); });
  }
  return OPQ.embaralha(escolhidas.slice(0,n));
}
/* A questão-irmã também respeita o histórico (senão volta sempre às
   mesmas poucas, rodada após rodada). */
function irma(eixo, usados){
  var jaVi=vistos();
  var pool=BANCO.filter(function(i){ return i.eixo===eixo && usados.indexOf(i.id)<0; });
  var novas=pool.filter(function(i){ return jaVi.indexOf(i.id)<0; });
  return OPQ.embaralha(novas.length?novas:pool)[0]||null;
}
function copia(o){ var n={}; for(var k in o) n[k]=o[k]; return n; }
/* 21/10 (Paulo: "o aluno termina o simulado e não mostra o resultado"): a cada erro entrava uma questão-irmã
   logo depois — e a irmã errada puxava outra. Depois da "Question 12 of 12" vinham mais e mais questões, e o
   resultado parecia nunca chegar. Agora a rodada acaba na última questão e o resultado vem na hora: a
   porcentagem, os tópicos, a revisão (só as erradas ou todas) e o que fazer em seguida. As questões
   parecidas viraram um botão do resultado. */
function T2(en,pt){ return pt; }
function certaDe(item){ for(var i=0;i<item.opts.length;i++) if(item.opts[i].ok) return item.opts[i].t; return ''; }
function estrelas(p){ return p>=90?3:p>=70?2:p>=40?1:0; }

function App(){
  var t=React.useState('inicio'), tela=t[0], setTela=t[1];
  var m=React.useState('prova'), modo=m[0], setModo=m[1];      /* prova | aquecer | refazer | parecidas */
  var tm=React.useState(RODADA), tam=tm[0], setTam=tm[1];        /* tamanho da última rodada nova */
  var f=React.useState([]), fila=f[0], setFila=f[1];
  var c=React.useState(0), cur=c[0], setCur=c[1];
  var r=React.useState({}), resp=r[0], setResp=r[1];             /* id -> {ok, t} */
  var v=React.useState('erros'), ver=v[0], setVer=v[1];          /* revisão: erros | todas */

  var ids=BANCO.map(function(i){ return i.id; });
  var totalBanco=BANCO.length, jaVistas=vistos().filter(function(id){ return ids.indexOf(id)>=0; }).length;

  function joga(q, md){ setModo(md); setFila(q); setCur(0); setResp({}); setVer('erros'); setTela('q'); marcaVisto(q.map(function(i){ return i.id; })); }
  function comeca(n){ setTam(n); joga(montaRodada(n), n>=RODADA?'prova':'aquecer'); }
  function responde(acertou,item,texto){
    if(resp[item.id]) return; /* voltou a uma questão já feita: vale a primeira resposta */
    var novo=copia(resp); novo[item.id]={ok:acertou,t:texto}; setResp(novo);
  }
  function avanca(){ if(cur<fila.length-1) setCur(cur+1); else setTela('fim'); }
  function volta(){ if(cur>0) setCur(cur-1); }

  /* barra de progresso e navegação de baixo, que vivem fora do React */
  React.useEffect(function(){
    var bar=document.getElementById('bar'), nav=document.getElementById('qnav');
    var p=document.getElementById('navPrev'), n=document.getElementById('navNext');
    if(tela==='q'){
      nav.style.display='flex';
      bar.style.width=Math.round(cur/fila.length*100)+'%';
      p.disabled = cur===0; p.onclick=volta; n.onclick=avanca;
      n.innerHTML = cur<fila.length-1 ? 'Próxima &#8250;' : 'Ver meu resultado';
    } else {
      nav.style.display='none'; bar.style.width = tela==='fim'?'100%':'0%';
    }
  });
  /* cada questão nova começa do alto da página */
  React.useEffect(function(){ try{ window.scrollTo(0,0); }catch(x){} },[tela,cur]);

  if(tela==='inicio'){
    var faltam=Math.max(0,totalBanco-jaVistas), rodadas=Math.floor(totalBanco/RODADA);
    return h('div',null,
      h('h1',{className:'tt'},'Simulado — História'),
      h('p',{className:'sub'},'Detetives do Tempo · Fontes históricas · A escola tem história · Profissões no tempo'),
      h('div',{className:'grade duas'},
        h('button',{className:'linha',onClick:function(){ comeca(AQUECER); }},
          h('span',{className:'n'},String(AQUECER)),
          h('span',null,h('b',null,'Aquecer'),h('small',null,'5 questões'))),
        h('button',{className:'linha',onClick:function(){ comeca(RODADA); }},
          h('span',{className:'n'},String(RODADA)),
          h('span',null,h('b',null,'Simulado completo'),h('small',null,RODADA+' questões, como a prova'))),
      ),
      h('div',{className:'bancobar'},
        h('div',{className:'bancofill',style:{width:Math.round(jaVistas/totalBanco*100)+'%'}})),
      h('p',{className:'progresso'},
        faltam>0
          ? totalBanco+' questões: '+rodadas+' simulados sem repetir. Você já viu '+jaVistas+'; faltam '+faltam+'.'
          : 'Você já viu as '+totalBanco+' questões. Agora elas voltam.'),
      jaVistas>0 && h('div',{className:'linhabtn',style:{justifyContent:'center'}},
        h('button',{className:'mini',onClick:function(){
          zeraVistos(); LP3E.zeraVistos(); setTela('inicio0'); setTimeout(function(){ setTela('inicio'); },0);
        }},'Começar de novo do zero'))
    );
  }
  if(tela==='inicio0') return h('div',null);

  if(tela==='q'){
    var item=fila[cur], ultima=cur===fila.length-1, rr=resp[item.id];
    return h(OPQ.Questao,{
      key:item.id+'-'+cur, item:item,
      numero:cur+1, total:fila.length,
      etiqueta: modo==='refazer' ? 'de novo' : modo==='parecidas' ? 'parecida' : null,
      respostaTexto: rr ? rr.t : null,
      aoResponder:responde, aoAvancar:avanca,
      rotuloAvancar: !ultima ? 'Próxima' : 'Ver meu resultado'
    });
  }

  /* ---------------- resultado ---------------- */
  var total=fila.length;
  var certas=fila.filter(function(i){ return resp[i.id]&&resp[i.id].ok; });
  var erradas=fila.filter(function(i){ return !(resp[i.id]&&resp[i.id].ok); });
  var pulou=fila.filter(function(i){ return !resp[i.id]; }).length;
  var pct=total?Math.round(certas.length/total*100):0, est=estrelas(pct);
  var porFam={};
  fila.forEach(function(i){ porFam[i.eixo]=porFam[i.eixo]||{ok:0,t:0}; porFam[i.eixo].t++; if(resp[i.id]&&resp[i.id].ok) porFam[i.eixo].ok++; });
  var msg = pct===100 ? T2('All correct! Great job!','Acertou tudo! Muito bem!')
          : pct>=75 ? T2('Almost all! Look at your mistakes below.','Quase tudo! Olhe os erros aqui embaixo.')
          : pct>=50 ? T2('Good work! Practise the mistakes and try again.','Bom trabalho! Treine os erros e tente de novo.')
          : T2('Every mistake here is one you will not make on the test.','Cada erro aqui é um erro a menos na prova.');
  var lista = ver==='erros' ? erradas : fila;
  var parecidas = (function(){
    var usados=fila.map(function(i){ return i.id; }), q=[];
    erradas.forEach(function(i){ var ir=irma(i.eixo, usados); if(ir){ q.push(ir); usados.push(ir.id); } });
    return q;
  })();
  return h('div',{className:'resultado'},
    h('h1',{className:'tt',style:{textAlign:'center'}}, modo==='refazer'?'Os erros, de novo':modo==='parecidas'?'Questões parecidas':'Meu resultado'),
    h('div',{className:'anel',style:{background:'conic-gradient(var(--ok) '+pct*3.6+'deg, var(--line) 0)'},'aria-label':pct+'% de acertos'},
      h('div',{className:'anelin'}, h('b',null,pct+'%'), h('small',null,certas.length+' de '+total))),
    h('div',{className:'estrelas','aria-label':est+' estrelas'}, [0,1,2].map(function(k){ return h('span',{key:k,className:k<est?'on':''},'★'); })),
    h('p',{className:'placarsub'},msg),
    h('div',{className:'resnum'},
      h('div',{className:'rn ok'},h('b',null,certas.length),h('span',null,'certas')),
      h('div',{className:'rn no'},h('b',null,erradas.length-pulou),h('span',null,'erradas')),
      pulou>0 && h('div',{className:'rn pu'},h('b',null,pulou),h('span',null,'sem resposta'))),

    h('div',{className:'grade',style:{marginTop:'12px'}},
      erradas.length>0 && h('button',{className:'avancar',onClick:function(){ joga(OPQ.embaralha(erradas.slice()),'refazer'); }},
        'Refazer os erros ('+erradas.length+')'),
      erradas.length>0 && parecidas.length>0 && h('button',{className:'avancar calmo',onClick:function(){ joga(parecidas,'parecidas'); }},
        'Treinar com questões parecidas'),
      h('button',{className:'avancar'+(erradas.length?' calmo':''),onClick:function(){ comeca(tam); }},
        'Próximo simulado ('+tam+' questões novas)'),
      h('button',{className:'avancar calmo',onClick:function(){ setTela('inicio'); }},'Voltar ao início')
    ),

    h('div',{className:'secao'},'por assunto'),
    OP.FAMILIAS.filter(function(fm){ return porFam[fm.k]; }).map(function(fm){
      var pv=porFam[fm.k];
      return h('div',{key:fm.k,className:'fambar'+(pv.ok===0?' zero':'')},
        h('span',{style:{color:fm.cor}},fm.nome), h('b',null,pv.ok+' de '+pv.t),
        h('i',{className:'fbarra'},h('i',{style:{width:Math.round(pv.ok/pv.t*100)+'%',background:fm.cor}})));
    }),

    h('div',{className:'secao'},'revisão'),
    h('div',{className:'filtro',role:'group'},
      h('button',{className:'mini'+(ver==='erros'?' on':''),'aria-pressed':ver==='erros',onClick:function(){ setVer('erros'); }},'Só as erradas ('+erradas.length+')'),
      h('button',{className:'mini'+(ver==='todas'?' on':''),'aria-pressed':ver==='todas',onClick:function(){ setVer('todas'); }},'Todas ('+total+')')),
    lista.length===0 && h('p',{className:'placarsub'},T2('No mistakes to review. Well done!','Nenhum erro para rever. Muito bem!')),
    lista.map(function(i){
      var rs=resp[i.id], ok=rs&&rs.ok, fm=FAM[i.eixo]||{};
      return h('div',{key:i.id,className:'rev '+(ok?'ok':'no')},
        h('div',{className:'revtop'},
          h('span',{className:'revn'},(fila.indexOf(i)+1)),
          h('span',{className:'revf',style:{color:fm.cor}},fm.nome),
          h('span',{className:'revst'},ok?'✔':'✖')),
        h('p',Object.assign({className:'revq'},html(i.pede))),
        !ok && h('p',{className:'reva sua'},h('b',null,'Sua resposta: '),rs?h('span',html(rs.t)):h('i',null,'sem resposta')),
        h('p',{className:'reva certa'},h('b',null,ok?'Sua resposta: ':'Resposta certa: '),h('span',html(certaDe(i)))),
        i.truqueHtml && h('p',Object.assign({className:'revt'},html(i.truqueHtml)))
      );
    })
  );
}
function html(s){ return {dangerouslySetInnerHTML:{__html:s}}; }

  window.goHome=function(){ if(window.screenLocked) return; ov.classList.add('show'); };
  document.getElementById('sairSim').onclick=function(){ ov.classList.remove('show'); irEmbora(); };
  document.getElementById('sairNao').onclick=function(){ ov.classList.remove('show'); };
  ov.onclick=function(e){ if(e.target===ov) ov.classList.remove('show'); };
  document.addEventListener('keydown',function(e){
    if(ov.classList.contains('show')){ if(e.key==='Escape') ov.classList.remove('show'); return; }
    var nav=document.getElementById('qnav'); if(nav.style.display==='none') return;
    if(e.key==='ArrowRight') document.getElementById('navNext').click();
    else if(e.key==='ArrowLeft'){ var p=document.getElementById('navPrev'); if(!p.disabled) p.click(); }
  });
})();
