<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<title>The Lost Endings — English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="serafina-core.css?v=20261012">
<style>
/* ============================================================
   ING3_jogo.html — The Lost Endings (Inglês 3º tri). Casca herdada do
   LP3_jornada.html; tudo em inglês, português atrás da bandeira. Tudo que é jogo vive no
   canvas #game (960x540 lógico, letterbox). O DOM só cuida do que
   precisa de texto grande e acessível: HUD, quadro da pergunta da
   arena, menus, customização e controles de toque.
   ============================================================ */
:root{--u:1;--fs:1;--ink:#0d0b1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0b1e;
  font-family:'Nunito',"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0b1e}
#game{display:block;background:#0d0b1e}
#ui{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;pointer-events:none}
#ui > *{pointer-events:auto}
button{font-family:inherit;cursor:pointer}
svg{display:block}
#sombtn{display:none}

/* ---- HUD ---- */
#hud{position:absolute;left:0;top:0;right:0;height:54px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(180deg,rgba(13,11,30,.6),rgba(13,11,30,0));transition:opacity .3s}
#hud.arena #hudName{opacity:.6}
.ib{width:42px;height:42px;border-radius:13px;border:2px solid rgba(255,255,255,.28);background:rgba(13,11,30,.55);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);flex:0 0 auto;padding:0}
.ib svg{width:24px;height:24px}
.ib:active{transform:scale(.94)}
.ib{position:relative}
.ib.on{background:rgba(248,113,113,.35);border-color:#fca5a5}
.ib.hold{animation:hold 2s linear forwards}
@keyframes hold{from{box-shadow:inset 0 0 0 0 rgba(74,222,128,.6)}to{box-shadow:inset 0 -42px 0 0 rgba(74,222,128,.6)}}
body.locked #btnHome{display:none}
body.globo #hud .pill,body.globo #hudName,body.globo #btnPause{display:none}
#hudName{flex:1;text-align:center;font-weight:900;font-size:19px;text-shadow:0 2px 6px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;text-shadow:0 2px 6px rgba(0,0,0,.7);background:rgba(13,11,30,.55);padding:5px 12px;border-radius:13px;border:2px solid rgba(255,255,255,.2);height:42px;white-space:nowrap}
.pill svg{width:22px;height:22px}
#hudArena{border-color:rgba(253,230,138,.6)}

/* ---- controles de toque ---- */
#touch{position:absolute;inset:0;pointer-events:none}
body.kbd #touch{display:none !important}
/* pergunta, teoria ou menu na tela: sem botões de controle por cima */
body.naArena #touch,body:has(#qbox.show) #touch,body:has(#menu.show) #touch{display:none !important}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);backdrop-filter:blur(2px);color:#fff;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;width:84px;height:84px;bottom:22px;text-shadow:0 2px 4px rgba(0,0,0,.5);transition:background .1s,transform .1s}
.tb.on{background:rgba(255,255,255,.45);transform:scale(.95)}
#tLeft{left:22px}#tRight{left:122px}#tDown{left:72px;bottom:112px;width:66px;height:66px;font-size:26px}
#tJump{right:22px;width:104px;height:104px;bottom:16px;font-size:20px;letter-spacing:.5px;border-color:rgba(251,191,36,.7);background:rgba(251,191,36,.22)}
#tAct{right:140px;width:84px;height:84px;bottom:30px;font-size:13px;border-color:rgba(96,165,250,.7);background:rgba(96,165,250,.25);display:none;line-height:1.1;text-align:center}
#tAct.show{display:flex}

/* ---- quadro da pergunta ---- */
#qbox{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;padding-bottom:10px;background:rgba(13,11,30,.35)}
#qbox.show{display:flex}
.qcard{width:900px;max-height:400px;overflow:auto;border-radius:26px;padding:0 22px 16px;background:linear-gradient(160deg,#1c1a3a,#0f0e24);border:3px solid var(--tc,#60a5fa);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.06);animation:qin .32s cubic-bezier(.2,1.4,.4,1);position:relative}
.qcard.shake{animation:shake .4s}
@keyframes qin{from{transform:scale(.8) translateY(60px);opacity:0}to{transform:none;opacity:1}}
.qtimer{position:relative;height:14px;margin:0 -22px 10px;background:rgba(255,255,255,.1);border-radius:26px 26px 0 0;overflow:hidden}
.qtbar{height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#fde047);transition:width .25s linear,background .3s}
.qtbar.urgente{background:linear-gradient(90deg,#f87171,#ef4444)}
.qtseg{position:absolute;right:12px;top:-2px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qtema{display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:var(--tc,#60a5fa);color:var(--ink);font-weight:900;font-size:15px;white-space:nowrap}
.qseq{font-weight:800;font-size:15px;opacity:.85;flex:1}
.qpeixes{display:inline-flex;align-items:center;gap:5px;font-weight:900;font-size:16px;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:999px}
.qpeixes svg{width:22px;height:22px}.qpeixes i{font-style:normal;font-weight:700;opacity:.7;font-size:13px}
.qvoz{width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.qvoz svg{width:24px;height:24px}
.qvoz:active{transform:scale(.94)}
body.sem-voz .qvoz{display:none}
.qp{font-size:26px;font-weight:900;line-height:1.3;margin:2px 0 12px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.qops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qops.n2{grid-template-columns:1fr 1fr}.qops.n3{grid-template-columns:1fr 1fr 1fr}.qops.n4{grid-template-columns:1fr 1fr}
.qop{min-height:64px;border-radius:18px;border:3px solid rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));color:#fff;font-size:24px;font-weight:900;padding:8px 12px 8px 60px;text-align:left;position:relative;line-height:1.2;transition:transform .12s,background .2s;animation:opin .35s backwards}
.qop:nth-child(2){animation-delay:.06s}.qop:nth-child(3){animation-delay:.12s}.qop:nth-child(4){animation-delay:.18s}
@keyframes opin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.qop .n{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:12px;background:var(--tc,#60a5fa);color:var(--ink);font-size:19px;display:flex;align-items:center;justify-content:center}
.qop:active{transform:scale(.97)}
.qop.sel{border-color:#fbbf24;background:rgba(251,191,36,.18)}
.qop.ok{border-color:#22c55e;background:linear-gradient(180deg,#22c55e,#15803d);animation:pop .4s}
.qop.err{border-color:#ef4444;background:linear-gradient(180deg,#ef4444,#991b1b)}
.qop:disabled{cursor:default}.qop.dim{opacity:.4}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.qfoot{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:48px}
.qdica{height:46px;padding:0 16px;border-radius:14px;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.qdica svg{width:20px;height:20px}
.qdicaTxt{flex:1;font-size:18px;font-weight:700;color:#fde68a;line-height:1.3;display:none}
.qdicaTxt.show{display:block}
.qex{flex:1;font-size:19px;font-weight:700;line-height:1.3;display:none;color:#e9e6ff}
.qex.show{display:block}.qex.okc{color:#bbf7d0}.qex.errc{color:#fecaca}
.qgo{height:48px;padding:0 24px;border-radius:14px;border:none;font-size:18px;font-weight:900;color:var(--ink);background:linear-gradient(180deg,#fde68a,#f59e0b);box-shadow:0 5px 0 #b45309;display:none}
.qgo.show{display:inline-block;animation:qin .3s}
.qgo:active{transform:translateY(4px);box-shadow:0 1px 0 #b45309}

/* ---- menus ---- */
#menu{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,11,30,.6);backdrop-filter:blur(4px)}
#menu.show{display:flex}
.mcard{width:560px;max-height:520px;overflow:auto;border-radius:26px;padding:20px 24px;background:linear-gradient(160deg,#1c1a3a,#0f0e24);border:3px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;animation:qin .3s}
.mcard.festa{border-color:rgba(253,224,71,.6)}
.mcard.custom{width:600px;position:absolute;right:20px;top:12px;max-height:516px;padding:12px 20px;display:flex;flex-direction:column}
.mcard.custom .cwrap{overflow:auto;flex:1;min-height:0}
.mcard.custom h2{font-size:24px;margin-bottom:6px}
.mcard.custom .mbtn{height:52px;margin:8px 0 0;flex:0 0 auto}
.mcard.regra{width:740px;max-height:516px;display:flex;flex-direction:column;padding:14px 20px}
.mcard.regra h2{font-size:24px;margin-bottom:8px}
.mcard.regra .mbtn{flex:0 0 auto;height:52px;margin:6px 0 0}
.rgwrap{display:grid;gap:8px;text-align:left;overflow:auto;min-height:0}
.rg{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 12px}
.rgl{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.rgt{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--tc);color:var(--ink);font-weight:900;font-size:14px;flex:0 0 auto}
.rgr{font-size:17px;font-weight:800;line-height:1.3}
.rge{margin:4px 0 0;padding-left:18px;font-size:15px;line-height:1.35;columns:2;column-gap:14px}
.rge li{break-inside:avoid}
.rge b,.rgr b,.recap b{color:#fde68a}
/* popup de teoria (errou) */
.mcard.teoria{width:800px;max-height:520px;display:flex;flex-direction:column;text-align:left;padding:14px 20px;border-color:var(--tc,#60a5fa)}
.mcard.teoria h2{text-align:center;font-size:22px;margin:0 0 8px;display:flex;align-items:center;justify-content:center;gap:10px}
.mcard.teoria h2 .qtema{font-size:15px}
.tcorpo{overflow:auto;min-height:0;flex:1;display:grid;gap:8px}
.tregra{font-size:19px;font-weight:900;line-height:1.3;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;border-left:0}
.tregra b,.tex b{color:#fde68a}
.tex{display:flex;flex-wrap:wrap;gap:8px}
.tex span{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-size:17px;font-weight:800}
.tcerta{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(90deg,rgba(34,197,94,.25),rgba(34,197,94,.08));border:2px solid rgba(74,222,128,.6);border-radius:14px;padding:10px 14px;font-size:18px;font-weight:800;line-height:1.3}
.tcerta b{color:#bbf7d0;font-size:20px}
.tmais{display:none;gap:8px}
.tmais.show{display:grid}
.tmais .regra{font-size:17px;font-weight:800;line-height:1.35;margin-bottom:4px}
.tmais h4{margin:0 0 4px;font-size:16px;color:#fde68a}
.tmais .tela{background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px}
.pals{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.pal{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:4px 10px;font-size:18px;font-weight:900;letter-spacing:.5px}
.pal .sil{display:block;font-size:11px;opacity:.7;letter-spacing:1px}
.hl{color:#fde68a;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.mudo{opacity:.4;border-bottom:3px dotted currentColor}
.qt{opacity:.45;text-decoration:line-through;text-decoration-thickness:3px}
.caixa{border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 10px;margin:4px 0}
.caixa h3{margin:0 0 4px;font-size:15px;color:#fde68a}
.dupla{display:flex;gap:8px}.dupla .caixa{flex:1}
.passos{display:flex;gap:6px;align-items:stretch}.passo{flex:1;background:rgba(255,255,255,.06);border-radius:10px;padding:6px;font-size:14px;text-align:center}.passo .fig{display:none}.pseta{align-self:center;opacity:.6}
.chave{display:grid;gap:6px}.chave .tag{display:inline-block;background:#fde68a;color:var(--ink);border-radius:8px;padding:2px 8px;margin-right:6px;font-weight:900}
.tbtns{display:flex;gap:10px;margin-top:10px;flex:0 0 auto}
.tbtns .mbtn{margin:0;height:54px}
.tbtns .mbtn.voz{flex:0 0 64px;display:flex;align-items:center;justify-content:center}
.tbtns .mbtn.voz svg{width:28px;height:28px}
body.sem-voz .tbtns .mbtn.voz{display:none}
/* cartão do conteúdo no mapa */
#mapCard{position:absolute;left:150px;right:150px;bottom:6px;max-height:104px;overflow:hidden;display:none;background:rgba(13,11,30,.9);border:2px solid rgba(253,224,71,.55);border-radius:18px;padding:6px 12px;text-align:left;animation:qin .25s}
#mapCard.show{display:block}
.mcTop{display:flex;align-items:center;gap:10px}
.mcNome{font-weight:700;font-size:14px;color:#fff;flex:1;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mcNome b{color:#fde68a;font-size:17px}
.mcNome small{font-size:12px;color:rgba(255,255,255,.7)}
.mcN{font-size:12px;font-weight:800;opacity:.85;white-space:nowrap}
#mapCard .mbtn{width:auto;height:36px;padding:0 20px;margin:0;font-size:16px}
.mcRegras{display:flex;gap:8px;margin-top:5px}
.mcRegras .rg{flex:1;padding:4px 10px;min-width:0;display:flex;flex-direction:column;gap:2px}
.mcRegras .rgl{flex-wrap:nowrap;align-items:center;min-width:0}
.mcRegras .rgt{font-size:11px;padding:1px 9px}
.mcRegras .rgr{font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mcRegras .rge{font-size:12px;columns:1;margin:0;padding:0;list-style:none;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcRegras .rge li{display:inline}.mcRegras .rge li+li::before{content:" · ";opacity:.6}
.mcard h2{margin:0 0 10px;font-size:28px;font-weight:900}
.mcard p{font-size:19px;line-height:1.4;margin:0 0 10px;opacity:.95}
.mcard p.sub{font-size:16px;opacity:.8}
.mbtn{display:block;width:100%;height:58px;margin:8px 0;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));color:#fff;font-size:20px;font-weight:900}
.mbtn.pri{background:linear-gradient(180deg,#fde68a,#f59e0b);color:var(--ink);border:none;box-shadow:0 5px 0 #b45309}
.mbtn.danger{background:linear-gradient(180deg,#f87171,#b91c1c);border:none}
.mbtn:active{transform:scale(.98)}
.mrow{display:flex;gap:10px}.mrow .mbtn{flex:1}
.mstars{display:flex;justify-content:center;gap:8px;margin:4px 0 10px}
.mstars span{width:54px;height:54px;opacity:.25;transform:scale(.6)}
.mstars span.on{opacity:1;animation:starin .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.mstars svg{width:54px;height:54px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.mfish{display:flex;justify-content:center;gap:4px;margin:6px 0 10px;flex-wrap:wrap}
.mfish span{width:40px;height:40px;opacity:.2}.mfish span.on{opacity:1;animation:starin .4s backwards}
.mfish svg{width:40px;height:40px}
.placar{display:flex;gap:10px;justify-content:center;margin:6px 0 12px}
.placar>div{flex:1;background:rgba(255,255,255,.08);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.placar span svg{width:30px;height:30px}.placar b{font-size:24px}.placar i{font-style:normal;font-size:13px;opacity:.75}
.lista{text-align:left;font-size:15px;line-height:1.5;columns:2;margin:4px 0 8px}
.lista div{display:flex;justify-content:space-between;gap:6px;padding-right:10px}.lista .st{color:#fde047}
.como{text-align:left;font-size:16px;line-height:1.4;display:grid;gap:6px;margin-bottom:8px}
.como div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px}
/* customização */
.cwrap{display:grid;gap:6px;text-align:left}
.crow{display:flex;align-items:center;gap:10px}
.ctit{width:92px;font-weight:900;font-size:15px;opacity:.9;flex:0 0 auto}
.copts{display:flex;gap:6px;flex-wrap:wrap}
.copt{width:46px;height:46px;border-radius:14px;border:3px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
.copt.on{border-color:#fde047;background:rgba(253,224,71,.2);transform:scale(1.06)}
.copt svg{width:34px;height:34px}
.sw{width:26px;height:26px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.5)}
.sw.none{background:transparent;border-style:dashed}

/* ---- botões do mapa ---- */
#mapBtns{position:absolute;right:12px;top:64px;width:150px;display:none;flex-direction:column;gap:8px;pointer-events:none}
#mapBtns .mb{pointer-events:auto;height:42px;padding:0 12px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(13,11,30,.6);color:#fff;font-size:16px;font-weight:900;backdrop-filter:blur(3px)}
#mapBtns .mb.sec{opacity:.7;font-size:14px}
#mapBtns .mb:active{transform:scale(.96)}

/* ---- orientação / toast ---- */
#rot{position:fixed;left:0;right:0;top:0;display:none;justify-content:center;padding:10px;pointer-events:none;z-index:50}
#rot span{background:rgba(251,191,36,.95);color:var(--ink);font-weight:900;font-size:16px;padding:8px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
body.portrait #rot{display:flex}
#toast{position:absolute;left:50%;top:112px;transform:translateX(-50%);background:rgba(13,11,30,.82);border:2px solid rgba(253,224,71,.5);padding:8px 18px;border-radius:999px;font-weight:900;font-size:18px;display:none;white-space:nowrap;max-width:900px;overflow:hidden;text-overflow:ellipsis}
#toast.show{display:block;animation:qin .3s}
/* ---- X da arena: sai das perguntas na hora (3ª rodada) ---- */
#btnSairArena{position:absolute;right:12px;top:58px;width:66px;height:66px;border-radius:18px;border:3px solid rgba(255,255,255,.75);background:linear-gradient(180deg,rgba(248,113,113,.95),rgba(185,28,28,.95));color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.4);z-index:5}
#btnSairArena.show{display:flex}
.qsair{margin-left:8px;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;font:900 15px Nunito,Arial,sans-serif;cursor:pointer}
#btnSairArena svg{width:32px;height:32px}
#btnSairArena small{font-size:11px;font-weight:900;line-height:1;margin-top:1px;letter-spacing:.3px}
#btnSairArena:active{transform:scale(.94)}

/* corrida: só ▲ ▼ */
body.corrida #tLeft,body.corrida #tRight{display:none}
body.corrida #tDown{left:30px;bottom:22px;width:84px;height:84px}
body.corrida #tJump{font-size:34px}
/* ---- ING3: tradução atrás da bandeira ---- */
.tr{display:none}
body.show-tr .tr{display:block;font-size:.72em;font-weight:700;opacity:.85;margin-top:2px;line-height:1.25}
small.tr{color:#fde68a}
#btnTr.on{background:rgba(253,224,71,.3);border-color:#fde047}
#btnTr svg{width:28px;height:20px}
#toast small.tr{font-size:14px;color:#fde68a}
#toast{white-space:normal;text-align:center;max-width:760px}
/* botões do quiz: embaixo, no meio (entre ◀ ▶ e PULAR), longe das placas e do balão */
#quizBtns{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;flex-direction:row;gap:10px;z-index:4}
#quizBtns.show{display:flex}
#quizBtns button{height:44px;min-width:96px;padding:0 12px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(13,11,30,.7);color:#fff;font:900 15px Nunito,Arial,sans-serif;display:flex;align-items:center;gap:6px;justify-content:center}
#quizBtns button svg{width:20px;height:20px}
#quizBtns #qSair{background:linear-gradient(180deg,#ef4444,#b91c1c);border-color:rgba(255,255,255,.7)}
body.sem-voz #qOuvir{display:none}
/* legenda da intro */
#legenda{position:absolute;left:60px;right:60px;bottom:18px;display:none;background:rgba(13,11,30,.85);border:2px solid rgba(253,224,71,.5);border-radius:18px;padding:12px 18px 12px;text-align:center}
#legenda.show{display:block}
#legenda p{margin:0;font-size:22px;font-weight:900;line-height:1.3}
#legenda .mini{position:absolute;right:10px;top:-46px;height:38px;padding:0 14px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:rgba(13,11,30,.7);color:#fff;font:900 14px Nunito,Arial}
/* escolha do herói */
.mcard.escolha{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:900px;max-height:200px;padding:12px 16px;background:rgba(15,14,36,.92)}
.hsel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hbtn{min-height:56px;border-radius:16px;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:900 18px Nunito,Arial;padding:6px}
.hbtn.on{border-color:#fde047;background:rgba(253,224,71,.2)}
.hcores{display:flex;gap:8px;justify-content:center;margin:8px 0 2px}
.hcor{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.5);padding:0}
.hcor.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px #fde047}
.mcard.escolha .mbtn{height:50px;margin:6px 0 0}
/* cartão do mapa */
.mcRes{font-size:15px;font-weight:700;line-height:1.3;margin-top:4px;opacity:.95}
#mapCard{max-height:118px}
.mcNome small.tr{display:none}
body.show-tr .mcNome small.tr{display:inline;margin-left:6px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="ui">
    <div id="hud">
      <button class="ib sera-home" id="btnHome" title="Home" aria-label="Home"></button>
      <button class="ib" id="btnLock" title="Full screen and lock" aria-label="Full screen and lock"></button>
      <button class="ib" id="btnHelp" title="Help" aria-label="Help"></button>
      <button class="ib" id="btnTr" title="Português" aria-label="Mostrar em português"></button>
      <button class="sombtn" id="sombtn" onclick="toggleSom()" aria-hidden="true" tabindex="-1"></button>
      <div id="hudName">The Lost Endings</div>
      <div class="pill" id="hudArena" title="Pages"><span id="hudArenaIco"></span><span id="hudArenaN">0/0</span></div>
      <div class="pill" id="hudPtsPill" title="Points"><span id="hudPtsIco"></span><span id="hudPts">0</span></div>
      <div class="pill" id="hudCoins" title="Coins"><span id="hudCoinIco"></span><span id="hudCoinN">0</span></div>
      <button class="ib" id="btnPause" title="Pause" aria-label="Pause"></button>
    </div>
    <div id="touch">
      <button class="tb" id="tLeft" aria-label="Left">&#9664;</button>
      <button class="tb" id="tRight" aria-label="Right">&#9654;</button>
      <button class="tb" id="tDown" aria-label="Crawl">&#9660;</button>
      <button class="tb" id="tJump" aria-label="Jump">JUMP</button>
    </div>
    <div id="quizBtns"><button id="qDica"></button><button id="qOuvir"></button><button id="qSair">&#10005; Leave</button></div>
    <div id="mapCard"></div>
    <div id="legenda"></div>
    <div id="toast"></div>
    <div id="menu"><div class="mcard" id="mcard"></div></div>
  </div>
</div>
