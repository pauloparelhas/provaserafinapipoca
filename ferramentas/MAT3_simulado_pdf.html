<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Practice Test (PDF)</title>
<!-- Página de IMPRESSÃO de um simulado de Math 3º tri (fork de GEO3_simulado_pdf.html). ?s=N escolhe o sorteio
     (trabalho/3tri_matematica/gen/pdf_mat3.py gera ferramentas/media/mat3/Simulado_Math_NN.pdf).
     15 questões de escolha = o MESMO MAT3_simulado_data.js do simulado (só itens aprovados), 2 por tema + 1 sorteado;
     SÓ DE MARCAR (13/11 tarde, ordem do Paulo: as 3 discursivas saíram; questão de escrever mora só na folha
     MAT3_discursivas.html). Última página: answer key. A4 retrato, em inglês (a prova é em inglês). -->
<style>
@font-face{font-family:"Nunito";font-weight:200 1000;src:url(assets/fonts/nunito-latin.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:400 800;src:url(assets/fonts/baloo2-latin.woff2) format("woff2")}
@page{size:A4 portrait;margin:12mm 13mm 13mm}
:root{--tinta:#1d2b29;--tinta2:#4b5b58;--linha:#cfd8d3;--c:#b45309}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--tinta);font:11pt/1.4 "Nunito",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cab{display:flex;align-items:center;gap:5mm;border-bottom:1.2pt solid var(--tinta);padding-bottom:3mm;margin-bottom:4mm}
.cab h1{font:800 18pt/1.05 "Baloo 2",sans-serif;margin:0}
.cab .nome{margin-top:2.5mm;font-weight:700;color:var(--tinta2)}
ol.qs{list-style:none;margin:0;padding:0;columns:2;column-gap:8mm;column-rule:.5pt solid var(--linha)}
.q{break-inside:avoid;margin:0 0 4.5mm}
.n{display:inline-grid;place-items:center;width:6mm;height:6mm;border-radius:50%;background:var(--tinta);color:#fff;font:800 9pt/1 "Baloo 2",sans-serif;margin-right:1.6mm;vertical-align:.2mm}
.q .p{font-weight:800}
.q .obs{font-size:8.5pt;font-weight:800;color:var(--tinta2)}
.q .fig{margin:1.6mm 0;text-align:center}
.q .fig svg{max-width:100%;max-height:38mm;width:auto;height:auto}
.q .fig .solido{max-height:30mm}
.tabela{border-collapse:collapse;margin:0 auto 1.5mm;font-weight:800}
.tabela td{border:.8pt solid var(--tinta);padding:.6mm 4mm;text-align:center}
.q ul{list-style:none;margin:1.6mm 0 0;padding:0;display:flex;flex-direction:column;gap:1.2mm}
.q li{display:flex;gap:2mm;align-items:baseline}
.cx{flex:0 0 auto;width:3.6mm;height:3.6mm;border:1pt solid var(--tinta);border-radius:.8mm;transform:translateY(.5mm)}
.cx.r{border-radius:50%}
.gab{break-before:page}
.gab ol{margin:0;padding-left:6mm;columns:2;column-gap:8mm}
.gab li{break-inside:avoid;margin:0 0 2mm}
.gab .t{font-size:9pt;color:var(--tinta2)}
.tr{display:none}
/* MANDAMENTO TIPOGRÁFICO (12/11): enunciado e explicação do gabarito justificados (última linha à esquerda) */
.q,.gab li{text-align:justify;text-align-last:left;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.q ul li{text-align:left}
</style>
</head>
<body>
<div class="cab"><div style="flex:1"><h1 id="tit">Math Practice Test</h1><div class="nome" data-tipo="rotulo">Year 2 · 3rd term &nbsp;·&nbsp; Name: ______________________________ &nbsp; Date: ___/___</div></div></div>
<ol class="qs" id="qs"></ol>
<section class="gab"><h2>Answer key</h2><ol id="gab"></ol></section>
<script src="MAT3_figuras.js?v=08b66841640"></script>
<script src="MAT3_simulado_data.js?v=08b66841640"></script>
<script>
(function(){
  var S=window.MAT3S, F=window.MAT3F, m=/[?&]s=(\d+)/.exec(location.search), sem=m?+m[1]:1;
  document.getElementById('tit').textContent='Math Practice Test No. '+sem;
  var x=sem*9301+49297; function rnd(){ x=(x*233280+49297)%2147483647; return x/2147483647; }
  function emb(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function semTr(s){ return String(s||'').replace(/\s*<span class="tr">[\s\S]*?<\/span>/g,''); }
  /* cotas do simulado (2 por tema = 14); para 15 entra mais 1 de um tema sorteado */
  var cot={}; S.FAMILIAS.forEach(function(f){ cot[f.k]=f.cota||0; });
  cot[emb(S.FAMILIAS)[0].k]++;
  var esc=[]; S.FAMILIAS.forEach(function(f){ esc=esc.concat(emb(S.ITENS.filter(function(i){ return i.eixo===f.k; })).slice(0,cot[f.k])); });
  function figura(it){
    if(!it.fig) return '';
    var s=it.tabela?'<table class="tabela"><tbody>'+it.tabela.map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'; }).join('')+'</tbody></table>':'';
    return '<div class="fig" data-tipo="rotulo">'+s+F[it.fig[0]].apply(null,it.fig.slice(1))+'</div>';
  }
  var qs='', gb='';
  esc.forEach(function(it,n){
    var ops=emb(it.opts), multi=!!it.multi;
    qs+='<li class="q"><span class="n">'+(n+1)+'</span><span class="p">'+semTr(it.pede)+'</span>'+(multi?' <span class="obs">(tick all the right answers)</span>':'')+figura(it)+
      '<ul>'+ops.map(function(o){ return '<li data-tipo="rotulo"><span class="cx'+(multi?'':' r')+'"></span><span>'+semTr(o.t)+'</span></li>'; }).join('')+'</ul></li>';
    var certas=ops.filter(function(o){ return o.ok; }).map(function(o){ return semTr(o.t); });
    gb+='<li><b>'+certas.join(' · ')+'</b>'+(it.truque?'<div class="t">'+it.truque.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>':'')+'</li>';
  });
  document.getElementById('qs').innerHTML=qs; document.getElementById('gab').innerHTML=gb;
  document.body.setAttribute('data-pronto','1');
})();
</script>
</body>
</html>
