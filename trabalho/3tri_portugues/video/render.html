<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>render LP3</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="cv" width="1280" height="720"></canvas>
<script src="timeline.js"></script>
<script src="lib.js"></script>
<script src="chars.js"></script>
<script src="props.js"></script>
<script src="props2.js"></script>
<script>const SCENES = {};</script>
<script src="cenas1.js"></script>
<script src="cenas2.js"></script>
<script src="cenas3.js"></script>
<script src="cenas4.js"></script>
<script>
/* Motor: render(t) desenha o quadro do tempo t (segundos). Deterministico. */
const cv = document.getElementById('cv'), CX = cv.getContext('2d');
const bufA = document.createElement('canvas'), bufB = document.createElement('canvas');
bufA.width = bufB.width = W; bufA.height = bufB.height = H;
const XF = 0.6;
const MISSING = [];

const LIST = [{ id: 'titulo', nome: '', ini: 0, fim: TL.t_titulo, frases: [], palavras: [] }].concat(TL.cenas);
LIST[LIST.length - 1].fim = TL.total;

function mkS(sc) {
  const ini = sc.ini;
  return {
    sc, dur: sc.fim - sc.ini,
    w(word, n = 0) {
      const hits = sc.palavras.filter(p => p.w === word);
      if (!hits[n]) { if (!MISSING.includes(sc.id + ':' + word + n)) MISSING.push(sc.id + ':' + word + n); return 1e9; }
      return hits[n].ini - ini;
    },
    f(i) { return sc.frases[i].ini - ini; },
    fe(i) { return sc.frases[i].fim - ini; },
    talk(lt) {
      const t = lt + ini;
      for (const p of sc.palavras) if (t >= p.ini && t <= p.fim + .04) return .45 + .55 * Math.abs(Math.sin((t - p.ini) * 15));
      return 0;
    }
  };
}
const SS = LIST.map(mkS);

function drawScene(ctx, i, t) {
  const sc = LIST[i], fn = SCENES[sc.id];
  ctx.save(); ctx.clearRect(0, 0, W, H);
  if (fn) fn(ctx, t - sc.ini, SS[i]);
  else { ctx.fillStyle = '#333'; ctx.fillRect(0, 0, W, H); txt(ctx, 'cena ' + sc.id, W / 2, H / 2, 60, '#fff'); }
  ctx.restore();
}

function captionAt(t) {
  const all = [];
  TL.cenas.forEach(c => c.frases.forEach(f => all.push({ f, cena: c })));
  for (let k = 0; k < all.length; k++) {
    const { f, cena } = all[k];
    const nxt = all[k + 1];
    let end = f.fim + 0.35;
    if (nxt && nxt.cena === cena) end = nxt.f.ini - 0.06; else end = Math.min(cena.fim - 0.35, f.fim + 0.9);
    const st = f.ini - 0.12;
    if (t >= st && t < end) return { text: f.leg, a: Math.min(clamp((t - st) / .15), clamp((end - t) / .15)) };
  }
  return null;
}
function wrap(ctx, s, maxW) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const tst = cur ? cur + ' ' + w : w; if (ctx.measureText(tst).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tst; }
  if (cur) lines.push(cur); return lines;
}
function drawCaption(ctx, t) {
  const c = captionAt(t); if (!c || c.a <= 0) return;
  let size = 36; ctx.font = `800 ${size}px ${FONT}`;
  let lines = wrap(ctx, c.text, 1120);
  if (lines.length > 2) { size = 32; ctx.font = `800 ${size}px ${FONT}`; lines = wrap(ctx, c.text, 1160); }
  const lh = size * 1.25, bh = lines.length * lh + 26;
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 56;
  const by = H - 18 - bh;
  ctx.save(); ctx.globalAlpha = c.a;
  rr(ctx, (W - bw) / 2, by, bw, bh, 22); ctx.fillStyle = 'rgba(14,16,34,.82)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.stroke();
  ctx.fillStyle = '#fffdf5'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + 13 + lh * (i + .5) + 1));
  ctx.restore();
}

function render(t) {
  let i = LIST.findIndex(s => t >= s.ini && t < s.fim); if (i < 0) i = LIST.length - 1;
  const sc = LIST[i];
  let other = -1, k = 0;
  if (i + 1 < LIST.length && t > sc.fim - XF / 2) { other = i + 1; k = (t - (sc.fim - XF / 2)) / XF; }
  else if (i > 0 && t < sc.ini + XF / 2) { other = i - 1; k = 1 - (t - (sc.ini - XF / 2)) / XF; i = i; }
  CX.save(); CX.globalAlpha = 1;
  if (other < 0) { drawScene(CX, i, t); }
  else {
    const [a, b] = other > i ? [i, other] : [other, i];
    const kk = other > i ? k : k;  // k = peso da cena seguinte
    const kb = easeInOut(other > i ? kk : 1 - (1 - kk));
    const wNext = other > i ? easeInOut(k) : easeInOut(1 - k);
    drawScene(bufA.getContext('2d'), a, t); drawScene(bufB.getContext('2d'), b, t);
    CX.drawImage(bufA, 0, 0); CX.globalAlpha = wNext; CX.drawImage(bufB, 0, 0); CX.globalAlpha = 1;
  }
  drawCaption(CX, t);
  CX.restore();
  return true;
}
window.render = render;
window.frameJPEG = (t, q) => { render(t); return cv.toDataURL('image/jpeg', q || 0.9); };
</script>
</body></html>
