<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arte C — prévia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>body{background:#1a1a2e;color:#fff;font-family:Nunito,Arial;margin:16px}canvas{display:block;width:960px;max-width:100%;margin:6px 0 18px;border-radius:8px;background:#000}h2{font-size:16px;margin:8px 0 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row canvas{width:960px}</style>
</head><body>
<h2>Mapa (nós por cima, como o cena.js)</h2><canvas id="mapa" width="1920" height="1080"></canvas>
<h2>Capa</h2><canvas id="capa" width="1920" height="1080"></canvas>
<h2>Globo k = 0 · 0.5 · 1</h2><div class="row"><canvas id="g0" width="1920" height="1080"></canvas><canvas id="g1" width="1920" height="1080"></canvas><canvas id="g2" width="1920" height="1080"></canvas></div>
<h2>Itens de poder e cartas de fonte</h2><canvas id="itens" width="1920" height="600"></canvas>
<script src="../../ferramentas/LP3_jornada_arte.js"></script>
<script src="../../ferramentas/LP3_jornada_arte2.js"></script>
<script src="../../ferramentas/HIS3_jogo_arte.js"></script>
<script src="../../ferramentas/HIS3_jogo_arte2.js"></script>
<script src="../../ferramentas/HIS3_jogo_arte3.js"></script>
<script src="../../ferramentas/HIS3_jogo_arte4.js"></script>
<script src="../../ferramentas/HIS3_jogo_arte5.js"></script>
<script src="../../ferramentas/HIS3_jogo_arteC.js"></script>
<script>
var A=window.ARTE, q=new URLSearchParams(location.search), T0=q.has('t')?+q.get('t'):null;
function ctx(id){ var c=document.getElementById(id).getContext('2d'); c.setTransform(2,0,0,2,0,0); return c; }
function caminho(a,b){ var p=[],mx=(a.x+b.x)/2,my=(a.y+b.y)/2-24; for(var i=0;i<=14;i++){ var t=i/14,u=1-t; p.push([u*u*a.x+2*u*t*mx+t*t*b.x,u*u*a.y+2*u*t*my+t*t*b.y]); } return p; }
function nos(c,t){ var N=A.MAPA_NOS;
  for(var i=0;i<N.length-1;i++) caminho(N[i],N[i+1]).forEach(function(p){ c.fillStyle=i<3?'#b45309':'rgba(120,53,15,.35)'; A.circ(c,p[0],p[1],i<3?4:3); c.fill(); });
  N.forEach(function(n,i){ c.save(); c.translate(n.x,n.y); if(i===3){ c.fillStyle='rgba(253,224,71,.4)'; A.circ(c,0,0,40); c.fill(); }
    var g=c.createRadialGradient(-6,-6,4,0,0,26); if(i===8){ g.addColorStop(0,'#c4b5fd'); g.addColorStop(1,'#4c1d95'); } else if(i<3){ g.addColorStop(0,'#fef3c7'); g.addColorStop(1,'#d97706'); } else { g.addColorStop(0,'#dcfce7'); g.addColorStop(1,'#15803d'); }
    c.fillStyle=g; A.circ(c,0,0,24); c.fill(); c.strokeStyle='#fff'; c.lineWidth=3; c.stroke(); c.fillStyle='#fff'; c.font='900 19px Nunito,Arial'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(i+1),0,1);
    if(i<3) for(var s=0;s<3;s++) A.estrela(c,-16+s*16,32,6.5,'#fde047',0); c.restore(); });
}
function itens(c,t){ c.fillStyle='#2b2f4a'; c.fillRect(0,0,960,300);
  ['lupa','lanterna','chapeu','capacete','barco','carta'].forEach(function(tp,i){ var x=70+i*90; c.fillStyle='rgba(255,255,255,.08)'; A.circ(c,x,70,30); c.fill(); A.itemPoder(c,tp,x,70,t); c.save(); c.translate(x,165); c.scale(2,2); A.itemPoder(c,tp,0,0,t); c.restore(); c.fillStyle='#fff'; c.font='800 12px Nunito'; c.textAlign='center'; c.fillText(tp,x,120); });
  ['oral','escrita','visual','material'].forEach(function(tp,i){ A.cartaFonte(c,tp,620+i*56,72,1,t); A.cartaFonte(c,tp,620+i*80,230,1.6,t); });
  ['oral','escrita','visual','material'].forEach(function(tp,i){ A.cartaFonte(c,tp,600+i*40,140,.6,t); });
}
function quadro(t){
  var c=ctx('mapa'); A.mapaLivro(c,t); nos(c,t);
  A.capaLivro(ctx('capa'),t);
  A.globo(ctx('g0'),t,0); A.globo(ctx('g1'),t,.5); A.globo(ctx('g2'),t,1);
  itens(ctx('itens'),t);
}
function loop(ms){ quadro(ms/1000); requestAnimationFrame(loop); }
function go(){ if(T0!==null){ quadro(T0); document.title='pronto'; } else requestAnimationFrame(loop); }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(go); else go();
</script>
</body></html>
